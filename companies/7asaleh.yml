notes: >-
  Reviewed 2026-11-07. StartupsJo lists 7ASALEH (حصالة) as a Jordan-based
  EdTech/personal-finance startup with founder contact Nayef Elfayez, general
  mailbox info@7asaleh.com and phone +962797300700; neither contact is a
  verified recruiting channel. The July 12, 2021 int@j report independently
  lists 7asaleh among 23 startups admitted to Umniah's The Tank third cohort.
  Umniah's October 2024 company feature describes parent-controlled accounts,
  chores, savings goals and a prepaid-card concept for ages 7-17; it does not
  establish continuing operations in 2026. WeTheMakers' first-party case study
  confirms a 2021 contracted build using React Native, TypeScript, NestJS,
  MongoDB, Firebase, Docker and Drone CI, not the startup's current internal
  stack. AppBrain's iOS-specific listing, rechecked 2026-11-05, reports that
  the 7asaleh app was removed from Apple's App Store on 2026-01-19, with its
  last listed update on 2022-12-04 and The Interactive Company for Digital
  Services named as publisher. The legal relationship between the publisher
  and the startup is not established. App removal alone does not prove
  closure or establish Android availability. The official 7asaleh.com
  domain was inaccessible during the 2026-11-03 review; the independent
  AppBrain listing remains available and corroborates the historical iOS
  removal, not current Android distribution.
  On 2026-11-05, the StartupsJo directory still displayed the Jordan headquarters,
  general email info@7asaleh.com, phone +962797300700 and EdTech/financial
  services classification. This is a directory listing, not evidence of current
  operations or recruiting; no newer official hiring evidence was established.
  On 2026-11-09, Umniah's official retrospective of its December 2022 The Tank\n  annual event was reviewed: it explicitly names 7asaleh among 20 participating\n  startups. This independently supports historical incubator participation,\n  but neither current operations nor employment. Targeted November 2026 searches\n  did not establish a current official vacancy, company LinkedIn page, or\n  operational office. The 2024 Umniah/Startupbootcamp partnership concerns\n  the incubator generally and is not evidence that 7asaleh participated in 2024.\n  No confirmed current company LinkedIn page, careers portal, open direct
  vacancy, headcount, street address, coordinates or HR mailbox was found.
  Rechecked 2026-11-11: Targeted searches for 7asaleh/حصالة did not establish a
  current official careers page, vacancy, active Jordan office or headcount.
  The AppBrain page currently presents inconsistent platform wording: its URL
  and heading refer to iOS, while the body describes Google Play removal on
  2026-01-19. Consequently the exact affected storefront is unresolved;
  the listing is evidence of historical distribution only, not proof that
  both app stores removed the product or that the company closed.
  A ChangeLabs 2023 Jordan and Palestine Fintech for a Future program report
  (published in 2024) names Nayef El Fayez as 7asaleh founder and participant;
  this independently corroborates historical founder identity and fintech
  ecosystem participation, but is not evidence of 2026 operations. A targeted
  2026-11-07 search found no attributable current company careers listing or
  newer official operating announcement; similarly named Saudi Salla is
  unrelated. Jordan-level origin is documented, but the current operating address and
  company activity remain unresolved. Rechecked 2026-11-13: a targeted search for
  7asaleh and حصالة returned no attributable current official recruitment or
  operating announcement. The 2024 ChangeLabs program report continues to
  corroborate founder Nayef El Fayez and historical fintech participation,
  but not operations or hiring in 2026. Unrelated Saudi Salla recruitment
  results were excluded. No new HR contact, size, office coordinates or
  current internal stack could be supported. Partial verification reflects
  corroborated historical identity, not a verified active employer.
