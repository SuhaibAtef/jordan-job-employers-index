notes: "Reviewed 2026-11-11: Official homepage and Jordan coverage index display original reporting dated 2026-11-10, confirming ongoing editorial activity, not staff recruitment. Official contribution guidance invites freelance pitches and collaborations, not salaried vacancies. Conflicting office street addresses, dedicated HR contact and precise coordinates remain unresolved. Reviewed 2026-11-08: Official homepage lists reporting dated 2026-11-04 and 2026-11-02, confirming continuing editorial publication but not recruitment. Official English contact page still lists 7 Hussein At Tarawneh Street, Jabal Al Lweibdeh, Amman and telephone +96264630998; the previously identified conflicting Arabic address remains unresolved, so location status and coordinates are unchanged. Official contribution guidance solicits freelance editorial pitches and collaborations, not staff employment; no verified current staff vacancy or HR-specific contact. Reviewed 2026-11-06. First-party historical organizational statement identifies the registered legal entity as Hiber for Training and Technology LLC (registered in Jordan in 2009); this is historical registration evidence, not proof of current corporate filing status. The official contribution page invites freelance editorial and multimedia submissions, not applications for employment. A 2015 official relocation announcement corroborates Jabal Lweibdeh as the neighborhood but does not resolve the conflicting present-day street addresses. No new dated staff vacancy, HR email, or verified office coordinates were established. Previously reviewed 2026-11-03. 7iber remains an active Amman journalism organization; its company LinkedIn page showed recent editorial updates during the November 2026 review, and the previously documented original reporting dated 2026-10-27 remains supporting evidence. The official about page documents journalism, research, media training and editorial projects. The English contact page and current LinkedIn profile list 7 Hussein At Tarawneh Street in Jabal Al Lweibdeh, while the Arabic contact page lists second floor, Building 6, Sharia College Street; the precise address remains disputed and location is provided_unverified. General inquiries/projects email info@7iber.com and phone +96264630998 are not verified HR contacts. LinkedIn reports 11-50 employees. The official contribution page invites journalism and multimedia pitches but does not advertise employment. No current recruitment portal, open staff position, dedicated HR email or precise coordinates were confirmed. A 2019 senior web-developer posting mentions WordPress, PHP, MySQL, HTML, CSS, JavaScript and REST/JSON; these are historical hiring requirements, not proof of a current production stack. The 2019 program-coordinator vacancy is likewise historical."
