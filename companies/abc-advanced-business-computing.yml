notes: "Initial review 2026-10-07. ABC is an active Midis Group company in Jordan and a Dell Titanium Black Partner. The exact Amman office remains unresolved because current first-party sources conflict: ABC's own contact page publishes King Abdullah II St., 324 Midis Group Building, while Midis Group's current affiliate page and LinkedIn publish Al Rayan Tower, Queen Alia Street 31. The previous coordinates and map pin were removed instead of choosing one address silently. ABC's official contact form includes 'Curriculum Vitae (CV)' as a submission type, so it is used as the application/contact URL rather than claiming a dedicated careers page. Recent public Jordan-specific vacancies were not found; historical ABC Jordan postings include Presales Manager and Technical Support Engineer roles and show Dell/VMware/Veeam infrastructure requirements. A current Midis careers posting under an ABC legal entity is for Qatar, so it is not treated as a current Jordan opening. Follow-up review 2026-10-16: ABC's live official contact page still lists King Abdullah II St., 324 Midis Group Building, while the Midis Group affiliate listing still gives Al Rayan Tower, Queen Alia Street 31; retain unresolved address and no coordinates. Both official sources publish +962 65000996 as a general telephone number. The official contact form still permits CV submissions, but no current Jordan-specific opening or dedicated HR email was confirmed; do not confuse Qatar-based ABC vacancies with Jordan vacancies. Review 2026-10-27: Rechecked the live ABC and Midis Group contact pages; they still disagree on the Amman street/building. An independent Dun & Bradstreet business listing also gives Al Rayan Tower, 31 Queen Alia Street, but this does not override ABC's own King Abdullah II Street address. Keep location unresolved with no precise coordinates. The current Jordan ICT directory profile and an October 2026 company LinkedIn repost support ongoing business presence, not a confirmed open vacancy. No dedicated Jordan HR email or active ABC Jordan job was verified. Review 2026-11-03: The MDS SI Group ABC Jordan affiliate page again lists Al Rayan Tower, Queen Alia St., Building 31, Amman and +962 65000996, corroborating the parent-group address but not resolving the conflict with ABC Jordan’s own contact-page address. The 2025 Jordan ICT industry directory independently documents ABC as a Midis affiliate and Dell Titanium Black Partner, with enterprise infrastructure, storage, virtualization, data and AI services; its historical establishment year is 2023. These sources establish operating identity and services, not an open Jordan job or an exact geocoded office. Keep partial status, unresolved street address, null coordinates and no dedicated HR email. Review 2026-11-06: The company LinkedIn profile reposts the 2026 Who's Who in Jordan ICT edition's ABC advertisement and company profile, providing a recent company-linked operating signal. The profile still lists 2-10 employees and Al Rayan Tower, Queen Alia Street 31; it does not reconcile the company's conflicting King Abdullah II Street contact address. No current Jordan-specific vacancy or dedicated HR email was established. Retain partial status, unresolved street location and null coordinates. Review 2026-11-08: Official ABC contact page again lists King Abdullah II St., 324 Midis Group Building, Amman, telephone +962 65000996 and a CV submission option; the official about page describes data-center infrastructure, system integration, backup, disaster recovery and managed support. Existing Midis affiliate address conflict remains unresolved. No dedicated HR mailbox, confirmed active Jordan vacancy, or office coordinates were established. The website claims over 150 enterprise clients across regional operations, not Jordan-only customers. Review 2026-11-10: Rechecked the Midis Group official ABC Jordan affiliate listing, which continues to identify the Amman Al Rayan Tower address and general telephone +962 65000996. Midis Group careers lists November 2026 Amman roles, including a November 2 Technical Support Engineer position explicitly under Jordanian Company for Systems Management, Business; these are group-level hiring signals and are NOT attributed to ABC Jordan. The conflicting ABC-owned address remains unresolved, no ABC-specific open vacancy or dedicated HR contact was established, and location coordinates remain null."
