notes: "Initial review 2026-10-07. ABC is an active Midis Group company in Jordan and a Dell Titanium Black Partner. The exact Amman office remains unresolved because current first-party sources conflict: ABC's own contact page publishes King Abdullah II St., 324 Midis Group Building, while Midis Group's current affiliate page and LinkedIn publish Al Rayan Tower, Queen Alia Street 31. The previous coordinates and map pin were removed instead of choosing one address silently. ABC's official contact form includes 'Curriculum Vitae (CV)' as a submission type, so it is used as the application/contact URL rather than claiming a dedicated careers page. Recent public Jordan-specific vacancies were not found; historical ABC Jordan postings include Presales Manager and Technical Support Engineer roles and show Dell/VMware/Veeam infrastructure requirements. A current Midis careers posting under an ABC legal entity is for Qatar, so it is not treated as a current Jordan opening. Follow-up review 2026-10-16: ABC's live official contact page still lists King Abdullah II St., 324 Midis Group Building, while the Midis Group affiliate listing still gives Al Rayan Tower, Queen Alia Street 31; retain unresolved address and no coordinates. Both official sources publish +962 65000996 as a general telephone number. The official contact form still permits CV submissions, but no current Jordan-specific opening or dedicated HR email was confirmed; do not confuse Qatar-based ABC vacancies with Jordan vacancies. Review 2026-10-27: Rechecked the live ABC and Midis Group contact pages; they still disagree on the Amman street/building. An independent Dun & Bradstreet business listing also gives Al Rayan Tower, 31 Queen Alia Street, but this does not override ABC's own King Abdullah II Street address. Keep location unresolved with no precise coordinates. The current Jordan ICT directory profile and an October 2026 company LinkedIn repost support ongoing business presence, not a confirmed open vacancy. No dedicated Jordan HR email or active ABC Jordan job was verified."
