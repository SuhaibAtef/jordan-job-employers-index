notes: "Reviewed 2026-11-15: Official homepage currently advertises Arabic ebooks and audiobooks, more than 35,000 titles and more than six million active Arabic readers (company-reported, not independently audited). The official privacy policy continues to publish Abjjad LTD at King Hussein Business Park Building 23, 3rd Floor, Amman, and feedback@abjjad.com as general contact; it does not prove present physical occupancy. No active Jordan hiring vacancy, dedicated HR email, precise coordinates or updated independent headcount was established. Reviewed 2026-11-09: Wuzzuf employer profile lists no currently open Abjjad vacancies; this third-party listing is not a comprehensive search of all recruitment channels. The similarly named abbjad.com school-management company advertising positions in Muscat, Oman, is not the Jordanian Arabic-reading platform and its jobs and technology stack must not be attributed to Abjjad. Existing Jordan business and address evidence retained without claiming fresh confirmation of office occupancy. Verified 2026-10-07. The official site is active and the official privacy policy identifies the business as Abjjad LTD at King Hussein Business Park, Building 23, 3rd Floor, Amman, with feedback@abjjad.com as the public contact. LinkedIn independently confirms Amman headquarters, 11-50 employees and a 2012 founding date. The previous generic info@abjjad.com value was removed because the current first-party contact is feedback@abjjad.com and no HR-specific email was found. Historical LinkedIn roles explicitly targeted fresh graduates for eBook testing/digitization and provided training on InDesign, Calibre, Jira and Instabug; those vacancies are closed and are retained only as early-career evidence. The official privacy policy also documents Firebase, Firebase Crashlytics, OneSignal and Amplitude in the application."
