notes: "Reviewed 2026-10-17. Official website and LinkedIn confirm an operating Jordanian exchange/remittance business; the company LinkedIn profile states founded 1994, 25 branches, and 201-500 employees, while its narrative mentions approximately 200 staff and 17 locations. Treat branch count and headcount as self-reported and potentially dated, not audited current figures. Official website footer lists Hesham Salameh Complex, Building 133, Wasfi Al Tal Street, Amman and general contact@abusheikha.com / +962-6-550-8081. LinkedIn lists primary Amman location at Building 133, and Waze independently identifies the main Gardens branch at Building 133; address is corroborated, but precise office coordinates were not established. Prior coordinates (31.99357, 35.86058) were not corroborated for this specific branch and were removed. Official careers page displayed 0 available vacancies and offers a general CV submission form, but no verified dedicated HR email or current open role. Previous info@abusheikha.com is not confirmed as a recruitment contact; contact@abusheikha.com is a general address only. An online currency converter is a product feature, not evidence of the company's internal programming stack. Company-level verification remains partial because direct recruitment contact, technology stack, and current employee counts are not independently established."
