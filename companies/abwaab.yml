notes: "Reviewed 2026-10-16. Abwaab official help center (updated 2026-07-06) describes curriculum lessons, question banks, live sessions and teacher support. LinkedIn currently lists E-Learning Providers, Amman headquarters and self-reported 201-500 company size (not independently audited). The official help center still links to the Freshteam jobs portal, but the portal now displays an unclaimed-site error; no functioning company-wide careers page or HR email could be confirmed. Recent hiring: an Abwaab leadership post, reposted by the company in October 2026, recruits an Amman Social Media Content Specialist; a company-authored AI Operations Automation Specialist advertisement appeared in 2026, but the role may have closed. Historical Amman engineering vacancies and employee profiles suggest AWS, CI/CD, Django, Docker, Git, Go, Kubernetes, Python, React and Terraform; these are historical job/profile signals, not a current production-stack audit. The Plaza Outlets business listing and Dar As-Salehin Street company listing corroborate an Amman office, while coordinates are a Google Maps business pin rather than an independently surveyed entrance. Location evidence does not establish full company verification. Rechecked 2026-10-27: Company LinkedIn still identifies Amman headquarters and a self-reported global size of 201-500. A company-reposted October leadership call seeks an Amman short-form Social Media Content Specialist via direct message, while the CEO also advertised senior product, CX, AI automation and developer recruitment without specifying Jordan locations; neither is evidence of a currently open entry-level engineering role. The Freshteam careers URL still shows an unclaimed-site page, so careers_url and dedicated HR email remain null. Wamda reported Abwaab\u0027s 2026-09-01 acquisition of Egypt\u0027s Eduact, extending the business into teacher/learning-center SaaS; no assumption is made about Abwaab\u0027s deployed software stack from the acquisition. Existing map coordinates remain a third-party business pin, not independently surveyed."
