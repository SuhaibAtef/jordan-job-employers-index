notes: "Reviewed 2026-10-17. Official site confirms leak-detection sensors, water-monitoring app and management team; company LinkedIn reports 11-50 employees (self-reported) and Berlin headquarters. Jordan location remains city-level: official contact page says Amman, while LinkedIn also lists '3030, Aqaba, JO'; neither establishes a current street-level office. Removed an unsupported Aqaba city-centre map pin and duplicate location keys. The official site lists info@adadk.tech and support@adadk.tech as general contacts, not HR addresses; CEO email is not a recruitment mailbox. Careers page displays engineering, support and product roles but no publication dates or confirmed active application process. React Native and firmware/embedded systems are supported by job descriptions; AI/ML, IoT and sensing are supported by company product descriptions. Robotics and marine drones are promoted as broader company initiatives but are not established as current internal production stack. Removed the unsupported 'games' category. Royal Academy of Engineering and Halcyon corroborate founder Bayan Al-Abdullat and Jordan ties. Full-company verification remains partial because precise Jordan office details, hiring availability and headcount are not independently confirmed."
