notes: >-
  Reviewed 2026-10-28. The official About page identifies Hend Baghdady as
  CEO and Luma Aladnani as co-founder and president; its footer places the
  business in Amman, Jordan. The current class calendar lists in-person
  Circle Time sessions at Moonbirds (6th Circle) and Tiny Tots (Swefieh
  Village), Amman. These are teaching venues, not evidence of an office
  address. The official events calendar lists six U.S. shows from September
  19 to October 4, 2026, demonstrating active international operations,
  not current Jordan hiring. LinkedIn reports 2-10 employees, an
  E-Learning Providers industry classification and a 2016 founding date,
  but no usable headquarters address. The Jordan Media Commission license
  directory previously listed the Khaled Bin Al Waleed Street registered
  address; the directory timed out on this review, so the address remains
  provided_unverified and precise coordinates remain null. StartupsJo
  lists founder contact Luma@adamwamishmish.com, not a dedicated HR mailbox.
  The official Work With Us page now invites join-the-team inquiries via
  a form, but lists no open vacancies, job levels or recruitment email.
  The Arabic-letter game was built in partnership with eduTechnoz; no
  internal software stack is verified. Company verification remains
  partial because a current office pin, direct HR contact and current
  technical hiring are not established.
