notes: >-
  Reviewed 2026-10-16. The official site confirms ongoing children's Arabic-language
  music, educational content, classes, and live shows; its contact page states only
  Amman, Jordan. LinkedIn reports 2-10 employees and no usable headquarters address.
  The Jordan Media Commission's artistic production/distribution license directory
  lists 'Adam wa Mishmish Production and Distribution Co.' (row 94), with general
  manager Luma Baher Al Adnani and Khaled Bin Al Waleed Street, Jabal Al-Hussein,
  Al-Abdali, Amman as the registered address. This does not confirm a current
  walk-in office or building-level pin, so the street address is provided_unverified
  and previous uncorroborated coordinates have been removed. StartupsJo lists
  founder contact Luma@adamwamishmish.com and +962777392255, neither verified as
  dedicated HR/recruitment contact. No current vacancy or official careers page
  was found. In 2026 the company announced a mobile Arabic-letter game developed
  with external partner eduTechnoz; that partnership does not establish its
  internal engineering stack. Previous AWS, WooCommerce and WordPress stack claims
  could not be corroborated in this review and were removed. Historical 2021
  seed financing of USD 475,000 is not a current hiring signal.
