name: "Adam Wa Mishmish"
description: >-
  Adam Wa Mishmish is a Jordan-founded Arabic-language children's edutainment
  company launched in 2016. It produces musical animated learning videos,
  books, toys, live performances and interactive Arabic classes for young
  children. Its 2026 activities include Amman classes, a U.S. live tour and
  an Arabic-letter learning game developed with eduTechnoz.
