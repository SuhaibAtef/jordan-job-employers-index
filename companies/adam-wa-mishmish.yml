notes: >-
  Reviewed 2026-11-13: The official Work With Us page still invites general
  join-the-team messages but provides no named vacancy or dedicated HR email.
  The official class calendar advertises Amman sessions at Moonbirds and Tiny
  Tots, and an online cohort starting November 15, 2026; these are evidence
  of services offered, not a verified staffed office or Jordan recruitment.
  The official About page identifies five named founders/leaders and reports
  more than one million YouTube subscribers; audience size is not headcount.
  Precise office coordinates, current hiring and internal engineering stack
  remain unverified. Previous review details follow.
  Reviewed 2026-11-09 (UTC); previous detailed review 2026-11-06. The official\n  live-classes page still advertises Amman Circle Time at Moonbirds (6th\n  Circle) and Tiny Tots (Swefieh Village), plus online Music Hour cohorts.\n  These are program venues, not independently verified company premises.\n  The eduTechnoz co-branded Arabic-learning game landing page describes\n  a partnership and an early-bird signup; it does not establish in-house\n  engineering employment or an open vacancy. Current Jordan recruitment,\n  dedicated HR contact and precise office coordinates remain unverified.\n  Reviewed 2026-11-06 (UTC); previous review 2026-11-04. The official About page identifies Hend Baghdady as
  CEO and Luma Aladnani as co-founder and president; its footer places the
  business in Amman, Jordan. The current class calendar lists in-person
  Circle Time sessions at Moonbirds (6th Circle) and Tiny Tots (Swefieh
  Village), Amman. These are teaching venues, not evidence of an office
  address. The official events calendar lists six U.S. shows from September
  19 to October 4, 2026, demonstrating active international operations,
  not current Jordan hiring. LinkedIn reports 2-10 employees, an
  E-Learning Providers industry classification and a 2016 founding date,
  but no usable headquarters address. The Jordan Media Commission license
  directory previously listed the Khaled Bin Al Waleed Street registered
  address; the directory timed out on this review, so the address remains
  provided_unverified and precise coordinates remain null. StartupsJo
  lists founder contact Luma@adamwamishmish.com, not a dedicated HR mailbox.
  The official Work With Us page still invites join-the-team inquiries via
  a form but lists no open vacancies, job levels or recruitment email on
  2026-11-04. The official privacy policy (updated July 3, 2026) gives
  info@adamwamishmish.com for general privacy inquiries, not HR. The official
  class booking page advertises a ten-week online Arabic cohort starting
  November 15, 2026, indicating ongoing service delivery, not hiring.
  The Arabic-letter game was built in partnership with eduTechnoz; no
  internal software stack is verified; Stripe and Zoom are named by the
  company as external class-payment and video providers, not evidence of
  an in-house engineering stack. Company verification remains
  partial because a current office pin, direct HR contact and current
  technical hiring are not established. On 2026-11-06 the official Work With
  Us page still displayed a Join the team inquiry option but no named
  vacancy; the same page chiefly advertises commercial bookings, sponsorship
  and licensing, so these are not employment openings. The company LinkedIn
  profile continued to self-report 2-10 employees and no usable headquarters
  address. Its 2026 posts explicitly credit eduTechnoz as the technology
  partner for the Arabic-letter game; app availability is not proof of an
  in-house engineering stack. No current Jordan recruitment opening,
  dedicated HR mailbox or precise office coordinates were established.
