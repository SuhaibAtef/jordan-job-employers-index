notes: "Reviewed 2026-10-28 (partial company verification). Official ADSTRA site confirms AI-driven financial crime, AML, fraud and business intelligence solutions; its contact page lists only Amman, Jordan, +962 79 3110009 and general business@adstratech.com. The company and Mada BNPL publicly announced a partnership during the 23-24 September 2026 Jordan FinTech Festival to implement ADSTRA's AI-powered fraud and AML platform; this supports current business activity but is not proof of implementation completion. Company LinkedIn also describes an AI Case Investigation Agent and advertised mid-level .NET (2-3 years) and junior .NET (0-1 year) roles. Applications are invited to business@adstratech.com, a general business mailbox also used for CVs, not a verified dedicated HR address; a historical closed sales vacancy used careers@adstratech.com. Current vacancy status is not independently established. A historical unpaid Data Analyst Trainee internship was advertised in Amman for university students and is now closed. C#, ASP.NET Core/MVC, Entity Framework, REST APIs, SQL Server/MySQL, HTML/CSS/JavaScript, Bootstrap/jQuery and Git come from developer hiring requirements, not audited production infrastructure; Angular and Azure were preferred skills only. LinkedIn reports 11-50 employees and founding 2021; intaj reports 1-24 employees and founding 2020, so headcount and founding year remain conflicting self-reported data. Official contact, LinkedIn, intaj and the 2026 Jordan ICT directory confirm Amman only. The older Caracas Building/Yajouz Street address and exact coordinates remain uncorroborated; location remains approximate. No standalone careers page or verified precise street address was established."
