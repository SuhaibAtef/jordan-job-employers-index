notes: "Reviewed 2026-10-28 (partial company verification). Official ADSTRA site confirms AI-driven financial crime, AML, fraud and business intelligence solutions; its contact page lists only Amman, Jordan, +962 79 3110009 and general business@adstratech.com. The company and Mada BNPL publicly announced a partnership during the 23-24 September 2026 Jordan FinTech Festival to implement ADSTRA's AI-powered fraud and AML platform; this supports current business activity but is not proof of implementation completion. Company LinkedIn also describes an AI Case Investigation Agent and advertised mid-level .NET (2-3 years) and junior .NET (0-1 year) roles. Applications are invited to business@adstratech.com, a general business mailbox also used for CVs, not a verified dedicated HR address; a historical closed sales vacancy used careers@adstratech.com. Current vacancy status is not independently established. A historical unpaid Data Analyst Trainee internship was advertised in Amman for university students and is now closed. C#, ASP.NET Core/MVC, Entity Framework, REST APIs, SQL Server/MySQL, HTML/CSS/JavaScript, Bootstrap/jQuery and Git come from developer hiring requirements, not audited production infrastructure; Angular and Azure were preferred skills only. LinkedIn reports 11-50 employees and founding 2021; intaj reports 1-24 employees and founding 2020, so headcount and founding year remain conflicting self-reported data. Official contact, LinkedIn, intaj and the 2026 Jordan ICT directory confirm Amman only. The older Caracas Building/Yajouz Street address and exact coordinates remain uncorroborated; location remains approximate. No standalone careers page or verified precise street address was established. Review 2026-11-03: Official homepage now explicitly lists behavioral intelligence, AI forecasting, revenue assurance, financial reconciliation, AML and fraud detection modules. Official contact still provides only Amman, Jordan, business@adstratech.com and +962 793110009, with no verifiable street address or coordinates. Company LinkedIn displays an onsite mid-level .NET developer advertisement (2-3 years) with CVs to the general business mailbox; the post is recent but active application acceptance is not independently verified. The 2026 Jordan ICT profile identifies founder/CEO Mohammad Bdair and co-founder/CTO Thaer Al Saudi and lists customers and 2020 founding, while LinkedIn says founded 2021; retain this discrepancy and partial verification. No dedicated HR email or independently confirmed exact office pin was established. Review 2026-11-06: The official contact and product pages remain accessible and continue to identify Amman, the general business mailbox and AI-driven compliance/fraud products. The company LinkedIn page still displays 2026 junior (0-1 year) and mid-level (2-3 years) .NET developer advertisements, but neither the post date nor ongoing acceptance was independently established on this review. A historical Amman Data Analyst Trainee posting explicitly describes unpaid university training and is closed. No new street-level address, dedicated HR contact or independently verified headcount was established; partial status and approximate location are retained. Review 2026-11-09: The official contact page again identifies only Amman, Jordan, phone +962 793110009 and business@adstratech.com, which is a general business contact rather than a dedicated HR mailbox. The official website continues to advertise AML, fraud detection, risk intelligence, forecasting and reconciliation. Company LinkedIn additionally reports a partnership announcement with Shumul Bank for Islamic Microfinance in Yemen for an AI-powered AML solution; this is a company announcement of planned implementation, not independently confirmed deployment. The company page continues to show junior and mid-level .NET recruitment posts, but their application status is not confirmed as open on this review. LinkedIn estimates 11-50 employees, not audited headcount. No precise Amman address or coordinates were established; retain partial company verification and approximate location."
