name: Agility Logistics Jordan
description: Historical Amman listing for Agility's freight-forwarding and warehousing operations. Agility sold
  its Global Integrated Logistics (GIL) division to DSV in August 2021. DSV currently documents Jordan freight and
  warehouse operations, but available official sources do not establish that a separate Agility-branded freight
  employer still operates at the historical Amman address. The current Agility group owns and invests in aviation,
  logistics parks, digital logistics and related infrastructure businesses.
