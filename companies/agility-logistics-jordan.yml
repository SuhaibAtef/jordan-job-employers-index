name: Agility Logistics Jordan
description: >-
  Historical Agility-branded freight-forwarding and warehousing employer listing in
  Shmeisani, Amman. Agility sold its Global Integrated Logistics (GIL) business to
  DSV in August 2021, so a current Agility freight-forwarding office at that
  address is not established. Separately, the Agility group's Logistics Parks
  division has an official Jordan page describing a Qastal-area logistics-park
  development near Amman's airport; this does not establish continuity of the
  historical Shmeisani employer or that the park is fully operational.
