notes: Reviewed 2026-10-16. The JordanYP Agility Logistics entry reports Laila Al-Akhyaliyah Street, Shmeisani,
  Amman and telephone +962 6 565 5200, but was last updated 2021-04-27, before Agility's Global Integrated Logistics
  sale to DSV (completion announced 2021-08-16). Agility's own history confirms the sale. Current DSV Jordan pages
  document more than 177 staff and five facilities in Amman/Aqaba, but these figures, addresses, systems and roles
  must NOT be attributed to a still-operating Agility Jordan entity. A second directory lists a different logistics
  location; neither office or any exact coordinates are current-officially confirmed. The group LinkedIn and careers
  page do not establish a Jordan-specific headcount, HR contact or active opening. No verified local hiring or internal
  technology stack was found; leave HR email, company size, coordinates and technology tags unknown. Agility group's
  ongoing activity does not establish continuation of the historical Jordan freight office.
