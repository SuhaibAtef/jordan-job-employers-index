notes: >-
  Rechecked 2026-10-28. The official Agility Logistics Parks Jordan page describes
  more than 100,000 square metres of land, warehousing and logistics infrastructure
  under development in Qastal, near Airport Road. This is first-party evidence of
  a separate Agility group project in Jordan, NOT proof that the historical
  Shmeisani Agility GIL freight office still operates or that the Qastal project
  is complete. Agility's own DSV history and DSV's 2021-08-16 completion notice
  confirm the GIL sale. Current DSV Jordan operations, including its reported
  local staffing and facilities, belong to DSV and must not be assigned to this
  Agility record. The JordanYP Shmeisani listing (Laila Al-Akhyaliyah Street,
  telephone +962 6 565 5200) was last updated 2021-04-27, before the sale; a
  second directory lists a different site. Neither source confirms a current
  Agility office or exact coordinates, so the historic address remains
  provided_unverified. Agility's 2026-08-07 financial release confirms current
  group activity and Logistics Parks business growth, but does not establish
  Jordan-specific headcount, jobs, technology stack or HR contact. LinkedIn
  reports 10,001+ employees for the global group only; local size remains null.
  The official group careers overview links to multiple business units but no
  Jordan-specific Agility vacancy or dedicated HR email was confirmed. Leave
  local size, HR email, coordinates and technologies unknown. Company-level
  verification remains partial despite the separate official Jordan parks page.
