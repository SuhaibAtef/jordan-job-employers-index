notes: >-
  Official site lists King Hussein Business Park, Building 19, Floor 1, and
  general contact fintech@ahli.com; this is not a verified HR mailbox.
  The site's map link resolves to King Hussein Business Park, not a confirmed
  Building 19 entrance. Previous coordinates (31.9539, 35.9106) were not
  supported for this office and have been removed. LinkedIn reports 2-10
  employees (self-reported, not audited). The official accelerator page shows
  applications closed at review time. The startup-jobs page lists a role at
  portfolio company askPepper, not an AHLI FINTECH vacancy; no current direct
  company vacancy or dedicated careers portal was confirmed. Student hackathons
  and incubator activities demonstrate ecosystem engagement, not guaranteed
  AHLI FINTECH hiring. A historical third-party profile mentioned a Python
  backend internship in 2022, but no reliable evidence confirms Python as the
  current internal technology stack, so it is not listed as verified technology.
  The official Jordan Fintech Festival 2026 program lists AHLI FINTECH CEO
  Ghassan Muasher as a speaker for the September 23-24 event, supporting
  current ecosystem participation but not direct company hiring. Jordan Ahli
  Bank maintains its own careers portal; those bank vacancies are not evidence
  of AHLI FINTECH-specific openings. Rechecked 2026-10-28: no dedicated
  AHLI FINTECH recruiting email, direct vacancy, precise office pin, or
  internally used technology stack could be independently confirmed.
  The company LinkedIn page reported hosting a Jordan Fintech Festival 2026
  roundtable, supporting recent activity but not direct hiring. A 2023 Jordan
  financial-services directory documents historical UiPath RPA delivery for
  Jordan Ahli Bank, not confirmation of the current internal technology stack.
  Rechecked 2026-11-04: no confirmed direct vacancy, HR-specific contact, or
  precise office coordinates. Company verification remains partial
  notwithstanding the official office address.
  Rechecked 2026-11-06: the official website terms identify the registered
  business as Ahli for Financial Technology company, a Jordanian private
  shareholding company, registration 1206, with registered address at
  King Hussein Business Park, Building 19, Floor 1. This strengthens
  confidence in the published registered address but does not independently
  verify physical occupancy or exact coordinates. The terms and privacy
  policy give contact@ahlifintech.com as a general contact, not an HR inbox.
  The official FAQ clarifies that hackathon/incubator applications are
  startup-program applications rather than employment. An AHLI FINTECH-hosted
  Account Manager hospitality-tech job page contains a submission form, but
  the role is described for a portfolio startup, not confirmed as an
  AHLI FINTECH direct vacancy; posting date and live acceptance are unknown.
  A historical Jordan Ahli Bank Investment Associate job explicitly
  describes work with AHLI FINTECH but is closed and does not demonstrate
  current hiring. No verified internal engineering stack or audited headcount.
  Rechecked 2026-11-09: AHLI FINTECH's official November 16, 2025
  announcement confirms a signed cooperation MoU with JoPACC's JOIN
  Fincubator for startup support and knowledge exchange. This supports
  ecosystem activity, not direct hiring or a verified internal tech stack.
  The official news archive lists July 7, 2026 as its newest release;
  no new direct AHLI FINTECH vacancy was established in this review.
  Rechecked 2026-11-13: the official portfolio archive lists CyberSierra
  dated 2026-10-08, supporting continued portfolio activity but not an
  AHLI FINTECH employment vacancy. The official homepage advertises fintech
  incubation and acceleration programs and lists the Building 19 office.
  The official 2026-07-07 InvoiceQ partnership confirms ecosystem activity.
  No direct AHLI FINTECH job, dedicated HR contact, verified internal
  technology stack, audited headcount or exact office coordinates were found.
  The official news homepage displays a 2025-11-27 incubator story above
  the 2026-07-07 announcement, so display order is not reliable chronology.
