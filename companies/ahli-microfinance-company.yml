name: "Ahli Microfinance Company"
description: >-
  Ahli Microfinance Company (AMC), established in 1999 and wholly owned by
  Jordan Ahli Bank, provides microfinance loans and non-financial support to
  individuals, micro-entrepreneurs and small businesses across Jordan. It
  operates a branch network and offers online loan applications and a customer
  mobile app. Its official careers page lists Branch Manager, Loan Officer and
  general applications; the linked application forms were reachable on
  2026-10-28, although posting dates and deadlines were not displayed.
