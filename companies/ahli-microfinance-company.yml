notes: >-
  Ownership and services confirmed by the company and parent bank. The Central
  Bank of Jordan and the company's LinkedIn profile corroborate the head-office
  address at Building 449, Al Jandaweel; the coordinates follow the Google Maps
  place pin linked by the company's own website. Location verification does not
  establish full-company verification. LinkedIn self-reports 201-500 employees;
  the official company about page mentions 294 employees without an as-of date.
  The company's own site describes 23 branches, while the parent bank's page
  describes 28; current network size is therefore not asserted. The official
  management page identifies Jumana Faraj as Human Resources Manager, but no
  dedicated public HR email was confirmed; amc@amc.com.jo is the general
  contact listed by the Central Bank of Jordan. The official vacancies page
  lists Branch manager and Loan Officer positions and a general application,
  but postings have no visible dates, so live application status is uncertain.
  No current internal programming languages, cloud platforms or core banking
  technology stack could be verified; a public mobile app and online loan
  application do not establish an internal stack. No internship or graduate
  recruitment was confirmed. Rechecked 2026-10-28: the Loan Officer and
  Branch Manager Apply Now links led to first-step application forms requesting
  personal details; no submission was attempted. A separate General Job
  Application page was also available. This confirms application routes, not
  whether the dated vacancies remain actively staffed. Recent LinkedIn posts
  promote education financing and customer cybersecurity awareness, showing
  public-facing activity rather than technical hiring or an internal stack.
  The official governance page links a 2025 guide, but does not establish
  current internal systems. No 2026 vacancy publication dates or internship
  programme were found.
