notes: |-
  Reviewed 2026-10-16. AI HUB's company LinkedIn page identifies Amman (postal code 11925), a 2024 founding date and 2-10 employees; this size is company self-reported, not an audited count. No street address, office pin or reliable office coordinates were established. Earlier coordinates (31.9539, 35.9106) and Google Maps search were generic city-center references, not evidence of the employer's premises, so they were removed.
  The company-authored 2025 fresh-graduate job announcement explicitly supplied jobs@aihub-talent.com for applications. It is recorded as a historical recruitment contact; current deliverability and an active HR mailbox have not been verified. The company also reposted an internship announcement and a robotics-trainer hiring message during 2026, but current openings, deadlines and direct employment relationships are not confirmed.
  In 2026 the company promoted AI-agent training using Python, n8n and APIs, plus a Claude for Work course scheduled for 17 October with Princess Sumaya University for Technology. These are training topics, not proof of the company's internal production stack; technologies therefore remain empty. No independently confirmed official company website or careers portal was found. The similarly named AI Hub jo (LinkedIn: aihubjordan; founded 2013; website aihubjo.com) appears to be a distinct initiative and must not be conflated with this 2024 AI HUB (aihub-talentpool).
