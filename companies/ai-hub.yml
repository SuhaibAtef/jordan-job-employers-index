notes: |-
  Reviewed 2026-10-28. The AI HUB company LinkedIn page identifies an Amman headquarters (postal code 11925), 2024 founding, and 2-10 employees (self-reported, not audited). It now lists https://aihubjo.org/ as the company's website, but the domain could not be independently retrieved during this review; the URL is company-provided, not proof of an accessible website or careers portal. No street address, office pin, or reliable coordinates were established. Previous city-center coordinates were not office evidence and remain excluded.
  AI HUB's company LinkedIn feed advertised a 12-hour Claude for Work training course beginning 2026-10-17 in collaboration with the Consultation and Training Center at Princess Sumaya University for Technology. Its team representative Tareq Masaeed reported AI HUB sponsorship of AI Expo 2026 at the University of Jordan and an AI in Business workshop in October. These are recent company-controlled signals of activity, not proof of direct recruitment or a deployed internal technology stack.
  The company-authored 2025 AI/data fresh-graduate rotation announcement supplied jobs@aihub-talent.com for applications. This is a historical recruiting contact; current deliverability and an active HR mailbox were not independently confirmed. A 2026 internship program and robotics-trainer opportunity were reposted by AI HUB, but the original hiring organizations, current availability, and direct AI HUB employment relationships were not verified. The robotics post provided tareqmasaeed@aihubjo.org for that specific opportunity, not as a verified general HR address.
  Python, n8n, APIs and Claude/Claude Code appear in training curricula only, so technologies remains empty rather than representing an internal production stack. No dedicated careers portal or currently open direct vacancy was confirmed. AI HUB (aihub-talentpool, founded 2024) must not be conflated with AI Hub jo (aihubjordan, founded 2013, aihubjo.com) or EY's separately named AI Hub. Verification remains partial because exact office location, current recruiting arrangements, and operational implementation details are unverified.
