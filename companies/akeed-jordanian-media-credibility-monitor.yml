name: "Akeed (Jordanian Media Credibility Monitor)"
description: "AKEED is a Jordan Media Institute media-accountability and fact-checking project, launched in 2014 with support from the King Abdullah II Fund for Development. It monitors rumors and the credibility of Jordanian media coverage, checks claims against published standards, and issues periodic monitoring reports."
