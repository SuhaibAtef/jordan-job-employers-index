notes: |-
  Reviewed 2026-10-28 (previous review 2026-10-16). AKEED is a project of the Jordan Media Institute, not independently confirmed as a separate incorporated employer. The official site lists Airport Street, Amman, and info@akeed.jo (general contact, not a dedicated HR address), but does not establish an exact building or office pin; the prior generic city-center coordinates were removed. The parent institute's address and recruitment page should not be treated as AKEED-specific without confirmation. No AKEED-specific careers page, live vacancy, early-career program, LinkedIn company profile, or production technology stack was verified. A 2026 academic study describes a ten-person team including collaborators, not an audited payroll count. AKEED was active in 2026: Petra reported its September rumor monitoring on 2026-10-01. AKEED Tech and akeedsoft.com are unrelated organizations. The official AKEED website published new reports on 2026-10-26 and 2026-10-27 about hate-speech monitoring and rumor tracking after the Karak incident, confirming current editorial operations, not staffing levels or hiring. Jordan Media Institute advertised a director of the AKEED monitor in July 2026, with an application deadline of 2026-07-22 to JMIHR@jmi.edu.jo; the associated LinkedIn vacancy is now closed. That is a historical AKEED-specific senior recruitment signal through the parent institute, not a current opening, a verified AKEED-dedicated HR mailbox, or evidence of an early-career program. The job description discusses digital tools, data analytics and exploring AI but does not establish the internal production technology stack. The Airport Street contact is corroborated by AKEED itself, but no exact office coordinates or independent street-level pin were confirmed.
