notes: |-
  Reviewed 2026-10-16. AKEED is a project of the Jordan Media Institute, not independently confirmed as a separate incorporated employer. The official site lists Airport Street, Amman, and info@akeed.jo (general contact, not a dedicated HR address), but does not establish an exact building or office pin; the prior generic city-center coordinates were removed. The parent institute's address and recruitment page should not be treated as AKEED-specific without confirmation. No AKEED-specific careers page, live vacancy, early-career program, LinkedIn company profile, or production technology stack was verified. A 2026 academic study describes a ten-person team including collaborators, not an audited payroll count. AKEED was active in 2026: Petra reported its September rumor monitoring on 2026-10-01. AKEED Tech and akeedsoft.com are unrelated organizations.
