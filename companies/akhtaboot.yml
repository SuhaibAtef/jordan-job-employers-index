notes: >-
  Reviewed 2026-10-28 (previous review 2026-10-16). Akhtaboot is an Amman-headquartered online recruitment
  network and employer-facing hiring platform serving the MENA region. Its
  company LinkedIn lists 11-50 employees, founded 2007, and Emaar Towers,
  6th Circle, Amman 11181. A separate Jordan business directory corroborates
  the Sixth Circle/Zahran Street location and +962 6 577 7500. Address
  confidence is medium-to-high; existing map coordinates were retained from
  the prior record but were not independently revalidated this review.
  The official Akhtaboot-hosted about page describes web recruiting and
  Android/iOS apps, but its undated team roster is not reliable proof of
  present staffing. Android and iOS therefore describe published app
  platforms, not a verified internal engineering stack. The Akhtaboot
  employer service page describes applicant tracking and recruitment
  services. Its jobs marketplace carries vacancies for other employers:
  postings there are not evidence that Akhtaboot itself is hiring.
  German Jordanian University career-fair handbooks from 2015 and 2016
  document internships and graduate opportunities historically, but no
  currently open internal role or dedicated HR recruiting mailbox was
  confirmed. Official terms publish info@akhtaboot.com as a general
  contact, and the employer page publishes sales@akhtaboot.com; neither
  is verified as an HR inbox. The main homepage blocked automated access
  during this review; Akhtaboot-hosted subpages and company LinkedIn
  remained discoverable. A dated Akhtaboot-hosted ICRC HR Partner vacancy
  (posted 2026-10-14, application deadline 2026-10-29) demonstrates
  October 2026 use of Akhtaboot's recruitment marketplace. The listing
  belongs to ICRC, not Akhtaboot, and its deadline does not prove it is
  still accepting applications. The company LinkedIn profile continues
  to list 11-50 employees and Emaar Towers, Sixth Circle. No dedicated
  Akhtaboot careers page, current internal opening or HR recruiting
  mailbox was confirmed. Partial company verification remains
  appropriate despite the independently supported office address.
