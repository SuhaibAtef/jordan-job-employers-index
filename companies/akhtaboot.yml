notes: >-
  Reviewed 2026-11-18: Akhtaboot's company LinkedIn profile still identifies its Amman headquarters at Emaar Towers, Sixth Circle, founded 2007, with a self-reported 11-50 employee band. The Akhtaboot-hosted jobs marketplace displays third-party Jordan vacancies dated 2026-11-05 and 2026-11-07, corroborating recent marketplace activity but not Akhtaboot's own hiring. Its employer-services page continues to describe ZenATS, Career Connect and Testello as products sold to customers, not evidence of internal deployed technology. A Jordan Ministry of Labour career-guidance directory lists Akhtaboot and sales@akhtaboot.com, but this directory is historical and the address is not a verified HR recruitment inbox. No active Akhtaboot-internal opening, dedicated HR contact, audited employee count, independently confirmed current office occupancy or exact entrance coordinates was established. Partial company verification remains appropriate; existing map coordinates are retained without fresh geospatial validation.
  Reviewed 2026-11-16: The company LinkedIn profile, indexed today, still reports Akhtaboot as a 2007-founded Amman staffing/recruiting marketplace with 11-50 employees and an Emaar Towers, Sixth Circle address; the size and address are company-reported, not audited headcount or proof of present office occupancy. Akhtaboot's official about page describes MENA job matching and Android/iOS applications, while its employer page advertises ZenATS, Career Connect and Testello as customer-facing recruitment products rather than verified internal technology. A UNESCO career-guidance review published in 2025 and accessible in 2026 independently lists Akhtaboot as a Jordan employment platform. No currently open Akhtaboot-internal role, dedicated HR inbox, independently verified entrance coordinates or internal software stack was confirmed. Existing coordinates were retained without new precision validation; partial verification remains appropriate.
  Reviewed 2026-11-13: The publicly accessible company LinkedIn profile still identifies Akhtaboot as an Amman-based staffing and recruiting marketplace founded in 2007, with a self-reported 11-50 employee range and Emaar Towers, Sixth Circle address. Its job marketplace displayed third-party employer vacancies dated as recently as 2026-11-12 (for example Doculand B2B Sales Representative, reference 167708); this supports recent marketplace listings, not Akhtaboot internal hiring. No currently accepting Akhtaboot vacancy, HR-specific inbox, independently audited headcount, validated precise office coordinates, or internal engineering stack was established. Existing coordinates remain unverified as a precise entrance. Partial verification remains appropriate. Reviewed 2026-11-10: Public company LinkedIn still reports Amman headquarters at Emaar Towers, Sixth Circle, 11-50 employees, founded 2007 and staffing/recruiting operations. This is company-reported, not independently audited. No current Akhtaboot-internal hiring, HR-specific email, independently validated precise coordinates or internal engineering stack was established. Historical German Jordanian University 2014 and 2016 career-fair handbooks document past internship and fresh-graduate recruitment, not open 2026 opportunities. The coordinates remain a previously recorded approximate pin, not a verified office entrance. Partial verification remains appropriate. Reviewed 2026-11-04 (previous review 2026-10-28). Akhtaboot is an Amman-headquartered online recruitment
  network and employer-facing hiring platform serving the MENA region. Its
  company LinkedIn lists 11-50 employees, founded 2007, and Emaar Towers,
  6th Circle, Amman 11181. A separate Jordan business directory corroborates
  the Sixth Circle/Zahran Street location and +962 6 577 7500. Address
  confidence is medium-to-high; existing map coordinates were retained from
  the prior record but were not independently revalidated this review.
  The official Akhtaboot-hosted about page describes web recruiting and
  Android/iOS apps, but its undated team roster is not reliable proof of
  present staffing. Android and iOS therefore describe published app
  platforms, not a verified internal engineering stack. The Akhtaboot
  employer service page describes applicant tracking and recruitment
  services. Its jobs marketplace carries vacancies for other employers:
  postings there are not evidence that Akhtaboot itself is hiring.
  German Jordanian University career-fair handbooks from 2015 and 2016
  document internships and graduate opportunities historically, but no
  currently open internal role or dedicated HR recruiting mailbox was
  confirmed. Official terms publish info@akhtaboot.com as a general
  contact, and the employer page publishes sales@akhtaboot.com; neither
  is verified as an HR inbox. The main homepage blocked automated access
  during this review; Akhtaboot-hosted subpages and company LinkedIn
  remained discoverable. A dated Akhtaboot-hosted ICRC HR Partner vacancy
  (posted 2026-10-14, application deadline 2026-10-29) demonstrates
  October 2026 use of Akhtaboot's recruitment marketplace. The listing
  belongs to ICRC, not Akhtaboot, and its deadline does not prove it is
  still accepting applications. The company LinkedIn profile continues
  to list 11-50 employees and Emaar Towers, Sixth Circle. No dedicated
  Akhtaboot careers page, current internal opening or HR recruiting
  mailbox was confirmed. Partial company verification remains
  appropriate despite the independently supported office address.
  On 2026-11-04 the public company LinkedIn profile continued to describe
  Akhtaboot as a privately held staffing/recruiting business founded in 2007,
  with 11-50 employees and its primary office at Emaar Towers, Sixth Circle,
  Amman. This is company self-reporting, not an independent headcount audit.
  The 2014 German Jordanian University career-fair handbook also documented
  internships and fresh-graduate hiring historically; its then-current
  Jordan headcount is not applicable to 2026. No fresh internal job opening,
  HR-specific address, or validated technology stack was found in this review.
  Reviewed again 2026-11-06: the publicly accessible Akhtaboot company LinkedIn
  profile still reports staffing and recruiting, 11-50 employees, and Emaar
  Towers at Sixth Circle, Amman. These are self-reported company details,
  not audited employee counts or independently measured office occupancy.
  The Akhtaboot-hosted employer-services page describes ZenATS applicant
  tracking, Career Connect recruitment management and Testello assessments;
  these are marketed products, not proof of the company's internal stack.
  Its employer contact sales@akhtaboot.com is for sales, not verified HR.
  October 2026 jobs displayed on Akhtaboot identify other organizations as
  employers and do not demonstrate Akhtaboot hiring. No current internal
  vacancy or dedicated recruiting email was established. Coordinates were
  retained without fresh independent geospatial validation; partial status
  remains appropriate.
