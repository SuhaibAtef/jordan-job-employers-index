notes: >-
  Reviewed 2026-10-16. Al Bawaba's official About and Contact pages confirm
  its Amman headquarters, publishing activities, SyndiGate ownership, and
  The Plenary fourth-floor address at 74 Abdel Hamid Sharaf Street.
  The Al Bawaba Business and SyndiGate LinkedIn company profiles corroborate
  the building and street. Address confidence is high, but no precise
  office coordinates were independently established; the maps_url is only
  an address-search link, not a verified pin. Al Bawaba News LinkedIn
  self-reports 11-50 employees, not an audited headcount. An Al Bawaba
  article dated 2026-10-16 supports continued publication activity.
  The 2026 junior content licensing coordinator and SyndiGate content
  operations assistant advertisements were closed when checked. A separate
  multi-digital content writer/creator advertisement remained visible
  without a closed notice, but live application availability was not
  independently established. A 2025 company-associated hiring post listed
  jobs@corp.albawaba.com for a specific journalist role; current validity
  as a general HR mailbox is unconfirmed. The official general contact is
  contact@albawaba.com, not a verified HR address. No dedicated official
  careers page was established. Technology evidence is qualified: Vardot
  documented a Drupal 8 relaunch in 2019, and a SyndiGate development
  manager self-reports PHP, Symfony, MySQL, Linux, Nginx and Varnish for
  Al Bawaba/SyndiGate without a current deployment date. A 2026 company
  job advertisement explicitly mentions Pipedrive CRM as a workflow tool.
  SyndiGate's official site offers Amazon Kinesis as a delivery option,
  not proof of an internal cloud stack. Uncorroborated WordPress, Git and
  jQuery tags and the devops category were removed. Company verification
  remains partial even though the published office address is corroborated.
  Rechecked 2026-10-28: Al Bawaba published new editorial coverage dated
  October 28, confirming continued site activity. Two October 2026 LinkedIn
  advertisements for senior Arabic editor-in-chief roles in Amman were
  identified; one explicitly no longer accepted applications, whereas the
  other did not display a closed notice. These are recent hiring signals,
  not confirmation that either role is currently accepting applications.
  The previously recorded multi-digital content creator listing still had
  no closure notice in its retrieved public page; application availability
  remains unconfirmed. No dedicated careers page or HR email was verified.
  The self-reported 11-50 size is not a Jordan-only audited headcount, and
  historical technology evidence was not revalidated for current deployment.
