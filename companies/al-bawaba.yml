name: "Al Bawaba"
description: >-
  Al Bawaba is an Amman-headquartered digital news and information publisher
  founded in 2000. It publishes Middle East news, business, technology and
  lifestyle coverage in English and Arabic. Its group also owns SyndiGate,
  a content licensing and syndication business, and operates the DISCO
  digital-content marketplace.
