notes: >-
  Official company pages describe Arabic-learning curricula for children aged
  approximately 3-10, home-learning products, educational apps and consulting.
  Founders are siblings Shaima and Mohammed Al-Bishtawi. LinkedIn lists an
  Amman headquarters, founding year 2011 and 11-50 employees; the size is
  self-reported, not an independently audited headcount. The Google Play
  listing for the company's My Cheerful Letters app supplies Building 251,
  Office 107, Al-Madina Al-Munawwara Street, Amman as the app developer's
  contact address under the publisher name TAER ALHODHUD LIL TASWEEQ; this
  is not independently confirmed as Al Hodhud's current operating office.
  Previous coordinates 31.9539,35.9106 were generic Amman coordinates,
  not an office geolocation, and were removed. Google Play reports a May 4,
  2025 update to My Cheerful Letters; a partner posted a mobile-learning
  collaboration MoU in late 2025, but this does not establish a current job
  opening. Google Play lists dev2@alhodhud.com as app support and
  ammar@alhodhud.com as a developer contact; neither is an HR address.
  An older official document lists mohd@alhodhud.com as a founder contact.
  No current direct vacancy, dedicated careers page, recruiting email, or
  internal programming-language/cloud stack could be verified. Interactive
  whiteboards and tablets are learning delivery devices, not evidence of
  the internal software stack. Company verification remains partial.
  Rechecked 2026-10-28: LinkedIn continues to list Amman, a 2011 founding
  year and 11-50 employees. The official site remains indexed, but a direct
  request timed out during this review. Google Play still lists My Cheerful
  Letters with 10K+ downloads and a last update of 2025-05-04. Apple's App
  Store separately lists the company's Questions Game (As'ilati al-Marha)
  under Alhodhud Creative Content for children, with Shaima Al-Bishtawi
  as provider; the latest version shown there dates to 2019-01-24. These
  are evidence of a published app portfolio, not proof of 2026 app
  development, recruitment or active office occupancy. No current direct
  vacancy, recruiting email, exact office pin or internal stack was found.
  Rechecked 2026-11-05: The official Al Hodhud online product page for
  "Al Hodhud at Home" is accessible and advertises a paid Arabic-language
  self-learning program for children, with selectable one- or two-child
  options. This confirms a currently published product offering, not
  fulfillment, active hiring, current office occupancy or employee count.
  No dedicated HR contact or internal technical stack was established.
  Rechecked 2026-11-07: The official homepage is accessible and identifies
  founders Mohammed and Shaima Al-Bishtawi, advertises Arabic-language
  children's learning content and the Al Hodhud at Home program. The
  official product page lists a home-learning offer for children, with
  one- and two-child variants; the company LinkedIn profile continues
  to describe an Amman-based early-childhood e-learning provider. These
  public listings do not establish active hiring, current physical office
  occupancy, audited headcount or internal software stack. No current
  vacancy or dedicated HR contact was substantiated in this review.
  Rechecked 2026-11-11: The official homepage and product listing are indexed
  and accessible, naming Mohammed and Shaima Al-Bishtawi as founders and
  advertising Al Hodhud at Home for Arabic self-learning. The product page
  displays a USD 35-60 price range and one- or two-child variants; these
  are advertised offers, not proof of completed sales or 2026 hiring.
  The official team page documents multidisciplinary educational and
  software-development roles historically, without confirming a current
  technology stack, vacancies, headcount or physical office occupancy.
  No new HR contact or reliable office coordinates were established.
