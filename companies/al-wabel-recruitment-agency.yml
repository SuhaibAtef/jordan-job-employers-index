notes: "Reviewed 2026-10-16. Jordan Ministry of Labour private-employment-office directory (page updated 2026-10-12) lists Al-Wabel, manager Dr. Wisam Al-Masharqah, Sweifieh/Yanabii Street/Building 21, phone 06-5865618 and general email info@alwabel.net. LinkedIn identifies a different street (Al Wakalat Street) in Sweifieh, so the exact physical office remains unconfirmed; previous coordinates (31.9518,35.94042) did not have adequate address-level support and were cleared. LinkedIn self-reports 1,001-5,000 employees, but this is not independently audited. Earlier company materials use general email Info@Al-Wabel.net; neither address is established as a dedicated HR mailbox. Official website and historic online CV application URL were inaccessible during this review; the latter is retained only as historical evidence, not an active careers link. A historical Saudi Retail Supply Chain Manager vacancy is closed, so no current opening or early-career opportunity is claimed. No company technology stack was independently evidenced. Previous unsubstantiated web category was removed. Rechecked 2026-10-28: Jordan Ministry of Labour still publicly lists Al-Wabel in its private employment-office directory with Dr. Wisam Al-Masharqah, Yanabii Street Building 21, telephone 06-5865618 and general email info@alwabel.net. LinkedIn continues to list Al Wakalat Street instead, so the precise office address and coordinates remain unverified. LinkedIn's 1,001-5,000 employee range is self-reported and not independently corroborated. The official website again timed out; no active official careers/application page or dedicated company HR email could be established. Third-party job aggregators list a Student Assistant at Al-Wabel's Amman offices, posted 2026-09-05 with stated 2026-12-05 deadline, and a Talent Acquisition Specialist, posted 2026-08-12 with stated 2026-11-12 deadline. These are recent possible recruitment and student-access signals, not employer-confirmed live applications: the aggregators provide no functional direct apply route, and the Talent Acquisition role could be a client placement. A second aggregator repeats the Student Assistant listing but is not independent employer confirmation. No internal software stack was verified; company-level status remains partial."
