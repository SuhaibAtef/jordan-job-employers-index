redo hiring. Recent paid content-creator and ambassador invitations are recruitment signals, not confirmed staff positions. Alefredo's AI product positioning and Replit education partnership do not establish its internal technology stack; former Jira, Microsoft 365 and Generative AI stack entries were removed as unverified. The LinkedIn founding year (2019) differs from press coverage (2020); no founding year is asserted here.
