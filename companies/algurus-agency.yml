notes: >-
  Reviewed 2026-10-28. The active official website, company LinkedIn profile,
  and independent Shopify Partner Directory corroborate ongoing agency
  activity in Amman. Shopify lists AlGurus as a service partner active since
  March 2020, with Amman as its primary location and services including store
  builds, migrations and theme customization. The agency published dated
  articles on 2026-10-15 announcing its Shopify directory listing and claiming
  Google Premier Partner status for 2026. The direct Google Partners profile
  could not be independently accessed in this review, so the Premier status
  is attributed to the company rather than independently certified here.
  LinkedIn reports 11-50 employees and Um Uthaina headquarters; that range
  is self-reported, not an audited headcount. The official website lists
  Um Uthaina, phone +962 79 100 6167 and Mohammad@algurus.com for general
  inquiries; the email is not a confirmed HR or recruitment contact.
  No dedicated careers page, open internal job vacancy or internship was
  established in this review. The agency's separate academy offers paid or
  organized marketing training, not employment opportunities. Listed
  technologies are platforms advertised for client work, not a verified
  internal engineering stack. The exact building, street address and office
  coordinates remain unverified; older third-party directories mention
  Mecca Street, while the current official website and LinkedIn specify
  Um Uthaina. The generic Google Maps search is not an exact business pin.
