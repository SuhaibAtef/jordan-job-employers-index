notes: >-
  Reviewed 2026-11-08 (following 2026-11-05 and 2026-10-28 reviews). The active official website, company LinkedIn profile,
  and independent Shopify Partner Directory corroborate ongoing agency
  activity in Amman. Shopify lists AlGurus as a service partner active since
  March 2020, with Amman as its primary location and services including store
  builds, migrations and theme customization. The agency published dated
  articles on 2026-10-15 announcing its Shopify directory listing and claiming
  Google Premier Partner status for 2026. The direct Google Partners profile
  could not be independently accessed in this review, so the Premier status
  is attributed to the company rather than independently certified here.
  LinkedIn reports 11-50 employees and Um Uthaina headquarters; that range
  is self-reported, not an audited headcount. The official website lists
  Um Uthaina, phone +962 79 100 6167 and Mohammad@algurus.com for general
  inquiries; the email is not a confirmed HR or recruitment contact.
  On 2026-11-05 Shopify's live Partner Directory independently confirmed
  the Amman service-partner listing, March 2020 partnership date, public
  general contact Mohammad@algurus.com, and Shopify store-building, migration
  and theme-customization services. The agency's current official website
  continues to advertise digital marketing and web development. These sources
  corroborate business activity but do not verify internal hiring.
  On 2026-11-08, the live official homepage and partnerships page continued to advertise digital marketing, Shopify and WordPress services. Shopify independently listed the Amman service partner and public general contact; LinkedIn continued to report 11-50 employees and Um Uthaina headquarters. The agency claims 2026 Google Premier Partner status, but the direct Google directory was not independently confirmed. No fresh employer-authored hiring announcement was established. These checks do not establish exact office coordinates, audited headcount or internal software stack.
  Rechecked 2026-11-13: The official homepage currently advertises Google Ads, Meta/social advertising, SEO/GEO and Shopify/WordPress services and publishes Um Uthaina, Amman, telephone 0791006167 and Mohammad@algurus.com. The company claims 120+ brands served, $28M+ managed advertising spend and Google Premier Partner 2026 status; these performance and certification claims were not independently audited. Shopify's live official Partner Directory independently confirms an Amman-based service partner since March 2020, with store-building, migration and theme-customization services, the same public phone and email, and a Select Partner designation. This confirms ongoing public commercial presence, not direct recruitment. No current employer-authored job vacancy, dedicated HR email, exact office pin, audited headcount or internal software stack was established. The general contact is not classified as HR.\n  No dedicated careers page, open internal job vacancy or internship was
  established in this review. The agency's separate academy offers paid or
  organized marketing training, not employment opportunities. Listed
  technologies are platforms advertised for client work, not a verified
  internal engineering stack. The exact building, street address and office
  coordinates remain unverified; older third-party directories mention
  Mecca Street, while the current official website and LinkedIn specify
  Um Uthaina. The generic Google Maps search is not an exact business pin.
