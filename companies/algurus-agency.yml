notes: "Amman-based ecommerce development and digital marketing agency serving Jordan and MENA; no public fresh-grad/internship program found. No verifiable exact office pin found — GoodFirms lists 'Mecca Street, Amman 11911', the agency's own site footer says 'Um Uthaina, Amman'; city-center fallback kept. [GPS attempt 1, 2026-10-03, inconclusive] Live-browser investigation: official site footer (algurus.com) states only city-level 'Amman – Jordan' (earlier crawl showed 'Um Uthaina, Amman, Amman 11911, JO' — inconsistent footer copy); no contact page, no embedded map. Site's 'Get Directions' link resolves to a Google Maps entry 'Algurus Marketing Agency' at 31.8357604,35.9476308 (centroid-like, no address shown — distrusted). Google Maps search returns a claimed, maintained listing 'AlGurus Digital Marketing Agency' (Advertising agency, 17 reviews) but it has NO street address field and its pin (31.279444,37.122627) is Jordan's country centroid — distrusted as an address. TechBehemoths and Expat.com directory listings agree on 'Mecca Street, Amman' (GoodFirms text-fetch also shows 'Mecca Street, Amman 11911'), but these are unverified/self-submitted directory rows with no building number and no coordinates; Mecca Street is a ~6km arterial so this is street-level only. LinkedIn company page behind authwall; Clutch/GoodFirms pages Cloudflare-blocked. Phone numbers match across sources (+962791006167), confirming the same entity. No exact building pin exists in any source; pin stays approximate at Mecca Street.\n[GPS attempt 2, 2026-10-03, inconclusive] Live-browser deep dive: official site (home, about-us, contact-us-algurus-digital) gives only city-level 'Amman, Jordan' everywhere — deliberately no street address; site's 'Get Directions' resolves to a centroid-like Maps pin (31.8357604,35.9476308) with no address field. Google Maps 'AlGurus Digital Marketing Agency' is claimed (17 reviews) but has NO address field and sits at Jordan's country centroid (31.279444,37.122627) — distrusted. LinkedIn behind authwall; no careers page; no job postings found; Facebook login-walled; Instagram/YouTube bios say only 'Amman Jordan'. Directories: TechBehemoths (profile strength POOR) + expat.com both self-submitted 'Mecca Street' (same origin, no building, weak); SuperbCompanies (claimed) says 'Amman' with postal 11110 — conflicts with 11911 in TechBehemoths/expat; GoodFirms/Clutch/Sortlist/DesignRush/Krowdbase Cloudflare-blocked; jordanyp.com has no AlGurus listing; yellowpages.com.jo is dead; no news about an office. Verdict: no verifiable street address exists in any public source; address set back to city-level; pin stays approximate at city-center fallback.\n[GPS attempt 3, 2026-10-03, final - inconclusive] Wayback Machine deep dive: 16 homepage snapshots (2021-11-25 to 2026-05-11) and 6 contact-page snapshots (2025-08-28 to 2026-05-01) checked - NO snapshot ever showed a street-level address, only city-level 'Amman, Jordan'; the 'Um Uthaina' footer from an earlier crawl matches no archive. Google Maps listing 'AlGurus Digital Marketing Agency' re-checked: still no street-address field, pin still at Jordan country centroid (31.279444, 37.122627); claimed/maintained but distrusted as a location. Phone +962791006167 searched (Bing/DuckDuckGo/Mojeek): no page ties it to any street address. Instagram @algurus.agency: bio city-level only; post geotags behind login wall, third-party viewers blocked. Fresh crumbs: expat.com lists address verbatim as 'mecca street, undefined' (self-submitted, weak); a Bing summary quotes the login-walled LinkedIn page as 'Amman, Um Uthaina, Jordan' (neighborhood-level only). The site's own 'Get Directions' (maps.app.goo.gl/wqR5USCMiyBNSeePA) resolves to Maps place 'Algurus Marketing Agency' at 31.8357604, 35.9476308 (residential block, south Amman) - the company's own endorsed pin, but with no address text, no rendered detail panel, and conflicting with the Mecca Street/Um Uthaina directory claims, so it cannot count as a verified pin either. No two independent sources agree on one office location; no authoritative source confirms a street address. 3 attempts exhausted - marked gps_unverifiable; pin kept at city-center fallback (approx)."
