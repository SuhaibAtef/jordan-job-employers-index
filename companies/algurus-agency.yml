description: >-
  AlGurus is an Amman-based digital marketing, performance advertising and
  e-commerce development agency established under its current name in 2018.
  It offers Google and social advertising, SEO and generative-engine
  optimization, analytics, social media management, and Shopify, Salla and
  WordPress store or website development for clients in Jordan and other
  markets. Shopify's official Partner Directory independently lists AlGurus
  Agency as an Amman service partner, active since March 2020. The agency also
  operates practical digital-marketing training through AlGurus Academy.
