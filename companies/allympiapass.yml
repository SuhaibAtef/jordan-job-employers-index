name: "AllympiaPass"
description: >-
  AllympiaPass is a Jordan-founded fitness-membership platform launched in 2017
  that offered access to multiple gyms, studios and exercise classes through a
  single membership and mobile application. Historical reporting documents
  activity in Jordan, Lebanon, Egypt and Kuwait. Its current operational status
  could not be independently established in October 2026.
