notes: >-
  Reviewed 2026-10-17. LinkedIn identifies Amman headquarters, a 2017 founding
  date and a self-reported 51-200 employee size band, but does not establish
  current payroll or operating activity; Dealroom separately estimates 2-10
  employees, so present headcount is uncertain. Jordan Times reported the
  regional fitness-class membership product in October 2018. Two business
  directories list 164 Mecca Street, Amman, but neither establishes that the
  address is a currently occupied office; location is provided_unverified.
  The company-listed website was inaccessible during this review. AppBrain
  reports the Android application was removed from Google Play on 2024-05-03,
  with its last listed update on 2021-02-16. A former mobile developer's
  employment history supports historical Android/iOS work (2017-2019), not
  present use of Java, Kotlin, Swift, Node.js, Firebase or any other internal
  production stack; unsupported technology attributions were removed.
  No current company vacancy, dedicated careers page, recruitment email,
  internship or graduate hiring program could be corroborated. Historical
  operations and an Amman location do not establish current full-company
  verification; the company remains partially verified.
  Rechecked 2026-11-04: LinkedIn continues to describe a 2017-founded Amman
  fitness-studio membership platform and reports 51-200 employees, but does
  not provide evidence of active 2026 operations or recruitment. Dealroom's
  recently crawled company profile instead estimates 2-10 employees, leaving
  current staffing unresolved. CB Insights lists the historical company and
  seed funding but its database classification is not independent proof of
  an operating 2026 service. No company-confirmed active vacancy, HR contact,
  current office occupancy, coordinates or production software stack was
  established. The company therefore remains partially verified.
  Rechecked 2026-11-07: Public LinkedIn profile still identifies the 2017-founded
  Amman fitness-membership business, shows a self-reported 51-200 employee
  range and only five visible associated profiles; neither number verifies
  present payroll. LinkedIn labels its industry Spectator Sports, while its
  own business description establishes the more specific fitness membership
  model. Its company-listed website was inaccessible during this review.
  No dated 2026 company update, direct job posting, careers portal, recruiting
  contact, independently confirmed office occupancy or GPS coordinates was
  established. No evidence justifies upgrading company-level verification.
