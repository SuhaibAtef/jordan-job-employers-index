notes: >-
  Reviewed 2026-10-28. Official contact page continues to identify Al Quds Center,
  Building 224, Office 210, Wasfi Al Tall Street, Amman 11953, phone +962 785314928
  and general email info@almomanicybersolutions.com. LinkedIn self-reports 2-10
  employees, founded 2024, and advertises internships and a Growth Lead (Marketing
  and Sales) position with applications directed to sales@almomanicybersolutions.com;
  the post's closing date and current vacancy status are unconfirmed. A LinkedIn
  job card labels the Growth Lead location "Jordan, PA", inconsistent with the
  company's Amman contact address; do not infer the job is physically in Amman.
  The official Full Stack Development and Cybersecurity Defense Engineer internship
  program pages each show three months and "Open for Registration". These are
  training-program registrations, not evidence of paid employment or job vacancies.
  The company has also advertised fee-charging SOC training (50 JOD participant
  cost in its August 2026 LinkedIn announcement), so "internship" should not be
  assumed to mean a paid job. The internships@almomanicybersolutions.com address
  is an advertised training application contact, not independently verified as
  a general HR mailbox. The Full Stack curriculum mentions Django, PHP, Laravel,
  Node.js, Git, GitLab, CI/CD and Docker; these are teaching topics and do not
  prove the production stack. Existing employee-based technology evidence remains
  historical. No independent HR contact, live salaried engineering vacancy,
  precise office coordinates or current company-wide internal stack was confirmed.
