notes: "Reviewed 2026-10-16. Official contact page confirms the Jordan office at King Hussein Business Park, King Abdullah II Street, Building 15, 4th Floor, Amman; the company LinkedIn profile identifies Dubai as headquarters. Existing latitude/longitude are a business-park-area map point, not independently verified Building 15 entrance coordinates. LinkedIn explicitly reports the company-size band as 51-200, although approximately 252 profiles are associated with the company; profile association is not a payroll headcount and does not justify changing the band to 201-500. Official site links to an active careers portal at altibbi.zenats.com, which on this review displayed an AI Engineer role in Amman created 2026-09-16 plus other medical/marketing positions. A matching LinkedIn AI Engineer posting specifies 3-7 years, on-site Amman, Python, RAG, LangGraph/LangChain, AWS Bedrock, Azure OpenAI, Git and Docker familiarity; requirements do not prove all listed tools are deployed internally. Public Altibbi Flutter/Dart repository supports historical mobile SDK development. No dedicated HR email or entry-level engineering vacancy was confirmed. Removed unsupported ELK, TypeScript and Vue.js stack attributions pending stronger evidence. Company marked partial because precise coordinates, HR recruitment contact and production-wide stack remain unconfirmed."
