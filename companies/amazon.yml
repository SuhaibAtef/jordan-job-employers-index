notes: >-
  Reviewed 2026-10-18 (Jordan local date); company verification remains partial. The Royal Hashemite Court confirmed that Amazon inaugurated an Abdali-district corporate office on 2021-11-02 and employed approximately 1,220 Jordanians at that time; this historical Jordan headcount must not be treated as current. Amazon's LinkedIn company profile reports 10,001+ employees globally, not in Jordan. Amazon's official careers search indexed Amman roles posted in May-June 2026, including AI Data Associate, Customer Service Associate and Amazon Payment Services Software Development Engineer, supporting activity in Jordan, but the dynamically rendered current search did not allow confirmation that these particular vacancies remain open on the review date. Amazon Science listed a 2026 Applied Scientist Intern role with Jordan among possible EMEA locations; the listing is historical, not a confirmed October opening. Java, C++ and Python are evidenced as internship programming requirements, and distributed-systems work by historical SDE recruitment; none establishes an independently audited present-day Amman production stack. No dedicated public Jordan HR email, verified current Jordan headcount, precise street address, office building or independently supported pin coordinates were found. The Abdali location is approximate and is not proof of full-company verification.
