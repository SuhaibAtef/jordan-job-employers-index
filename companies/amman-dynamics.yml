notes: "Reviewed 2026-10-17. Official website and About page confirm services and 2016 founding; the official contact page lists Shmeisani, Amman and info@ammandynamics.com, a general mailbox, not a verified HR address. Company LinkedIn lists 2-10 employees, Amman headquarters and 86 Abdul Hamid Sharaf Street; Clutch independently repeats Building 86 but reports 10-49 employees, conflicting with LinkedIn's self-reported range. Street-level location is therefore provided_unverified; precise coordinates from the previous record were not corroborated and have been removed. The official website does not list a dedicated careers page, and no current vacancy was confirmed. Company-authored 2026 LinkedIn updates describe a 10-year anniversary, a Stad gaming-platform technology partnership, and mobile-platform delivery, supporting current activity. Clutch lists Ruby, TypeScript, C#, Unity, Flutter, Next.js, React Native, Ruby on Rails and Webflow as service technologies; these are provider-profile capabilities rather than an audited production stack. A former intern publicly described a Ruby on Rails internship, supporting historical early-career activity only. Games category reflects the Stad esports-platform partnership and Unity/AR-VR service capability, not proof of game publishing. Rechecked 2026-11-05: Official website remains accessible and advertises custom web applications, CMS/e-commerce, outsourcing and technical team building. Official contact page confirms Shmeisani, Amman, general mailbox info@ammandynamics.com and Jordan telephone +962 7 9789 6999. Company LinkedIn continues to identify 2016 founding, 2-10 employee size band and 86 Abdul Hamid Sharaf St.; its 2026 ten-year anniversary and Stad technology-partner posts support recent operations, not current vacancies. Clutch repeats Building 86, but a separate directory lists Wasfi Al Tal Street, so exact occupied address and coordinates remain unverified. No dedicated HR mailbox, live vacancy or accepting internship was established. Existing technologies are provider-profile capabilities, not verified deployment stack. Company-level verification remains partial." Rechecked 2026-11-08: Official contact still identifies Shmeisani, Jordan phone +962 7 9789 6999 and general info@ammandynamics.com; company LinkedIn reports 2-10 employees and Abdul Hamid Sharaf St. 86, with 2026 anniversary and Stad platform partnership activity. No dedicated HR contact or current open vacancy established. Precise address/coordinates remain unverified and provider-listed technologies are not an audited deployed stack. Company verification remains partial."
