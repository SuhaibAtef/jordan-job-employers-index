notes: >-
  The 2017 Jordan ICT directory describes Apprikot as Beecell's development arm,
  established in 2015 with 38 staff and an Amman mailing address. It listed
  www.apprikot.com, which was inaccessible during the 2026-10-17 review.
  Beecell's LinkedIn company description still names Apprikot as a subsidiary,
  but Beecell's current official website does not mention Apprikot; evidence of
  Beecell's 2026 activity does not independently prove Apprikot's present
  operating status. No current standalone LinkedIn profile, current headcount,
  dedicated careers page, verified HR address, open vacancy, or precise office
  location was established. Beecell's global employee range is not Apprikot's
  headcount. Android and iOS are historical development capabilities, not a
  confirmed 2026 internal technology stack. Previous generic Amman coordinates
  were removed because they did not identify a verified office.
  Rechecked 2026-11-04: Beecell's official website documents October 2026
  participation at Telemedia Marbella and lists Beecell careers and an Amman
  mailing address, but it does not identify an operating Apprikot division.
  Beecell's company LinkedIn profile still describes Apprikot as a
  subsidiary, while its 2022 Jordan ICT profile lists only Tomandora as a
  subsidiary. These differing descriptions cannot establish Apprikot's
  current independent status. A 2016 Jordan ICT directory lists Apprikot's
  historical Amman mailing address and management contacts, not current
  appointments. Beecell recruitment instructions are not Apprikot openings.
  No standalone active website, current Apprikot vacancy, HR contact,
  verified office coordinates, current employee count, or technology stack
  could be substantiated. Company verification remains partial.
