notes: "Amman mobile-app training & consulting company (est. 2012) running iOS/Android/PhoneGap/Unity courses; launched AppTrainers Lab with Al-Ahliyya Amman University to train students — strong fresh-grad fit. GPS verified 2026-10-06: company contact page (apptrainers.com/contact) states Amman, Queen Rania Street; its embedded map carries the same place ID as the Google Maps pin 31.9879855,35.8950749 (address label \"Queen Rania St, Amman\", category Software company, 4.9/42 reviews). jordanyp (owner-validated, updated 2016) gives building detail \"Abu Alhaj complex, 7th floor, office 710\"; current company site names no building, so building/office detail treated as dated."
research_notes_2026_11_14: "Company LinkedIn profile reviewed 2026-11-14 identifies Amman and Riyadh operations, 11-50 self-reported global employees, and training in AI/data, cybersecurity, mobile/web, games, QA and UI/UX. LinkedIn shows a recent Amman Video Editor hiring post, but whether applications remain open is unconfirmed. A separate Data Warehouse Consultant LinkedIn vacancy explicitly no longer accepts applications. intaj member listing corroborates Amman consulting/training and +962 79 6644560; its headcount range differs from LinkedIn. Queen Rania Street is supported; precise building occupancy and coordinates were not revalidated. info@apptrainers.com is a general/application address, not a dedicated HR mailbox. Listed Android/iOS/PhoneGap/Unity technologies describe training offerings, not independently verified production stack. LinkedIn company bio describes Saudi headquarters while its structured headquarters field lists Amman and Riyadh; avoid treating either as sole headquarters."
