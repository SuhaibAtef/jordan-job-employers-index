notes: "Reviewed 2026-10-18 and rechecked 2026-11-05. Official site confirms the company's cloud POS, restaurant and retail inventory, analytics and multi-branch products, with Amman/Dabouq headquarters and general contact info@aqua-pos.com (+962 79 1888655). LinkedIn identifies founding year 2005, company size 51-200 (self-reported, not a Jordan-specific audited count), and street address 29 Saed Ali Bataineh Street, Dabouq; the official site confirms Dabouq but not the building number, so the street-level address remains provided_unverified. Company LinkedIn posts from approximately September 2026 and official site activity support current operations. No dedicated HR mailbox, careers portal, open Jordan vacancy or internship was confirmed. The published general contact is not a verified HR email. No reliable evidence identified the internal development stack; cloud POS and inventory are products, not programming languages. Previous generic Amman coordinates (31.9539,35.9106) were not office-specific and have been removed. Previous ai and fintech categories were unsupported by the available product descriptions. November 5 recheck: the official site remains accessible and publishes April 2026 product updates, including an April 26 operations-dashboard announcement. The official about page confirms Dabouq headquarters and general sales/support contacts but no HR contact. The company LinkedIn profile shows recent product and client-partnership updates in 2026, supporting ongoing operations; the 51-200 size range and street address remain company-profile claims rather than independently audited facts. No active dated Jordan vacancy, dedicated HR email, verified exact office coordinates, or software engineering stack was established."
