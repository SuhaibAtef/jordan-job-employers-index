notes: "Partial company verification on 2026-10-16. Official contact page confirms Amman main office, phone +962-6-552-2331, and general helpdesk@arabiaweather.com; LinkedIn reports 11-50 employees and Amman headquarters. The company LinkedIn page includes a February 2026 event announcement identifying ArabiaWeather offices at Al-Waha Circle / Al-Mehanieh Towers, corroborating the Google Maps listing of the Carrefour/Al-Mehanieh building on Wasfi Al-Tal Street; exact suite and coordinates are unconfirmed. Official contact page links to careers.arabiaweather.com, but the portal returned a 502 error during this review, so no active vacancy was confirmed. A historical company hiring post invites social-media/content applications to jobs@ard.co; current inbox monitoring and vacancy status are unknown. Android and iOS are consumer app platforms, not evidence of internal implementation technologies; previously listed Kotlin was not independently corroborated. No current graduate/internship recruitment program was found. Follow-up 2026-10-29: The official ArabiaWeather contact page still names Amman and +962-6-552-2331 and links to the careers portal, which again returned HTTP 502, so no open role or live CV intake was confirmed. The Ard Solutions first-party contact page publishes the same Amman phone number and locates its related-group office at Almehaneyh Tower, Abdul Halim Abbas Street; this differs from the Wasfi Al-Tal Street wording in the previously recorded Maps listing, and the ArabiaWeather-specific suite or entrance remains unconfirmed. Location is now provided_unverified pending direct ArabiaWeather street-level corroboration. The Ard Solutions contact mailbox info@solutions.ard.co is general to a related entity, not ArabiaWeather HR. An Ard Group employer-authored historical Digital Sales vacancy for ArabiaWeather in Amman requested 2-3 years of experience and provided a role-specific individual mailbox; it is not current HR evidence. The company LinkedIn feed recently promoted a 300-hour meteorology diploma through its academy; this is paid training, not employment or an internship. The earlier jobs@ard.co content-creator application address remains historically evidenced only. LinkedIn 11-50 is a platform-reported size, and Ard Group or Ard Labs engineering headcounts cannot be assigned to ArabiaWeather. No verified current early-career position, audited headcount, exact coordinates, or internal implementation stack was established."
