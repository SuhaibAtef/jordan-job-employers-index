notes: "2026-11-12 recheck: Official Arquitalent careers index continues to advertise global Microsoft Dynamics 365 and Power Platform roles, but its first page shows Portugal-based roles and no confirmed currently accepting Jordan vacancy. Official company contacts directory lists offices in Portugal, Spain, Angola, Saudi Arabia, UAE, Egypt, Brazil and the USA but no Jordan street address. Historical Amman postings remain recruitment evidence only, not proof of a Jordan office. Group headcount remains a LinkedIn-reported global estimate; listed Microsoft products are client-facing consulting capabilities rather than confirmed internal stack. Existing 2026-11-06 review:  The official Arquitalent careers page 3 lists three May 2026 Amman, Jordan postings (junior Finance Functional Consultant on May 8, junior Supply Chain Functional Consultant on May 7, senior Finance Functional Consultant on May 6). These are newer employer-authored Jordan recruitment signals than the previously recorded 2024 postings; the listing remains on the employer's site but an application submission was not tested, so live acceptance is unconfirmed. The global contacts section still does not show a Jordan street address or coordinates; do not infer an occupied Amman office from job locations. The Arquiconsult MENA LinkedIn profile reports ongoing regional activity but lists Riyadh headquarters and no Amman address. The group size remains self-reported and not Jordan-specific; Microsoft technologies are service capabilities, not proof of an internal engineering stack. Previous review: 2026-10-18. The official 2024 Amman Finance and Supply Chain Junior Functional Consultant adverts required 1-3 years of Dynamics 365 Finance and Operations experience and offered structured training and Microsoft certifications; these are historical early-career hiring signals, not confirmed open vacancies. The current official 2026 jobs archive lists vacancies in other countries but no confirmed Jordan-specific role. The current official global contacts page does not list a Jordan office, so no current Amman office address, office coordinates, or Jordan-specific headcount can be verified; Amman is retained only as a historically documented recruitment location. The official career adverts and recruitment pages identify talent@arquiconsult.com as the group recruitment mailbox, not a Jordan-dedicated HR contact. LinkedIn reports 201-500 global employees, headquartered in Odivelas, Portugal. Technologies reflect official client-facing products and consulting capabilities, not an independently verified internal engineering stack."
