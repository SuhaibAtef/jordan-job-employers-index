notes: "Review 2026-11-14: Bayt.com's own current company profile (https://www.bayt.com/en/company/bayt-com-1480348/) describes its AI-enabled, trilingual MENA recruiting platform, with more than 44 million professionals and over 40,000 organizations; these are company-published platform figures, not Jordan employee counts. The company-operated profile lists 100-499 employees, a self-reported company-wide range that differs from the older 201-500 record, which is retained pending reconciliation. Another Bayt-hosted Amman profile (https://www.bayt.com/en/company/bayt-com-721252/) lists Amman but no street address. The YAML previously contained conflicting repeated location keys, including King Hussein Business Park and Sobhi Al-Qotob Street; neither precise street address nor existing coordinates were substantiated by the current first-party pages checked, so the duplicate keys and precise geocoding were removed, while both historical address claims are preserved in these notes. No currently accepting Bayt.com-as-employer vacancy or dedicated HR mailbox was confirmed; platform-wide third-party vacancies do not establish Bayt hiring. MENA's largest recruitment marketplace (founded 2000) with an Amman office among its 12 regional offices; hires entry-level back-end software engineers (1-3 years) in Amman; pin moved to geocoder street-number match for Sobhi Al-Qotob St 16 (Tla' Al Ali / Um Al-Summaq). stack verified 2026-10-07: own Amman back-end engineer job posting requires PHP or Python, Yii/Laravel/CakePHP (Yii/CakePHP have no canonical tags), JS/HTML/CSS, relational DB, Git/SVN, Vue.js a plus; Senior SE Team Lead's GitHub profile shows Laravel, PHP, MySQL, Node.js."
