notes: >-
  Reviewed 2026-10-17. Dubizzle Group's official brand directory explicitly links
  Bayut Jordan to bayut.jo. Its official website reports over 2,600 employees
  worldwide, whereas LinkedIn shows a different global employee-size band;
  neither is a Jordan headcount. Great Place to Work Jordan's October 2025
  employer profile reported 49 Jordan-based employees and described the
  Abdoun, Amman back-office operation as supporting multiple Gulf-region
  Bayut/dubizzle markets. The Bayut|dubizzle application portal lists a
  Jordan office on Princess Basmah Street but provides no building number;
  the previous city-center coordinates were generic, not office-specific,
  and have been removed. The Workable email is a group-level resume intake,
  not a verified Jordan HR contact. Historical 2025 Amman sales postings
  support hiring activity but not a currently open position. Existing
  Python/Django/React/JavaScript/database technologies were previously
  attributed to group engineering postings; these are not verified as
  Bayut Jordan's local internal stack. No current Jordan engineering
  vacancy or early-career programme was substantiated.
