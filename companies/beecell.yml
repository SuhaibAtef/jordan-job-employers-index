notes: >-
  Reviewed 2026-10-17. The official website describes content distribution, direct carrier billing,
  digital marketing, mobile applications and corporate services, and reported an Amman employee
  volunteer event in March 2026 and participation in Telemedia Marbella in October 2026.
  Official contact information confirms an Amman P.O. box (840666, Amman 11181) and
  telephone +962 6 5861730, but not a street address. Al-Anis 2 Street 28 is from a
  third-party business directory and is not independently verified; previous precise
  coordinates were removed. LinkedIn lists Dubai as global headquarters and 51-200
  employees company-wide, not a verified Jordan headcount; an ICT directory reported
  70 staff in 2022 (historical only). The official homepage contains a careers/CV section
  with the address displayed as an image. hr@beecell.com is supported by Beecell's
  2025 internship announcement reproduced on LinkedIn, but current inbox activity is
  not verified. The Java Developer listing documents Java, MySQL and MongoDB as job
  requirements; Android is an official product-development capability. Linux and Oracle
  Database are retained from historical employee-profile research and should not be
  interpreted as a verified current internal stack. No currently open vacancy was
  confirmed. Full-company verification remains incomplete.
