notes: Reviewed 2026-10-22. The company also uses the BeyondAI brand. Its official contact page publishes the Shmeisani,
  Amman address, but current physical occupancy and building-level coordinates were not independently verified.
  LinkedIn reports 201-500 employees worldwide; Jordan headcount is unknown. The official careers page displayed
  a hybrid Amman DevOps Engineer vacancy described as early-career, while an accessible QA Automation Engineer page
  describes a more senior Jordan role. Official product and engineering materials describe neuro-symbolic AI, cloud
  deployment and REST interfaces; the QA posting references JavaScript, Java, Python, Selenium, Jenkins, PostgreSQL,
  Docker, AWS and Azure as requirements or preferences. These technology signals do not establish the complete internal
  stack. The prior record included React, Node.js, PHP and TypeScript based on third-party individual profiles,
  which were not independently reconfirmed in current official material. The former coordinate pin was removed because
  it was not tied reliably to the published office address. Company-level verification remains partial despite official
  location and recruitment evidence.
