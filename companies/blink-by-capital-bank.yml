notes: "Verified real and operating: Jordan's first digital-only neobank, launched Feb 2022 by Capital Bank of Jordan; tech hiring runs through parent Capital Bank (e.g., Senior Software Engineer (.NET) and Solutions Architect roles posted in Amman). No public Blink-specific street office; city-center fallback kept. Deep-verified 2026-10-03: Blink is Capital Bank of Jordan's digital-only neobank with no separate premises (its own site says no physical presence); Capital Bank's registered office is Building 26, Suliman Al Nabulsi St, Abdali Boulevard, Amman — confirmed by the bank's Q1 2025 financial statements, the Amman Stock Exchange company guide, the LEI registry, and the claimed Google Maps HQ pin (31.9630634, 35.9060112). Blink's official site uses Capital Bank's P.O. box 941283, tying it to the same HQ. stack verified 2026-10-06: parent Capital Bank of Jordan posted Senior Software Engineer (.Net) and Solutions Architect in Amman within the last week (LinkedIn jobs page); Blink tech hiring runs through the parent bank and the Blink app is built on the Codebase Digibanc platform."
