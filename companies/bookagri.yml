notes: "Official website accessed in October 2026 and displays bookable agritourism experiences and rural stays; it states the platform began in 2015 and publishes info@bookagri.com and +962 77 223 6393 as general customer contacts, not verified HR contacts. The website lists Marj Al-Hamam, Amman (postcode 11733); physical office occupancy and precise coordinates were not independently verified. Royal Jordanian's directory separately lists an office on Mecca Street, but this conflicts with the current website location and is not used as the present address. The founder's personal LinkedIn profile is not an official company page. Current employee count, careers portal, open vacancies, internships, and internal engineering stack could not be verified. Bookagri's public iPhone app lists Cryptonic-Art as developer, so the app does not establish an in-house software stack. Earlier IoT categorization and generic Amman coordinates lacked support and were removed."
