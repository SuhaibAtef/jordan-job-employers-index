notes: >-
  Official site and press page confirm active operations, Amman base, 2021
  founding year, Arabic/English services, and Jordan/Gulf markets. The official
  custom-software page names Next.js, React, Node.js, Python, PostgreSQL, AWS,
  Vercel, Google Cloud, REST and GraphQL APIs as technologies used for client
  projects; this is not an independently audited internal production stack.
  LinkedIn reports 11-50 employees, not an independently verified headcount.
  Clutch lists King Hussein Business Park in Amman and a 2022 founding year;
  the company does not currently publish that street/site address, so its
  occupancy and exact coordinates are unverified. Legacy evidence references
  PHP, Laravel, CodeIgniter, QA, blockchain, design and DevOps capabilities;
  current usage of those technologies is not independently confirmed. The
  public hello@bottletech.net address and +962 7 7837 0057 are general business
  contacts, not verified HR contacts. A historical LinkedIn hiring post was
  for an Egypt-based social-media role, not a current Jordan vacancy. No
  confirmed current Jordan opening, graduate program or careers portal found.
  Review 2026-11-12: Official homepage, about and press pages continue to describe
  Amman-based AI automation, custom software, CRM/POS/accounting integrations,
  Kashif and Chatwiser, with services in Jordan, Saudi Arabia and the UAE.
  The official press page says more than 40 people have worked on BottleTech
  projects since 2021; this is cumulative participation, NOT current headcount.
  Company LinkedIn continues to report 11-50 employees and Amman headquarters.
  LinkedIn's historical Senior QA Engineer contract listing allowed remote work
  from Egypt/Jordan but now says applications are closed; a PHP role was Egypt-only.
  No currently accepting Jordan vacancy, dedicated HR mailbox, precise office
  address, coordinates or audited production technology stack was established.
  Retain partial company verification and approximate location.
