notes: >-
  Reviewed 2026-10-22. Official contact and homepage list the Amman regional
  office at Office 302, Anwar Paris 2, Paris Street, phone +962 6 585 8558;
  the Jordan ICT directory independently corroborates the Amman phone number.
  Current occupancy and office-specific coordinates were not independently
  confirmed; the former coordinate pair was removed rather than treated as a
  verified pin. LinkedIn reports 51-200 employees and Beirut headquarters;
  the current official careers/contact pages report more than 200 global staff
  and Dubai headquarters. Retain the LinkedIn size range as a platform-reported
  estimate, not a verified headcount; Jordan headcount is unconfirmed.
  Sales (sales@broadnet.me) and engineering (engineering@broadnet.me) are
  business contacts, not verified HR emails. The careers portal is active,
  but no Jordan-specific opening or internship was confirmed. Technologies
  include published products/protocols and role requirements, not an audited
  internal production stack.
