notes: "Uber-owned 'Everything App'; active engineering hiring in Amman - Software Engineer I (NextGen programme) explicitly welcomes fresh graduates (0-2 yrs). Apply via Careem's careers site. No verifiable Amman office street address or map pin found; GPS kept on city-center fallback. GPS deep-check attempt 1 (2026-10-03, live browser): official careem.com Jordan terms state the registered office as 'Building 14B, Rafiq Al Hariri Ave, 2nd floor, Abdali Boulevard, Amman' (Careem Networks/Jordan PSC, Companies Controller Dept. no. 1207); careem.com has no contact page or embedded office map. Google Maps 'Careem Operations Center - Amman' is a separate driver facility (Al Husseini Complex, 4th fl No. 407, Abd Ar-Rahman Khalifah St.; pin 31.9591257, 35.8518828; 995 reviews) ~5.4 km away. LinkedIn lists 'King Hussein Business Park, Building 7, Amman' (pin 31.9708514, 35.8316638) - a third site. No two sources agree on one location, and a building-level pin for Building 14B could not be confirmed (geocoder's 'Al Hariri St 14b' match at 31.98127, 35.90098 may be a different street). Pin moved from city-center fallback to Google's Rafiq Al Hariri Ave street pin (Abdali), approx. Not verified. Follow-up live-browser check: Google Maps confirms 'Rafiq Al Hariri Ave' is a real named street in Abdali, running through/adjacent to the Abdali Boulevard complex (pin 31.9641627, 35.9054186) - consistent with the official address - but Google does NOT resolve 'Building 14B' to a specific building (top result is the Abdali Boulevard mall area listing). Building-level pin still unconfirmable. GPS deep-check attempt 2 (2026-10-03): 3 live-browser tasks + 6 text searches. The live-browser tasks ran 36 steps across Google Maps, LinkedIn, careem.com and careers/press, but their final reports failed to deliver into this run (empty final responses; LinkedIn check stalled on sign-in, treated as failed). Text corroboration found no new decisive source: GulfTalent Careem postings list 'Amman, Jordan' (city level only); no directory (jordanict.com, yellow pages) or news article gives a building-level Amman office address. Leads unchanged: official careem.com Jordan terms state the registered office of Careem Networks/Jordan PSC as 'Building 14B, Rafiq Al Hariri Ave, 2nd floor, Abdali Boulevard, Amman' (Companies Controller Dept. no. 1207), but LinkedIn lists 'King Hussein Business Park, Building 7, Amman' — a genuine conflict — and the separate driver 'Careem Operations Center - Amman' (Al Husseini Complex, Abd Ar-Rahman Khalifah St., pin 31.9591257, 35.8518828) is a different facility. No second independent source agrees with the official address at building level and the LinkedIn conflict is unresolved, so the certainty bar is not met — NOT verified (attempt 2 of 3). Pin kept at Google's street-level Rafiq Al Hariri Ave pin (Abdali), approx_location=true. (Update 2026-10-03: the live-browser task's full report was delivered after the initial attempt-2 write-back. Findings: Google Maps has NO corporate-office listing for Careem — only the unclaimed 'Careem Operations Center - Amman' driver facility (Al Husseini Complex, 4th fl No. 407, Abd Ar-Rahman Khalifah St., pin 31.9591257, 35.8518828, Transportation-service category, 995 reviews) and a sparse unclaimed 'Careem Job' listing (Mecca St., pin 31.9759026, 35.8597988, zero reviews). LinkedIn Locations was authwalled; the 'King Hussein Business Park, Building 7' entry could not be re-verified and no source mentions 'Building 7'. Careem careers (jobs.careem.com) shows zero Amman postings on 2026-10-03 (only Dubai/Karachi/Lahore). Two low-authority directories agree on King Hussein Business Park / King Abdullah II St (Cybo, bizmideast); TripHobo lists Queen Rania St (same corridor) — weak corroboration of KHBP as the working-office area. Official careem.com Jordan terms verified live: Careem Networks/Jordan PSC 'having its offices at Building 14B, Rafiq Al Hariri Ave, Second floor, Abdali Boulevard, Amman, Jordan, registered at the Companies Controller Department under number 1207' — authoritative for the legal/registered office, but in tension with the KHBP directories and the absent corporate Maps listing. Conclusion unchanged: NOT verified. Attempt stays 2 of 3.)\nGPS deep-check attempt 3 (2026-10-03, FINAL): text searches + one live-browser task (22 steps: careem.com Jordan terms re-read, Google Maps 'Careem Amman' full listing scan, 'Kawar Keystone Amman' pin check, LinkedIn - authwalled). No corporate-office Maps listing exists; only the unclaimed driver 'Careem Operations Center' (Al Husseini Complex, Abd Ar-Rahman Khalifah St., pin 31.9591257, 35.8518828) and a sparse zero-review 'Careem Job' (Mecca St.). One new corroboration: Building No 14 on Rafiq Al Hariri Ave is Kawar Keystone (per GAC Jordan's own listing: '7th Floor, Kawar Keystone, Building No 14, Rafiq Al Hariri Avenue, Abdali District, Amman 11194'), so the official registered-office address ('Building 14B, Rafiq Al Hariri Ave, 2nd floor, Abdali Boulevard' from careem.com Jordan terms) points at a real building - but NO source anywhere ties Careem's tenancy to it. LinkedIn still authwalled (the earlier 'King Hussein Business Park, Building 7' entry could not be re-verified); two low-authority directories (Cybo, bizmideast) say KHBP - genuine unresolved conflict. Certainty bar not met: only ONE authoritative source for the registered office, zero second independent sources agreeing on a corporate pin. Set gps_unverifiable=true after 3 attempts. Pin kept at Google street-level Rafiq Al Hariri Ave pin (Abdali), approx_location=true - honest fallback, NOT verified. [Report delivered after write-back: live browser confirmed the careem.com Jordan terms verbatim - 'Careem Networks/Jordan PSC a private shareholding company established in the Hashemite Kingdom of Jordan, having its offices at Building 14B, Rafiq Al Hariri Ave, Second floor, Abdali Boulevard, Amman, Jordan, registered at the Companies Controller Department under number 1207' (Notice clause: 'Building 14B, Rafiq Al Hariri St., Abdali Boulevard, Amman-Jordan.'). Google Maps listing scan found NO separate Careem corporate office in Amman - only driver-facing facilities: 'Careem Operations Center - Amman' (Transportation service, Al Husseini Complex - 4th fl - No. 407, Abd Ar-Rahman Khalifah St., 2.8 stars, 995 reviews, pin 31.9591257, 35.8518828, owner-engagement signals but not definitively claimed), 'ROADS CAREEM BOX' (Recruiter, Wasfi At-Tall St., pin 31.9943418, 35.8592673, appears claimed) and 'Careem Job' (Mecca St., pin 31.9759026, 35.8597988, no reviews); plus unrelated look-alikes 'Kareem Logistics Co' (different spelling, Naouri Group) and a 'Careem' travel agency. 'Kawar Keystone' Maps listing: address label 'Rafiq Al Hariri Ave 14, Amman, Jordan', 'Located in: Abdali Boulevard', pin 31.9646114, 35.9029978, owner-managed signals - aligns with the terms' Building 14B address, but still no source ties Careem's tenancy to it. LinkedIn demanded sign-in (authwall), no location obtained. Conclusion unchanged: single authoritative source for the registered office only, certainty bar not met.]"
