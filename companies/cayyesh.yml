notes: "Reviewed 2026-10-22. Flat6Labs documented Cayyesh in its March 2023 Amman accelerator cohort and described payment-provider integrations, transaction-linked cashback, and merchant analytics. Cayyesh's own historical LinkedIn post describes its MEPS partnership. LinkedIn currently lists Amman headquarters, 2020 founding, and 2-10 employees; this range is self-reported and not a verified current headcount. The official cayyesh.com domain could not be accessed during this review. A third-party company database marks the company alive while an earlier repository research note cited an out-of-business classification; neither establishes current operations or closure. No current official product activity, open vacancy, careers page, or HR contact was confirmed. A 2023 sales-support job post published a contact email for that historical application only; it is not a verified current HR address. A 2022 Django job advert mentions Python, Django, AWS, and Docker, but the old third-party advert is insufficient to establish a current internal stack. The published Amman location is city-level only; an unverified directory street address and generic city-centroid coordinates are deliberately excluded. REST API refers to the historically advertised integration capability, not an audited production stack. The similarly named Egypt-based Cayesh is a different company."
