notes: "Reviewed 2026-10-22. Cisco's official EMEA accounts-payable directory lists Cisco Systems Jordan (entity 593) at Astra Plaza Complex, Block A, Office 505, 5th Floor, Northern Malfuf-Wadi Saqra Street, Amman 11821, and Cisco Systems Netherlands Holdings B.V. (Jordan) (entity 682) at King Hussein Business Park, King Abdullah II Street, Building 1, 1st Floor, Amman 11953. These are company-published BILLING addresses, not independently verified staffed offices; the first entity's address is retained as a provided, unverified location, and the alternate entity address is noted here. Cisco's 2025 list of subsidiaries separately identifies Cisco Systems (Jordan). Coordinates and a map pin remain unset. LinkedIn reports 10,001+ employees globally, not Jordan-specific headcount. The official global careers site describes early-career programs, but no currently open Jordan job was confirmed. Cisco's published recruitment sender addresses are not designated public HR inquiry mailboxes; hr_email remains null. Listed technologies are publicly documented Cisco products/capabilities, not an independently audited internal engineering stack. The official accounts-payable alias 593-jo-ap@cisco.com is for invoices, not HR."
