notes: "Reviewed 2026-10-22. CloudVertex's official main site and About page advertise AI/FinTech products including Basira Search, FaturaBridge and financial analytics; its linked infrastructure subdomain describes Jordan-based cloud/DevOps engineering, Kubernetes, observability, databases, automation and incident response. The About page self-reports a 2025 founding year, which has not been independently corroborated. Listed technologies are officially advertised client-service platforms and integration capabilities, not an audited internal production stack. The infrastructure page publishes a Jordan WhatsApp number (+962-79-605-3143) and a general engineering email link; these are not HR contacts. The official site provides no confirmed current careers portal, Jordan vacancy or internship program, and a matching Jordan-specific company LinkedIn page or reliable employee range could not be established; similarly named Cloudvertex and CloudVests LinkedIn profiles must not be attributed to this employer. No official street address, building, independent office confirmation or reliable coordinates were established, so location remains unresolved. This is a partial company-level review, not full verification."
