notes: >-
  Reviewed 2026-10-23. CoinMENA announced on 2026-09-20 that CoinMENA B.S.C.(c)
  began offering services in Jordan within the Central Bank of Jordan's JoRegBox
  regulatory sandbox, including JOD deposits via local bank-transfer and CliQ
  channels. The Central Bank's public JoRegBox participant list names Coin Mena
  under virtual-asset activities, and Petra reported the launch on 2026-09-21.
  Sandbox participation is not a claim of an unrestricted Jordanian license.
  CoinMENA's official about page identifies Bahrain and UAE entities and office
  addresses, not a Jordan street address. Its LinkedIn company page separately
  lists Amman as a location, supporting city-level presence but not a verified
  office address, physical occupancy or coordinates. LinkedIn lists 51-200
  employees company-wide; Jordan headcount is unknown. The December 2025
  Paribu acquisition is documented by CoinMENA. A Jordan Junior Marketing &
  Social Media Officer advertisement requested 0-2 years of experience, and an
  Amman Head of Compliance advertisement required at least 7 years, but both
  LinkedIn listings now say they are no longer accepting applications. They are
  historical hiring evidence, not confirmed current vacancies. No functioning
  dedicated careers page, verified HR recruitment email or current Jordan-specific
  vacancy was established. The retained digital-asset infrastructure technology
  label describes a product capability, not a verified internal software stack.
  Company-level verification remains partial despite confirmed Jordan services.
