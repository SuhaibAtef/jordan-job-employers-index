name: "CoinMENA"
description: >-
  CoinMENA is a Bahrain-headquartered digital-asset trading and custody platform
  serving the MENA region. In September 2026 it launched services for Jordanian
  users within the Central Bank of Jordan's JoRegBox regulatory sandbox, including
  digital-asset trading and Jordanian-dinar funding. CoinMENA joined Paribu in
  December 2025 following an acquisition valued at up to USD 240 million.
