notes: >-
  Reviewed 2026-11-10. Cozmo's official website and THE Group's first-party
  company profile confirm a Jordanian supermarket brand founded in 2003,
  online grocery shopping launched in 2016, and operations at 7th Circle,
  Amman. THE Group reports seven Simply Cozmo neighbourhood branches across
  Amman; these are not seven separately verified Cozmo main stores. The
  official THE Group vacancies page currently lists a Cozmo Bakery Manager
  position, but the page supplies no publication date or deadline and
  application acceptance was not tested. A historical LinkedIn posting
  used Careers@thegroup.jo for recruitment, but this is a group-level
  application address and has not been verified as a current dedicated
  Cozmo HR mailbox. THE Group's LinkedIn size range of 501-1000 describes
  the parent group, not Cozmo-specific headcount; Cozmo size remains unknown.
  The existing street address is retained from earlier research without
  new independent door-level verification. Coordinates remain unset.
  No internally operated software engineering stack was established from
  the existence of the online shop. Company verification does not imply
  precise location verification.
