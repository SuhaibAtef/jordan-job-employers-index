name: "Decapolis"
description: "Decapolis is a Jordan- and UK-linked B2B/GovTech food-safety and agricultural traceability technology company. Its Decapolis Food Guard platform uses a permissioned blockchain for batch-level quality and compliance records, digital certification and QR-code provenance, with IoT sensor and ERP integration capabilities. Jordan projects and international partnerships are documented."
