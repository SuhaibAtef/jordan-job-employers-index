notes: "Reviewed 2026-10-23. The official website documents B2B/GovTech food-safety traceability, permissioned blockchain, digital certification, QR verification, and IoT/ERP integration capabilities. LinkedIn reports 11-50 employees globally and founding in 2018, but its Amman, England / UK street listing is geographically inconsistent. Jordan Green Resource Center identifies Amman, and a business directory last updated in August 2023 lists Al-Sha\u0027b Street; these sources support only approximate city-level location, not a verified current office or coordinates. Jordan Ministry of Agriculture and UN/WFP reports corroborate historical Jordan projects, not a present office. No current company careers page, active Jordan vacancy or dedicated HR email was confirmed. Product capabilities are not proof of the internal engineering stack."
