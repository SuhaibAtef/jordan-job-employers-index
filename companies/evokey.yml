ale (last review ~Feb 2026) but its label already matches the new office; the contact page's embedded map pins that same listing (pin 31.9977989,35.8301188, plus code XRXJ+42). No job postings/news about the move found. Verification stands (clause b + LinkedIn corroboration)."
