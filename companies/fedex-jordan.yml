notes: "Review 2026-10-23: FedEx's Jordan country website is live, correcting the prior claim that it was unavailable. The official FedEx locator lists one Amman station on Layla Al-Akhyaliyah Street (postal code 11194), with no building number or verified coordinates; this establishes a customer station, not a corporate headquarters. Older third-party directories list Abdul Rahim Al-Waked Street, Building 27, Shmeisani, which may be historical or a different facility and was not corroborated as the current official station. Previous coordinates 31.96903,35.90387 and their map link were removed because they were not confirmed for the official current station. FedEx Jordan customer-service telephone +962 6 429 6292 is not an HR contact. Global FedEx careers include student programs, internships and other roles, but no active Jordan-specific vacancy, local internship, public HR email or Jordan engineering stack was confirmed. FedEx's regional MEISA LinkedIn lists 5,001-10,000 employees regionally; the global FedEx LinkedIn lists 10,001+ worldwide. Location verification is not full company verification."
