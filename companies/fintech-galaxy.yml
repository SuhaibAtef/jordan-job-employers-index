description: "Fintech Galaxy is a Dubai-headquartered Open Banking and Open Finance infrastructure provider. Its FINX Connect platform supports consent-based financial-data aggregation and payment initiation. In Jordan, FINX Connect participates in the Central Bank of Jordan's JoRegBox testing environment, and the company announced multi-bank connectivity in September 2026. Jordan operations do not establish a verified physical office."
