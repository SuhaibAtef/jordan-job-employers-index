notes: "Reviewed 2026-10-23. The company's 2026-09-23 official announcement reports completed multi-bank Open Banking connectivity and consent-based account aggregation in Jordan via FINX Connect. The Central Bank of Jordan independently lists FINX Connect under JoRegBox testing for Account Information Services (AIS) and Payment Initiation Services (PIS); sandbox participation must not be represented as a full Jordan operating license. Fintech Galaxy's official markets page distinguishes Jordan sandbox testing from Bahrain regulated operations and UAE regulatory progression. LinkedIn lists Dubai headquarters and 11-50 global employees; the Jordan-specific headcount and physical office/address are unverified. Removed the prior city-center coordinates and generic Google Maps pin because they were not a company address; Amman in a press-release dateline is not proof of an office. The official careers page says no public vacancies and permits general expressions of interest, without a Jordan-specific or early-career role. Official general contact info@fintech-galaxy.com is not a verified HR email. The previously recorded technologies are retained as historical indirect employee-profile claims noted in the source record (2026-10-06), not independently reconfirmed internal stack or evidence of a Jordan engineering team. The pre-existing YAML contained duplicate location keys; these have been consolidated into a single supported location block. Full company verification remains partial."
