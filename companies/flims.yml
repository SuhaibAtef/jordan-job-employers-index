name: "FLIMS"
description: >-
  FLIMS was presented as a Jordanian preventive-health technology startup in the
  2021-2022 Flat6Labs Amman seed program. Its proposed web and mobile platform
  combined diagnostic testing, lab results, wellness coaching, activity tracking,
  and chronic-disease risk information. Historical company activity is documented,
  but current operations, staffing and hiring could not be confirmed as of 2026-10-30.
