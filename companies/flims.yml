notes: >-
  Flat6Labs' 2022 investor brief describes FLIMS as a B2B2C health-tech startup
  offering diagnostic kits, subscription wellness plans, activity tracking, lab
  results, wellness coaching, and disease-risk estimates. The 2022 brief identifies
  Sufian Ahmad as CEO, Khaled Otoum in marketing and sales, Dr. Abd Al Rahman
  Zuiter in life sciences R&D, and Dr. Hanna Makhamreh in medical R&D; these are
  historical roles, not verified current appointments. The 2022 FLIMS pitch deck
  publishes info@flims.co as a general contact, not a verified HR address. The
  official domain was inaccessible during the 2026-10-21 check. No verified current
  company LinkedIn profile, employee count, office address, careers page, or open
  vacancy was found. Generic Amman coordinates previously listed did not identify
  a specific FLIMS office and have been removed. Current operating status remains
  unresolved. Names of founders in earlier research notes were not corroborated
  by the primary 2022 investor brief. Rechecked 2026-10-30: the historical
  flims.co website could not be retrieved. Flat6Labs' first Amman Demo Day
  page and 2022 investor brief corroborate the startup's participation and
  proposed preventive-wellness app and web platform, but not operations in
  2026. The first-party 2022 pitch deck describes future expansion and a
  funding ask, neither evidence that these plans materialized. No current
  attributable company LinkedIn profile, careers page, active vacancy,
  HR mailbox, headcount, street office, precise coordinates or internal
  engineering stack could be substantiated. Mobile, web and cloud were
  historical product descriptions, not confirmed programming technologies,
  and have been removed from the technologies list. Amman is documented
  only as the historical accelerator location; the current physical office
  is unresolved. The company remains unresolved rather than claiming
  current activity or closure without contemporary first-party evidence.
