notes: >-
  Official case studies document Flowless work with Miyahuna and the Water Management
  Initiative in Amman, AgriWise irrigation on Jordan Valley palm farms, and a
  hydroponics project with Jordan-based Senara. These demonstrate projects in
  Jordan, not a local headquarters, permanent office, or local hiring. The
  official contact page lists offices on Irsal Street in Ramallah, Palestine,
  and at Agora 4, 8934 CJ Leeuwarden, Netherlands; LinkedIn identifies
  Leeuwarden as headquarters. No Jordan street address or defensible company
  coordinates were found. A previous Amman city-center pin (31.9539, 35.9106)
  was not office evidence and was removed. General inquiries:
  info@flowless.co (not a verified HR address). LinkedIn's 11-50 size range is
  company-wide, not Jordan-specific. AgriWise documents LoRaWAN/RF sensors and
  a mobile dashboard; Flowless describes Modbus, MQTT and REST integration for
  its products, not a confirmed internal software-engineering stack. No
  current Jordan vacancy, internship, dedicated careers page, or recruitment
  email was verified as of 2026-10-23. Historical company/employee social posts
  are project context, not evidence of a current Jordan office or job opening.
