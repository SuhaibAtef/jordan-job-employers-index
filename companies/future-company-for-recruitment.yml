notes: >-
  Reviewed 2026-10-21. The company-operated LinkedIn profile, linked to the
  futurejordan.com domain, lists Amman headquarters, Queen Rania Al-Abdullah
  Street and 11-50 employees (self-reported company-wide range, not a measured
  current headcount). Its recent posts demonstrate active recruitment for
  client employers and one internal administrative/operations opening accepting
  fresh graduates. contract@futurejordan.com is the application address in
  that internal vacancy; data@futurejordan.com is used for client-placement
  advertisements, while info@futurejordan.com is a historically published
  general contact. The company website/cv page could not be accessed during
  this review and no dedicated careers portal was verified. A historical
  recruitment directory lists Al Omari Complex, third floor, near Sports City
  Circle; a 2018 employment-agency booklet lists a different nearby building
  description. Neither establishes current occupancy or an exact office pin.
  Current LinkedIn street-level location and a mapped recruitment business
  support Amman presence, but the building address and coordinates remain
  unverified. The company is a staffing agency, not a demonstrated software
  developer; no internal technology stack was substantiated. The Bayt profile
  claims licensing since 2004, but current licensing was not independently
  verified. Partial company verification reflects live business activity,
  unresolved website availability and exact office details.
