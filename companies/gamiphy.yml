notes: >-
  Reviewed 2026-10-23. Coretava's own LinkedIn post announced the rebranding
  from Gamiphy in 2023. The live coretava.com homepage presents Tavyo OS,
  described as an AI workspace for marketing, sales, CRM and customer loyalty;
  a separate /en landing page continues to describe CoreAds, CoreCRM and
  CoreLoyalty. LinkedIn reports San Francisco headquarters, 11-50 global
  employees and locations in San Francisco, Sao Paulo and Mexico City; no
  Jordan office is listed. The Jordan Times reported on 2022-06-09 that
  Jordan's ISSF invested USD 250,000 in Gamiphy and quoted the CEO describing
  the company's Jordan operations. This is historical Jordan presence, not
  evidence of a current Jordan office or employment. An old Amman city-center
  coordinate (31.9518, 35.94042) was unsupported and removed, along with
  duplicate location keys. No verified current Jordan street address,
  precise coordinates, careers page, Jordan vacancy, internship or dedicated
  HR email was found. The official homepage lists hello@coretava.com for
  general terms requests and support@coretava.com for support; neither is
  a recruitment address. A closed 2023 Coretava Mid Back End Engineer job
  in Ramallah requested Node.js, TypeScript and MongoDB experience and
  3+ years in engineering; it is not an active or Jordan-specific vacancy.
  Existing technology tags (Firebase, JavaScript, MongoDB, React, Redis,
  TypeScript) were preserved from earlier employee-profile research but
  were not independently reverified as the current internal production
  stack. Company-level verification remains partial because Jordan
  employment and physical presence are unresolved.
