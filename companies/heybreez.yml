notes: >-
  Founded in 2025 by Karim Malhas. HeyBreez's official August 18, 2026 seed-round
  announcement confirms a $2.5 million raise and offices in Amman and Dubai,
  with formal US headquarters. LinkedIn estimates 11-50 employees globally;
  Jordan-specific headcount is unknown. The official website provides a sales
  contact form and hello@heybreez.ai as a general contact, not a verified HR
  address. The Delaware address at 108 West 13th Street, Wilmington, DE 19801
  appears in the company's legal terms; it is not a Jordan office address.
  Repeated public-source checks have not established an Amman street address,
  so no coordinates or map pin are retained. Company LinkedIn has advertised
  senior engineering and commercial roles in 2026, but no active Jordan vacancy
  or internship was confirmed as of this review. Generative AI, NLP and REST
  API are platform capabilities, not an independently established internal
  engineering stack. Earlier source records included unsubstantiated Amman
  city-center coordinates, which have been removed.
