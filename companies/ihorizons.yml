notes: >-
  Founded in 1996 and headquartered in Doha, Qatar. The company's official
  October 2026 website documents enterprise software, cloud, AI, consulting
  and managed services; its About page describes more than 250 technologists.
  LinkedIn reports 201-500 employees globally, not a Jordan-specific count.
  A company-authored LinkedIn post confirms a Jordan HR/Admin hire in 2022;
  older directories list an Amman office near Yajouz/Jbaiha, but the company
  website and current LinkedIn locations do not confirm a present street
  address. A 2026 third-party Amman support-role listing corroborates Jordan
  recruiting interest but is closed. No exact office coordinates or map pin
  are substantiated. The official careers page publishes hr@ihorizons.com
  for CVs, and the company-branded JazzHR board has global/remote vacancies;
  remote eligibility for applicants resident in Jordan is not established.
  The remote AI Engineer posting is marked entry level but requests 1-3 years
  of experience and explicitly mentions Python, TensorFlow and PyTorch.
  Existing technology tags were preserved from earlier employee-profile
  and job-ad research (including .NET, React, PostgreSQL, jQuery, Azure and
  Google Cloud); they are historical role/product signals, not proof of
  the current Jordan engineering stack. An older generic Amman city-center
  pin and duplicate location fields were removed.
