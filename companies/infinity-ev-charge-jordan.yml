description: "Infinity EV Charge Jordan operates and expands a public electric-vehicle charging network in Jordan through a venture involving Egypt-based Infinity and Middle East Holding Company. Its fast/DC charging locations and InfinityEV mobile app support station discovery, charging-session management and digital payments; operational locations include Amman and Aqaba."
