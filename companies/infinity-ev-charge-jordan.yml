notes: >-
  Reviewed 2026-10-24. Infinity's parent announced Jordan expansion through a venture with
  Middle East Holding Company and reported seven charging stations in a 2026 company post;
  its first Jordan station began operating in November 2025. The Jordan entity's LinkedIn
  page reports 51-200 employees, but that range is self-reported and no Jordan-specific
  audited headcount is available. The July 5, 2026 Jordan Kuwait Bank announcement confirms
  JKBPay/CliQ integration in the InfinityEV app; these are third-party payment integrations,
  NOT evidence of the company's internal software-engineering stack or a Jordan-based
  development team. Petra reported a February 7, 2026 Ayla Oasis (Aqaba) agreement
  involving three planned charging stations and 90/60 kW DC chargers; a charging-hardware
  partner documents a 2026 Infinity station at Majdi Mall in Amman. The company's October
  2026 LinkedIn update announces an Uptown Amman charging-station agreement at Al Nakhil,
  Airport Road; a planned station is not proof it has opened. These are charging-site
  locations, not a corporate headquarters or recruiting office. No current official Jordan
  office street address, exact corporate coordinates, Jordan-specific hiring vacancy or
  local HR inbox was verified. The listed careers page and recruitment@weareinfinity.com
  belong to the Egypt-based parent Infinity; applicability to Jordan vacancies is
  unconfirmed. The official charging website is JavaScript-rendered. The fintech/IoT
  categories reflect payment integration and connected charging products, not proof
  that Infinity Jordan is a fintech employer. A previously recorded generic Amman
  map pin (31.9539, 35.9106) was removed as unsupported.
