notes: "Reviewed 2026-10-14 using the official site and careers page, current LinkedIn company profile, company job postings and Clutch. LinkedIn reports 11-50 global employees and lists Blackstone Building at Mecca Street/Al Haramain Circle in Amman; the sixth-floor detail appears only in third-party directories and is omitted. The earlier numeric coordinates were not independently corroborated, so they were removed; the map URL is a text search, not a verified office pin. A 2026 Amman QA Engineer posting requested 2+ years and a Bid Specialist posting requested 3 years; both were closed when checked, so no current vacancy or internship/fresh-graduate signal is asserted. Both postings publicly list hr@ispectra.co for applications; the prior a.halah@ispectra-mena.com was not independently verified as a current HR contact. Official sources support Drupal, Sitecore and Liferay; other technologies are listed in the Clutch company profile and are not evidence that every stack is used by the Amman team. The company now describes its focus as AI-enabled enterprise CMS/DXP, rather than solely web/mobile agency work."
