notes: "Reviewed 2026-10-14. Istikana's official About page confirms its Amman office at 28 Al Rawda Street, Dahiyet al Rasheed; the street address is verified, but no reliable office-level latitude/longitude was established, so previous coordinates were removed. LinkedIn reports 11-50 employees (company-wide), a 2011 founding year, and Amman headquarters; the previous 1-10 size estimate was replaced. The company currently promotes independent Arab cinema and related entertainment; its official site and LinkedIn show web, mobile and smart-TV viewing. Android and iOS denote public client applications, not independently verified programming languages or an internal engineering stack. Apple's listing remains accessible but shows a last published update in 2023; a third-party catalog reports that the Android Google Play listing was removed in May 2025, so current Android store availability is not asserted. No official careers page, publicly advertised HR-specific email, current job vacancy or early-career opportunity was found. Published content@istikana.com, press@istikana.com and support@istikana.com are business/press/support contacts, not HR. Company-level status remains partial because current hiring details and internal technology evidence are unresolved despite the verified address."
