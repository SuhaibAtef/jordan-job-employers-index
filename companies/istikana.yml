notes: >-
  Reviewed 2026-10-24. Istikana's official English and Arabic About pages
  continue to publish its office at 28 Al Rawda Street, Dahiyet al Rasheed,
  Amman 11183, with telephone +962-6-5157692. Arab Media Network (AMN)'s
  LinkedIn company page independently lists its headquarters at Complex No 28,
  Al Rawdah Street, Amman, and identifies Istikana TV among its subsidiaries.
  This supports the published street address and group affiliation, but
  does not establish separate legal ownership details or a precise office
  latitude/longitude. The company's own LinkedIn profile lists Amman
  headquarters, founding year 2011 and 11-50 employees; AMN's separate
  51-200 employee range must not be attributed to Istikana. Istikana's
  official site was accessible during this review and its company LinkedIn
  feed showed recent 2026 program and podcast promotion, supporting ongoing
  public-facing content activity, not evidence of hiring. The service
  describes web, mobile, Chromecast and Smart TV access. Android and iOS
  in the technologies list refer to client platforms, not confirmed
  programming languages or an internal development stack. Apple's iOS app
  listing remains accessible but its most recent published update is from
  2023; a third-party catalog reports removal of the Android Google Play
  listing in May 2025, so current Android store availability is not asserted.
  No dedicated careers page, current vacancy, internship, early-career
  opportunity or verified HR-specific mailbox was found. The published
  content@istikana.com, press@istikana.com and support@istikana.com addresses
  are business, press and support contacts, not recruitment inboxes.
  Company-level verification remains partial despite a verified address
  and current official platform activity.
