notes: "Reviewed 2026-10-24. Historical existence in Jordan is supported by the 2009 ICT/ITES yearbook, which lists Information Technology Guard / IT Guard without a website and gives a historical phone number. The JordanYP directory listing, registered on 2012-01-04 and explicitly marked unverified, reports Al-Sharie'ah, Jabal Al-Weibdeh, Amman, telephone +962-6-4601606, and former domain www.it-guard.com.jo; neither these contacts nor the address can be treated as current. The original record's Queen Rania Street claim conflicts with the directory, so no current street address or coordinates are asserted. Historical employment records from 2006-2013 describe system engineering, IT support, networking, antivirus/security products, security alarms, computer hardware/software and service contracts. A university-hosted former staff CV also documents an IT Guard role in 2011-2012; the individual's security-vendor certifications do not prove a company-wide stack. A separate third-party directory associates the company with itgshield.com and a 2005 founding date, but these are not independently corroborated. Both itgshield.com and the older it-guard.com.jo were inaccessible on 2026-10-24. No reliable current official website, matching active LinkedIn company page, careers page, recruitment email, employee count, active Jordan vacancy or engineering stack could be confirmed. The website field is retained as a historical third-party lead, NOT a verified active company website. Location remains unresolved and company verification partial, reflecting historical evidence only."
