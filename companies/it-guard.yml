notes: "Reviewed 2026-10-14. The 2009 Jordan ICT industry yearbook lists Information Technology Guard (IT Guard), confirming historical activity in Jordan. A JordanYP listing registered in 2012 gives Al-Sharie'ah, Jabal Al-Weibdeh, Amman and an older website it-guard.com.jo, while the original record claims Queen Rania Street. These addresses conflict, and neither is corroborated as a current office; the old coordinate pin was removed. A 2011-2013 former sales employee describes networking, antivirus, security alarms, computer hardware/software and IT services contracts; this is historical evidence, not proof of current offerings. A third-party directory associates IT-Guard with itgshield.com and a 2005 founding year, but the site was inaccessible when checked and the founding date and headcount were not independently confirmed. No official active site, current company LinkedIn page, careers page, public HR email, company size, current vacancies or reliable internal engineering stack was confirmed. JavaScript and PHP were removed because no source substantiates them. Distinguish this Jordan company from unrelated IT Guard businesses in other countries. Company verification remains partial and current location unresolved."
