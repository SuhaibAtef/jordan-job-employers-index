notes: "Reviewed 2026-10-24. Official website and company LinkedIn remain active; services include GRC, penetration testing, managed security and training. The official contact page lists hr@itsecurityct.com for careers. On 2026-10-24 the official-site-linked SmartRecruiters portal visibly listed one SOC Analyst L1 position in Al Khobar, Saudi Arabia, restricted to Saudi nationals, and no Amman position in the inspected view. An Amman Sr. Cyber Security Engineer posting from September 2026 remains visible in third-party listings but was not confirmed active on the company portal. LinkedIn promoted an Amman CCSE training course starting October 4, 2026; the company also documents delivery of the Central Bank of Jordan cybersecurity training camp (2025) and 2026 Nashama Al Cyber activity. These support training/early-career engagement but do not establish an open Jordan internship or graduate vacancy. The 2025 company CPENT brochure and LinkedIn both corroborate IMEX Building 37, first floor, Princess Rahma Street, Khalda; no independently verified building-level coordinates. LinkedIn reports 11-50 employees while the Jordan ICT directory reports 100+; headcount discrepancy remains unresolved. Listed technologies are security solutions, frameworks or role requirements, not an audited internal engineering stack. Company verification remains partial despite the verified street address."
