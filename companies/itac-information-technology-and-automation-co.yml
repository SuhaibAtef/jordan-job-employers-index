notes: "Reviewed 2026-10-14. The active primary company site is itacsoft.com; the older itaccloud.com remains accessible and uses the same telephone and general email. Official website and current company LinkedIn establish the 2002 founding, Amman headquarters, enterprise field-operations software, mobile applications, ERP integration, barcode/RFID solutions and cloud offerings. LinkedIn reports 11-50 company-wide employees. LinkedIn gives Wasfi Tal Street, Saada Building, Code 21, Amman 11821; Clutch and current local business directories corroborate this building/street, but floor information is not consistently published and is omitted. Former coordinates 31.98348,35.89069 could not be tied reliably to the office and were removed; maps_url is an address search, not a verified pin. The public info@itacsoft.com is a general contact address, not a confirmed recruiting email; no official careers page, current Jordan job vacancy or fresh-graduate/internship opportunity was established. Android/iOS are supported client platforms; Oracle Database/OCI, Huawei Cloud, Honeywell hardware, RFID and SOTI are public technology/product or partnership evidence, not necessarily the complete internal engineering stack. ITAC Solutions (itacsolutions.com) is a separate US recruiter and International Technical Assistance Consultant (ITAC Jordan) is a different Jordanian company; neither company's jobs are attributed to ITAC. Company status is partial due to unresolved recruitment and internal engineering details, while its office street address is verified."
