notes: "Reviewed 2026-10-24. ITAC's live official site and LinkedIn confirm the 2002 founding, Amman headquarters, field-sales/distribution and enterprise automation products, mobile ERP integration, barcode/RFID and Oracle/Huawei cloud offerings. The official contact page explicitly confirms Head Office — Al Saadeh Complex, Wasfi Al Tal St. 21, P.O. Box 3225, Amman 11821, telephone +962 6 5535205 and general info@itacsoft.com. LinkedIn independently lists Saada Building, Code 21, Wasfi Tal Street, Amman 11821 and a company-wide size of 11-50. No reliable building-level GPS coordinates were established; the maps URL is an address search, not a verified pin. An approximately 2023 IT Sales Officer advertisement on the company's LinkedIn is closed and used the general contact inbox for CVs. An undated third-party Telegram repost mentions fresh-graduate C#/.NET MVC recruitment, but its date, authenticity and present availability could not be independently confirmed. Neither establishes current hiring, a dedicated HR email, or an active graduate/internship programme. No official careers page or current Jordan vacancy was found. Android/iOS are client platforms; Oracle Database/OCI, Huawei Cloud, Honeywell, RFID and SOTI are publicly documented technologies, products or partnerships, not an audited internal stack. The undated C#/.NET MVC mention is not recorded as a confirmed current stack. ITAC Solutions (US recruiter) and International Technical Assistance Consultant (ITAC Jordan) are separate organizations; their vacancies are excluded. Company verification remains partial despite the verified office address."
