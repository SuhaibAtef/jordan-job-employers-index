notes: >-
  Reviewed 2026-10-14. The company's LinkedIn profile identifies a 2020 founding,
  2-10 company-wide employees, Amman/Tareq headquarters and a specific office at
  Building 22, 2nd floor, Office 26, Tabarbour Street, Journalists' Circle.
  An independent Jordan directory corroborates the Tabarbour area and company
  telephone, but not the precise building, floor or office; therefore the address
  remains provided_unverified, and previous numeric coordinates were removed.
  The company domain is linked from its LinkedIn profile and independently from
  the PECB partner announcement; the website could not be accessed during this
  review, so current on-site careers/contact details were not independently
  confirmed. A historical LinkedIn Cyber Security Engineer Intern vacancy
  publicly used hiring@itcapside.com, but that listing is closed and the email's
  present recruiting use is not confirmed. A 2026 company LinkedIn AI-project
  hiring post instead directs applicants to general info@itcapside.com and
  requests experienced specialists, including backend/API engineers familiar
  with Python or Node.js. Those two names are advertised role requirements,
  not verified internal production-stack details. The company also advertised
  a three-month hybrid practical cybersecurity training opportunity for
  students/recent graduates in 2026, distinct from an employment vacancy;
  its present intake status has not been independently confirmed. PECB
  independently describes ITCapside's cybersecurity services and partnership.
  The company remains partially verified due to unresolved current hiring
  status, HR email currency, precise office location and internal stack.
