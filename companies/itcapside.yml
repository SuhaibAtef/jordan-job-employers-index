notes: >-
  Reviewed 2026-10-24. ITCapside's current company LinkedIn profile identifies
  a 2020 founding, 2-10 company-wide employees, headquarters in Amman/Tareq,
  and Building 22, second floor, Office 26, Tabarbour Street, Journalists'
  Circle, Amman 11947. Ordonna independently corroborates the Tabarbour area
  and phone +962 780992787, but not the exact building or office. The address
  is therefore company-provided but not independently verified; no precise
  coordinates are asserted. The official domain is linked from the company's
  LinkedIn and PECB partner announcement but remained inaccessible on this
  review, so official-site contact and careers details were not confirmed.
  PECB independently corroborates the cybersecurity consultancy, risk,
  penetration-testing, digital forensics and training services. Company
  LinkedIn posts in 2026 describe API security, SAST consulting, OT/ICS
  security, professional certification training and AI/LLM security work.
  A mid-2026 company-authored AI-project recruitment call requested senior
  candidates for AI/NLP, data, backend/API, security and other roles and
  explicitly instructed CV submissions to general info@itcapside.com.
  This address is recorded as a publicly used recruiting channel, not a
  dedicated HR mailbox. The historical closed Cyber Security Engineer
  Intern posting instead used hiring@itcapside.com; its present use is
  unconfirmed. A company-announced 2026 three-month hybrid practical
  cybersecurity program targeted students/recent graduates, allowed a
  rolling start after registration, and gave +962 780992787 for enquiries;
  present capacity was not independently confirmed. A more recent company
  LinkedIn post advertised open registration for professional cybersecurity
  and AI courses; these are training opportunities, not jobs. Historical
  LinkedIn Sales Executive and Mobile Penetration Tester listings are closed.
  No currently accepting Jordan employment vacancy or official careers page
  was established. Python and Node.js were advertised AI-project role
  requirements, not audited internal production-stack facts; other listed
  technologies primarily represent publicly described services or skills.
  Verification remains partial despite a specific company-reported address.
