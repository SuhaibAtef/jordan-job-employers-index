notes: >-
  Reviewed 2026-10-15 (Jordan local date). ITG's official Jordan contact page and its current
  LinkedIn company profile independently agree on 41 Ahmad Shawqi Street,
  Jabal Al Webdeh, Amman; this verifies the street address, not the precision
  of a map pin. Prior numeric coordinates (31.956531, 35.917365) were not
  independently confirmed as a building-level location and were removed.
  LinkedIn reports 201-500 employees for the global company; Jordan ICT's
  profile describes 350+ professionals across operations, not a Jordan-only
  headcount. The official internship page lists student/fresh-graduate
  eligibility, 1-4 month training and internship@itgsolutions.com, but does
  not confirm current cohort availability; this is a dedicated internship
  inbox, not a verified general HR recruitment email. Official careers pages
  displayed September-October 2026 Amman roles including Senior Database
  Developer (minimum five years of experience) and Sales Manager (ten years),
  plus a Cairo AI/ML position; vacancies and eligibility can change.
  .NET/C#/ASP.NET/SQL Server/HTML/CSS/JavaScript/jQuery come from a 2025
  ITG Cairo team-lead posting; SQL/PL-SQL/ETL come from a September 2026
  Amman database posting. These are advertised role requirements across
  different ITG offices, not a fully verified Jordan engineering stack.
  Historical employee-profile-based Android, Angular, Flutter, iOS, Java,
  Kotlin, REST API, Swift and Vue.js claims were excluded pending primary
  evidence. LMS refers to the published EduWave product category.
  Company-level verification remains partial because internal technology
  coverage and current internship intake are not fully established, despite
  verified company identity, address, official career channels and activity.
  Follow-up 2026-10-27: ITG official careers portal and dedicated 2026-10-22
  Amman IT Security Officer posting confirm continued Jordan recruitment.
  The role requires at least two years of cybersecurity experience and lists
  SIEM/EDR investigation, incident response, vulnerability assessment and
  Windows/Linux hardening. Elastic Security is preferred; Splunk, QRadar and
  Microsoft Sentinel are acceptable alternatives. These are vacancy skill
  requirements, not proof of deployed internal tooling. Official internship
  eligibility, contact inbox, company address and global size were rechecked;
  no current internship cohort or dedicated general HR inbox was confirmed.
  Company verification remains partial.
