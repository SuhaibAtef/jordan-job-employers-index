name: "ITG (Integrated Technology Group)"
description: >-
  Integrated Technology Group (ITG), founded in Jordan in 1989, develops and
  implements enterprise, government and education software platforms. Its
  products include EduWave for education management and e-learning, WaveERP
  for enterprise resource planning, WaveGRP for government resource planning,
  and WaveDMS for document management. ITG also provides implementation,
  training and technical support across regional markets.
