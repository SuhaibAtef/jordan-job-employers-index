notes: >-
  Reviewed 2026-10-15 (Jordan time). The current official site identifies ITON
  as an MSP operating in Jordan, Saudi Arabia and Iraq, with managed IT,
  network infrastructure, cloud, cybersecurity, backup/recovery and consulting
  services. LinkedIn and WALLIX both report a 2007 founding; the primary
  LinkedIn profile reports 11-50 employees. The company's official homepage
  gives the second-floor office at Adnan Hussein Complex, 44 Queen Rania Al
  Abdullah Street, and LinkedIn independently confirms the building and street;
  location.status therefore applies only to the office address, not full-company
  verification. Previous coordinates (31.99067, 35.89316) lacked building-level
  support and were removed; maps_url is an address search, not a verified pin.
  The official contact page lists info@iton-jo.com as a general inbox, not an
  HR email. An older 2021 third-party job advertisement uses hr@iton-jo.com,
  but current recruitment use was not established; hr_email is null. No
  official dedicated careers portal or current direct company vacancy was
  confirmed. ITON's own 2026 LinkedIn announcement promotes a practical
  system-administration training/employment pathway for 20-24-year-old
  graduates and diploma holders, in cooperation with the Ministry of Digital
  Economy and Entrepreneurship / Youth, Technology & Jobs; this is not proof
  of a currently open position or guaranteed employment. Technologies are
  advertised solution/vendor partnerships or training topics, not a verified
  internal development stack. WALLIX independently confirms ITON's PAM
  reseller partnership. Company verification remains partial because direct
  hiring status, current HR contact and internal technology stack are unresolved.
