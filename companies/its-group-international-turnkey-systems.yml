notes: >-
  Reviewed 2026-10-15. Official website and company LinkedIn identify the group
  as Kuwait-headquartered and operating banking software, ETHIX/ETHIX NG,
  infrastructure and managed services; LinkedIn reports 1,001-5,000 global
  employees (not a Jordan headcount). The official contact page lists Kuwait,
  two Egypt offices, Bahrain and UAE, with no Jordan address. The official
  2022 corporate profile also includes India but not Jordan; the July 2026
  five-office ISO announcement supports the current non-Jordan office footprint.
  ITS's own Technovation Summit 2023 account documents participation in Amman
  alongside its Jordan-based partner Arizona Intelligent Solutions, which
  establishes a business relationship but not a staffed ITS office. A stale,
  unverified JordanYP directory record lists Mecca Street, while other map
  services give inconsistent Abdullah Ghosheh Street or city-only locations.
  None is sufficient to confirm a Jordan office; the previous generic
  Amman coordinates 31.9539,35.9106 and map link have been removed. This
  record should not be presented as a confirmed Amman-based employer. The
  official careers portal is active but JavaScript-rendered; no currently open
  Jordan-specific vacancy, graduate scheme or recruiting email was verified.
  info@its.ws is the company's general contact, not an HR address. ETHIX NG
  and Oracle E-Business Suite are supported by official sources. Java,
  Oracle Database and SQL Server are retained from prior historical developer
  evidence and should not be interpreted as a verified current Jordan stack;
  prior jQuery, REST API and Spring Boot claims lacked sufficiently strong
  source attribution and were removed. Rechecked 2026-10-28: two employer-
  attributed LinkedIn job advertisements independently establish historical
  recruitment targeted to Amman: Digital Banking Implementation Consultant
  (approximately two years old; Java and 4-5 years' experience) and Financial
  Analyst (approximately three years old; 2-5 years' experience). Both now
  explicitly say applications are closed. They strengthen evidence of historical
  Jordan-facing recruitment, but do not establish a staffed office or any
  current Jordan opening. A more recent Senior Full Stack Engineer listing
  in Cairo, Egypt (approximately September 2026, also closed) demonstrates
  recruitment outside Jordan and mentions C#, .NET Core, TypeScript, React
  and SQL Server as job requirements, not independently verified production
  technologies in Jordan. The official careers page still exposes filters
  including internships but requires JavaScript to display listings; no
  active Jordan role or graduate scheme could be verified. The official
  contact page still lists Kuwait, Egypt, Bahrain and UAE only, with no
  Jordan address. LinkedIn's October 2026 posts and the company website
  show ongoing group activity, not a confirmed local office. Company-level
  verification remains partial because current Jordan office, direct
  recruiting presence and exact local location remain unresolved.
