notes: "Kuwait-HQ'd banking software group (ETHIX suite); Levant operations include Jordan; participated in Technovation Summit 2023 in Amman with Jordan-based partner. Amman office street address unverified. No street-level pin found; GPS remains Amman city-center approximation. Address updated per JordanYP listing. info@its.ws confirmed on its.ws contact page. GPS attempt 1 (2026-10-04): inconclusive. Official its.ws contact page (its.ws/contact-2/) lists NO Jordan/Amman office (Kuwait, Cairo x2, Bahrain, Dubai, India only; archived 2022 page identical). Conflicting third parties: jordanyp.com + buildeey.com say 'Macca St., Amman' (phone +962-6-5503253, jordanyp listing unverified, registered 2012); UNCLAIMED Google Maps 'International Turnkey Systems ITS' pin (lat 31.9674911, lng 35.8548897 per place URL) shows vague 'Amman, Jordan' label, miscategorized 'Educational institution', 1 decade-old review, no website, 'Claim this business' shown - weak evidence; Bing panel ties same listing to Abdullah Ghosheh St 55, Um Nuwwarah (+962 6 581 8383) - different street AND phone from JordanYP. LinkedIn auth-walled; public snippet says HQ Kuwait, R&D Kuwait/India/Cairo - no Jordan. jordanict.com: not listed; no ITS job posts mention Amman; careers page empty; news page has no Jordan content. Per trust hierarchy the company's own site wins - it claims no Amman office, so no pin confirmed. Kept honest city-center fallback. GPS attempt 2 (2026-10-04): inconclusive - STRONGER evidence ITS has NO Amman office of its own. ITS 2022 company profile PDF (its.ws official) lists offices only in Kuwait, Cairo x2, Bahrain, India, Dubai; live its.ws contact page + About page list same, no Jordan; its.ws site search for 'Amman'/'Jordan' returns nothing; July 2026 ITS ISO announcement mentions exactly 5 offices (Kuwait, Cairo x2, Bahrain, UAE). ITS's own Technovation Summit 2023 article frames its Jordan footprint as a PARTNERSHIP with Jordan-based Arizona Intelligent Solutions (Al Kindi St, Amman) - not an ITS office. ITS hired staff in Amman (LinkedIn job ~2023, 'Amman, Jordan', no street address). Stale/conflicting third parties: jordanyp.com (UNVERIFIED, registered 2012) + buildeey.com (mirror) claim 'Macca St., Amman', phone +962-6-5503253; unclaimed Google Maps 'International Turnkey Systems ITS' pin (31.9674911, 35.8548897, read live from place URL) shows only 'Amman, Jordan' label, miscategorized 'Educational institution', 1 ten-year-old review, no website - pin sits ~1.5km off Macca St corridor; Bing card for same listing says 'Abdullah Ghosheh St 55, Um Nuwwarah'. Three addresses, two phones across sources - no two agree. Bar not met. Kept honest city-center fallback.\nGPS attempt 3 (2026-10-04) - FINAL: unverifiable. Live browser re-check of its.ws (contact page, About, News & Events): ITS still lists exactly 5 offices (Kuwait HQ, Egypt x2, Bahrain, Emirates), NO Jordan/Amman; site search for 'Jordan'/'Amman' returns zero results; July 2026 ISO-renewal announcement confirms the same five-office footprint; official Sept 2025 company profile PDF (its.ws/wp-content/uploads/2025/09/ITS_CP_EN_S.pdf) lists the same 5 offices. Google Maps 'International Turnkey Systems ITS' (Amman) UNCHANGED: still unclaimed, still miscategorized 'Educational institution', address label only 'Amman, Jordan', 1 ten-year-old review, no website, 'Claim this business' prompt - still weak evidence, never counts alone. Stale jordanyp.com/buildeey.com 'Macca St.' claim (2012, unverified) and Bing's conflicting 'Abdullah Ghosheh St 55' card both remain; three addresses, two phones, no two agree. LinkedIn auth-walled. CONCLUSION: no authoritative source confirms an ITS office in Amman; ITS's own official footprint explicitly excludes Jordan. Marked gps_unverifiable=true. Kept honest Amman city-center fallback pin.\nstack verified 2026-10-06: developer CVs (ITS ETHIX/Fluid banking projects) show Java/JSF/JPA on Oracle WebLogic + Oracle DB/SQL Server; recent ITS SWIFT payments dev posting lists Java/.NET, ISO 20022."
