name: "ITS Group (International Turnkey Systems)"
description: >-
  International Turnkey Systems (ITS Group) is a Kuwait-headquartered financial
  technology and systems-integration provider founded in 1981. Its ETHIX and
  ETHIX NG banking platforms serve conventional and Islamic financial institutions;
  it also offers enterprise solutions, infrastructure, managed services and
  global software delivery. Its Jordan relationship is documented through a
  Jordan-based channel partner, but a company-operated office in Jordan is unconfirmed.
