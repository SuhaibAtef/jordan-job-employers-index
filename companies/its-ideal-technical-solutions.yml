  investigations found no independent building-level directory or map listing;
  fresh 2026-10-15 searches also found no attributable company LinkedIn page,
  Jordan job advertisement or careers page. An older Google Maps link in the
  record referred to a different similarly named firm and is excluded. The
  technologies field describes website-advertised solution areas and client
  platforms, not a confirmed internal engineering stack; the earlier 'REST API'
  label was narrowed to 'API Integration' because REST specifically was not
  documented. No current internships, graduate hiring, company headcount or
  independently verified legal registration were established. Company status
  remains partial and location status unresolved; do not confuse this company
  with MEMF ITS or other businesses using similar names.
