name: "Ivvest"
description: >-
  Ivvest, now operating publicly as Ivvesa, is an Amman-based consultancy focused on
  feasibility studies, regulatory advisory, urban planning, environmental and social
  assessments, and delivery of public-sector and donor-funded projects in Jordan.
  Its earlier Ivvest business developed controlled-environment vertical farming and
  IoT-enabled hydroponic systems, including The Capsule and IvvestOS.
