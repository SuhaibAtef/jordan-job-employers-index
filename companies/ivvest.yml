notes: >-
  Reviewed 2026-10-15 (Jordan time). The original Ivvest LinkedIn URL redirects
  to Ivvesa, whose current company profile and official site identify the same
  founder Abdel Rahman Alzubaidi, a 2020 founding date and Amman headquarters.
  The active official site is ivvesa.com; historical ivvest.com was inaccessible
  during review and should not be treated as a confirmed active careers/contact
  destination. The current company focuses on Jordan public-sector feasibility,
  regulatory, environmental/social and consortium delivery consulting. A June
  2025 Jordanian news report independently documents Ivvest and ACCIONA in a
  meeting with the National Agricultural Research Center about a central-market
  value-chain study; the current Ivvesa site reports a completed central-market
  feasibility mandate. Earlier UN and startup-directory materials support the
  original IoT-enabled vertical farming product history (The Capsule/IvvestOS),
  but not its continued sale or current internal engineering stack. LinkedIn
  reports 2-10 employees; an older third-party profile's 11-50 figure is not
  treated as current. The current official site gives B7, KHBP, Amman and LinkedIn
  independently confirms the KHBP area; the exact B7 unit and its coordinates
  were not independently corroborated. Old coordinates 31.9539,35.9106
  appeared to be an approximate central-Amman pin and were removed. General
  contact info@ivvesa.com is published; no dedicated HR/recruitment address,
  careers portal, internship, current vacancy or graduate hiring signal was
  established. The site's 'Opportunities' page advertises public tenders and
  consortium alerts, not employment. React and Google Cloud tags from the
  previous record lacked reliable company-specific stack evidence and were
  removed; IoT and hydroponic automation are historical product capabilities,
  while computer vision is a currently advertised service, not a confirmed
  internal development framework. Partial verification reflects unresolved
  employment, product continuity, exact office and engineering-stack details.
