notes: >-
  Reviewed 2026-10-15; rechecked 2026-10-29. Javna's official website, About Us page and company LinkedIn
  establish Amman headquarters, operation since 2001, CPaaS, programmable SMS and
  WhatsApp Business APIs, OTP/2FA, no-code conversational AI and unified messaging.
  LinkedIn reports 51-200 employees (company-wide, not Jordan-specific). The
  official privacy policy identifies the registered office as Adnan Halawa
  Center on Industrial Road in Bayader Wadi Al-Seer; int@j and Decypha independently
  corroborate that building and street. int@j specifies a third floor, but the
  current official policy does not confirm the floor, so it is omitted. The
  prior latitude/longitude are not independently tied to the precise entrance
  and were cleared; the maps link is an address search, not a verified pin.
  The official site links a KayanHR-hosted careers portal, but following the
  portal returned a redirect loop during review; current listings cannot be
  confirmed. A company recruitment post reposted by Javna HR Careers lists
  careers@javna.com, and describes QA testing using Azure DevOps, Android/iOS
  and API testing; another recruitment post seeks 1-2 years' experience for
  customer/technical support. Historic AI and software internships are
  documented, including a company post about five AI interns and firsthand
  intern accounts, but no open October 2026 internship intake was established.
  ASP.NET Core, C#, Entity Framework Core and MySQL are documented from an
  individual 2024 backend internship and a 2026 full-stack internship report;
  these are examples of intern-used tools, not a comprehensive current stack.
  Product/API technologies are publicly advertised capabilities. On 2026-10-29
  the official homepage and LinkedIn additionally confirmed Instagram,
  Messenger and webchat channels. The KayanHR careers link still caused a
  redirect loop. Javna HR Careers and employee reposts showed recent Mid-Level
  .NET Backend Engineer (C#/.NET, Azure) and Manual QA Tester notices, while
  a Product Presales Specialist LinkedIn listing was closed. The engineering
  vacancy requirements are not proof of the full deployed stack, and the
  current acceptance of CVs was not independently confirmed. Verification
  remains partial due to inaccessible live careers listings and unconfirmed
  current early-career openings and internal stack completeness.
