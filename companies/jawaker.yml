name: "Jawaker"
description: >-
  Jawaker is a social and mobile gaming studio developing and publishing a
  single-app collection of more than 50 culturally popular card and board games,
  with multiplayer, chat and community features. Headquartered in Abu Dhabi,
  UAE, it lists an Amman, Jordan operation and has been part of Stillfront Group
  since its 2021 acquisition. Its official careers portal advertises engineering
  roles in Amman.
