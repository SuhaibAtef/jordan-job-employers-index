notes: >-
  Reviewed 2026-10-18. Corporate website and company LinkedIn identify Abu Dhabi
  headquarters and Amman operations. The company reports 51-200 employees on
  LinkedIn, a company-wide range, not a Jordan-specific headcount. The official
  site states established 2011, while Stillfront's 2021 acquisition announcement
  says founded 2009; do not treat either date as conclusively reconciled.
  Stillfront announced acquisition for USD 205 million in September 2021.
  The Waze business listing gives Emmar Towers, Zahran St 42, Amman, and the
  tower's existence is independently corroborated, but Jawaker's current suite,
  occupancy and exact coordinates are not confirmed by an official source;
  therefore the location remains provided_unverified. A 2024 company job posting
  supports AWS, Ruby, C# and Java as historical advertised backend skills, not
  an independently audited production stack. Cloudflare was removed as
  unsupported. The hiring@jawaker.com address comes from a closed 2024
  company recruitment posting and is not verified as currently monitored.
  The company careers page lists two Amman engineering positions created in
  July 2025, still displayed in October 2026, without a verified application
  status. No dedicated Jordan headcount or confirmed current early-career
  vacancy was found. Product site: https://www.jawaker.com/.
