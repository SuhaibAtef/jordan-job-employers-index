notes: >-
  2026-11-07 review: Jeeny official Jordan privacy policy identifies Bab Al Qamar for Website Management LLC as the Jordan controller and repeats the Mecca Street, Al-Hijaz Tower, Building 158 Amman address; this supports the published office address but not the recorded coordinates or current physical occupancy. Official Jeeny Workable board displayed 12 jobs, including on-site Amman Sales Agent and Live Operations Agent roles, checked 2026-11-07; direct application submission was not tested. Sales Agent description requests a high-school certificate and rotating-shift availability, an entry-level hiring signal. No Jordan-specific HR mailbox or audited headcount was found; the privacy-policy DPO is not an HR contact. Existing technology tags remain job-advert requirements, not verified deployments. Previous review: 2026-10-16. Official Jeeny contact page confirms the Amman regional-office address (Mecca
  St., Al Hijaz Tower, Building 158), and LinkedIn independently lists Mecca Street 158 and company size 201-500;
  headquarters is Riyadh, not Amman. The existing coordinate pair (31.975671, 35.8609) is retained as an approximate
  map pin, NOT independently verified as the office entrance; location.status is therefore approximate despite
  the supported street address. The official contact email inquiries@jeeny.me is a general-inquiries mailbox,
  NOT a verified HR address, so hr_email remains null. Jeeny's Workable posting for an Amman Senior Business
  Development Manager was discoverable in October 2026; listing visibility does not guarantee acceptance of
  applications. Jeeny's LinkedIn advertised a 2026 Jordan graduate trainee intake with a July 18 deadline;
  that intake is historical, not currently open. A 2026 Lahore Platform Engineer listing mentions AWS, Docker,
  Grafana, Jenkins, Kubernetes, Prometheus and Terraform as requirements; these are hiring-signal technologies,
  not independently confirmed production deployments or Jordan-specific stack. Prior Figma, Google Analytics,
  HTML and Webpack tags lacked corroborating current sources and were not retained as verified technologies.
  No verified recruiting email.
