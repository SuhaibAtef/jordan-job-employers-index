name: "Jeeran"
description: >-
  Jeeran is a Jordanian-founded Arabic local-discovery and user-review platform
  that historically helped people find, rate and discuss restaurants, services
  and other places across Amman and other Middle Eastern cities. The company
  maintains a public LinkedIn profile, but current platform availability,
  operating activity and hiring could not be confirmed in October 2026.
