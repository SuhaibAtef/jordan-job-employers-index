notes: >-
  Reviewed 2026-10-15. Jeeran's public LinkedIn profile describes its
  user-generated local reviews and places platform, lists Amman headquarters,
  11-50 employees and a PO Box (9162, Amman 11191), but does not confirm an
  active physical office. The company website jeeran.com returned a 502 error
  during review, and the historical jo.jeeran.com careers page was inaccessible;
  this is insufficient to establish that the company has ceased operations.
  An unverified JordanYP directory listing, registered in 2012, places the
  company on Abdul Raheem Al-Haj Mohammad Street in Sweifieh, without
  identifying the Al Waha 2 building or unit. The former street-number-57
  building coordinates refer to a building, not a confirmed Jeeran office,
  so unsupported coordinates and maps URL were removed. A Bayt employer
  profile contains historical recruiting copy, not current vacancies.
  A 2019 repost documents paid three-month internships in software
  engineering, sales, marketing, customer service and design, with possible
  full-time conversion; this is historical early-career evidence only.
  No current job, application channel, HR email or active internship was found.
  Previously listed Python, PHP, JavaScript and Docker stack claims were not
  independently substantiated by company engineering documentation or current
  attributable vacancies and were removed rather than asserted as current.
