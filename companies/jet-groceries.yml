notes: >-
  Official site lists hello@jetapp.me and +962 79 11 11 802 as general
  customer contacts, not verified HR contacts. LinkedIn (Jet Technology)
  lists Amman headquarters, founding year 2021, and 11-50 employees.
  September 24, 2026 company article describes owned inventory, warehouse
  fulfillment, real-time stock and delivery across much of Amman. Yango Tech
  announced a partnership in January 2024 for dispatch, driver management,
  route optimization and tracking; this is historical vendor integration
  evidence, not proof of Jet's internal engineering stack in 2026. Google Play
  lists an Android app updated September 29, 2026, and Apple's App Store lists
  the iOS app, both under developer/publisher Talabac. No attributable public
  careers page, active vacancies, graduate program, internship, street-level
  office or warehouse address, exact coordinates, or HR email was confirmed.
  The previous Amman city-center coordinates were an unsupported placeholder
  and have been removed; city-level presence is supported independently.
  Rechecked 2026-10-30. Jet's official website remains accessible and describes
  ongoing Amman grocery delivery from company-held warehouse inventory, with
  delivery hours and a general customer-service phone; the published
  hello@jetapp.me address is a general contact, not a recruiting mailbox.
  Jet Technology's LinkedIn still lists Amman headquarters, founding in
  2021, and 11-50 employees (a self-reported platform size band, not an
  independently audited headcount). Apple's current iOS listing records
  version 11.0.0 on October 11, 2026, supporting recent app maintenance;
  it names Talabac as publisher and carries a Jet For Trade And Ecommerce
  copyright notice, neither of which establishes the internal developer
  organization or a specific technology stack. The public site does not
  display a careers section, and this review found no attributable live
  vacancy, HR-specific email, street-level office/warehouse address, or
  verified precise coordinates. Retain partial company verification and
  city-level approximate location pending those details.
