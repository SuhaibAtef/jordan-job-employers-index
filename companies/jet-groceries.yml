description: >-
  Jet Groceries is an Amman-based quick-commerce grocery delivery business
  operating a mobile shopping service. The company reports stocking more than
  4,000 grocery and household products in its own warehouse and delivering
  orders across much of Amman. Its LinkedIn profile operates under the name
  Jet Technology; its Android and iOS apps are publicly listed.
