notes: >-
  Reviewed 2026-10-15. Founded 2014 per company LinkedIn, ULA Group and JCIF;
  earlier 2013 claims are not adopted. LinkedIn reports 501-1,000 employees
  globally (not Jordan-specific). The parent group's official page gives
  158 Mecca Street, Al Hijaz Towers, 6th floor; company LinkedIn and a
  geographic listing corroborate the building. Coordinates are approximate
  for the building, not a surveyed office entrance or floor-level location.
  The official group careers page links directly to Jo Academy's careers
  portal; its October 2026 postings include Software Quality Assurance Manager
  (Oct 7), Mathematics Assistant Teacher - Part Time (Oct 7), and other
  Amman roles. A 2026 React Native developer listing required 1-4 years of
  experience and supports a historical early-career signal, but an active
  internship or graduate-only program was not established. React, Next.js,
  JavaScript, HTML, CSS, React Native, TypeScript familiarity and REST API
  integration are documented in company job requirements; this is not a
  complete internal production-stack inventory. The parent group advertises
  AI-powered learning; do not infer specific model vendors or deployed ML
  frameworks from job wish lists. The $28 million financing announced by JCIF
  in February 2025 supports expansion and technology development, not proof
  of a currently open graduate intake. No public recruitment email verified;
  store support email is not an HR contact.
  Rechecked 2026-10-30: Jo Academy's official Arabic careers board displayed
  18 postings across two pages, including Senior Accounts Receivable (Oct 21),
  Senior HR Operations Officer (Oct 19), Mathematics Assistant Teacher - Part
  Time (Oct 7) and Software Quality Assurance Manager (Oct 7), all in Amman;
  these are dated vacancy signals, not guaranteed application availability.
  The English careers page was accessible but did not expose readable listings
  to the research tool; the Arabic board supplied the dated evidence. The
  official Jo Academy website remained live and described K-12, international,
  and university courses. ULA Group reported Jo Academy's $500,000 strategic
  investment in Saudi EdTech firm AILA on Aug 19, 2026 and a partnership with
  Orange Jordan in Aug 2026. The AILA investment supports an AI product
  direction, not evidence of specific internal AI frameworks. LinkedIn still
  lists 501-1,000 employees globally, with Al Hijaz Towers in Amman as its
  primary location. The parent group confirms the 158 Mecca Street address;
  confidence is medium for the approximate building coordinates, not a
  surveyed entrance. No confirmed public HR recruiting email or current
  internship intake was found. Keep partial status pending HR contact and
  independently verified current internal technology inventory.
