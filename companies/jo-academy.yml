name: "Jo Academy"
description: >-
  Jo Academy is a Jordan-based education technology company founded in 2014.
  Its web and mobile learning platform serves school and university learners
  through live and recorded lessons, interactive courses, examinations and
  educational resources covering Jordanian and international curricula.
  Jo Academy is part of ULA Group, which is expanding digital education
  products in the region.
