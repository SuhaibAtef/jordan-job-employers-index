notes: >-
  Reviewed 2026-10-15. The official contact page, company LinkedIn profile and
  JordanYP listing corroborate the Al-Jandaweel / Umm Matawee Al-Aslameyah
  Street address. The retained coordinates are an approximate directory-area
  pin, not a surveyed office entrance; a separate third-party listing gives
  31.96056, 35.84461, about 27 metres away. LinkedIn reports 51-200 employees,
  while an older JordanYP listing reports 51-100. Official careers page accepts
  general CV submissions for guarding, engineering, cybersecurity and forensics;
  no currently accepting internship or graduate-specific vacancy was confirmed.
  A company LinkedIn recruitment post sought an electrical/mechatronics engineer
  with 3+ years' experience and gave moutasemb@joeagle.com for that role only;
  this is not confirmed as a general HR mailbox. Official cyber pages advertise
  technologies and vendor partnerships, not a confirmed internal software stack.
  Gallagher Security announced a Jordanian Eagle partnership on 2025-10-16.
