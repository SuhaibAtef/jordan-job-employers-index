name: "JO Eagle (Jordanian Eagle for Security & Protection)"
description: >-
  Jordanian Eagle for Security & Protection (JOEAGLE) is an Amman-based security
  services and systems integrator founded in 2008. It provides manned guarding,
  electronic access control and surveillance, cybersecurity assessments,
  identity and endpoint security, incident response, digital forensics and
  security consulting for government and enterprise clients. The company
  lists offices in Amman, Aqaba, Petra and Tafilah.
