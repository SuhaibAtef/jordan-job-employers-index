notes: >-
  Reviewed 2026-10-15. The official contact page, company LinkedIn profile and
  JordanYP listing corroborate the Al-Jandaweel / Umm Matawee Al-Aslameyah
  Street address. The retained coordinates are an approximate directory-area
  pin, not a surveyed office entrance; a separate third-party listing gives
  31.96056, 35.84461, about 27 metres away. LinkedIn reports 51-200 employees,
  while an older JordanYP listing reports 51-100. Official careers page accepts
  general CV submissions for guarding, engineering, cybersecurity and forensics;
  no currently accepting internship or graduate-specific vacancy was confirmed.
  A company LinkedIn recruitment post sought an electrical/mechatronics engineer
  with 3+ years' experience and gave moutasemb@joeagle.com for that role only;
  this is not confirmed as a general HR mailbox. Official cyber pages advertise
  technologies and vendor partnerships, not a confirmed internal software stack.
  Gallagher Security announced a Jordanian Eagle partnership on 2025-10-16.
  Rechecked 2026-10-30: the official website, contact and careers pages remain
  accessible and confirm the Amman head-office address and general contact
  info@joeagle.com, but no dedicated HR mailbox. LinkedIn still reports
  51-200 employees, which is a platform band rather than audited headcount.
  A company LinkedIn post in 2026 advertised a Software Engineer (C / Systems
  Developer) role requiring advanced C, basic C#/.NET, Linux and Windows
  command-line use, networking and Python automation. These are job-specific
  skill requirements, not proof of an internal production stack. The linked
  recruitment.joeagle.com portal could not be accessed during this review;
  the current status of that vacancy is unconfirmed. The official careers
  page accepts general CV applications but does not confirm a live graduate
  or internship opening. The official manned-guarding page describes a
  40-hour training program for selected guards, not a graduate scheme.
  The official address is corroborated, but stored latitude and longitude
  remain approximate third-party coordinates rather than a surveyed entrance.
  The website references four named office locations while also stating two
  offices in summary metrics; no independent reconciliation was available.
