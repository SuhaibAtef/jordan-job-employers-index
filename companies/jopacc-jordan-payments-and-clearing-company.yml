name: "JoPACC (Jordan Payments and Clearing Company)"
description: >-
  Jordan Payments and Clearing Company (JoPACC), established in 2017, operates
  Jordan's domestic retail and micro-payment infrastructure: CliQ instant
  payments, JoMoPay mobile wallets, eFAWATEERcom bill payments, the Automated
  Clearing House (ACH), and electronic cheque clearing (ECCU). Owned by the
  Central Bank of Jordan and 21 operating banks, it also runs JOIN Fincubator
  for fintech entrepreneurship and university talent programs.
