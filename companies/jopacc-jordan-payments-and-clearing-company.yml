notes: >-
  Reviewed 2026-10-15; re-reviewed 2026-10-30. Official website confirms five payment systems and JOIN
  Fincubator; official About page reports Central Bank of Jordan and 21 banks
  as owners. LinkedIn reports 11-50 employees. Street address corroborated by
  company LinkedIn, official privacy policy and Central Bank of Jordan register.
  Existing coordinates retained from prior 2026-10-03 GPS review, approximate
  building pin rather than surveyed entrance. info@jopacc.com is a general
  contact, NOT an HR email; no official careers portal or current direct
  employment vacancy confirmed. January 2026 university agreement describes
  JOIN internships and training; 2026 university hackathon confirms student
  engagement, NOT an active employee hiring opportunity. CliQ is a product,
  ISO 20022 a messaging standard, and Open APIs a JOIN integration offering:
  none establishes JoPACC's internal programming stack. Unsupported REST API
  claim removed. October 2026 follow-up: JoPACC remains active, with its
  September 2026 systems figures reported by the Jordan Times on 2026-10-13
  (CliQ: 185.49 million transactions, JD18.99 billion January-September)
  and 2026-10-14 (JoMoPay: 130.33 million transactions, JD6.02 billion
  January-September). JoPACC's official 2026-01-19 Orange Jordan MoU
  describes practical training, applied projects and fintech engagement for
  Coding Academy graduates, not an advertised JoPACC job vacancy. LinkedIn
  continues to show 11-50 employees and Building 195, fifth floor, Arar
  Street. No confirmed active direct vacancy, dedicated HR email or
  internal production programming stack was established in this review.
  Retain partial verification despite the corroborated office address.
