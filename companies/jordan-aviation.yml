notes: >-
  Reviewed 2026-10-31. Jordan Aviation's official contacts and offices pages
  confirm its Amman head office in Um Uthaina on King Faisal Bin Abdulaziz
  Street; the recorded building number 55 is also on its company LinkedIn.
  Coordinates are approximate address-level geocoding, not a surveyed entrance;
  verified location does not imply full-company verification. The company's
  LinkedIn reports 501-1,000 employees (a platform estimate), and its official
  website has a Careers page with an embedded Jotform application form.
  On 2026-10-31 the embedded form displayed "Form over quota", so submissions
  through that form could not be confirmed working. The company's LinkedIn
  advertised a Technical Store Manager and recent CAMO Quality Auditor and
  Safety Assurance Manager roles, but their current application availability
  and closing dates were not confirmed. Some company-feed reposts concern
  Alexandria Airlines, not Jordan Aviation vacancies, and are not counted.
  JAV-InitPilotTrng@jordanaviation.jo is a pilot-role-specific address from a
  2026 recruitment post, while info@jordanaviation.jo is the official general
  contact; neither is verified as a general HR mailbox. No current graduate
  program, independently verified internal software stack, or exact office
  entrance coordinates were established. Company verification remains partial.
