notes: >-
  Reviewed 2026-10-15. The official contact/office pages, Jordan Aviation's
  LinkedIn profile and independent business listings agree on the Amman head
  office in Um Uthaina at King Faisal Bin Abdul Aziz Street, building 55.
  Coordinates are an approximate building/address geocode from a geographic
  listing, not a surveyed entrance; location verification is separate from
  company-level verification. LinkedIn lists 501-1,000 employees on the active
  Jordan Aviation Airline profile, while another similarly branded profile
  reports 1,001-5,000; the size is an estimate. September-October 2026 hiring
  evidence includes experienced A320/A330 commanders, safety assurance,
  technical-store management and CAMO quality roles. The role-specific pilot
  recruitment mailbox JAV-InitPilotTrng@jordanaviation.jo appeared in the
  September 14, 2026 advertisement; it is not established as a general HR
  contact. The published info@jordanaviation.jo is a general contact, not a
  confirmed HR mailbox. No official careers portal, active graduate/internship
  program or internal software/AI technology stack was substantiated. Removed
  the unsupported AI category.
