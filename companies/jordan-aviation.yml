name: "Jordan Aviation"
description: >-
  Jordan Aviation (JAV) is a privately owned Jordanian airline established in 1998
  and headquartered in Amman. It operates passenger and charter flights and offers
  aircraft wet-leasing services. The airline has historically supported transport
  contracts for United Nations peacekeeping operations.
