notes: >-
  Reviewed 2026-10-15. JBS's LinkedIn company page lists 51-200 employees,
  2005 founding, Amman headquarters and a Shmeisani office at Building 31,
  Queen Alia Street. The parent-group profiles (Midis and MDS SI) and multiple
  pages on JBS's own website identify Al-Rayyan/Rayan Tower, floors 6-7, at
  this address. However, the current JBS contact page instead lists the 1st
  Floor, Midis Group Building, 324 King Abdullah II Street, Amman; no dated
  move notice or definitive explanation was found. Accordingly the address
  is provided but the current office location is NOT independently resolved.
  Existing 31.97664,35.90467 coordinates are retained from prior research as
  an approximate Al-Rayyan Tower area pin, NOT a confirmed office entrance;
  do not use them as proof of JBS's present location. info@jbs.com.jo is a
  general company contact published by Midis, NOT a verified HR address.
  No dedicated company careers portal or current internship/graduate program
  was confirmed. A March 5, 2026 JBS LinkedIn Technical Support Engineer
  posting in Amman specified 1-2 years of experience and Cisco/firewall
  networking skills; it was closed at review, so it is a historical
  early-career signal, not a currently open role. Technologies listed above
  describe public partner/client solution offerings and advertised support
  skills, NOT a verified internal software development stack. JBS's IBM
  partnership and Cisco ACI deployments are documented by its official site;
  its official pages promote IBM QRadar, IBM Cloud Pak and IBM watsonx.
