name: "Jordan Business Systems (JBS)"
description: >-
  Jordan Business Systems (JBS) is an Amman-based IT systems integrator and
  consulting company established in 2005 and part of Midis Group. It serves
  organizations in Jordan and Palestine with enterprise infrastructure,
  networking, data-center systems, cybersecurity, hybrid-cloud integration,
  analytics, collaboration and self-service banking technologies. Its
  published partner and solution portfolio includes Cisco, IBM, Lenovo,
  Diebold Nixdorf and Red Hat.
