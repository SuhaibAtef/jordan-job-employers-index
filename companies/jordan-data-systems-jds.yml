name: "Jordan Data Systems (JDS)"
description: >-
  Jordan Data Systems (JDS), founded in 1981 and part of Midis Group's MDS
  System Integration network, is an Amman-based enterprise ICT integrator.
  It supplies cloud and managed services, data-centre infrastructure, networking,
  cybersecurity, ERP and hospitality systems, analytics, and consulting to
  commercial and public-sector customers in Jordan and the region.
