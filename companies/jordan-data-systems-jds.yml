notes: >-
  Reviewed 2026-10-15. JDS official About page confirms founding in 1981,
  Midis Group affiliation, enterprise infrastructure, cloud, security, analytics,
  hospitality and ERP service lines. LinkedIn reports 51-200 employees, while
  JDS's own site reports 60+ staff (50+ engineering specialists). Current
  official Contact page specifies 3rd Floor, Midis Group Building, 324 King
  Abdullah II Street; a business map listing and Waze corroborate the building.
  Parent MDS SI directory and LinkedIn still list 31 Queen Alia Street,
  Al Rayyan Tower, an unresolved historical-versus-current address conflict;
  official current JDS contact details take precedence. Existing coordinates
  retained as approximate area/building coordinates, NOT independently surveyed
  office entrance coordinates. info@jds.com.jo is a general contact, not a
  verified HR mailbox. A Careers link appears in the website footer but its
  target could not be confirmed; no active internship or graduate program was
  established. A historical LinkedIn Technical Consultant vacancy (closed,
  minimum two years' experience) listed Python, XML, CSS, JavaScript, Ubuntu,
  GitHub, PostgreSQL and API/JSON skills; these are job requirements, not a
  verified complete internal software stack. Vendor offerings/partnerships
  include HPE, Aruba, Oracle Hospitality, VMware, Cisco and Oracle NetSuite;
  these describe customer solutions, not necessarily internal development.
  Unsupported Oracle Fusion and Oracle Database tags and the unsubstantiated
  Internship signal were removed.
