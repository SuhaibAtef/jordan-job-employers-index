notes: >-
  Reviewed 2026-10-15. The official website and company profile confirm
  customized inbound tours and operations since 2000. LinkedIn reports
  11-50 employees, but this is a platform range rather than an audited count.
  The current official contact page places the office on the second floor at
  7 Shihan Al Oqlah Street in Abdoun; Cybo and Wanderlog corroborate that
  address. LinkedIn still lists Amin Marie Complex on Boumedin Street, an
  unresolved alternate or older address. Existing coordinates were retained
  only as an approximate street-level pin near Shihan Al Oqlah Street, not a
  surveyed office entrance; a geographic directory places nearby building
  No. 10 at approximately 31.9509,35.8724. info@jdtours.com is a general
  customer contact, not a verified HR address. No official careers portal,
  current job posting, internship, graduate program, or internal software
  stack was corroborated. The site's inquiry and online payment functions
  do not establish which technologies the company uses internally.
  Rechecked 2026-10-31: The official homepage and company profile remained
  accessible, advertising tailored private tours and scheduled small-group
  departures, with the company reporting 26 years of operation since 2000.
  Its official contact page still lists the second-floor office at 7 Shihan
  Al Oqlah Street, Abdoun, and info@jdtours.com as a general enquiries
  address. An independent business directory also lists this exact office
  address and telephone. The company LinkedIn profile still gives the older
  Amin Marie Complex/Boumedin Street location and an unverified 11-50 staff
  band; treat the official address as the current contact address, not a
  surveyed coordinate. The retained map pin is approximate with low
  coordinate confidence. A public travel-agency listing reproduces company
  tourism posts dated June 8, June 15 and June 22, 2026, suggesting recent
  promotional activity; these are not proof of current hiring or staffing.
  No company-specific 2026 vacancy, official recruitment portal, public HR
  email, internship or graduate intake was corroborated in this review.
  The general enquiries email is not classified as HR. No internal software
  stack or precise office entrance coordinates were established. Company
  verification remains partial even though its contact address is supported.
