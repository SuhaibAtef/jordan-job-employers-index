notes: >-
  Reviewed 2026-10-15. The official website describes private and customized
  Jordan tours, MICE/ground-handling services, and regional itineraries;
  LinkedIn identifies a 2013 founding year and 11-50 employees. Official
  contact page lists Khawaja Center, fifth floor, Office E-9 on Wasfi Al Tal
  Street; LinkedIn and independent Petit Fute and TourismRendezvous listings
  corroborate Wasfi Al Tal Street and/or Khawaja Center. Coordinates represent
  an approximate Google Maps business-place pin linked by the official website,
  not a surveyed office entrance. Other business listings report Ali Al
  Sarayrah Street, an unresolved alternate or possibly older location.
  The official careers page advertises Sales Executive and Business Development
  Manager positions in Jordan, each requiring at least two years of experience,
  and embeds a CV application form; no graduate-specific program or internship
  was confirmed. info@johtt.com is a general enquiries address, not verified
  as an HR mailbox. No public evidence establishes an internal software stack;
  the earlier web category was removed because an online tour website alone
  does not establish web-development hiring. Company verification remains
  partial despite corroborated office-address evidence.
