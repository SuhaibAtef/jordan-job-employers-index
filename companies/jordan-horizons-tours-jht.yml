name: "Jordan Horizons Tours (JHT)"
description: >-
  Jordan Horizons Tours (JHT) is a Jordan-based travel agency and destination
  management company founded in 2013. It organizes private tailor-made tours,
  cultural and pilgrimage itineraries, regional multi-country programs,
  ground-handling services, transport and MICE arrangements for international
  visitors and travel partners. Its official company profile lists offices in
  Amman and Aqaba; its careers page advertises tourism sales and business
  development roles.
