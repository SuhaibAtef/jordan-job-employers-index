notes: >-
  Reviewed 2026-10-31. The official website remains accessible and describes
  private tours, customized regional itineraries, ground handling, transportation
  and MICE services. Its company profile, last updated 2026-05-11, identifies
  founding in 2013 and offices in Amman and Aqaba; a public Tripadvisor listing
  contains 2026 guest reviews and management replies, supporting recent service
  activity without independently auditing staffing or licensing. LinkedIn
  self-reports 11-50 employees, Amman headquarters and a location on Al Seddiq
  Street in Aqaba. The official profile instead gives the Aqaba branch as the
  3rd Commercial Area, so the exact Aqaba branch address is not reconciled.
  The official Amman contact page confirms Khawaja Center, 5th Floor, Office
  E-9, Wasfi Al Tal Street; the retained Google Maps pin is company-linked
  and approximate, not a surveyed office entrance (medium location confidence).
  Other directories give an alternate Ali Al Sarayrah Street address, which
  remains unresolved. Official careers page still advertises Sales Executive
  and Business Development Manager positions in Jordan with at least two years
  of experience and a CV upload iframe; posting dates and successful submission
  were not independently established. No graduate program or internship found.
  info@johtt.com and sales@johtt.com are general/sales contacts, not verified
  HR addresses. No public source substantiates an internal engineering stack.
  Company verification remains partial despite supported operating activity and
  the confirmed Amman street address.
