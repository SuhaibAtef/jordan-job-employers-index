name: "Jordan Open Source Association (JOSA)"
description: "Jordan Open Source Association (JOSA) is an Amman-based nonprofit promoting open source software and hardware, open data, digital rights, online privacy and security, and accessible technology. Its Techween and OpenLab programmes support practical ICT learning and open-source contributions; JOSA also conducts digital-security research, community training and AI-related projects."
