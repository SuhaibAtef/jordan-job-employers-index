notes: "Reviewed 2026-10-16 (Jordan local date). The official contact page and a current geographic business listing place JOSA at the Center for Innovation and Entrepreneurial Excellence in King Hussein Business Park; LinkedIn gives the less specific King Abdullah II Street. The coordinates are the approximate business-park centroid from OpenStreetMap/Mapcarta, not a verified JOSA office or entrance pin; the former coordinates 31.9518,35.94042 did not match the documented business park. LinkedIn lists 11-50 employees and founding year 2009; the official About page says active since 2011, which need not indicate the legal founding year. The official careers page lists a Techween Project Manager reannouncement dated 2026-10-11 requiring at least four years' experience; this is not a graduate opening. The 2025 and 2026 OpenLab apprenticeship announcements confirm paid early-career training, but their application deadlines have passed and no currently open apprenticeship intake was confirmed. Git is documented in open-source apprenticeship/training material and Python in historical JOSA data-science hiring requirements; neither establishes the full internal production stack. JOSA's 2026 data-annotation posting documents work on an Arabic-language AI moderation model, but deployment details are unconfirmed. No dedicated HR email was confirmed. Company verification remains partial despite a corroborated campus-level location."
