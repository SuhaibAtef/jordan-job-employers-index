name: "Jordan Payments and Clearing Company (JoPACC)"
description: >-
  Established in 2017, JoPACC operates and develops Jordanian retail payment
  infrastructure, including CliQ, JoMoPay, eFAWATEERcom, automated clearing
  (ACH), and electronic cheque clearing (ECCU). It is owned by the Central
  Bank of Jordan and 21 operating banks and supports fintech innovation
  through JOIN Fincubator.
