notes: "JUST is a public university founded in 1986, with a campus near Ar Ramtha and a postal address in Irbid. LinkedIn reports 1,001-5,000 employees (not student enrollment). Its job application portal is accessible and explicitly publishes hr@just.edu.jo; a current vacancy was not independently confirmed on 2026-10-16 because the portal requires login. June 2026 academic hiring announcements had already closed. The university's Career Guidance and Alumni Office helps students and graduates find opportunities, but these are not evidence of JUST itself hiring fresh graduates or offering internships. The Center for E-Learning reports an in-house Moodle-based online examination platform with custom plugins in July 2024. A separate university project page documents ASP.NET 3.5, VB.NET and Microsoft SQL Server in an older JUSTOE system; these are historical deployments, not proof of a current organization-wide stack. Campus location is corroborated by JUST's own Google Maps link and independent mapping; coordinates represent an approximate point within the campus, not a specific HR office or entrance. University-level verification remains partial despite corroborated campus location."
