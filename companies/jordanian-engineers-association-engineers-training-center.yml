name: Jordanian Engineers Association (Engineers Training Center)
description: The Jordan Engineers Association (JEA) is a Jordanian professional engineering association founded in 1958. Its
  Engineers Academy for Training and Development (EATD), established in 1997, provides continuing education and professional
  training in engineering, IT, project management, contracts, and related fields. The academy is a training arm of the association,
  not a separate verified technology employer.
