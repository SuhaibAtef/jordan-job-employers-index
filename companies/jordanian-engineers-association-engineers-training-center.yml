notes: Reviewed 2026-10-16. JEA founded 1958; its Engineers Academy for Training and Development (EATD) founded 1997. Official
  JEA and academy pages confirm engineering, IT, project management, BIM/CAD, energy and AI training; these are course subjects
  or partner platforms, not evidence of an internal software stack. Academy LinkedIn self-reports 201-500 employees, but that
  range is not independently validated for academy staff and may include association personnel. Academy address at Building
  27, Sate Al-Husari St corroborated by academy LinkedIn and independent business listings. The JEA association headquarters
  is separately listed at the Professional Associations Complex, Abd Al-Hameed Sharaf St; do not conflate these sites. Existing
  coordinates retained as approximate academy-area pin, not a surveyed entrance. training@jea.org.jo is the official training-program
  contact, NOT a verified HR inbox. Official JEA internal-staff vacancies page exists but displays no publicly confirmed active
  vacancies. JEA job board advertises third-party employers; its listings are NOT evidence of JEA hiring. Academy provides
  early-career training for engineers, but no current academy internship or graduate employment recruitment was confirmed.
  Therefore early_career_signal false.
