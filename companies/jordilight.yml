notes: >-
  Founded in 2020 according to company LinkedIn. LinkedIn lists Delaware,
  United States, as headquarters, whereas StartupsJo identifies Jordan and
  founder Robert Haddad's public profile places him in Amman. This supports a
  Jordanian founder/team connection but does not establish an operating office
  address in Amman. No street address or office-level coordinates could be
  corroborated; the former Amman city-centre pin was removed. Employee range
  is self-reported on LinkedIn, not independently audited. The Apple App Store
  changelog explicitly names a Flutter/Dart SDK upgrade, supporting the mobile
  companion app stack but not a complete internal engineering stack. The
  published robert@jordilight.com is the founder's business contact, not a
  verified HR mailbox; support@jordilight.com is customer support. No dedicated
  careers page, currently accepting vacancy, or internship was confirmed on
  2026-10-16; the previously recorded Internship signal lacked evidence.
