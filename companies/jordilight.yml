description: >-
  JordiLight develops and sells a connected multi-purpose outdoor lighting device
  that combines flashlight, headlamp, lantern and work-light functions. Its
  companion mobile app provides Bluetooth lighting control, while the hardware
  includes a compass and fall-detection features.
