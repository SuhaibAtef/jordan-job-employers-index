notes: >-
  Reviewed 2026-10-16. Official JorMall website and the company's LinkedIn
  profile identify Central E-Commerce Co. Ltd., established in 2000, and
  describe SMS communications, marketing, customer engagement and loyalty
  services. The official site also describes an e-commerce offering. LinkedIn
  reports 51-200 employees; this is a self-reported range, not an audited
  headcount. The official contact section and LinkedIn independently agree
  on Khaled Hanafi Street, Building 3, 4th Floor, Sweifieh, Amman, also
  corroborated by an independent business directory. Address confidence is
  high, but no exact office coordinates were established; previous
  31.9539,35.9106 coordinates were a city-center approximation and have
  been removed. The official general contact is info@jormall.com and
  telephone +962 6 5855703; neither is a confirmed HR contact. No
  official careers portal was established. Company-authored LinkedIn
  advertisements for Sales Support Executive and Sales Executive -
  Cybersecurity & Technology Solutions were found, but both are marked
  no longer accepting applications; neither establishes current hiring or
  an internship/graduate program. SMS Gateway denotes an advertised
  service/platform, not a verified internal implementation stack. The
  former josms.net website was not accessible during this review.
  Company-level verification remains partial because HR contact, live
  openings, exact coordinates and internal technology stack are unconfirmed.
