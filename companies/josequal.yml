notes: >-
  Reviewed 2026-10-16. Official About, Services and Contact pages confirm
  software development, AI integration, digital marketing and the Jabal Al
  Hussein office. Company LinkedIn independently confirms the street/complex,
  reports 11-50 employees and states founded in 2018; an older company webpage
  states 2019, so founding year is unresolved. The official About page reports
  20+ specialists. A business directory independently corroborates 193 Khaled
  Ben Al-Walid Street; existing coordinates are retained as an approximate
  street/building pin, not a surveyed office entrance. Official Services page
  advertises Next.js, Laravel, React Native, Swift, Kotlin, LLM/RAG integrations;
  Flutter, Firebase, Dart and SQL are supported by historical developer
  recruitment evidence, not a complete current internal stack. Generative AI
  is a marketed service capability, not a confirmed framework. The site's
  'Careers' footer link leads to the general contact page, not a verified
  recruitment portal. info@josequal.com is general contact, not HR. A company
  LinkedIn Sales Officer advertisement (visible October 2026, posted several
  months earlier) directs CVs to apps@josequal.com and asks for at least three
  years' experience; it is not confirmed open today and that address is
  vacancy-specific, not a verified general HR mailbox. Historical developer
  posts mention fresh graduates, but no currently accepting internship or
  graduate vacancy is confirmed. Company-level verification remains partial.
