notes: >-
  Flat6Labs' July 2023 investor brief identifies Omar Hadid as CEO, Ibrahim
  Alafeef as engineering lead, and a mobile app and B2B dashboard as products.
  The founder email o.hadid@kabaten.com appears in that historical brief, but
  is not established as a recruitment/HR address. LinkedIn lists a 2021 founding
  year, Amman headquarters and 2-10 employees; this self-reported range is not
  a current independently audited headcount. The previously listed website was
  inaccessible during the 2026-10-18 review. No reliable current careers page,
  open vacancy, internship, precise office address, coordinates, or internal
  programming stack was confirmed. Earlier research notes cited a PitchBook
  out-of-business date in December 2024, but the underlying profile was not
  independently retrievable in this review; do not treat shutdown as confirmed.
  The company is historically documented, but present operations remain uncertain.
