description: >-
  Jordanian sports-technology startup documented in Flat6Labs' 2023 Amman cohort.
  Its described products included B2B football competition-management and live-data
  software, alongside a B2C mobile app for players, coaches, and fans. Current
  operating status and product availability could not be independently confirmed.
