notes: "Reviewed 2026-10-19. The official website confirms Arabic-language digital creator networking, animation, branded video and content-production services, and dates operations to 2008 (earlier dataset said 2005). The company LinkedIn profile lists 11-50 employees, Amman headquarters, the Abu Al Dhahab Complex address and recent 2026 posts; an independently indexed Maps business listing corroborates the same Amman address. Location.status verified reflects the address, not independent validation of the inherited latitude/longitude (31.974926, 35.860521), which remain approximate historical map-pin data. The official careers page exists but displays no dated vacancies; no current Kharabeesh job posting or internship was confirmed. A historical animator internship mentioned in the prior audit is not a current early-career hiring signal. Public iloveyouguys@kharabeesh.com is a general/creator contact, not a confirmed HR mailbox. The official site describes a multi-platform analytics dashboard and mobile application, but does not disclose an engineering stack; Maya and animation/video tags in the legacy record describe historical creative work rather than verified current production software. Older sources disagree on founding year and employee counts; current first-party/LinkedIn information is preferred. Company verification remains partial despite corroborated office location."
