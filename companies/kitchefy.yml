notes: >-
  Reviewed 2026-10-19. Critical current-status conflict: co-founder Marwan Abu Sakha
  publicly announced in 2025 that Kitchefy's venture had ended after multiple pivots;
  co-founder Abdullah Absi acknowledged the end of the journey in the same thread.
  The live website continues to advertise POS/RMS, Kitchefy Pay, online ordering and
  regional contact offices, including an Amman address on Mecca Street; no evidence
  was found that this reflects an active 2026 employer or a current Jordan office.
  A JordanYP listing last updated 2023 gives a different historical Amman address,
  Wasfi Al-Tal St 168. The prior coordinates 31.992508,35.865706 corresponded to
  that older listing and are removed because the location is not verified. The
  website-listed Amman address is retained as provided, not independently verified.
  LinkedIn lists 11-50 employees and Riyadh headquarters but its virtual-kitchen
  description appears historical; current headcount cannot be established, so size
  remains null. A historical Junior Operations Officer posting in Amman is closed,
  and a former Junior Sales Officer role was reported; neither proves current hiring.
  No current vacancy, internship, careers page or dedicated HR email was confirmed;
  support@kitchefy.com is a customer-support contact, not an HR address. The listed
  technologies were recorded in a 2026-10-05 review from historical employee
  profiles (GulfTalent/The Org) and are preserved as unconfirmed historical stack,
  not verified current production technologies. The company was founded in 2021 and
  reported a $350K pre-seed round in 2022; those facts do not establish current
  operations. Do not mark this as an independently verified active employer.
