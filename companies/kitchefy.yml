name: "Kitchefy"
description: >-
  Jordan-founded food-technology venture established in 2021, originally connecting
  restaurant brands with underused commercial kitchens. Its still-published website
  markets a cloud point-of-sale and restaurant-management platform, including online
  ordering, payments, inventory and kitchen operations. A co-founder publicly stated
  in 2025 that the venture had ended after multiple pivots; the current website alone
  does not establish that Kitchefy remains an operating employer.
