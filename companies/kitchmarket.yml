notes: "Kitch & Co's official history states that KitchMarket was founded in September 2021 and became Kitch & Co in May 2024 following a pivot from kitchen-space marketplace to managed cloud-kitchen operations. This record and companies/kitch-and-co.yml refer to the same business lineage; do not count them as independently verified current employers. The legacy KitchMarket website remains accessible but is not proof of continued separate operations. LinkedIn (now Kitch & Co) reports 2-10 employees and Dubai headquarters; the size pertains to the successor company, not a separately operating KitchMarket workforce. Historic iPARK/ShamalStart accelerator participation and an Amman kitchen partnership support a Jordan connection, not a current physical office. The previous coordinate pair (31.9539, 35.9106) and map pin do not identify a verified business location. No verified HR email, dedicated careers page, current vacancy, or internal technology stack was found as of 2026-10-18. The former marketplace advertised food-intelligence analytics; this is a product feature, not evidence of an internal engineering stack. Third-party 'out of business' classifications may reflect the superseded brand rather than closure of its successor."
