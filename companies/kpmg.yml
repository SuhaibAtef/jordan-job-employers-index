notes: >-
  Reviewed 2026-10-18. Official KPMG Jordan pages identify the legal firm as
  Kawasmy and Partners Company and confirm audit, tax, advisory, financial,
  risk and IT advisory services. KPMG announced in February 2026 that its
  Jordan workforce was about 400, with an aspiration to reach 1,000; the
  latter is a target, not current headcount. KPMG Middle East's LinkedIn
  profile lists an Amman location on Al-Shareef Abdul Hameed Sharaf Street,
  while third-party business directories identify Building 28. The 2026
  lease announcement describes a new Amman headquarters but does not
  establish whether the new office is occupied or whether Building 28 is
  still the current address. Historical coordinates have therefore been
  removed and the street address is not marked verified. No current public
  HR recruitment email was established. The official Jordan careers page
  promotes graduate opportunities; an older third-party graduate listing
  should not be interpreted as an open intake. A Jordan graduate job listing
  on LinkedIn was marked no longer accepting applications. KPMG PREVA,
  cybersecurity, data analytics and IT advisory are products or service
  capabilities, not evidence of the internal software engineering stack;
  earlier technology tags were removed from technologies rather than
  misrepresented as confirmed programming tools. The regional LinkedIn
  headcount is not the Jordan headcount.
