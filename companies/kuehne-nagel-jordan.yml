notes: Reviewed 2026-10-18. The official corporate website and LinkedIn confirm a global freight-forwarding and logistics business;
  the company locator previously indexed a Jordan National HQ at 14 Zahran Street, 3rd Circle, Amman, but the current locator is dynamically
  rendered and does not confirm a current street address in its accessible text. IATA lists Al-Hamra Building, Shmeisani, and JordanYP
  lists Al-Thaqafah, Shmeisani; these conflict with the formerly indexed official address. Retained the historically listed Shmeisani
  locality but not an asserted verified office pin; removed unsupported coordinates. The official global careers portal is active, but
  no currently open Jordan vacancy or Jordan-specific graduate/intern programme was confirmed. A German Jordanian University 2014 fair
  handbook listed 103 Jordan employees and fresh-graduate opportunities; this is historical only. 82,000+ is a global workforce figure,
  not a Jordan estimate. info.amman@kuehne-nagel.com is a general contact, not verified HR. No locally supported internal technology
  stack or AI hiring was found; removed unsupported AI category.
