notes: >-
  Reviewed 2026-10-18. ESKADENIA's dated October 28, 2008 announcement identifies
  MetroBeam Wireless Telecommunications Co. LLC as Kulacom and documents its
  licensed WiMAX and VoIP services plus an outsourced billing/CRM arrangement.
  Dell's historical customer case study documents VMware vSphere, PowerEdge,
  EqualLogic, a data center and 120 employees at the time; none establishes a
  current stack or headcount. Contemporary 2010 reporting also described
  broadband, voice and data-center services. A third-party directory lists
  300 King Abdullah II Street in Amman, but current occupancy and the old
  map coordinates were not verified; location is not fully verified.
  The historical kulacom.jo domain was not established as a working official
  website in this review. The LinkedIn result for Kulacom Communications
  describes a Bahrain company and was not adopted as proof of this Jordan
  entity. No current company-specific careers page, vacancy, internship,
  recruitment email, current employee count or reliable 2026 operating
  confirmation was found. Historical product and technology tags are not
  evidence of present-day deployment. Do not confuse Kulacom with Kalaam Telecom.
