notes: "Reviewed 2026-10-18. Official website reports 1,700+ titles and use in 22 countries; these are self-reported reach figures. Kutubee is a digital product of Jabal Amman Publishers, corroborated by the iOS App Store developer listing. Official contact page and company LinkedIn both locate the organization on Islamic College Street, Third Circle, Amman; a third-party directory lists building number 81, but exact current building occupancy and coordinates were not independently confirmed, so the prior pin was removed. support@kutubee.com is technical/customer support, not a verified HR recruitment email. LinkedIn reports 11-50 employees without an independently audited or Jordan-only headcount. The 2025-2026 reading festival and 2026 UAE reading competition support recent platform activity. A closed entry-level freelance Illustrator job (posted about nine months before review) establishes historical entry-level recruitment only. A closed Full Web/Apps Stack Developer vacancy from about four years earlier mentioned React Native, Node.js, HTML5, CSS3 and JavaScript; these are historical hiring requirements, not proof of the current internal stack. Android and iOS are supported product platforms. No current vacancy, dedicated careers page, or confirmed HR email was found; full-company verification remains incomplete."
