description: "Kutubee is an Amman-based interactive reading and literacy platform for children aged 3-14, offering more than 1,700 Arabic, English and French titles, reading-level tools, read-aloud features and teacher/parent reporting. It is a digital product of Jabal Amman Publishers and serves schools and families; the company says it is used in 22 countries."
