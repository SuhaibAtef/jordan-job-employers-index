notes: Reviewed 2026-10-19 (Jordan time). Company LinkedIn self-reports founding in 2025, Amman headquarters and
  2-10 employees; these are self-reported figures, not audited headcount. October 2026 official LinkedIn posts confirm
  active factory camera AI product development and AI Engineer recruitment in Irbid. A LinkedIn AI Engineer job
  advertisement says 11-50 employees and based in Irbid, conflicting with the company profile; neither establishes
  a street address or a change in headquarters. A newly indexed Computer Vision Working Student listing describes
  a 3-month internship (despite a 40-hour/week workload). September 19 Dr.Job junior technical sales and computer
  vision mentor listings show recruitment, but LinkedIn says junior sales applications are closed; do not assert
  that role remains open. Python and PyTorch are current job requirements; NVIDIA edge hardware is referenced in
  the company hiring post. These are job/product technologies, not an audited internal stack. The site and job posts
  support Jordan operations, but repeated prior location research found no verifiable street address or precise
  office coordinates. City-center placeholder coordinates were removed. No dedicated careers portal or confirmed
  HR recruitment email. Do not confuse with unrelated lahza.io fintech company.
  Rechecked 2026-11-05: the employer-authored LinkedIn AI Engineer and Computer Vision Working Student listings, both posted approximately two weeks earlier, explicitly state applications are no longer accepted. The working-student advertisement describes a three-month internship at 40 hours per week, not conventional part-time hours. A third-party Dr.Job mirror still shows an application deadline of 2027-01-15, but that does not override the closed application status at LinkedIn. An employer-authored Industrial Sales Partner commission-based posting is also marked no longer accepting applications. Thus these are recent hiring signals, not confirmed currently open vacancies. The AI Engineer posting refers to an Irbid-based 11-50-person team while the company profile has described an Amman headquarters and 2-10 employees; do not replace the company location or size without resolving the discrepancy. No dedicated HR contact, street address, coordinates, or independently audited headcount established.
  Rechecked 2026-11-09: the original LinkedIn AI Engineer and Computer Vision Working Student listings remain marked no longer accepting applications. The AI Engineer description says Irbid and 11-50 employees, conflicting with the company profile's earlier Amman and 2-10 claims. Third-party job mirrors still display the AI Engineer role, sometimes with a January 2027 deadline, but do not establish that direct applications remain open. Python and PyTorch are supported as advertised role requirements, not independently audited deployed technologies. No new verified street address, coordinates, dedicated HR email or current open direct application was found.
  Rechecked 2026-11-13: the company-controlled LinkedIn profile still identifies
  Amman as headquarters, 2-10 employees (self-reported), and a 2025 founding.
  Its indexed employer-authored posts document an AI Engineer recruitment call
  for Irbid and an October 19 Startup Alley appearance at German Jordanian
  University, alongside a claimed intaj membership. The public page does not
  establish whether the recruitment call remains open on this review date;
  earlier individual LinkedIn job advertisements were marked closed. The
  official lahza.ai website could not be accessed during this check. No
  independently confirmed HR email, office address, coordinates, audited
  headcount or deployed production stack was established. Company-level
  verification remains partial; Amman is a self-reported city, not a
  geocoded office.
