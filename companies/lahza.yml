notes: Reviewed 2026-10-19 (Jordan time). Company LinkedIn self-reports founding in 2025, Amman headquarters and
  2-10 employees; these are self-reported figures, not audited headcount. October 2026 official LinkedIn posts confirm
  active factory camera AI product development and AI Engineer recruitment in Irbid. A LinkedIn AI Engineer job
  advertisement says 11-50 employees and based in Irbid, conflicting with the company profile; neither establishes
  a street address or a change in headquarters. A newly indexed Computer Vision Working Student listing describes
  a 3-month internship (despite a 40-hour/week workload). September 19 Dr.Job junior technical sales and computer
  vision mentor listings show recruitment, but LinkedIn says junior sales applications are closed; do not assert
  that role remains open. Python and PyTorch are current job requirements; NVIDIA edge hardware is referenced in
  the company hiring post. These are job/product technologies, not an audited internal stack. The site and job posts
  support Jordan operations, but repeated prior location research found no verifiable street address or precise
  office coordinates. City-center placeholder coordinates were removed. No dedicated careers portal or confirmed
  HR recruitment email. Do not confuse with unrelated lahza.io fintech company.
