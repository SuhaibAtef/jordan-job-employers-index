notes: "Reviewed 2026-10-19 (Jordan time). The official About/Contact pages confirm the Jordan founding in 2006, software and telecom focus, and 90 Wasfi Al-Tall Street office; company LinkedIn and Waze corroborate the address. The original map coordinates were not established as the precise office point and have been cleared. LinkedIn reports 201-500 employees across the company, not a Jordan-only count. The official careers page explicitly says the company is not currently hiring as checked 2026-10-19. Company-authored LinkedIn recruitment posts and now-closed job ads document prior Amman recruitment and jobs@leading-point.com as an application email; a past entry-level Technical Support Engineer role does not prove current junior or internship openings. Angular, .NET Core, C#, TypeScript, SQL Server, PostgreSQL, Azure DevOps and REST APIs are requirements from a historical senior job posting, not a complete or audited internal stack; Computer Vision is associated with the VisionPoint AI identity-verification product. The prior contactus@leadingpoint.com address was not confirmed as an HR contact. Do not confuse this software firm with the unrelated leadingpoint.jo management-advisory business."
