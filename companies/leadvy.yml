notes: "Reviewed 2026-10-19. The active official site and LinkedIn company page confirm digital marketing, web development and operations in Amman, Dubai and Jeddah. The official contact page lists the Amman office at Dana Complex, Al-Madinah Al-Munawarah Street, Al-Rabiah; older independent directories instead list Abu Al Hajj Commercial Complex on Queen Rania Street. The current official address is retained as provided but not independently geocoded; prior coordinates 31.9539,35.9106 were an Amman city-center fallback, not an office pin, and have been removed. LinkedIn lists 11-50 employees company-wide, whereas the official website claims 50+ employees across three countries; Jordan-only headcount is unknown. WordPress, Next.js and HubSpot are publicly advertised services, not an audited internal engineering stack. hello@leadvy.com is a general contact address, not a confirmed recruitment mailbox. No dedicated careers page or current Amman vacancy/internship was confirmed. A historical LinkedIn Business Analyst posting displayed under Amman specified Riyadh as the actual work location and is closed; it is not evidence of current Jordan hiring."
