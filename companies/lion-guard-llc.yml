notes: >-
  Reviewed 2026-10-19. Official company pages corroborate active public-facing
  operations in Amman, founding in 2021, and offerings in CCTV, access control,
  fire safety, automation and infrastructure. Listed technologies are vendor
  products and advertised system capabilities, not an audited internal software
  stack. The official contact page lists Wasfi Al Tal Street without a building
  number. A 2021 company-supplied press release and older directory identify
  Khalda, opposite Midas Furniture, building 246; current occupancy of that
  specific building and exact coordinates are not confirmed. Removed the
  previous precise coordinates, which were not supported by an exact official
  office pin. A 2021 directory lists 1-5 employees, too old to treat as a
  current workforce estimate. info@lionguard.net and +962 78 6565899 are
  confirmed general contacts, not a dedicated HR recruitment address. No
  reliably matching LinkedIn company page, dedicated careers page, current
  vacancy or internship was found; similarly named foreign firms are unrelated.
  Customer/project references on the official website are company claims and
  not independent confirmation of those customer relationships.
