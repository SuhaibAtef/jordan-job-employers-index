notes: >-
  Reviewed 2026-10-19. The company's official About Us page confirms its
  Amman headquarters and Arabic-literacy products; the official Contact Us
  page gives 44 Queen Nour Street, Amman and Jordan telephone +962 79 1286005.
  The street address is company-published, but exact building occupancy and
  coordinates were not independently corroborated; previously stored precise
  coordinates were therefore removed. LinkedIn reports 51-200 employees
  company-wide, not an independently verified Jordan-specific headcount.
  Seesaw announced its acquisition on 2025-04-15. The official Greenhouse
  careers board showed no current openings on 2026-10-19; an archived Senior
  DevOps Engineer vacancy for hybrid work in Amman is closed, while a third-party
  repost dated 2026-10-14 is not proof that applications are currently open.
  The archived role mentions AWS, CI/CD and Terraform as requirements, not a
  production-stack audit. iOS is supported as an app delivery platform by the
  I Read Arabic App Store listing. Previously recorded WordPress use could not
  be substantiated as a current company technology. No verified HR-specific
  email or current early-career hiring programme was established. The company
  has active public communications, but this does not establish full verification.
