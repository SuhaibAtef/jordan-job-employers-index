name: "Liwwa"
description: >-
  Amman-based financial technology company founded in 2013 that provides
  financing to small and medium-sized businesses in Jordan, including
  collateral-free and Sharia-compliant loan options. Its borrower-facing
  website supports online loan applications; its former retail peer-to-peer
  investment marketplace stopped accepting new investments in July 2023.
