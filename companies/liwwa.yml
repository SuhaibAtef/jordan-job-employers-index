notes: >-
  Reviewed 2026-10-19. The live official borrowing site confirms SME lending,
  a Jordan business-loan application flow and Sharia-compliant options. The
  company's own blog says its retail-investment marketplace closed to new
  investment after 2023-07-01; historical descriptions of an active P2P
  marketplace are outdated. Official contact and company LinkedIn independently
  agree on the 257 Prince Mohammed Street, mezzanine-floor, 3rd Circle, Amman
  office; a JordanYP listing corroborates the street/area. The address is
  corroborated, but the previously stored coordinates (31.95239, 35.93126)
  conflict with the listing's XW36+RQV plus code and are not a defensible exact
  office pin; coordinates are deliberately withheld. LinkedIn lists 51-200
  employees company-wide (not an independently audited Jordan headcount),
  whereas WUZZUF lists 11-50, so the size remains source-dependent. WUZZUF
  showed no open liwwa jobs at review; a historical LinkedIn Relationship
  Officer listing is closed, and third-party job reposts do not establish
  current vacancies. WUZZUF is a third-party employer/jobs profile, not an
  official careers portal. A former QA engineer's self-reported work history
  supports historical use of Selenium, Java and Python in test automation,
  but does not verify a current production technology stack. The official
  borrower/investor contact telephone is +962 79 870 4070; no HR-specific
  public email or current internship/fresh-graduate programme was confirmed.
  The company and street address are corroborated, but hiring, headcount,
  current stack and exact coordinates remain incomplete, so company-level
  verification is partial.
