notes: "Reviewed 2026-10-19. Logicom's Jordan distribution page and parent group structure independently agree on the Jordan Trade Center, third-floor address at 134 Queen Rania Street; IBM's partner directory also corroborates it. The previous coordinates (31.997809, 35.882345) were not independently verified as the precise office entrance and were cleared; the map link now searches the confirmed address rather than asserting an exact pin. The Jordan office is an operating technology distributor, not established as a local managed-services provider. Current group careers listings show three Amman roles with application forms: IBM Software & Cloud Presales Engineer (2026-04-15), Cisco Presales Engineer (2026-08-20) and Sophos Product Manager (2026-09-02). These are experienced roles, not confirmed graduate internships. Cisco, IBM and Sophos are vendor/product lines and presales skill signals, not verified internal software stack. The earlier EDR/XDR entry was not reconfirmed as an internal stack. LinkedIn's 501-1,000 employee band describes the multinational Logicom Distribution group, not Jordan-only headcount; a third-party directory's 2024 estimate of 50 local staff is historical, so Jordan size remains null. The group LinkedIn page lists Amman, but no dedicated Jordan company profile or recruiting email was confirmed. Recruitment is through the official job application forms; the privacy/DPO email is not an HR contact. An older third-party listing places the office in Rabieh/Samar Qand, conflicting with the current official Jordan address; follow up if street-level mapping is needed."
