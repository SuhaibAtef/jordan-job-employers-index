  Building 23 as real locations but do not confirm Loyalty Drones' occupancy
  or an exact office pin. The previously stored coordinates 31.97183,35.83394
  approximate the business park, not the confirmed Building 23 office; they
  were cleared to avoid false precision. Active company website and LinkedIn
  presence support business identity and services but do not establish full
  company-level verification.
