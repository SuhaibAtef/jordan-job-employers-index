notes: >-
  Reviewed 2026-10-19. LTUC's current official website lists one Amman campus
  on Airport Road, P.O. Box 183334, Amman 11118, and telephone +962 6 4000700;
  its LinkedIn school profile specifies near Marj Al Hamam Bridge. Independent
  Waze and OpenStreetMap-derived Mapcarta listings corroborate the campus area.
  The coordinates are Mapcarta's approximate campus point for the former
  Al-Quds College (also labelled Luminus College), NOT an independently
  confirmed entrance or building coordinate; location.status is therefore
  approximate rather than fully verified. LTUC's current site states one
  teaching campus, superseding the older four-campus claim in this record.
  The official general-contact email is info@ltuc.edu.jo; the recruitment
  address jobs@ltuc.edu.jo appears in LTUC's LinkedIn recruitment material
  and in a September 2026 faculty hiring notice for academic year 2026/27
  covering software engineering/computer science, data/AI and other subjects.
  That notice sought experienced faculty (at least three years of relevant
  work or teaching experience, or approved training), not junior developers;
  its closing date and continued availability could not be established.
  The official /en/careers and /en/careers/jobs pages serve students and
  alumni, NOT LTUC employment applicants; the student vacancy page showed
  no partner openings on 2026-10-19. No dedicated staff vacancies portal was
  confirmed. LinkedIn lists 1,001-5,000 employees for the school profile;
  Jordan-only staffing and independent headcount are not established.
  ASAC is a teaching programme, so the previously listed CSS, Express, Git,
  HTML, JavaScript, Node.js, PostgreSQL and React are not verified as LTUC's
  internal engineering stack and were removed from technologies. The
  data/edtech/web categories describe the institution's educational offerings,
  not an audited production stack. LTUC's graduate career services and academy
  do not by themselves establish early-career employment at LTUC. Its 2026
  website describes 5,000+ learners annually, nine departments and 23 partners;
  these are institutional self-reports, not employee counts. Full employer
  verification remains incomplete despite confirmed operations and location
  context.
