name: "Luminus Technical University College (LTUC)"
description: >-
  Amman-based technical and vocational higher-education institution offering
  bachelor's degrees and diploma programmes across applied disciplines. Its
  Abdul Aziz Al Ghurair School for Advanced Computing (ASAC) teaches software
  engineering, cybersecurity, cloud computing, artificial intelligence and
  data analysis. LTUC publishes student field-training and career-support
  services; those services are distinct from vacancies to work for the college.
