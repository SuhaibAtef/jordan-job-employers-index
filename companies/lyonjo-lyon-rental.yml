notes: 'Previous GPS audit 2026-10-04: a Lyon Jo Car Rental Google Maps listing matching the company phone and website, the
  official embedded map and official View Location links, Facebook and independent listings support the 7th Circle / Al-Mawaddah
  Street pin (31.9455433, 35.8437352). The official Bayader address text instead describes Arab Revolt Square opposite Manaseer
  Gas Station; this text-to-pin inconsistency is unresolved. A distinct Airport Road office at Gulf Gas Station before Airport
  Bridge was recorded, with historical approximate coordinates 31.7309879,35.9439266, not used for the primary pin. Company
  review 2026-10-19: Official website/about pages confirm car rental, tours, transportation, accommodation and a booking app.
  LinkedIn Lyon Group profile matches the company website, reports 2-10 employees and founding in 2015; employee count is
  self-reported, not audited. General support email is support@lyon-jo.com on the homepage; contactus.php also displays support@lyonjo.com.
  Public recruitment email rafat@lyon-jo.com is listed in Lyon Group 2026 LinkedIn hiring posts; it is not verified as a dedicated
  HR mailbox. Mid-2026 posts advertised on-site backend development (PHP/Laravel, Git, SQL or NoSQL and REST APIs), Flutter/Dart
  (BLoC/Cubit) and digital marketing, with 0-2 or 1-2 years of experience, in Amman 7th Circle. Historical Laravel/Vue.js
  and Flutter job listings are closed; current acceptance of applications was not independently established on 2026-10-19.
  Technologies are evidenced job requirements, not a production-stack audit. The company has no independently confirmed standalone
  careers page. A newer Lyon iSystem technology initiative is noted on LinkedIn but does not verify the group production stack.'
