notes: >-
  Reviewed 2026-10-19. Official site confirms Amman headquarters, game development
  and publishing across mobile, PC and PlayStation, and 100M+ downloads (site claim).
  LinkedIn lists 11-50 employees; a prior 2024 founder interview cited 28 staff,
  which is not a current audited headcount. jobs@madhook.io is a published job
  application address in company job advertisements; support@madhook.io is the
  general contact on the official website. A social media recruitment post appeared
  on company LinkedIn approximately six months before review; the corresponding
  LinkedIn job listing is no longer accepting applications, so no current opening
  is confirmed. A historical Unity Developer listing requests Unity and C#;
  Android/iOS are shipped platforms, not proof of the complete internal stack.
  The founder described university-student training intended to support future
  recruitment in a 2024 interview; no active graduate intake is confirmed.
  Official site and LinkedIn corroborate Amman only. Al-Isteqrar St. 4 comes from
  third-party directories, while the retained coordinates come from a previously
  recorded map pin; neither precise office occupancy nor entrance was independently
  reconfirmed this run. Location therefore remains approximate, independently of
  the partial company verification status.
