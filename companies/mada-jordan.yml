notes: >-
  Reviewed 2026-10-24. Official homepage, About, Contact, and Careers pages
  are accessible. The official Contact page states Zain Building No. 5,
  first floor, King Abdullah II Street, Eighth Circle, Amman, with general
  phone +962 6 400 0200 and 24/7 customer support +962 79 064 0000.
  This is an officially published address; independently confirmed
  building-level GPS coordinates were not obtained, so previous coordinates
  31.96277,35.84489 and their generic Google Maps search link were removed.
  The official careers page displays an outdoor sales role in Amman/Zarqa
  requiring 1-3 years of experience and a general CV upload form, but the
  vacancy is undated and application acceptance was not tested. No dedicated
  HR email, internship, or current engineering vacancy was confirmed.
  LinkedIn reports 51-200 employees; the Bayt company profile lists 10-49
  and a JordanYP directory lists 11-50, so actual current headcount is
  unresolved. LinkedIn's employee-profile count is not an audited headcount.
  The official About page documents the 2007 Mada Bahrain/Zain Jordan
  partnership, the 2009 service launch, and Zain Group acquisition in 2012.
  It also describes historical WiMAX, a 2016 shift to fixed LTE, fiber,
  MPLS/VPLS, microwave connectivity, and data center services. These are
  offered network technologies, not a verified internal software stack;
  the previously listed 5G was not substantiated by inspected official
  pages. Historical third-party directory, press, and staff-role references
  are retained as background, not proof of current hiring or headcount.
