name: "Mada Jordan"
description: >-
  Mada Jordan is a Jordanian telecommunications and internet service provider
  serving households and businesses with fixed LTE wireless broadband,
  fiber-optic connectivity, business networking, and data services. The company
  traces its launch to 2009 and became part of Zain Group in 2012.
