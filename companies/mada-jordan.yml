notes: "Wireless broadband provider (launched Jordan's first WiMAX, now fixed LTE); Bayt profile shows IT Help Desk among staff roles. Audit 2026-10-03: website fixed (old https://www.mada.jo/website/ returns 404; correct site is https://www.mada.jo per directories). Address reconfirmed on verified jordanyp listing; no verifiable map pin found, so GPS stays on city-center fallback. tech_stack all traceable to the jordanyp company description. Jordanian ISP offering wireless broadband, fixed LTE and fiber-optic/MPLS services; established Jan 2009 (incorporated 2007 as JV between Mada Bahrain Communications Group and Zain Jordan; acquired by Zain Group Mar 2012); 10 shops plus dealers across the Kingdom. Size: Lusha 2026 reports 290 employees (RocketReach: 124; bayt self-profile lists 10-49, likely stale). Address confirmed by jordanyp directory. LinkedIn taken from mada.jo footer. mada.jo has a jobs page (footer link) but its URL was not captured - flag for live-browser. Coords are street-level geocode of 8th Circle/King Abdullah II St - pending live-browser pin check. Live-browser verified 2026-10-03: claimed Maps pin 31.9627678,35.8448905 matches contact page (Zain bldg 5, 8th Circle). All 5 stack items corroborated; careers page captured from footer. Re-verified 2026-10-03: coords confirmed by claimed Google Maps listing, stack verified from jordanyp/mada.jo, careers page captured, LinkedIn added."
