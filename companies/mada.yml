notes: "Founded in 2018 in Amman; Jordanian buy-now-pay-later provider offering four interest-free installments at participating merchants. Reported $1.55M pre-seed financing in September 2025 (Vision Ventures and others). Company says it operates under the Central Bank of Jordan's JoRegBox regulatory sandbox; this is not evidence of a general banking licence. The official support FAQ states its app launched on 2026-09-23. Review 2026-10-19: LinkedIn company page reports 11-50 employees (self-reported, not audited), headquarters at King Abdullah II Street, Al Behar Industries Co., Amman; independent directory corroborates Al Behar's street address but not Mada's precise office or coordinates. Existing GPS pin was an unverified street-level estimate and has been removed. Company's about page links 'Join now' to its LinkedIn profile, not a dedicated careers portal. Its public LinkedIn recruitment post lists hr@mada-jo.com for a Marketing Manager role; current application status unconfirmed. October 2026 LinkedIn advertisements for Senior Backend Engineer (Java) and entry-level Customer Experience Specialist show applications closed at review time. Java, Spring Boot and REST APIs are evidenced as recruitment requirements, not independently verified production technologies; cloud/container skills are mentioned as desired familiarity. No active graduate intake or internships confirmed."
