notes: >-
  Reviewed 2026-10-19. The active official website is madfoat.com, correcting
  the previous claim that the company website was unavailable. Its homepage
  describes eFAWATEERcom, merchant payment gateway, PSP/agent platform and
  digital payments. The Central Bank of Jordan's licensed-company register
  corroborates its payment-system and service-provider authorizations and
  places its Amman office in Building 19, floors 4 and 5, King Hussein
  Business Park. The official contact page and company-managed LinkedIn
  independently confirm Building 19; location.status is verified for the
  published address. The retained coordinates (31.97183, 35.83394) locate
  the business-park area, not a separately validated Building 19 entrance.
  LinkedIn reports 51-200 employees, an unaudited profile range. A workforce
  analytics estimate differs; no audited current headcount was established.
  The official website explicitly publishes hr@madfoat.com as its careers
  contact; info@madfoat.com is general inquiries. No dedicated current
  careers-vacancy page or open company job posting was confirmed. Historical
  LinkedIn vacancies include Java Developer (Java, Vert.x, microservices),
  Senior Frontend Developer (Angular, Ionic, Kotlin, Swift), Senior Database
  Developer (Microsoft SQL Server), and IT Support Engineer (no experience
  required); these advertisements are closed. Technologies are documented
  historical job requirements, not an independently audited current
  production stack. A company LinkedIn update cites youth-employment support
  through CFYE, but the reported employment opportunities cannot be equated
  with direct MadfoatCom vacancies. Company-level verification remains partial
  because current hiring and internal stack have not been confirmed.
