description: >-
  MadfoatCom is a Jordanian financial-technology company founded in 2011 that
  develops and operates electronic bill presentment and payment systems,
  merchant payment gateways, payment-service-provider tools, and digital
  wallets. It operates eFAWATEERcom, Jordan's national electronic bill payment
  system, under authorization from the Central Bank of Jordan.
