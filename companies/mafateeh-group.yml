reet-level coordinates reflect an existing corroborated business map listing, not a new entrance-level GPS survey. The current redesigned contact page does not display a street address in accessible text. info@mafateehgroup.com is a general contact address, not verified as an HR mailbox; no dedicated recruitment email or current careers page confirmed. Odoo is an offered ERP platform, while Figma and Adobe creative tools are documented job requirements, not an audited internal engineering stack. Historical LinkedIn vacancies (motion design, UI/UX and media representative) are closed; no current Jordan opening or internship verified. Company-level verification remains partial despite previously verified location."
