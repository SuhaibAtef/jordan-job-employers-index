notes: >-
  Official website confirms store-building SaaS, payment and shipping integrations,
  mobile order fulfillment, and an Amman office on Yaser Sabaaneh Street at Building
  3 B. JordanYP independently confirms the street but not the building; the retained
  coordinates are near the street, not independently verified as the office entrance.
  LinkedIn reports 201-500 employees across the company, not Jordan-specific staffing;
  a 2022 US Embassy account reported 650 employees worldwide at that time, so the
  historical number must not be treated as current. LinkedIn describes more than
  14,000 partners, whereas the official about page says more than 12,000 customers;
  figures may reflect different publication dates or definitions. The earlier
  research described a connection to the Mawdoo3 team and founder Moe Ghashim;
  this attribution appears in a secondary startup roundup and is not independently
  established as a current ownership relationship. Original 2026-10-05 stack notes
  cited employee profiles for Android/Kotlin, PHP and iOS. A Wuzzuf employee profile
  and an organizational directory support historical PHP and mobile engineering
  roles; Kotlin evidence is indirect and not a verified production stack. The
  company's own product supports iOS and Android, which does not by itself prove
  its internal development tools. A historical senior UX/UI vacancy and a closed
  receptionist vacancy show past recruitment, but no current openings, dedicated
  HR email, careers page, internship or graduate programme could be confirmed as
  of 2026-10-19. The published support@makane.com is customer support, not HR.
