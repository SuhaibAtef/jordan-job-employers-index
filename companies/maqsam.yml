notes: 'Maqsam was founded in 2019 and operates an Arabic-first AI-powered contact-center platform. Its current
  LinkedIn profile lists Riyadh as global headquarters and 51–200 employees worldwide; Jordan headcount is not established.
  The official company site confirms voice AI, Arabic transcription, customer analytics and CRM integration. Maqsam''s
  official careers page points to Workable; that board stated no vacancies when checked on 2026-10-20. A 2026 Amman
  backend Software Engineer advertisement is historical and should not be represented as currently open. A technical
  lead''s public CV describes Rails, Node.js, Redis, PostgreSQL, AWS, WebRTC, SIP, Quickwit and Prometheus in production,
  but this is employee-reported rather than independently audited. No dedicated HR email was verified; hello@maqsam.com
  is a general business contact in the Jordan ICT directory.

  Location research 2026-10-05: An Amman office was corroborated by Queen Rania''s 2022 visit and Jordan ICT listings.
  An indexed historical company-managed LinkedIn snippet gave ''Boulevard Al-Abdali – Black Iris St., Central 1&2'';
  other businesses also use this Abdali street address, but the current Maqsam LinkedIn profile only publishes its
  Riyadh address. The Google Maps listing named Maqsam displayed a Saudi number and an implausible desert pin, so
  it was rejected. The retained 31.9631665,35.9057078 pin is an approximate Abdali-area point, not a verified office
  entrance. The Jordan office street/building cannot be independently reconfirmed as current; location confidence
  is approximate, distinct from partial company verification.'
