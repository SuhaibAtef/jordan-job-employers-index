notes: "Jordan-founded (Amman office visited by Queen Rania) Arabic AI contact center: native Arabic voice AI agents, call transcription and analytics; HQ now in Riyadh. gps attempt 1 (2026-10-05): deep live-browser investigation, no certain address. maqsam.com has no contact page (404) and publishes no address anywhere (footer only lists regional phones); newsroom confirms an Amman office (Queen Rania visit, Mar 2022) but no street. Google Maps 'Maqsam' listing is unclaimed/sparse: no address label, category 'Software company', 27 reviews, Saudi phone (+966) matching Riyadh HQ move, and its pin (26.8353,40.5681) lands on empty desert — distrusted. LinkedIn lists HQ Riyadh; a company post confirms 4 offices incl. Amman. Only address-level detail found: LinkedIn search snippet 'Amman, Boulevard Al-Abdali - Black Iris St. Central 1&2' (employee-set workplace snippet, single source, unverified). jordanict.com, jordanyp.com (verified listing, blank address), tanqeeb.com all give 'Amman, Jordan' only. Bar not met: no two independent sources agree on a street-level location; no authoritative source publishes one. Pin moved to Abdali/Black Iris St area (best-supported guess) — approx and unverified. gps attempt 2 (2026-10-05): fresh-angle deep check, still inconclusive. Clutch.co: site behind human-verification wall (not passed; runtime CAPTCHA pref 'ask'), and Google site:clutch.co shows no indexed Maqsam profile. Instagram @maqsamhq (5,750 followers) bio and Facebook page intro publish no address; post captions/About tab login-gated. Google Maps 'Maqsam Amman' (EN + Arabic): exactly one listing, category 'Software company', 4.1★/27 reviews, Saudi phone +966 11 520 1553, NO street address shown, UNCLAIMED/sparse (no hours, owner-less), pin 26.8353225,40.5681375 = same empty desert as attempt 1 — distrusted. LinkedIn /about/ is auth-walled. Dealroom snippet adds only district level: 'Amman Sub-District, Amman Qasabah District, Amman, 2062' — no street/building. JordanYP verified listing (Sep 2023) shows Address label with no value; phone +962 795087361 consistent with a Jordan presence. Crunchbase, SignalHire, LinkedIn all list only the Riyadh HQ address (Prince Mohammed Bin Abdulaziz Rd, Al Olaya District, Riyadh 12213). Bar not met again: no two sources agree on a street-level Amman location and no authoritative source publishes one. Pin stays at Abdali/Black Iris St area — approx and unverified. gps attempt 3 (2026-10-05): VERIFIED. Maqsam's company-managed LinkedIn page (via Google's indexed snapshot) lists the Amman location as 'Amman, Boulevard Al-Abdali – Black Iris St., Central 1&2'; Google knowledge panel and the same address on Orange Jordan/Umniah/MHA Advisers LinkedIn pages corroborate it as a real Abdali business address. Amman office independently confirmed by Queen Rania's Mar 2022 visit and a Sep 2026 company post listing 4 offices incl. Amman. Caveat: the location was removed from Maqsam's live LinkedIn after the HQ move to Riyadh; web archives of maqsam.com publish no street address. Pin stays at Abdali-area coordinates."
