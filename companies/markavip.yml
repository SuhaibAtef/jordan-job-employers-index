notes: >-
  Historical company, not a confirmed active Jordan employer as of 2026-10-24.
  The official domain listed on the company's LinkedIn profile was inaccessible
  during this review; no functioning official careers page, recent company-authored
  hiring advertisement, verified HR contact, or current Jordan vacancy was found.
  LinkedIn's 501-1,000 employee range describes the legacy company profile and
  must not be interpreted as current headcount. A JordanYP listing last updated
  2023-09-03 provides the Mecca Street address; CB Insights instead lists an
  Eighth Circle/Al Amani Building address. Neither establishes a present office.
  Removed previous Amman-centre coordinates because they were not tied to the
  stated premises. The 2018 Jollychic acquisition is documented; a 2019 report
  on Jollychic stopping deliveries in Jordan does not establish MarkaVIP's
  subsequent corporate closure. Historical Magento/PHP code is suggested by a
  2013 Stack Overflow example using markavip module namespaces, but this does
  not verify the current engineering stack. Earlier Nginx, AI and DevOps
  classifications lacked independent supporting evidence. The historical
  info@markavip.com general contact appears in a third-party company directory,
  but its deliverability and recruitment purpose are unverified.
