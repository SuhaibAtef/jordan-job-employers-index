description: >-
  MarkaVIP was an Amman-founded fashion and lifestyle flash-sale e-commerce
  platform launched in 2010 for customers across the Middle East. It was
  acquired by Jollychic in 2018. Its present operating status and any active
  Jordan employer presence could not be independently confirmed in October 2026.
