notes: "Reviewed 2026-10-24. Company LinkedIn identifies Irbid headquarters, Wasfi At-Tal Street, founding year 2014, and a self-reported 51-200 employee range; this is not an audited headcount. Third-party directories instead list Fawzi Al Mulqi Street and sometimes 11-50 employees, so the exact street/building and current workforce remain unresolved. The prior 32.5569,35.8469 pin was a generic Irbid-area coordinate, not verified premises; precise coordinates and map pin removed. The company website advertises UAV/autopilot, ground-control, remote-sensing, LiDAR and related services, but its pages could not be reliably opened live during this review; the official-domain identification is supported by LinkedIn and a Jordan industry directory. General contact info@marsrobotic.com and telephone +962 2 7102026 appear on the company's indexed site and a Jordan industry directory. HR@marsrobotic.com is explicitly published in a company-authored LinkedIn recruitment post and an Irbid engineering vacancy; delivery was not tested. LinkedIn shows 2026 hiring posts for Irbid RF engineering and senior HR roles, but inspected job pages show no longer accepting applications; do not classify as currently open. Historical fresh-graduate R&D and Mechanical Design internship listings were also closed. Technologies describe documented products/services and vacancy requirements, not a confirmed complete internal software stack. Emirates News Agency reported EDGE's acquisition of an 80% stake in May 2023; current ownership was not reaudited. No independently confirmed building-level address, precise coordinates, live careers URL, or open role established."
