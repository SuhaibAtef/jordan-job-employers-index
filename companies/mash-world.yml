notes: >-
  Reviewed 2026-10-24. The official Mash World contact page at usa.mash.world
  and the company LinkedIn profile both identify Building 67, Paris Street,
  Sweifieh, Amman; the location address is corroborated, but no precise
  building-level coordinates were verified. The old 31.95656,35.85967 map pin
  was described as a street-level fallback and has been removed. An older
  JordanYP listing uses 116 Wasfi Al Tal Street and a newer TechBehemoths
  profile uses Abd Ar-Rahim Al-Hajj Muhammad Street; these conflicting
  directory locations do not override the matching first-party address.
  LinkedIn reports 11-50 employees and a 2014 founding year; headcount is
  self-reported, not audited. The official contact page publishes
  info@mash.world and +962790715859 for general inquiries; the previous
  hello@mash.world is not independently confirmed as an HR mailbox, and no
  dedicated HR email was established. The official careers page is indexed
  at usa.mash.world/careers/ but could not be reliably opened live. A
  company-authored LinkedIn SDR vacancy in Amman links to the main-domain
  job application form recorded as careers_url; live form submission was not
  tested. A separate older SDR posting is closed, so job status varies by
  posting. The senior SEO / AI Search role is described as Cairo remote on
  one company post and must not be counted as a Jordan vacancy. A historical
  Junior Business Analyst internship is closed. Shopify, Magento and Google
  Analytics are described on official service pages; ASP.NET is evidenced by
  a historical developer vacancy; Google Search Console and Screaming Frog
  are mentioned in a recent senior SEO recruitment post. These technologies
  reflect advertised services or role requirements, not an audited current
  internal production stack. The primary mash.world site and some official
  subpages were intermittently inaccessible during this review; the official
  subdomain's indexed content and active LinkedIn presence corroborate the
  company. Partial verification reflects untested application availability,
  unverified HR channel, coordinates and internal technology stack.
