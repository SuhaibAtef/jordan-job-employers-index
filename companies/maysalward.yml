notes: >-
  Reviewed 2026-10-24. Official About and LinkedIn pages establish a
  mobile-game development and publishing company founded in Amman in 2003,
  with a second UK studio. The company reports titles including Dominoes Pro
  and Trix Plus, plus game-creator training and incubation through Capsule and
  The Space. LinkedIn lists 11-50 employees, not an independently audited
  headcount; intaj lists a different historical range (1-24). The official
  contact page and privacy policy updated 2026-08-07 publish the Abdali
  Boulevard, Rafiq Al Hariri Street, Central Square, Entrance 3 address;
  intaj independently repeats it. Verified location means the published
  address is corroborated, not that present physical occupancy or precise
  coordinates have been independently surveyed. Previously stored coordinates
  (31.96182, 35.89088) were removed as unverified for this office.
  General email info@maysalward.com is also explicitly listed for resume
  submissions on the official careers page, but is not a dedicated HR mailbox.
  The careers page's Unity/iOS vacancies appear to be longstanding content
  (search metadata dates them approximately 2015); do not treat them as
  currently accepting applications without confirmation. Unity, C#,
  Objective-C, OpenGL ES, PHP and MySQL are historical job-ad technologies,
  not proof of the current production stack. The company describes training
  programs, but no current internship or fresh-graduate vacancy was confirmed.
  The official site and company LinkedIn show continuing business activity.
