name: "Maysalward"
description: >-
  Maysalward is an Amman-founded mobile game development and publishing studio
  established in 2003. It develops culturally localized and free-to-play games
  for mobile platforms, including Dominoes Pro and Trix Plus, and supports
  regional game creators through training and incubation programs.
