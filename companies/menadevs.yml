notes: >-
  Reviewed 2026-10-24. The current official website is menadevs.io; the
  previously recorded menadevs.jo domain could not be accessed. The official
  site describes Solutions, Talent and Data services and reports 150+ engineers;
  LinkedIn lists 201-500 employees, an unaudited company-wide size band rather
  than a Jordan-specific count. Jordan Source reported over 120 programmers
  and data engineers in 2024. LinkedIn identifies Amman as headquarters, but
  no official street address or office-level coordinates were confirmed;
  previous generic city-center coordinates were removed. The official site
  lists hello@menadevs.io for general inquiries; company-authored job postings
  explicitly use recruitment@menadevs.io for applications, but deliverability
  has not been tested. The official careers link displayed 0 open roles when
  checked, despite recent company LinkedIn posts describing hiring and an AI
  internship; do not treat the role count or accepting status as confirmed.
  Python, Docker, SQL/PostgreSQL, Git and cloud/LLM tools appear in job
  requirements; React, Vue.js, Node.js and AWS appear as examples or options,
  not proof of the internal production stack. Previously listed Laravel was
  not corroborated by the reviewed official or company-authored sources.
  No verified building address, precise map pin or audited headcount was found.
