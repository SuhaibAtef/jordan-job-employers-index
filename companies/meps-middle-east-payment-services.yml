notes: "Reviewed 2026-10-24. Official website and LinkedIn confirm Amman headquarters and matching Khalda Center Building 30, 3rd Floor, Amer Bin Malik Street address. Previously checked map coordinates were retained; the published address is corroborated, but the precise map pin was not independently re-geocoded during this review. LinkedIn lists 51-200 employees company-wide (not an audited Jordan headcount), founded 2009. Official contact page lists info@mepspay.com as a general mailbox, not HR; company-authored 2026 recruitment posts explicitly invite applications to recruitment@mepspay.com, but deliverability was not tested. The official /form-hr page is an inquiry form without a confirmed live vacancy inventory; the careers link in LinkedIn posts is a shortened URL that could not be resolved in this review. Recent company-authored postings cover experienced finance/operations leadership; a LinkedIn Director of Operations job listing is closed, so no currently accepting vacancy is claimed. A company-attributed 2023 IT recruitment announcement welcomed fresh graduates for help desk, card-personalization support and e-channels, but the deadline expired in September 2023; no current graduate opening or internship confirmed. Official company and Mastercard materials confirm payment processing, Mastercard Gateway Click to Pay and tokenization-related integrations; these are products/integration capabilities, not evidence of the internal programming stack. A historical MEPS Senior IT Infrastructure Officer recruitment announcement listed VMware, Office 365, RADIUS, Veeam and Veritas; these are historical requirements, not confirmed current deployments. The 2026 Mastercard launch and 2025 Dinarak partnership demonstrate recent operations."
