name: "MEPS (Middle East Payment Services)"
description: "Middle East Payment Services (MEPS) is an Amman-headquartered payment services provider founded in 2009. It provides card issuing and processing, merchant acquiring, point-of-sale (POS) and ATM services, e-commerce payment gateways, fraud monitoring, and digital-payment integrations for financial institutions and merchants in Jordan and the region."
