notes: >-
  Reviewed 2026-10-25. Official website advertises a five-month/22-week part-time
  full-stack web-development bootcamp, more than 400 training hours, and up to
  eight months of graduate job-search support. Its stated 60% graduate employment
  figure is a company claim, not independently audited; older third-party
  listings report different outcomes and training hours. LinkedIn identifies
  the organization as founded in 2020, headquartered in Amman, and employing
  11-50 people (self-reported range). Official careers page promotes remote-in-Jordan
  staff positions and search-indexed listings include sales, operations,
  teaching and career-coaching roles, but current application acceptance and
  posting dates were not independently established. A LinkedIn lead-generation
  vacancy was closed when inspected. The published info@meraki-academy.com is
  a general contact, not a verified dedicated HR mailbox. Coding technologies
  listed here are subjects reported in the curriculum/alumni training records,
  not independently verified internal production technologies. The bootcamp
  and graduate-support signals are educational offerings, not guaranteed paid
  internships or entry-level employment. The official site and company LinkedIn
  provide Amman city-level location only; a historical 2026-10-06 location
  research sweep found no reliable street address or dedicated business pin.
  Generic Amman-center coordinates were removed because they did not locate
  an occupied office. No physical office or exact coordinates are confirmed.
