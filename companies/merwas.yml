notes: >-
  Reviewed 2026-10-25. The legacy Merwas for IT (Succeeded) LinkedIn profile
  describes an Amman web-design and IT-services partnership founded in 2015,
  with an estimated 11-50 employees and a Queen Rania Street location opposite
  Al Fanar Hotel. Clutch and Lisnic also list the Abu Alhaj Complex address;
  neither establishes current occupancy. The current merwas.com website and
  Merwas Inc. LinkedIn profile instead describe a California-based holding
  group, with a separately reported 51-200 company-wide employees. A legacy
  LinkedIn update directs followers to the new Merwas brand. The 11-50 size
  stored here applies to the older Jordan IT-services profile and is not a
  verified present Jordan headcount. The current official site identifies
  Lilian Technology (web/mobile development), Chegoe (e-commerce SaaS) and
  Sprintfy (low-code solutions) as portfolio brands, not necessarily the
  Jordan entity's current direct services. Clutch lists Mendix, React,
  React Native, Laravel and PHP as service capabilities; these are
  third-party/self-reported historical technology signals, not a verified
  current internal engineering stack. The official contact page publishes
  info@merwas.com as a general contact and HQ@merwas.com under 'Join Us',
  but neither was independently confirmed as a dedicated HR or active
  recruitment mailbox. No dated, accepting Jordan vacancy, careers page,
  internship or graduate hiring was confirmed. Precise Jordan office
  coordinates could not be independently corroborated, so the prior map
  coordinates were removed. Jordan operations and address remain unverified;
  company-level verification is partial despite an active parent website.
