notes: "Reviewed 2026-10-25. MFW is listed by the Central Bank of Jordan as a microfinance company; official pages describe a national network of 60 branches and digital lending/e-wallet services. The official careers page has Credit Officer, Branch Manager, voluntary training and future-opportunity forms; forms were visible but successful submission and live vacancy status were not tested. The company posted an Internal Auditor recruitment notice directing CVs to careers@microfund.org.jo; info@microfund.org.jo is the general contact. Employee counts conflict on official pages (homepage 710, careers text over 750); LinkedIn gives the broad 501-1,000 range, not an audited count. Headquarters street address is corroborated by the official branches page and Central Bank of Jordan. Existing map coordinates were retained from prior map research and are near an independently listed map point, but exact entrance/office pin precision was not independently revalidated. Oracle Forms/Reports, SQL and PL/SQL were described by a former Oracle developer for 2012-2013; an employee self-reported Oracle SQL/PLSQL, Node.js, Express.js and REST APIs in application support work since 2018. These are qualified employee-reported or historical technology signals, not an audited current production stack. Company-level verification remains partial despite corroborated location."
