notes: Reviewed 2026-10-25. Microsoft official worldwide directory explicitly lists the Jordan office at King Hussein Business Park, Building
  GH3, second floor, with phone +962 6 5503444. The older unclaimed Google Maps business listing calls it Building 3 and supplied the retained
  coordinates 31.972833, 35.835229; coordinates are approximate to the business-park building and are NOT independently verified as an office
  entrance or suite pin. The office address itself is verified against Microsoft and the Jordan ICT directory. Microsoft lists Jordan among its
  subsidiaries as of 2026-09-30. LinkedIn size 10,001+ refers to the global company, not Jordan; the Jordan ICT directory reports about 400 staff
  historically (2022), not a current audited local count. LinkedIn is the global Microsoft company page, not a verified dedicated Jordan page.
  .NET, Azure and Microsoft 365 are documented Microsoft platforms/products and are not evidence of the Jordan office internal development stack.
  Categories describe product/service domains rather than Jordan-specific engineering teams. The global careers page and Jordan MCAPS internship
  eligibility guidance do not establish any presently open Jordan vacancy or internship. No dedicated HR email was confirmed. Company verification
  remains partial even though the office address is verified.
