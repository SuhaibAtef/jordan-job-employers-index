notes: >-
  Midis Group's website and LinkedIn confirm an EMEA-wide ICT group with more
  than 175 affiliates/partners and over 7,500 employees; LinkedIn's 5,001-10,000
  size bracket is group-wide and NOT a Jordan headcount. ABC Jordan's own
  LinkedIn profile lists 2-10 employees, which applies only to that affiliate.
  Midis Group's official affiliate directory, ABC's own website and ABC Jordan
  LinkedIn independently confirm the Jordan affiliation. The group directory
  lists Al Rayan Tower, Queen Alia Street, building 31; ABC Jordan LinkedIn and
  Dun & Bradstreet specify the sixth floor. This verifies a published ABC Jordan
  office address, NOT a separate Midis Group headquarters or confirmed present
  occupancy. Previously recorded coordinates 31.97664, 35.90467 were removed
  because exact building-pin precision was not independently corroborated.
  Group-wide official careers portal lists October 2026 Amman vacancies at
  Jordanian Company for Systems Management and Jordanian Data Systems; these
  are group-affiliate openings, not evidence of ABC Jordan hiring. 'Apply now'
  links are displayed, but successful submission and current acceptance were
  not tested. Linux, Kubernetes, OpenShift and VMware are job requirements at
  a Jordan group affiliate, not a verified production stack at ABC Jordan.
  Azure is retained from the existing 2026-10-06 ABC Jordan research note
  about Microsoft Azure Stack, but that platform claim was not independently
  revalidated during this review. Graduate/intern tracks exist at group level,
  but the respective official category pages displayed no open listings.
  No dedicated Jordan HR email could be reliably established; use the official
  careers portal. A historical Bayt search page in the original evidence was
  not treated as proof of current vacancies.
