name: "Mind Rockets"
description: >-
  Mind Rockets for Software is an Amman-based assistive-technology company founded
  in 2016. It develops sign-language interpretation using 3D animated avatars
  and digital-accessibility tools for websites and online services, including
  the Hemam accessibility toolkit and sign-language applications.
