notes: >-
  Official company pages identify a Wasfi Al Tal Street office at Building 113,
  Office 401; the LinkedIn company profile instead lists King Hussein Business
  Park, Building 23, King Abdullah II Street. The previous record listed
  Building 112 on Wasfi Al Tal Street and coordinates 31.988337, 35.875949;
  neither that street number nor the coordinate precision was corroborated, so
  coordinates and the old map pin are not retained. Location remains unresolved
  pending confirmation of the occupied office. LinkedIn reports 11-50 employees,
  versus the previous unsourced 1-10 estimate; neither is a verified payroll
  headcount. The company website publishes sales@mindrocketsinc.com and
  contact@mindrocketsinc.com for general/business inquiries, not as HR contacts.
  No official careers page, currently accepting Jordan vacancy, graduate role or
  internship was established as of 2026-10-25. Company LinkedIn posts in
  October 2026 promote Hemam accessibility products but do not establish hiring.
  Android and iOS are evidenced by historical mobile apps; 3D avatars are a
  documented product technology. Previously listed AR/VR and NLP are not
  independently confirmed as specific internal development technologies; the
  games category was removed because avatars are not evidence of game development.
