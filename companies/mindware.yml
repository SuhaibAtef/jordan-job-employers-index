name: "Mindware"
description: >-
  Mindware is a Dubai-headquartered value-added IT distributor founded in 1991,
  supplying infrastructure, networking, storage, cloud and cybersecurity products
  and related pre-sales, implementation and technical support to channel partners
  across the Middle East and Africa. Its Jordan operation is listed in Amman.
