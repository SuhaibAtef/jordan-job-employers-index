notes: >-
  Mindware's official presence directory lists Mindware Jordan at Al Rayan
  Tower, fifth floor, Queen Alia Street, Amman (P.O. Box 941979 - 11194).
  A third-party business listing independently identifies Al Rayyan Tower at
  31 Queen Alia Street. The published address is verified as a company-listed
  office, but present-day occupancy and exact entrance-level precision of the
  previously recorded coordinates (31.97664, 35.90467) have not been
  independently established. LinkedIn's 201-500 employee band describes the
  regional/global company, not Jordan-specific headcount. The official careers
  page links to the Midis Group recruitment system; a 2026-01-23 Amman Channel
  Manager advertisement required 5-8 years of experience and is closed on
  LinkedIn. No currently accepting Jordan-specific role was independently
  confirmed on 2026-10-25. The regional Mindware Academy describes internship
  pathways, but no currently open Jordan-specific internship or graduate
  intake was established. No dedicated public Jordan HR email was verified.
  VMware is documented in the 2025 Jordan distribution partnership; Veeam is
  retained from the previous record as a vendor portfolio technology, not
  proof of internal deployment. July 2026 Jamf and Rapid7 partnerships also
  explicitly include Jordan. The devops and security categories describe
  supported infrastructure/security offerings, not necessarily internal
  engineering teams. The original map pin is retained as approximate and
  should not be interpreted as a verified office entrance.
