notes: >-
  Reviewed 2026-10-25. LinkedIn identifies Mixed Dimensions Inc as a
  San Mateo-headquartered company founded in 2013 with 11-50 employees
  company-wide; this is an unaudited global size band, not current Amman
  headcount. Company-authored 2021 GamePrint/Unity press material and Mimaki's
  2020 investment announcement document its 3D-model repair, GamePrint,
  full-color 3D printing and Unity SDK work. Wamda documented Jordanian
  origins and the historical GameDraw Unity plugin in 2012. Wellfound lists
  Amman as a company location, but neither LinkedIn nor an accessible
  current official site establishes an operating Jordan office in 2026.
  The previously recorded Al Kufa Street / Kolaghassi Capital Building 57
  address is retained as a historical lead, not a verified current office;
  prior registry-derived and archived workshop references could not be
  reopened this review. Cybo places the business on Al Kufa Street, while
  WorldPlaces lists a conflicting Hamadani 3 Complex, Mecca Street address.
  Therefore current office address and exact coordinates are unresolved;
  previously geocoded coordinates 31.96627, 35.87436 were removed rather
  than representing an unconfirmed entrance as verified. LinkedIn names
  mixeddimensions.com as the company domain, but the site was inaccessible
  during review. The old makeprintable.com URL now serves an unrelated
  3D-printing news website and must not be used as the employer's site.
  No official careers page or dedicated HR email was verified. Wellfound
  displayed zero company jobs, and no accepting Jordan vacancy, internship
  or graduate intake was established. The historical employee-profile stack
  (C++, C#, Unity, Unreal Engine, Android, iOS, Python, Ruby, PHP and Laravel)
  was preserved from the earlier audit but not independently revalidated
  as a current internal production stack. Unity is separately supported by
  company-authored 2021 SDK material. Game Platforms is a historical broad
  descriptor, not a specific framework. Categories reflect historical
  game tooling and web/mobile development, not confirmed 2026 hiring.
