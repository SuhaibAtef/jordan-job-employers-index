name: "Mixed Dimensions"
description: >-
  Mixed Dimensions is a Jordan-founded 3D software and digital-to-physical
  collectibles company that develops technology to repair 3D models and turn
  virtual game and digital-art assets into customized 3D-printed objects.
  Its documented products include MakePrintable and GamePrint; its company
  LinkedIn profile identifies San Mateo, California, as global headquarters.
