notes: >-
  Reviewed 2026-10-25. Company LinkedIn shows Amman headquarters, a Khalda
  Amoon Oasis location, and recent 2026 posts, supporting ongoing company
  activity. The company's published address is independently corroborated by
  int@j, including Office 302, and the historical official product pages;
  this verifies the published office address, not current physical occupancy.
  Coordinates were retained from the earlier owner-validated JordanYP map
  plus-code research and are approximate, not entrance-level GPS confirmation.
  LinkedIn reports 51-200 employees, whereas int@j lists 1-24 and the Jordan
  ICT directory says 25+; current audited headcount and Jordan-specific size
  are unknown. LinkedIn says founded 2001, whereas int@j and Jordan ICT say
  2010; founding year remains disputed. Official pages document Android,
  iOS, Oracle Spatial and Esri GIS for delivered solutions; Jordan ICT
  describes API-driven architecture but does not specifically confirm REST.
  These are product/service technologies, not a verified current internal
  engineering stack. The official homepage displayed a maintenance notice
  during this review; indexed product pages remained available. General
  contact info@mobisoft-me.com and +962 6 5377090 are published, but no
  dedicated HR email, careers portal, accepting Jordan vacancy, internship
  or graduate programme was independently confirmed. Removed unsupported
  ERP category and REST-specific technology assertion.
