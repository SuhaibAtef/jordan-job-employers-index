notes: >-
  Reviewed 2026-10-25. Monty Mobile's official site confirms global telecom,
  CPaaS, A2P SMS, eSIM, RCS, SMS firewall, and API integration offerings.
  The affiliated Monty Capital/Monty Group website explicitly publishes
  Office 501, Campbell Grey Living, Land Number 851, Al-Waibdeh - Al-Wastani
  Basin as Monty Mobile's Jordan office; an independent Amman directory
  corroborates the same address, but current physical occupancy was not
  independently inspected. Previous 31.9539,35.9106 coordinates were generic
  Amman coordinates and were removed; entrance-level coordinates are unknown.
  LinkedIn reports 501-1000 global employees and London headquarters; current
  Jordan headcount is not known. hr@montymobile.com was advertised in a
  company-authored LinkedIn recruiting post about three years earlier; it is
  a historical group-wide application mailbox, not confirmed current or
  Jordan-specific. No dedicated official careers portal, currently accepting
  Jordan vacancy, internship, or graduate intake was confirmed. A 2026
  company-authored Software Engineer vacancy in Beirut, Lebanon lists Java
  or C#.NET, React, Next.js, PostgreSQL and RabbitMQ requirements; those are
  recruitment signals for Lebanon, not proof of Jordan's internal stack.
  Listed technologies describe verified products and customer integrations,
  not a confirmed internal software engineering stack in Amman. The prior
  internship flag had no supporting evidence and was cleared. Recent August
  2026 corporate investment news confirms company activity, not Jordan hiring.
