notes: Reviewed 2026-10-25. Official website confirms ERP, SaaS, school/HR/accounting/operations products, custom web development,
  cloud and IT infrastructure services; company says it has served 1,500+ organizations, a self-reported figure. LinkedIn
  reports 11-50 employees and an Arjan, Haroun Al Rashid Street headquarters; its historical company description refers to
  a team of 16, so present headcount is not independently audited. Official contact page confirms Amman headquarters but no
  current street-level address; an official 2024 ERP booklet lists Arjan, Al Diya Complex, while LinkedIn gives Haroun Al
  Rashid Street and Clutch reports number 100. These sources support the Arjan area, not a confirmed current office suite.
  Existing 31.9822495,35.9161713 Google Maps company pin was retained from 2026-10-05 location research; precise building/entrance
  coordinates and current occupancy were not independently checked. Official careers page currently lists Full Stack Developer,
  ERP Sales Specialist, Technical Support Engineer, IT Support Engineer, Human Resources Officer and ASP.NET Developer, but
  some individual listings are explicitly expired (e.g. HR Officer). The July 15, 2026 Full Stack Developer post displays
  an application form and specifies 3-5 years experience with Node.js, NestJS, React, PostgreSQL and REST APIs; form submission
  and continuing acceptance were not tested. An October 2025 Technical Support Engineer post requires at least two years and
  SQL Server; ASP.NET listing describes C#/.NET and SQL Server. Laravel, WordPress, React and HTML are explicitly named on
  the company web-development page. These are documented services/job requirements, not a complete audited internal production
  stack. The careers page describes employee training and development, but no dedicated internship, graduate intake, or entry-level
  program was verified; the old internship flag was cleared. No public dedicated HR recruitment email was verified. Official
  ERP booklet gives info@mozon-tech.com as a general contact, not an HR mailbox.
