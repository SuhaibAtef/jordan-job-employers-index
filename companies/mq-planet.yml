notes: >-
  Reviewed 2026-10-25. The official website and About Us page identify MQ Planet
  as a fintech technology supplier for forex/CFD brokerages, founded in 2007;
  the site names Galya for Information Technology in its footer. Its published
  products include MetaTrader 4/5 server plugins, FX Webkit CRM, PlanSet,
  brokerage reporting, FIX/WebSocket gateways, low-latency dedicated servers,
  VPS hosting and DDoS protection. The official custom-development page explicitly
  lists MetaTrader APIs, C++, C#, Qt, Laravel and Joomla. These are documented
  products and development capabilities, not an independently audited complete
  internal stack or proof of current vacancies. LinkedIn reports 11-50 employees
  company-wide; this self-reported range is unaudited. The official contact page
  and company LinkedIn profile both publish Yajouz Street, Building 8, Office
  318, Al-Jubaiha, Amman. They disagree on the postal code (11194 on the
  official site versus 11953 on LinkedIn); exact entrance coordinates and
  current physical occupancy were not independently verified. Previous
  coordinates 32.02611,35.85659 were removed because they could not be tied
  reliably to the published office. The earlier sales@mqplanet.com address was
  not verified as an HR mailbox; no dedicated public recruiting email or official
  careers page was confirmed. Company product announcements show commercial
  activity, not hiring. No currently accepting Jordan-specific vacancy,
  internship or graduate program was confirmed. The previously listed
  'Firewalls' technology was not independently established as an internal
  product or stack component; the official site specifically supports
  anti-DDoS protection instead.
