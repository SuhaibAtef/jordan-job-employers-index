  current physical occupancy. LinkedIn reports 2-10 employees globally (unaudited)
  and a 2017 founding year. The company site lists an HR Manager but only publishes
  wecare@mujeer.com as its general contact; hr@mujeer.com is supported by a
  company-authored 2026 marketing/sales recruitment post, not a confirmed permanent
  careers mailbox. The company markets iOS/Android development; its LinkedIn
  posts and employee project descriptions reference Flutter mobile development and
  REST APIs for a workforce-management product. These are documented project/service
  technologies, not a comprehensive audited internal stack. ERP reporting is not
  evidence of a dedicated data-engineering practice, so the former data category
  was removed. No official careers portal, active engineering vacancy, or dedicated
  internship/graduate intake was confirmed; the older marketing/sales advert's
  current acceptance status is unknown.
