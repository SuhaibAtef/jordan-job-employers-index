notes: >-
  Reviewed 2026-10-25. The official contact page, branch directory and company
  LinkedIn corroborate headquarters at Wasfi Al-Tal Street, Gardens, Complex 133;
  the official Gardens branch map links to approximately 31.9894619, 35.872776.
  These coordinates are a published map pin, not independently surveyed entrance
  coordinates or proof of present physical occupancy. Previous coordinates
  (31.99357, 35.86058) did not match the official Gardens branch map and were
  replaced. LinkedIn reports 201-500 employees; the company website states over
  250 employees, both company-reported and not independently audited. The
  hr@musharbashexchange.com address is documented in a historical company-authored
  recruitment announcement, while web@musharbashexchange.com is the official
  general contact. The official careers page accepts resume details but does not
  establish an open position or successful submission. Musharbash Academy provides
  internal staff training, not evidence of a publicly accepting internship or
  graduate program. E-wallets and online remittances are customer-facing services,
  not verified internal software technologies; no engineering stack or current
  IT vacancies were established. The fintech category denotes payment-service
  exposure, not evidence of proprietary fintech software development.
