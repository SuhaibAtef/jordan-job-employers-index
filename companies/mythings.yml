notes: >-
  Reviewed 2026-10-25. Official site and company LinkedIn establish a Jordanian
  last-mile logistics and Q-commerce business founded in Amman in 2021.
  LinkedIn reports 201-500 employees company-wide, rather than the previous
  unsupported precise count of 154; this range is not an audited Jordan-only
  headcount. LinkedIn lists Al Mawaddah Street, Amman 11189. The previous
  '7th Circle' qualifier is not corroborated, and the former coordinates
  (31.9539, 35.9106) were a generic Amman pin, not the company entrance;
  building and occupancy remain unverified. The official website provides
  only 'Amman, Jordan' and placeholder-looking postal/address text.
  The email mohammad.hamad@mythings.app is a company-published engineering/QA
  CV submission contact, not independently confirmed as a dedicated HR inbox.
  No dedicated careers portal or verified internship/graduate intake was
  found; a previous generic 'Internship' signal was unsupported and cleared.
  Company LinkedIn describes proprietary in-house dispatch, CRM, MDM,
  chatbot and mobile applications. The named technologies are requirements
  or familiarity preferences in company-authored 2026 engineering adverts,
  not independently audited production deployments; Azure is specifically
  listed as familiarity, not proof of cloud deployment. Published senior
  engineering and QA posts are evidence of 2026 recruitment, not a guarantee
  that applications remain open on the review date. Historical Jordan Post
  partnership and founder assertions were not independently revalidated.
