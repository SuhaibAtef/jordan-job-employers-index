notes: >-
  Reviewed 2026-10-25. The current official homepage documents AI-assisted
  reputation management, social/news monitoring, competitor benchmarking,
  smart alerts, and briefings. The company's older official login page identifies
  NABA360 as a registered trademark of Jordanian Naba for Software LLC and
  publishes the Mohammad Fayyad Street office; MarComJo independently repeats
  Building 52 in Tla' Al Ali. This verifies the published address, not current
  physical occupancy. The coordinates are from the StartupsJo directory's
  linked office map, not a surveyed building entrance. LinkedIn reports 11-50
  employees and founding in 2017; older third-party listings report 1-10,
  so headcount is an unaudited, conflicting estimate. The official legacy site
  publishes info@naba360.com as a general contact; StartupsJo lists
  hkattab@naba360.com for a named contact. Neither is verified as HR, so
  hr_email remains null. No official careers page, currently accepting Jordan
  vacancy, internship, or graduate program was established. AI/ML and NLP
  describe documented product capabilities, not a confirmed internal framework
  or programming-language stack. The prior security category was unsupported.
