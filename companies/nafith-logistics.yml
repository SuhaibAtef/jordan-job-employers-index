notes: >-
  Reviewed 2026-10-25. The current official group site documents Amman HQ,
  port/hinterland concessions and the NFIDENT in-house technology arm, plus
  Load24's freight marketplace. NFIDENT documents REST integrations,
  optical recognition of vehicles/containers, RFID eSeals, and automated
  gates. These are documented products/capabilities, not an audited internal
  software stack. Historical 2023 recruitment for .NET backend and junior QA
  supports .NET historically; C# and React are retained from
  previously recorded employee-profile leads but not independently confirmed
  as a current production framework. LinkedIn reports 501-1000 employees
  worldwide and the group website reports 500+; int@j's 1-24 estimate
  apparently refers to a narrower company record and is not a reliable
  group-wide headcount. IFC and LinkedIn corroborate Office 401 on Mecca
  Street, and AmCham identifies Al Hijaz Towers. The map coordinates come
  from a third-party business listing near that building and are approximate,
  not a surveyed office entrance; current physical occupancy is unconfirmed.
  The group site publishes info@nafith.com as a general contact, not HR.
  No official careers page, dedicated HR email, currently accepting Jordan
  vacancy, internship or graduate intake was confirmed. A circa-2022 Amman
  QA lead posting is closed and circa-2023 .NET/junior QA listings are
  historical, not evidence of present openings. Official website says the
  group has operated since 2000, while LinkedIn and int@j list 2007;
  these may reflect different legal/group founding dates.
