name: "NAFITH Logistics"
description: >-
  Nafith International Group is an Amman-headquartered operator of technology-enabled
  port, freight-corridor and hinterland logistics infrastructure. Through its NFIDENT
  technology arm it develops gate automation, vehicle and cargo recognition, community
  systems and electronic waybill solutions; the affiliated Load24 marketplace connects
  cargo owners and transport providers.
