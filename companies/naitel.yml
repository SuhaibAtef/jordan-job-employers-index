description: "Jordanian telecommunications and digital-infrastructure provider and the telecom arm of Aqaba Digital Hub. NaiTel offers enterprise fiber and direct internet access, MPLS connectivity, internet exchange/peering through AqabaIX, cloud and colocation connectivity, and Starlink business internet. It operates connectivity infrastructure associated with Aqaba's cable landing and data-center ecosystem."
