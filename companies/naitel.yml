notes: >-
  Reviewed 2026-10-25. Official NaiTel website and LinkedIn support its telecommunications,
  fiber/FTTx, MPLS, peering, cloud-connectivity and Starlink offerings; these are network
  products/services, not evidence of an internal programming-language stack. LinkedIn
  describes Aqaba (Al-Makateb Area, Al-Dostoor Neighborhood) as headquarters and reports
  11-50 employees. A 2021 Jordan ICT directory reports 37 staff in 2018 and an older
  Amman office at 314 Zahran St. The current official Arabic homepage STILL lists
  314 Zahran St, Al-Husseini Complex, 7th Floor, Office 715, whereas the official
  English cookies-policy footer lists Abdoun, Salman Qudah St, Jordan Kuwaiti Bank
  Building, 1st Floor. The address discrepancy is unresolved; a previous claimed
  Google Maps pin near Abdoun (31.94053,35.88197) was removed as unverified and
  exact office occupancy was not established. Official Aqaba office is Al-Makateb
  Area, Al-Dostoor Neighborhood, 1st/2nd floors. The 2026-10-01 MEDUSA agreement
  concerns planned network integration and colocation via the existing Coral Bridge,
  not proof that new MEDUSA infrastructure is already operational in Jordan.
  Historic company-authored LinkedIn vacancies include an Amman pre-sales/solutions
  architect and an Aqaba data-center facility manager; both pages say no longer
  accepting applications. Pre-sales ad mentions Microsoft, VMware and KVM hypervisors
  as candidate familiarity, not confirmed deployed technology. No official careers
  portal, dedicated HR email, currently accepting Jordan vacancy, internship or
  graduate program was independently verified. Prior 2026-10-03 research preserved
  as historical context, but its claim that the Amman address conflict was resolved
  is superseded by this direct review of conflicting current official pages.
