notes: >-
  Reviewed 2026-10-25. Naseej's official company website identifies Riyadh as headquarters
  and lists other offices in Dubai, Kuwait, Abu Dhabi, Beirut, Cairo and Rabat; it does
  not list a direct Jordan office. Naseej and Sprintive's company-authored 2019
  investment announcement and the 2024 Jordan ICT directory establish a business
  relationship with Amman-based Sprintive, not proof of a direct Naseej Jordan
  office or its present legal/ownership structure. Sprintive independently lists
  Al Jalal Complex, Suhayb Ben Sinan Street, Amman, as its own address, which
  must not be attributed to a Naseej office. Prior central-Amman coordinates
  were generic and unsupported and have been removed. LinkedIn estimates
  501-1,000 Naseej employees globally; Jordan-specific staff are unknown.
  Naseej's live careers portal listed 14 roles on the review date in Riyadh,
  Jeddah and Cairo, including remote Cairo-office roles; none listed Jordan
  as a location. Its general internship-program benefit and Riyadh-based
  Tamheer training roles do not establish a Jordan graduate or internship
  opening. No dedicated public HR email was verified; info@naseej.com is
  a general corporate contact only. Drupal is documented through Sprintive,
  while LMS is a Naseej product category. Moodle and WSO2 partnerships are
  historical leads from earlier research, not current internal deployment proof.
  A previously recorded generic REST API claim was not independently
  substantiated as an internal technology stack. Current Jordan hiring,
  precise Naseej office address, direct local headcount and internal stack
  remain unverified; company verification therefore remains partial.
