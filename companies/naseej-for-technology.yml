name: "Naseej for Technology"
description: >-
  Riyadh-headquartered technology and digital-transformation company founded in 1989,
  serving education, libraries, museums, knowledge-management organizations and enterprises
  across the Middle East. Its portfolio includes learning and campus-management platforms,
  digital experience portals, library and archive systems, digitization, process automation
  and managed IT services. Naseej announced an investment in Jordan-based Drupal
  development company Sprintive in 2019; this does not establish a separately
  registered Naseej office in Amman.
industry: "IT services, educational technology and knowledge-management solutions"
