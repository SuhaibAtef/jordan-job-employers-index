notes: >-
  Reviewed 2026-10-25. Official website confirms NashmiCs' BPO services:
  customer contact by phone, chat and email, content moderation, training,
  HR outsourcing and call-center seat rental. Official contact page lists
  154 Wasfi Al-Tal St, Al-Waha Circle, Amman, Jordan and general email
  info@nashmics.com. The same address is independently repeated in a
  third-party company directory; this verifies the published business address,
  not current physical occupancy. Previously recorded coordinates
  (31.98888, 35.87527) were approximate and not tied to a corroborated
  building-level pin; removed rather than presenting them as precise.
  LinkedIn lists 201-500 employees, replacing the older third-party
  estimate of 250-999. Company-authored LinkedIn recruitment posts from
  approximately May 2026 sought Amman customer-service agents, with B1
  English and 3 months of experience for one opening and B2 English and
  a preferred year of experience for another. These demonstrate recent
  early-career-accessible customer-service recruiting, not a currently
  open vacancy. The official careers site links to a generic application
  form; submission and current vacancy status were not tested. No
  dedicated internship or graduate program was confirmed. The HR address
  hr@nashmics.com is directly published in company-authored recruitment
  posts. Official descriptions mention technology-enabled call-center
  services but do not substantiate named internal software frameworks,
  programming languages, cloud platforms or a production stack; the
  technologies list remains empty. Founding year 2020 appears in
  third-party directories but was not independently established from
  official sources. Company verification remains partial because
  actual employee count, current openings, exact office coordinates,
  office occupancy and internal technology stack are not verified.
