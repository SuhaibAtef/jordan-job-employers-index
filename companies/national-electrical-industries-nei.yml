notes: >-
  Reviewed 2026-10-25. Official company website and LinkedIn identify NEI as a
  Jordanian electrical-panel and lighting manufacturer founded in 1984. The
  newer official contact page distinguishes the head office at Building 63,
  Al-Shaheed Street, Sport City, Amman (P.O. Box 19225, Amman 11196) from the
  factory at Abdullah II Ibn Al Hussein Industrial City, Sahab (P.O. Box 50,
  Amman 11512). LinkedIn independently identifies the Sahab factory. The
  published addresses are verified as company-listed locations, not proof of
  present occupancy or surveyed entrances. Previous coordinates 31.84939,
  36.00937 were not independently tied to the NEI factory; removed. The
  official factory map opens a Google Maps viewport near 31.8531447,
  36.0083039, which is not sufficient to assert an exact entrance coordinate.
  LinkedIn reports 11-50 employees, not an audited payroll count. The general
  business email info@nei.com.jo is corroborated by a contractor directory;
  no dedicated HR mailbox was confirmed, so hr_email is null. The official
  Arabic job-application form is accessible, but no dated open job, internship
  or graduate intake was verified and submission was not tested. Official
  smart-solution pages document connected street lighting, NEI City, smart
  poles and PLC, RS485, Zigbee, LoRa, NB-IoT and GSM/LTE communications;
  these describe products and supported protocols, not an independently
  verified internal programming stack. Petra reported a ministerial visit to
  the company's production lines on 2026-10-01, supporting recent activity.
  A legacy official page states formation in 1983, whereas the current main
  website and LinkedIn state 1984; 1984 is used with the discrepancy noted.
  Company verification remains partial due to unverified headcount, current
  vacancies, HR contact, internal software stack and precise factory pin.
