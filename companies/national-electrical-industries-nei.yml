name: "National Electrical Industries (NEI)"
description: >-
  Jordanian electrical equipment and lighting manufacturer established in 1984,
  producing electrical panels, LED lighting, poles and industrial electrical
  systems. Its smart-city portfolio includes connected street lighting,
  multifunctional smart poles and the NEI City cloud management platform.
  The company publishes a head office in Amman Sport City and a factory in
  Abdullah II Ibn Al Hussein Industrial City, Sahab.
industry: "Electrical equipment and lighting manufacturing; smart-city infrastructure"
