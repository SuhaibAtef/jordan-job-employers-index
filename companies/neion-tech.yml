notes: >-
  Reviewed 2026-10-25. Official website and LinkedIn identify a Jordan-based
  software services company headquartered in Amman; LinkedIn and Clutch give
  2025 as founding year and estimate 2-10 and 2-9 staff respectively. These
  are directory/profile ranges, not audited Jordan payroll. Official contact
  page publishes Amman, phone +962792054000 and general contact
  info@neiontech.com; no verified dedicated HR email or careers page. Clutch
  and GoodFirms place the business around Abdali Boulevard near W Hotel, but
  the official contact page does not confirm a street address, building or
  occupancy. Earlier coordinates 31.97612,35.90546 and their Google Maps
  search URL were removed because no reliable building-level pin was verified.
  The official QEightSport portfolio documents Flutter/Dart, Laravel/PHP,
  PostgreSQL, REST APIs, Redis, Firebase Cloud Messaging and Nginx; the Jordan
  Journey portfolio documents WordPress with custom plugins. The official
  DevOps service page lists AWS, DigitalOcean, Linux, Docker, GitHub Actions
  and GitLab CI as offered capabilities; these are not a third-party audit of
  internal production systems. Other legacy stack terms were omitted without
  current specific supporting evidence. The earlier internship flag conflicted
  with its own notes and no internship, graduate intake or current vacancy
  could be corroborated, so early_career_signal is false. Company verification
  remains partial because staffing, hiring, dedicated HR contact and precise
  physical office location remain unconfirmed.
