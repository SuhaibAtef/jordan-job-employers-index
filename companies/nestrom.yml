"notes": "Reviewed 2026-10-25. Nestrom was founded in Jordan around 2016-2017: Wamda and contemporary 2018-2019\
  \ reporting say 2017, whereas the current company LinkedIn profile says 2016. Its original agricultural SaaS,\
  \ Android workforce-management and IoT sensor products are documented in 2018 reporting; the current company-authored\
  \ LinkedIn description instead promotes no-code BPM/workflow automation, quality and safety compliance, inspections,\
  \ analytics and API integrations. LinkedIn lists primary headquarters at Emirates Towers Offices, Area 2071, Dubai,\
  \ UAE, and 2-10 employees. Wamda and contemporary press establish Jordan origins and historical Jordan-based software\
  \ development. Lucidity Insights and The Org still list Amman headquarters, while Dealroom and LinkedIn list Dubai,\
  \ so current Jordan legal/physical presence is not independently confirmed. JordanYP lists Naeb Omran Al Mayata,\
  \ Amman, but its listing was last updated 2023; another directory suggests Kilo Circle. Neither is sufficient\
  \ for a present-day office address. Previously recorded 31.95672,35.92519 coordinates and Google Maps search URL\
  \ were removed as unsupported for the company office. The official nestrom.com website could not be loaded during\
  \ this review; URL retained from company LinkedIn and directory profiles, but site availability and careers pages\
  \ cannot be established. Crunchbase publishes info@nestrom.com as general contact, not an HR mailbox. An older\
  \ sales development representative posting is historical only; no current Jordan vacancies or internship intake\
  \ confirmed. Product technologies and capabilities are not an audit of internal engineering stack. Verification\
  \ remains partial due to website access, headquarters conflict, unverified Jordan office, staffing and hiring."
