notes: >-
  Reviewed 2026-10-26. Netcompany-Intrasoft's corporate LinkedIn lists Luxembourg
  headquarters and 1,001-5,000 employees worldwide; this is not a Jordan headcount.
  Its legacy INTRASOFT International LinkedIn lists an Amman postal location, and
  Jordan ICT identifies a Jordan delivery center. Intrasoft Middle East publishes
  Building 191, King Abdullah II Street, Khalda, and the same Amman phone number
  shown in the Netcompany-Intrasoft Jordan ICT listing, supporting an associated
  local presence. The exact legal/ownership relationship between Intrasoft Middle
  East and the current Netcompany-Intrasoft group, and current office occupancy,
  were not independently confirmed. Coordinates are an existing Google Maps pin,
  not surveyed entrance coordinates. Location verified means corroborated published
  address for the associated local operation, not full company verification.
  Intrasoft Middle East LinkedIn lists 51-200 staff, distinct from the group's
  global 1,001-5,000 range. The local careers page has 2025-dated postings and
  invites CVs to info@intrasoft.me; this is a general inbox explicitly used for
  applications, not a confirmed dedicated HR mailbox. Netcompany's global vacancy
  board was inspected and no Amman vacancy was identified on the displayed list
  as of review. SAP and Oracle EBS/S/4HANA are documented solution and role
  requirements of the local operation, not an audited internal development stack.
  Previously listed Cloudera and Microsoft 365 originated from a third-party
  vendor-stack aggregator and were not independently corroborated, so were removed.
  The global corporate website timed out during this review; company identity
  was corroborated through the corporate LinkedIn page and Jordan ICT directory.
  No verified current Jordan graduate or internship program.
