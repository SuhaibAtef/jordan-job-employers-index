name: "Netcompany-Intrasoft"
description: "Netcompany-Intrasoft is a Luxembourg-headquartered IT solutions and services group, part of Denmark's Netcompany Group since 2021, serving public- and private-sector clients through software development, systems integration, application services, analytics and enterprise platforms. Jordan ICT documents an Amman-based regional delivery presence; Intrasoft Middle East operates a closely associated local business, but the exact current legal relationship between the global group and that business has not been independently resolved."
