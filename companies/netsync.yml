notes: >-
  Reviewed 2026-10-26. Official NETSYNC website and LinkedIn corroborate the
  Houston headquarters, IT systems-integration business and cybersecurity,
  networking, cloud and managed-services offerings. LinkedIn's 51-200 company
  size band is a global profile estimate, not a verified Jordan headcount;
  employee-profile counts and third-party staff estimates differ. NETSYNC's
  official locations page says it has four international offices serving the
  Middle East and Africa, but the rendered office list does not identify
  Jordan or give an Amman address. Craft lists King Hussein Business Park,
  Building 5A, 3rd Floor, Amman; SignalHire shows some Jordan-based employee
  profiles, both third-party and not proof of current office occupancy.
  Retained existing coordinates 31.97183, 35.83394 as an approximate
  business-park-area map reference only, not a verified building entrance.
  The original 100-200 employee estimate was replaced with the company's
  LinkedIn 51-200 band. Cisco, governance/risk/compliance (GRC), AWS and
  Splunk are documented partner, product or service capabilities, not an
  independently verified internal software stack. The official website
  publishes info@netsync.com as a general contact, but no dedicated HR
  mailbox was established. The official careers page is accessible; no
  currently accepting Jordan-specific vacancy or internship was confirmed.
  US-based internship listings do not imply an Amman internship program.
  Company-level verification remains partial because Jordan location,
  occupancy, local staffing and recruitment cannot be independently verified.
