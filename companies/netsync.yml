name: "NETSYNC"
description: >-
  NETSYNC (Netsync Network Solutions) is a Houston-headquartered IT solutions
  integrator and value-added reseller founded in 2002. It designs, deploys and
  manages enterprise networking, cybersecurity, collaboration, data-center,
  cloud and managed-services solutions. A third-party office directory lists
  an Amman location at King Hussein Business Park; a current Jordan office
  and Jordan-specific hiring were not independently confirmed by the company.
