name: "Network International Jordan"
description: >-
  Network International Services Limited Jordan is the Jordanian operation of
  Network International, a regional payment-technology provider serving merchants,
  banks and fintechs. Its Jordan services include card and POS transaction
  processing, merchant acquiring, payment gateways, electronic collections and
  related payment infrastructure. The Central Bank of Jordan lists the local
  company as licensed for specified payment-system and payment-service activities.
