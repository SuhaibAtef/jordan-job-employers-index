notes: >-
  Reviewed 2026-10-26. Jordan legal entity and permitted payment activities are
  documented by the Central Bank of Jordan. The corporate contact page and CBJ
  both identify Building 43, Abdul Rahim Al-Waked Street, Shmeisani, Amman;
  this corroborates the published address but does not independently establish
  current physical occupancy. CBJ additionally lists branches in Sweifieh
  and Aqaba. Approximate map coordinates are from a third-party headquarters
  listing, not a surveyed entrance; the older uncorroborated pin was replaced.
  The Jordan subdomain is a merchant portal, not a corporate careers site.
  The official group contact page publishes recruitment-jo@network.global for
  Network roles in Jordan and nitech_recruitment@network.global for NICE.
  The LinkedIn size range describes the global group and is not a local staffing
  estimate; the previous 51-200 figure lacked a reliable Jordan-specific source.
  Network announced a Mastercard Move collaboration for Jordan on 2026-09-16,
  supporting recent local activity. The 2022 JoPACC CliQ QR partnership is
  historical product evidence. Java, Spring Boot, AWS and REST API were
  previously attributed to Amman employee profiles; MongoDB, MySQL, Docker,
  Kubernetes and React appear in 2026 third-party job descriptions, not a
  complete audited internal production stack. An October 29 deadline appears
  on a third-party backend job listing and a December 2 deadline on a
  deployment-engineer listing; neither was confirmed on an employer-operated
  vacancy page. No current Jordan graduate intake or internship verified.
