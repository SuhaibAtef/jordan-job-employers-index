job_seeker:
  early_career_signal: false
  signals:
    - "On 2026-10-26, the official careers portal displayed Jordan-based developer, DevOps, QA, integration, analytics and other roles with Apply Now links; many positions explicitly name client organizations rather than Nextwo as the employer."
    - "The company LinkedIn jobs listing displayed recent Amman and Irbid vacancies, but individual LinkedIn job pages may state applications are closed; confirm each posting before applying."
    - "Company-authored historical LinkedIn recruitment posts directed CVs to jobs@nextwo.com; continued monitoring of that mailbox has not been independently confirmed."
    - "No currently accepting Jordan-specific internship or formal graduate program was verified."
notes: >-
  Reviewed 2026-10-26. Nextwo's official about and contact pages identify
  Riyadh/Saudi Arabia as headquarters and Amman and Cairo as delivery centers;
  its LinkedIn company profile reports 201-500 employees worldwide, not a
  verified Jordan workforce count. An older company LinkedIn location listing
  and third-party directory describe Nextwo Complex, Building 66, Al-Madina
  Al-Munawara Street, Amman, but the current primary LinkedIn listing gives
  only Amman without a street address. The address is therefore provided
  but unverified for current occupancy. Previous numeric coordinates
  (31.969226, 35.864706) lacked reliable building-level corroboration and
  were removed; the map link is an address search, not a verified pin.
  The official contact email info@nextwo.com is a general commercial inbox.
  Historical company-authored recruitment posts explicitly give
  jobs@nextwo.com for CVs, so it is recorded as a recruitment contact with
  a recency caveat. The careers portal currently displays Jordan roles,
  including some for clients such as Cloud Solutions and Saudi Council of
  Engineers; they are not necessarily direct Nextwo employment. LinkedIn
  also lists Amman/Irbid roles but some individual listings show applications
  closed. No current graduate intake or internship was confirmed; the
  previous unsourced Graduate signal was removed. Technology entries are
  official service/recruitment specialties or job requirements, not an
  independently audited internal production stack. Tableau appears only
  as a bonus skill in historical company recruitment; it is not a verified
  production deployment.
