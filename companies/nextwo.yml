name: "Nextwo"
description: >-
  Nextwo is a T2 subsidiary providing recruitment process outsourcing,
  technical staffing, offshore development centers and managed technology
  teams for Saudi enterprises. It operates delivery centers in Amman, Jordan
  and Cairo, Egypt, and recruits across enterprise software, cloud,
  AI, data, ERP and cybersecurity disciplines. Its careers portal includes
  opportunities for client organizations as well as Nextwo roles.
industry: "IT staff augmentation / recruitment process outsourcing and offshore software delivery"
