name: "Nokia Jordan"
description: >-
  Nokia is a Finland-headquartered telecommunications network infrastructure
  company providing mobile radio access, fixed broadband, IP and optical
  networking, network software and related services. Its officially listed
  Amman office supports a documented Jordan presence. Nokia has supplied
  Orange Jordan and Zain Jordan with 5G radio access equipment and has
  worked with Orange Jordan on fiber access and broadband routing upgrades.
industry: "Telecommunications network infrastructure, equipment and services"
