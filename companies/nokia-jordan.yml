    - "A third-party February 2026 report described a Jordan radio-account-manager vacancy, but no corresponding currently open employer-operated posting was verified; treat it as historical only."
notes: >-
  Reviewed 2026-10-26. Nokia's official worldwide offices directory explicitly
  lists the first floor of Edgo Tower on Rafiq Al Hariri Avenue in Abdali,
  Amman, and Nokia's official affiliate list names Nokia Solutions and
  Networks Branch Operations Oy/Jordan Branch. This supports a verified
  published Jordan office address, not independently confirmed physical
  occupancy. The retained coordinates (31.9638919, 35.906863) identify a
  Google Maps Nokia pin close to the Edgo Atrium building pin; they are
  approximate mapping coordinates rather than surveyed office or entrance
  coordinates. A historical Nokia Siemens Networks directory address on
  Queen Noor Street in Shmeisani is not used as a current office address.
  Nokia's 2025 annual report reports approximately 78,000 average worldwide
  employees, while its LinkedIn profile uses the broad 10,001+ category;
  neither establishes Jordan headcount. The official corporate contact page
  does not publish a Jordan HR mailbox; media and general corporate contacts
  are not treated as recruitment addresses. Nokia's global careers portal
  and student/graduate page were checked, but a live Jordan-specific opening
  was not independently verified. A February 2026 third-party job listing
  is historical, not proof of a current vacancy. Documented Jordan customer
  deployments include Orange Jordan's 2023 AirScale/NetAct 5G RAN deal,
  Zain Jordan's 2023 AirScale 5G RAN deal, Orange Jordan's earlier GPON
  FTTH rollout, and the 2025 Nokia 7750 SR broadband gateway upgrade at
  76 sites. Listed technologies describe Nokia products deployed or
  contracted in Jordan, not a verified internal programming/software stack.
  The prior Cisco technology entry was removed because no Nokia Jordan
  deployment or internal-use evidence supported it. Company verification
  remains partial because local workforce, recruiting contact and current
  Jordan hiring signals remain unverified despite the official office listing.
