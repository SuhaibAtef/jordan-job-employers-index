notes: >-
  Reviewed 2026-10-26. The NoNerds company LinkedIn page describes a Jordanian university-learning marketplace and its FAHEEM AI tutor, lists 2-10 employees and founding year 2021. Apple App Store documents an iPhone app, and the company's Linkme profile links to Android distribution; these establish customer-facing platforms, not the engineering framework or internal stack. No verified software languages, frameworks, cloud vendors or employee engineering roles were found. The public Linkme profile lists info@nonerdsapp.com and +962799165443 for general enquiries; this is not a verified HR mailbox. It also offers a tutor-application link, which is not evidence of a salaried job, internship or graduate program. No active NoNerds employment vacancy or careers page was verified. Entarabi (2026-06-09), Jo Academy-associated statements and other press report acquisition by Jo Academy for USD 140,000; present standalone legal/employment status and Jordan headcount are unconfirmed. Founder attribution is inconsistent: NoNerds LinkedIn names Ahmad Alkayid, while acquisition coverage names Mohammad Al Soufi; a Jo Academy-associated post names Ahmad Alkayid, Mohammad Alsufi and Yazan Alqwaysim. Do not assume a single founder from these sources. LinkedIn and Dealroom support Jordan/Amman presence but no reliable current NoNerds street address or occupied office. Prior location research dated 2026-10-05 checked the company site, Google Maps, startup directories and Jordan CCD portal without identifying a corroborated street address; absence from a name search is not proof of nonregistration. Jo Academy's own office address must not be attributed to NoNerds. Previous Amman city-centre coordinates and Google Maps link were removed because they represented only a generic city fallback. NoNerds website was not independently retrievable in this run; public company LinkedIn, the App Store, Linkme and acquisition coverage were used instead.
