    - "Nortal inaugurated its Amman office on 2026-04-08; the government news agency described plans for specialized jobs, but the announcement is not a currently accepting vacancy."
    - "Jordan-based Senior Java Engineer and Senior Fullstack Java-Angular advertisements on Nortal's LinkedIn were reviewed; both show applications no longer accepted. They require Java/Spring and, for full-stack, Angular; cloud-provider experience is requested and Docker/Kubernetes is a plus."
    - "October 2026 third-party listings describe Jordan Java Engineer and Senior Java Engineer roles, but active applications could not be independently confirmed on Nortal's employer-operated portal. Check the official Middle East careers page."
    - "Nortal advertises a Saudi Changemakers early-career program; no currently accepting Jordan-specific internship or graduate program was verified."
notes: "Reviewed 2026-10-26. Nortal's official company office directory lists Mecca Street, Balsan Tower, Building 162, 4th floor, Amman and +962 6 553 4597. The directory links to Google Maps coordinates 31.976357, 35.859245; these are company-supplied map coordinates, not independently surveyed building-entrance coordinates. The published address is corroborated by the 2026-04-08 Jordan News Agency report of the official Amman office inauguration and Nortal's own LinkedIn announcement. Location status 'verified' means a credible published office address and Jordan operations, not independently observed current occupancy. LinkedIn's 1,001-5,000 size range applies to Nortal globally; an earlier claim of four Jordan employees could not be substantiated and is not retained. Nortal announced that its acquisition of Accela Middle East took effect 2025-10-01, making Nortal the exclusive Accela licensing entity in the region; this does not establish a separate Amman headcount. The official Middle East careers page exists but renders job results dynamically and did not permit direct confirmation of an accepting Jordan vacancy. Historical company-posted LinkedIn jobs for Senior Java Engineer and Senior Fullstack Java-Angular show no longer accepting applications. A historical Nortal-hosted Jordan .NET role required C#, ASP.NET/.NET Core and Vue.js, but the former iCIMS URL now returns 410; these are documented recruitment requirements, not an audited internal production stack. Java, Spring, Angular, SQL and Git likewise reflect Jordan recruitment requirements. AWS, GCP or Azure were listed as alternative cloud-experience qualifications, and Docker/Kubernetes as preferred; none proves deployed company infrastructure. October 2026 third-party Jordan Java job mirrors suggest ongoing recruitment but are not confirmation of an open official application. Nortal's Saudi Changemakers program is Saudi-specific, not a Jordan graduate program. No dedicated Jordan HR email was published in the reviewed official sources; corporate general contacts are not labeled as HR. Company verification remains partial pending independent Jordan workforce, current recruitment and internal-stack confirmation."
