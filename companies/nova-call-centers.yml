job_seeker:
  early_career_signal: true
  signals:
    - "Employer-authored LinkedIn advertisements in July-September 2026 sought customer service agents in Amman and Irbid, a quality assurance officer and a senior HR officer; roles and application status may change."
    - "Employer-authored job posts direct CVs to careers@novaservices.me, a verified recruitment mailbox; no separate company-hosted careers portal was confirmed."
    - "A December 2025 Irbid customer service advertisement explicitly welcomed university students for full-time and part-time work; this is historical student-friendly recruitment, not a verified current internship or graduate program."
    - "Customer service roles request English proficiency and basic Microsoft Office knowledge; QA roles mention Excel and contact-center KPIs. These are job skills, not evidence of the company's internal software stack."
notes: >-
  Reviewed 2026-10-26. The official contact page publishes Jordan Trade Center,
  134 Queen Rania Street, Amman and +962 6 222 9394; the company's LinkedIn
  profile independently lists 134 Queen Rania Al-Abdullah Street, unit 2A,
  Sweileh, Amman. Cybo and BizMidEast also list the same street address.
  The location is verified as a corroborated published business address, not
  independently observed current occupancy. Retained the existing coordinates
  31.997808, 35.882348 as an approximate map pin: a May 2025 business-location
  dataset places Nova at 31.9978057, 35.882346, but this is not a surveyed
  office entrance. Nova's website says it also operates a facility in Irbid,
  but no independently confirmed Irbid street address was found. LinkedIn
  reports a 201-500 company-size band while the Jordan ICT directory lists
  500-700 staff; different reporting periods and definitions are possible,
  and neither figure is an audited current headcount. LinkedIn and Jordan ICT
  identify 2016 as the establishment year; the official About page also
  claims experience since 2008, which is not resolved here. The official
  website publishes sales@novaservices.me for commercial inquiries; this
  is not the HR contact. Company-authored LinkedIn advertisements explicitly
  direct applications to careers@novaservices.me. Posts from July-September
  2026 provide evidence of recent hiring, but continued acceptance of
  applications was not independently checked in a live ATS. A December 2025
  posting welcomed university students to Irbid customer-service work;
  no current formal internship or graduate intake was verified. The prior
  2026-10-04 stack research found no developer vacancies. Reviewed job posts
  describe customer-support and QA skills, not an engineering production
  stack; technologies therefore remains empty. Verification remains partial
  because staffing figures conflict, the Irbid address and live application
  status are unresolved, and the internal technology stack is not verified.
