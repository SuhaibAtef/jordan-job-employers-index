name: "Nova Call Centers"
description: >-
  Jordan-based business process outsourcing (BPO) and customer-experience
  provider offering multilingual contact-center support, sales and lead
  generation, e-commerce content management, employer-of-record services,
  social media management and workstation leasing. The company publishes
  operations in Amman and Irbid.
industry: "Business Process Outsourcing / Contact Center and Customer Experience"
