notes: >-
  Reviewed 2026-10-26. Nplay's official website identifies a Jordanian
  creative-technology business founded in Amman in 2018, with hologram,
  VR/AR, digital-twin, web, AI and ERP/Odoo integration offerings. The
  company's official contact page publishes Office 203, Almehaniah
  Commercial Towers, Wasfi Al-Tall Street, Khalda, Amman; its current
  LinkedIn profile independently gives Wasfi Al-Tall Street and commercial
  center towers M2. Location.status verified means corroborated published
  address, not an independent observation of current occupancy. The official
  embedded Google Map is centered at about 31.9926079, 35.8655173, close
  to the previous coordinates; these are a company-published approximate
  location pin, not surveyed office-door coordinates. LinkedIn's current
  nplay Technologies profile reports 11-50 employees and founding in 2018;
  a separate older Nplay middle east profile linked to the same domain
  reports 201-500 employees and 2015 founding, an unresolved historical
  inconsistency. The current official site and linked company profile are
  preferred, but actual headcount and legal-entity structure remain
  unverified. The official site publishes info@nplay.tech as a general
  contact and h.alhaj@nplay.tech as a named contact; neither is established
  as a dedicated HR/recruitment address, so hr_email is null. A historical
  entry-level marketing vacancy on LinkedIn is closed. Academy training
  for students and graduates does not demonstrate current employment
  opportunities. Technologies represent public product/service capabilities,
  not an independently confirmed internal engineering stack; no programming
  language, engine, cloud provider or deployment architecture was verified.
  The previous games category was removed because a games business was not
  corroborated; web was added based on official website/platform services.
  Verification remains partial because staff count, current recruitment,
  exact occupancy and internal stack remain unresolved.
