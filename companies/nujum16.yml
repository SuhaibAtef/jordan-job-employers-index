name: "NUJUM16"
description: >-
  Jordan-founded sovereign cloud and AI data-center infrastructure developer
  established in 2026. NUJUM16 is planning a phased sovereign-compute campus
  near Queen Alia International Airport, intended to support regulated banking,
  healthcare, government, telecommunications and enterprise workloads while
  keeping sensitive data under Jordanian jurisdiction. Its September 2026
  infrastructure forum announced collaborations on AI compute, education and
  ecosystem development; announced capacity is not evidence of an operational campus.
