notes: >-
  Reviewed 2026-10-26. NUJUM16's official website and company LinkedIn
  describe a Jordan-based sovereign AI/cloud infrastructure initiative;
  LinkedIn lists Amman headquarters, 2026 founding and 2-10 employees.
  No street address for an occupied Amman headquarters is published. The
  official website separately describes a proposed 100 MW campus at Plot
  4790, Al-Jiza, on the Desert Highway about 7 km south of Queen Alia
  International Airport. That proposed project site is not an independently
  confirmed staffed office or operational data center. The previous
  coordinates 31.9518, 35.94042 were removed because no source linked
  them reliably to the headquarters or planned campus. The official site's
  readiness claims conflict: a hero section says Q4 2026, its phase schedule
  says a 2 MW pilot in Q1 2027 and full 100 MW build in Q4 2030, and its
  footer says service beginning Q2 2027. Treat all dates and capacities as
  projections, not completed infrastructure. The official site lists
  info@nujum16.com as a general contact, not a verified HR mailbox.
  The September 16, 2026 Petra report identifies founder Ahmad Bunnia
  (also styled Ahmad Al-Bunnia on LinkedIn) and three MOUs, including
  an education and potential employment-pathways partnership with HTU.
  Agreements and possible future pathways do not demonstrate active
  recruitment. Technologies above describe planned infrastructure and
  advertised specializations; no audited production stack, cloud vendor,
  active jobs, Jordan-specific headcount or physical site occupancy was
  independently confirmed. Company verification remains partial.
