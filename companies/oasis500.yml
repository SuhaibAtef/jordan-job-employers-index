name: "Oasis500"
description: >-
  Oasis500 is an Amman-based early-stage venture capital investor and startup
  accelerator founded in 2010. It backs technology and technology-enabled
  founders with seed financing, mentorship, strategic support and access to
  regional networks. In February 2026 it announced Oasis Ventures III,
  a fourth investment fund targeting more than USD 20 million for early-stage
  ventures; this fund target is not a confirmed amount raised.
