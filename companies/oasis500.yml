notes: >-
  Reviewed 2026-10-26. Oasis500 is a Jordanian seed investor and accelerator,
  not a software engineering employer by default. Its company LinkedIn lists
  founding in 2010, headquarters in Amman, a 2-10 employee company-size range,
  and Building 7 at King Hussein Business Park. JordanYP and CB Insights
  corroborate the published Building 7 address, but physical occupancy was
  not independently checked. An older 2017 self-submitted ecosystem listing
  gives Building 3; the more recent company-maintained LinkedIn listing
  supports Building 7. The retained coordinates (31.97183, 35.83394) are
  approximate business-park map coordinates, not independently verified
  Building 7 entrance coordinates. LinkedIn's employee range differs from
  third-party estimates; no audited current headcount was found. The general
  inquiry address info@oasis500.com is published by StartupsJo and other
  directories, but it is not a verified recruitment/HR contact. The 2026
  Oasis Ventures III fund launch and reported 193 portfolio investments
  describe investment activity and ecosystem jobs, not jobs directly at
  Oasis500. No reliable internal software stack, active direct-employer
  vacancy, careers portal, formal internship or graduate hiring program was
  established. Company-level verification remains partial.
