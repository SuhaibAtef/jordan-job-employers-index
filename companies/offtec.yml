notes: >-
  Reviewed 2026-10-26. OFFTEC Jordan's official site confirms the Amman
  subsidiary was established in 1947, while the wider OFFTEC business traces
  its origins to 1910; these dates describe different organizational scopes.
  Official contact details and the company LinkedIn profile corroborate
  12 Queen Misbah Street, Third Circle, Amman. The address is verified as
  published, not by an independent occupancy inspection. Existing coordinates
  31.955352, 35.912939 were removed because no reliable building-level source
  linked that precise point to the headquarters; the map link now searches
  by address. LinkedIn reports 201-500 employees for its company profile,
  while the official Jordan About Us page displays 200 employees; neither
  is an independently audited current Jordan headcount. hr@offtec.com was
  published in company-affiliated recruitment posts, including a 2026 Jordan
  sales role, but the mailbox's current monitoring was not tested. The group
  careers page displays older 2018-2022 Palestine listings and does not
  establish an accepting Jordan vacancy. Past Jordan software, technical
  support and sales recruitment supports a historical hiring signal, not a
  current internship or graduate program. Security products are marketed
  services/partner technologies; C#, ASP.NET Core, .NET Core, REST API and
  Microsoft SQL Server are historical job requirements, not an audited
  internal production stack. The earlier broad IT-security description was
  expanded to reflect banking, infrastructure and office technology services.
