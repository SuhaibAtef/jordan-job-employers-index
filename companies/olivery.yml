name: "Olivery"
description: >-
  Olivery is a logistics software company founded in 2020 that provides a
  low-code/no-code B2B SaaS platform for delivery businesses and merchants.
  Its cloud-based tools cover order management, dispatch, route optimization,
  driver tracking, cash-on-delivery reconciliation, and customer notifications.
  The company reports operations in Jordan and Palestine and serves customers
  across the wider MENA region.
