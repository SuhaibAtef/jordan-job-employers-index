notes: >-
  Reviewed 2026-10-26. The official company site lists an Amman office on
  King Faisal Street, a Ramallah office on Al-Quds Street and a US office in
  Delaware. The Amman street is company-published, but no independent
  building-level confirmation or occupancy check was found; prior coordinates
  31.95175, 35.93313 were removed as an unverified office pin. The map link
  is an address search, not a confirmed office entrance. The LinkedIn company
  profile lists Cardiff as headquarters and 11-50 employees worldwide; this
  differs in scope from the operational office listings and does not establish
  Jordan headcount. The company's general sales address is sale@olivery.app;
  jobs@olivery.app was advertised for recruitment in a Jordan Senior Technical
  Support post and other company-associated hiring notices, but the mailbox's
  current monitoring was not tested. A company-posted Amman DevOps Engineer
  vacancy, now closed, requested Linux, infrastructure as code, continuous
  integration and experience with AWS, Azure or GCP. These are historical
  recruiting requirements, not proof of deployed infrastructure or a selected
  cloud provider. An Amman/Ramallah Technical Sales Specialist advertisement
  expired 2026-04-30. No accepting Jordan vacancy, formal internship or
  graduate scheme was independently verified. The previous 'Internship'
  signal lacked company-specific corroboration and was replaced with qualified
  historical early-career recruitment. A July 2025 investor announcement
  reports seed backing from Ibtikar Fund and Flat6Labs and over 200 customers
  in nine countries at that time; planned AI features should not be treated
  as independently verified deployed capabilities. The website currently
  advertises over 200 customers and more than ten MENA countries, reflecting
  company-reported marketing figures rather than audited counts.
verification_status: "partial"
