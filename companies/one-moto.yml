name: "ONE MOTO"
description: >-
  ONE MOTO is a British-branded electric mobility company founded in 2019,
  developing and marketing electric motorcycles, scooters and commercial
  last-mile delivery vehicles. Its Byka delivery motorcycle offers a
  swappable battery and optional app connectivity, while the company also
  advertises fleet and rider management services. ONE MOTO names Jordan
  among its international markets, but a staffed Jordan office or direct
  local employer operation has not been independently established.
