notes: >-
  Reviewed 2026-10-26. The company-authored Amman expansion article and
  ONE MOTO LinkedIn profile identify Jordan as a market or territory;
  this is not evidence of an occupied Amman office, locally employed
  staff, a local R&D team or a currently operating Jordan dealership.
  No Jordan street address or verified office coordinates were found.
  Previously recorded 31.9539, 35.9106 pointed only to a generic Amman
  location and were removed; the city-level location is approximate.
  LinkedIn lists London headquarters, 2019 founding and 2-10 employees
  for the international company; this is a platform-reported global
  size band, not Jordan headcount. The company contact page publishes
  hello@one-moto.com for general enquiries and dealerships@one-moto.com
  for distribution. The official global careers page explicitly gives
  hr@one-moto.com for a Global Launch Manager role and lists other
  marketing, sales and operations positions. These are not confirmed
  current Jordan openings, and the page does not document a Jordan
  internship or graduate scheme. A sales/leasing role asks for at least
  one year of experience, but no Jordan placement is established.
  Byka's 4 kW motor, advertised up-to-150 km range, 72 V swappable
  battery and optional One App Connectivity are product specifications,
  not a software engineering stack. A company-republished Dubai
  Chambers account describes an AI-backed cloud fleet/rider management
  service; no programming languages, cloud vendor or deployed Jordan
  technology stack were independently verified. Earlier research dated
  2026-10-05 also found no Jordan software-development job postings.
  The company's Jordan market claim is supported, but the existence and
  present scale of a direct local employer remain unresolved.
