notes: >-
  Reviewed 2026-10-26. Official website and company LinkedIn profile
  identify the firm as an Amman IT consultancy offering security,
  programming, cloud, AI, networking and digital marketing services.
  LinkedIn reports 2-10 employees, a platform-reported range rather
  than audited Jordan headcount. Both the official website and company
  LinkedIn profile publish 46 Azal Plaza, Queen Nour Street, Amman;
  current occupancy and exact entrance coordinates were not independently
  verified. Hiring posts instead describe the work location as near
  the 4th Circle, which may be a different site or a broad landmark;
  the discrepancy is unresolved. Removed the previous 31.95616,
  35.89599 coordinates because they were not tied reliably to the
  published street address. The website publishes support@ow-jo.com
  for general support and +962 6 567 3053 for its office. The
  company-authored job advertisements repeatedly direct applications
  to info@ow-jo.com, so this is a documented recruitment inbox but
  not a separately verified dedicated HR department. The official
  careers page currently renders only a loading message to a text
  client; no currently accepting vacancy could be confirmed there.
  The LinkedIn posts are historical hiring evidence, not proof that
  roles remain open today. No formal internship or graduate program
  was verified. Skills and frameworks listed under technologies are
  recruitment requirements or alternatives, not audited production
  infrastructure. Earlier EDR/XDR and penetration-testing specifics
  were not independently established as deployed tools or services.
