description: >-
  OpenSooq is an Amman-headquartered, mobile-first online classifieds
  marketplace serving the Middle East and North Africa. Its Arabic- and
  English-language website and apps connect individuals and businesses
  advertising vehicles, property, jobs, services and other goods. The
  company operates country-specific marketplaces across the region.
