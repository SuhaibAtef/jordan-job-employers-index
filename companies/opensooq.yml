notes: >-
  Reviewed 2026-10-26. Official country website and company LinkedIn profile
  corroborate the mobile-first classifieds business and Amman headquarters.
  LinkedIn reports 201-500 employees globally, not audited Jordan headcount;
  the company's about-us page says more than 350 team members, which may
  reflect a different update date. LinkedIn lists 158 Makkah Street, Al
  Hijaz Tower as the primary office. A separate business directory confirms
  the Al Hijaz Towers building at street number 158, but not OpenSooq's
  present occupancy, floor or entrance. The earlier 31.976105, 35.860934
  coordinates were removed because they could not be independently tied
  to OpenSooq's exact premises; use the address search for navigation.
  Official about-us and LinkedIn pages publish careers@opensooq.com for
  employment inquiries; no dedicated individual HR contact was verified.
  OpenSooq's marketplace job advertisements are third-party employer posts,
  not vacancies at OpenSooq itself. An employer-branded KayanHunt job
  description dated 2025-02-24 lists PHP, Python, JavaScript/TypeScript,
  Node, React, HTML/CSS, Git, CI/CD, Docker/Kubernetes, MySQL/MongoDB and
  AWS as engineering qualifications or examples; they do not prove every
  technology is deployed. AMD's customer case study independently supports
  OpenSooq's use of AWS with AMD-powered instances. A historical company
  leadership hiring post mentions junior roles, but the prior claim of a
  confirmed large graduate intake is unsupported. No accepting internship
  or current Jordan-specific job was verified in this review. The 2021
  fundraising/expansion plan is not evidence of present headcount or hiring.
verification_status: "partial"
