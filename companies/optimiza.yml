notes: >-
  Reviewed 2026-10-18. Official website and LinkedIn confirm an active
  Jordan-headquartered ICT systems integrator founded in 1983. Official site
  describes over 450 experts across the group; LinkedIn's self-reported
  201-500 size range is not a Jordan-specific audited headcount. The Amman
  building and street are corroborated by the official contact page and
  company LinkedIn, but no exact geospatial point was independently verified;
  previous latitude/longitude were removed. The official careers page listed
  Operations Associate, Data & AI Product Line Manager and senior Oracle roles
  when checked; most postings do not state a Jordan work location, and the
  Oracle Presales Architect listing specifies Saudi Arabia. Official job
  descriptions publish careers@optimizasolutions.com for applications.
  September 2026 Bayt listings describe fresh-graduate SQL/PLSQL and Oracle
  database roles in Jordan, but present availability was not independently
  confirmed. Technologies are evidenced by advertised role requirements and
  services, not an audited internal production stack. Historical Optimiza
  Academy references do not establish an active academy in 2026.
