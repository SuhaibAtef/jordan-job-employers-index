notes: >-
  Reviewed 2026-10-26. Oracle's official Middle East contact directory lists
  Jordan sales telephone +962 6 5200802, support telephone +962 6 5200895,
  and contact@oracle.com as a general sales email, not an HR mailbox.
  Historical Jordan ICT directories identify Oracle Systems Ltd / Oracle
  Systems Co. Ltd. in Shmeisani, Al-Thaqafah Street, Amman, with a local
  telephone +962 6 5200800. The street-level listing is dated and not
  independently confirmed as Oracle's currently occupied office; the previous
  latitude 31.9678 and longitude 35.8983 were removed because no evidence
  ties them to a precise Oracle entrance. LinkedIn reports 10,001+ employees
  globally, not a Jordan headcount. The official Oracle careers portal and
  regional Generation Oracle EMEA program provide recruiting pathways, but
  no current Jordan-specific direct-employer vacancy, internship intake,
  dedicated Jordan HR email or named HR contact was verified. Search results
  for 'Oracle jobs in Jordan' largely advertise third-party employers using
  Oracle products and must not be attributed to Oracle as an employer.
  Listed technologies are Oracle products and company-wide capabilities,
  not an audited internal production stack for the Jordan operation. The
  earlier claim of an active regional Amman R&D hub is supported only by a
  historical 2014 Jordan ICT profile and is not asserted as current.
