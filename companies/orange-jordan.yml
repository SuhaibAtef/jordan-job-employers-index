notes: "Reviewed 2026-10-26. Orange Jordan is part of Orange Group and operates telecom, enterprise technology and digital payment services in Jordan. Orange Jordan's official investor-relations page explicitly directs visitors to headquarters at Abdali Boulevard entrance No. 8, and its official map link resolves to the Orange Company headquarters listing at approximately 31.9649615, 35.9052841. The corporate LinkedIn profile independently identifies Boulevard Al-Abdali, Black Iris Street, Central 1&2, Amman 11118. These are published headquarters coordinates, not an independently surveyed entrance or proof of physical occupancy. Orange's own about page reports around 1,600 employees; the Orange Group Jordan careers page says 1,200, and LinkedIn gives a broad 1,001-5,000 range. Different scopes/reporting dates may explain the discrepancy; none is an audited current headcount. No publicly verified dedicated recruitment email was found; applications should use jobs.orange.jo. The official investor-relations page names Fareez Barakat as Chief Human Resources Officer, but provides no personal HR contact address. The 2026-10-26 job search returned five listings, four marked closed and one field sales role with a future November 15 deadline; its Fresh Graduate label does not imply a software internship. Orange Jordan's company-authored publications support 5G, Ericsson core networking, cloud security, UTM/NG-IPS and a Fortinet customer implementation. Previously listed AWS, Kubernetes, OpenShift, Docker, Jenkins, GitLab CI, GitHub Actions, Ansible, Terraform, Grafana and Linux came from an individual employee portfolio rather than employer-authored production documentation; they were not retained as verified Orange Jordan internal stack. DevOps category is retained as a legacy search category, not proof of these specific tools. Full company verification remains partial because the internal engineering stack, recruitment mailbox and precise occupancy were not independently audited."
