notes: "2026-10-26 review: Petra Mobile Payment Services Company was established in 2019 and launched Orange Money in January 2020. CBJ's licensed-provider register and Orange Money's official FAQ corroborate an Abdali/The Boulevard/Black Iris Street location; Entrance 8 and the former coordinates 31.9649615,35.9052841 refer to Orange Jordan headquarters and are not independently proven to locate the separate Orange Money office, so precise coordinates were cleared. Location status confirms the published street-level address only, not physical occupancy. A 2025 sector directory reports 40 employees, consistent with the retained 11-50 range but not a current audited count. Orange Jordan LinkedIn is the parent profile; the Orange Money showcase is regional, not Jordan-specific. No dedicated HR email or current direct Orange Money internship was verified; orangemoney.care@orange.com is customer support, not recruitment. A 2026-09-28 ADSTRA AI/AML agreement is a partnership announcement, not proof of completed deployment. No internal programming language, cloud provider or production infrastructure stack was verified. An Orange Money-specific mid-level marketing vacancy was closed."
