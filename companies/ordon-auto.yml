notes: >-
  Reviewed 2026-10-26. The official company website documents the automotive
  classifieds business, founder Mohammad Al Saheb, an in-house IT team, an
  in-house marketing team and AI-assisted listing features. LinkedIn identifies
  founding year 2026, partnership type, 2-10 employees and a primary location
  around Amman's Seventh Circle (postal code 12111); the headcount is a
  platform-reported range, not audited. Neither LinkedIn nor the official
  contact page establishes a building-level office address, current occupancy
  or precise entrance coordinates. Previous coordinates 31.9539,35.9106
  were a generic Amman point and have been removed; the map link is only a
  Seventh Circle area search, not an office pin. Official pages publish
  info@ordonauto.com for general inquiries and support@ordonauto.com for
  customer support. A historical employer-branded entry-level marketing
  posting explicitly accepted applications via info@ordonauto.com but is
  closed; no current recruiting mailbox or careers portal was verified.
  The website footer says ORDON AUTO - Supply and Demand for Marketing, and
  the Apple App Store lists Supply and demand for marketing as the app
  developer; corporate registration and ownership were not independently
  established. The website and app-store listing support shipped products,
  but do not establish programming languages, cloud provider, deployment
  architecture or internal engineering stack. No active engineering job was
  found. The company remains partially verified despite the reported Amman
  presence and functioning marketplace.
