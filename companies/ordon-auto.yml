name: "Ordon Auto"
description: >-
  Ordon Auto is a Jordan-focused online automotive marketplace connecting private
  sellers, vehicle showrooms and official dealers with buyers. Its website and
  iOS/Android applications offer no-fee car and distinctive number-plate listings,
  seller contact, moderated listings, dealer storefronts and AI-assisted vehicle
  identification from uploaded photos.
