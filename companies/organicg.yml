    - "Historical OrganicG Junior Industrial Design Engineer advertisement in Amman invited fresh graduates and applications to hr@organic-g.com; LinkedIn now says applications are closed."
    - "2026 Sajjil listings under Green Culture for Agricultural Fertilizer Production (OrganicG) advertised no-experience agricultural engineering and digital marketing training-to-employment roles; their October 2026 deadlines have passed."
    - "Sajjil listed five production/packing training-to-employment places in Aqaba, posted 2026-09-14, requiring no previous experience and showing a 2026-11-14 deadline; current application acceptance was not independently confirmed."
    - "OrganicG reported welcoming trainees through the Ministry of Digital Economy and Entrepreneurship/INJAZ Training in Startups program on 2026-05-20; no new intake or currently accepting internship was verified."
notes: >-
  Reviewed 2026-10-26. Official website confirms organic fertilizers, composting
  products, educational workshops and CEO Mousa Samara. LinkedIn reports a 2024
  founding year, Amman headquarters and 2-10 employees; this is a company-profile
  estimate, not audited Jordan headcount. Official contact page lists headquarters
  only at Wasfi Al-Tal Street in Amman and a factory in Al Quwayrah Industrial
  Area; an August 2026 company article describes production in Ma'an. These
  southern-Jordan descriptions were not reconciled to a surveyed facility or
  building address. Removed prior coordinates 31.9539,35.9106, which represented
  a generic Amman point, not the company's premises. Map URL is a street search,
  not an office pin. General contact info@organic-g.com and sales phone
  +962 79 10 54321 are published on the official site. The historical company
  job advert explicitly gave hr@organic-g.com for applications, but its present
  monitoring status is unknown. Government Sajjil listings establish hiring
  history and an advertised future deadline for an Aqaba production role, not
  a confirmed currently accepting vacancy. A 2025 ZINC accelerator announcement
  reported JOD 10,000 support and one year of logistical assistance. OrganicG's
  own 2026 updates describe youth trainees and production activity. Industrial
  CAD tools appear as alternatives in a closed design job, not a verified
  production software stack; no internal IT stack or software-engineering role
  was established. Previous iot category was removed because no company IoT
  product or deployment could be corroborated. Headquarters location and
  corporate identity are supported, but exact premises, workforce, current
  recruiting availability and internal technology remain incompletely verified.
