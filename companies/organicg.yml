name: "OrganicG"
description: >-
  OrganicG is a Jordanian sustainable-agriculture and organic-fertilizer producer
  that converts organic waste into liquid and solid agricultural inputs. It
  develops fertilizer, composting and other organic growing solutions and
  conducts farmer training and environmental workshops. The company reports
  headquarters in Amman and a production facility in southern Jordan.
industry: "Sustainable agriculture / Organic fertilizer manufacturing (AgriTech)"
