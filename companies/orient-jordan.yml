notes: >-
  Reviewed 2026-10-26. The official contact page and company-profile PDF
  independently repeat the company's own Gardens Street, Waha Ammoun Building,
  seventh-floor Amman address; this is a published address, not independent
  confirmation of present physical occupancy. Removed the prior coordinates
  31.98574,35.88051 because no reliable evidence tied that point to the
  company's office. The map URL is an address search, not a surveyed pin.
  The official site publishes general/management contact gm@orientjordan.com,
  +962 6 2000519 and +962 79 9640590. Company-authored medical recruitment
  advertisements give hr@orientjordan.com for candidate applications; the
  mailbox is a recruitment contact, not proof of a dedicated internal HR team
  or active monitoring. A LinkedIn company profile using orientjordan.com
  reports 11-50 employees, founded 2016 and Abu Dhabi as its primary location;
  these company-reported figures do not establish Jordan headcount or the
  legal relationship between UAE and Jordan offices. The website displays
  many medical job advertisements for third-party hospitals and clinics in
  the UAE, Saudi Arabia, Qatar and Kuwait. Listings generally lack reliably
  visible publication dates or deadlines, so current acceptance is not
  confirmed. These are client vacancies, not evidence that Orient Jordan is
  directly hiring employees or offering entry-level jobs or internships.
  No independently supported programming languages, internal production
  technology stack or software-engineering recruitment was found. Removed
  the earlier web category because a public website/WordPress installation
  does not establish that the employer recruits or develops web technology.
  Company operations, exact occupancy, employee size and direct-employer
  recruitment remain only partially verified.
