name: "Orient Jordan"
description: >-
  Orient Jordan is a recruitment consultancy and HR services business with a
  company-published office in Amman. It sources specialized personnel for
  employers across the Middle East, particularly medical professionals for
  hospitals and clinics in Gulf countries, and describes candidate screening,
  recruitment coordination and workforce placement services.
