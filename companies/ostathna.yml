notes: >-
  Reviewed 2026-10-27. The currently accessible official website describes
  on-demand online academic help, 24/7 tutor access, school support, educational
  guidance and inclusive learning services. The official terms of service name
  Ostathna, Inc. and publish Khalda, 224 Wasfi Al Tal Street, Jerusalem Centre,
  Amman, info@ostathna.com and +962 777 626232. A LinkedIn profile titled
  Ostath links to ostathna.com and lists 224 Wasfi Al Tal Street, Jerusalem
  Centre, third floor, Amman; it reports founding in 2020 and one employee.
  The JordanYP directory, explicitly marked an unverified listing, reports
  1-10 employees and the same street and telephone. The retained 1-10 size is
  therefore an approximate historical directory estimate, not audited current
  headcount. The company-published street address is not independent evidence
  of current occupancy; previous coordinates 31.99357,35.86058 were removed
  because no reliable source tied them to the precise occupied premises. The
  replacement map URL searches the published address, not a surveyed office
  pin. info@ostathna.com is a general contact from the official terms, not
  a verified HR or applications mailbox. No dedicated careers page, active
  employer job advertisement, internship, graduate program or early-career
  hiring intake was established. The online platform is a documented product
  capability, not evidence of its internal programming languages, frameworks,
  cloud provider or production stack. The similar-sounding Ostathi Jordan
  (jo.ostathi.com) is a different platform and its workforce, address and
  recruitment details must not be attributed to Ostathna. Company activity
  and published contact details are supported, but current staffing, exact
  physical occupancy and direct-employer recruitment remain unverified.
