notes: >-
  Reviewed 2026-10-27. The official about and contact pages describe smart
  automation, access control, AI as a marketed service, industrial automation,
  low-voltage systems and Jordan contact numbers +962 799 860 869 and
  +962 6 55 111 89. LinkedIn matches the official oxgn-grp.com domain,
  identifies Amman/Zahran headquarters, reports founding in 2016 and gives a
  company-reported 11-50 employee range; no audited Jordan headcount was found.
  The official contact page gives PO Box 2154, Amman 11953, not a street
  address. A 2026 advertiser listing and a separate business directory
  identify Zahran Street, building 194/194 A, Um Uthaina; this is a
  third-party-reported location and physical occupancy and entrance were not
  independently confirmed. Previous coordinates 31.95672,35.92519 were
  removed because their connection to occupied premises was not established.
  The map URL is an address search, not a verified entrance pin.
  info@oxgn-grp.com is the official general contact and was explicitly
  published for CV submissions in company-authored LinkedIn recruitment
  posts; it is not a dedicated HR mailbox. A recent Sales Engineer post
  sought 3-5 years of experience; its application status on the review date
  is unknown. Older company-authored posts invited fresh graduates for
  technical engineering and IT support, and a former intern described
  KNX-based training, but no current internship or junior intake was found.
  BMS, CCTV and automation are documented offerings, not proof of specific
  internal software tools. A former intern's KNX account is historical;
  the earlier unqualified PLC/SCADA claim could not be corroborated and was
  removed. AI is an advertised service claim, not a verified deployed model
  or internal AI engineering stack. No dedicated careers page was confirmed.
  Jordan business operations are supported, but exact office occupancy,
  current hiring, internal stack and employee count remain incompletely
  verified.
