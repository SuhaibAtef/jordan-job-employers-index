notes: >-
  Reviewed 2026-10-27. Official website currently presents PandoSoft as an AI-native
  engineering studio in Amman, advertising rapid MVP delivery and product engineering;
  these are company claims, not independent confirmation of every product or AI tool.
  LinkedIn lists 11-50 employees (platform estimate, not audited Jordan headcount).
  The historical company contact page and third-party business listings place the
  office on the fourth floor of Al Ghaith Center on Mecca Street; the previously
  corroborated business-map pin is retained, but current physical occupancy and
  precise entrance coordinates were not independently inspected. Current official
  contact page publishes hello@pando-soft.com and +962 6 582 2112 for general
  inquiries, not a dedicated HR mailbox. Client interviews published by Clutch
  document JavaScript, AWS, Flutter and Figma for SYGMA; Vue.js, Firebase and Google
  Cloud for ABN Pay; Odoo for an ERP project; and HTML/CSS for a web project.
  These are historical client-project technologies, not proof that all remain in
  current internal use. No current employer-authored vacancy, internship, graduate
  intake or dedicated careers page was confirmed; no early-career hiring signal
  is asserted. Full company verification remains incomplete despite the location
  listing being corroborated.
