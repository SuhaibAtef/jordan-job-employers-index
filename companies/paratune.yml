notes: >-
  Reviewed 2026-10-27. Official site describes custom software, web/mobile apps,
  e-commerce, ERP/Odoo, digital marketing, outsourcing and IT consulting; the
  about page describes Jordan headquarters and distributed operations in India
  and Pakistan. LinkedIn reports 11-50 employees globally (company-reported
  range, not audited Jordan headcount), founded 2018, and lists a primary
  address on Amr bin Malek Street in Um Al Summaq. The official site instead
  publishes Hosni Sober Street, International Complex 47, first floor near
  8th Circle. The official address is retained, but this discrepancy and the
  absence of independently corroborated current building occupancy mean the
  office is provided_unverified. Prior coordinates 31.954152, 35.839406 were
  removed because an exact business entrance could not be confirmed; the map
  URL is an address search, not a verified pin. The official contact page
  publishes info@paratune.com and +962790856360 / +962777719040 for general
  inquiries; no dedicated recruitment mailbox is established. The official
  careers portal currently advertises a remote internship (deadline
  2026-12-30), remote Backend Developer (Laravel) (deadline 2027-01-01), and
  Amman hybrid QA Specialist (deadline 2027-01-07), each with an Apply Now
  control; successful application submission was not tested. Internship
  eligibility for applicants based in Jordan is unspecified. The Laravel
  advertisement explicitly requires PHP, Laravel and MySQL/MariaDB and
  mentions Git; the official company site advertises Flutter and Odoo.
  These are supported services or hiring requirements, not proof that every
  listed technology is currently deployed in production. Full company
  verification remains partial due to unconfirmed current occupancy,
  independently audited headcount and direct HR contact.
