name: "PayTabs"
description: >-
  Riyadh-headquartered payments infrastructure provider serving merchants and
  financial institutions across MENA, including Jordan. Its services include
  online payment gateways, payment links, invoicing, payment orchestration,
  merchant APIs and mobile SDKs; its MEPS partnership supports Jordanian
  contactless SoftPOS acceptance.
