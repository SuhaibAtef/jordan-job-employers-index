notes: >-
  Reviewed 2026-10-27. PayTabs' official Jordan payment-gateway page documents
  merchant payments, PayLinks, invoicing, repeat billing, APIs and mobile SDKs.
  Its 2023 company announcement confirms a MEPS partnership to bring the
  Android-based MEPS FAST SoftPOS solution to Jordan; the 2026-04-30 official
  Labour Day article describes Jordan as a technology-talent and developer hub.
  LinkedIn lists Amman among PayTabs' locations and 201-500 employees globally,
  with Riyadh as headquarters; this is not a Jordan headcount. The 2025
  corporate profile distinguishes dedicated offices in KSA/UAE from presence
  in Jordan. The former Edgo Atrium, Rafic Hariri Street, 2nd-floor address
  could not be connected to PayTabs by a current company-authored source;
  search results describe coworking offices at that address instead. The
  previous coordinates 31.9607134, 35.9162568 were therefore removed; the
  Amman location is approximate, not a verified office entrance. The careers
  page publicly solicits applicants and provides an obfuscated contact email,
  but its vacancy list requires JavaScript and the mailbox could not be
  independently read as a valid HR address. No dedicated Jordan recruitment
  email or currently accepting Jordan-specific internship or vacancy was
  verified. The 2026-04-30 regional fresh-graduate invitation supports a
  general early-career signal, not an open Jordan role; a 2025 Saudi internship
  is explicitly outside Jordan. Official technical documentation confirms
  PayTabs' Android and Flutter integration SDKs, APIs and payment solutions,
  not the languages or cloud infrastructure used by its Jordan engineering
  team. Previous Go, Redis, SQL Server and Google Cloud assertions lacked
  sufficiently attributable current company-level evidence and were removed;
  'devops' category likewise lacked substantiation. Full company verification
  remains partial because precise Jordan office occupancy, local headcount,
  current Jordan recruitment and internal engineering stack are unconfirmed.
