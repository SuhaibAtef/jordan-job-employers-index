notes: >-
  Reviewed 2026-10-27. The company website describes recruitment, headhunting,
  candidate sourcing, document attestation and Saudi visa assistance; its about
  page states operations began in 2005. LinkedIn corroborates Amman operations,
  the 2005 founding year, and a self-reported 11-50 employee range, not an
  independently audited current headcount; third-party directories provide
  differing smaller estimates. The official contact page publishes
  contact@petrarecruitment.com and +962 6 565 7280 as general contact details,
  but no dedicated HR/recruitment mailbox for jobs at Petra itself was found.
  The official website publishes the Building 148, fourth-floor address,
  corroborated by independent business directories; present occupancy has not
  been independently inspected. Retained coordinates 31.99088, 35.86977 are
  approximate geocoding of the reported building, broadly consistent with a
  third-party map listing at 31.99093, 35.86947, not surveyed entrance
  coordinates. The job-seeker portal accepts CV uploads and lists positions
  for client employers, but visible postings date to 2016-2017; these are not
  evidence of currently accepting vacancies or direct Petra staff recruitment.
  No current Petra-specific graduate intake, internship or software-engineering
  role was corroborated. The prior web category was removed: operating a job
  board does not establish an internal software engineering practice or stack.
  No programming languages, cloud services or production technologies were
  independently verified. Company verification remains partial, separate from
  the unverified physical location.
