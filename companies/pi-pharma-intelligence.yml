notes: >-
  Reviewed 2026-10-27. Official website documents Pi Insight, pharmaceutical
  analytics, contact email insight@pipharmaintelligence.com, telephone
  +962 77777 36 99, and 168-B Dabouq Complex on King Abdullah Street.
  Company LinkedIn independently repeats the building and lists Amman as
  headquarters, founding year 2018 and a self-reported 11-50 employee range;
  DHArab's older 2024 profile says 20+ employees. Exact office occupancy
  and entrance coordinates were not independently inspected. The previous
  31.9539, 35.9106 coordinates were generic central-Amman coordinates and
  were removed; map URL is an address search, not a verified pin. Official
  contact page gives postal code 11821, whereas LinkedIn gives 19154, so
  no postal code is asserted in the address field. The company careers page
  describes its work environment and invites applications, but no dated,
  currently accepting vacancy was established. A 2022 official university
  partnership announced internships for IT, AI and pharmacy candidates,
  and the company reported participation in an August 2026 graduate job fair;
  these are historical early-career signals, not confirmed current intake.
  A historical recruiter-authored Web Graphic Designer advertisement directed
  CVs to hr@pipharmaintelligence.com; the mailbox's current monitoring is
  unconfirmed. WIPO's 2025 case study documents AI use to harmonize pharma
  data, but no production language, cloud provider or full internal software
  stack was independently established. Previous Laravel entry was removed:
  a website search-result title mentioning Laravel does not substantiate
  the company's internal production stack. Company verification is partial
  and is separate from the location status.
