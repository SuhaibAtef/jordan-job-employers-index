  partner directory independently lists Pinnacle Innovation IT Consulting in
  Amman and publishes sales@pijordan.com. LinkedIn reports 2-10 employees and
  founding year 2003; these are company-profile figures, not audited headcount.
  The official contact page publishes 165 Mecca Street and info@pijordan.com,
  which is a general contact, not a verified HR mailbox. The building/entrance
  and current occupancy have not been independently confirmed, so old generic
  Amman coordinates were removed. The official jobs portal displayed open
  application forms for trainee and junior positions at review, but live
  acceptance and remaining places were not independently tested. The junior
  developer description contains template text and an '[Insert Deadline]'
  placeholder; no valid closing date can be inferred. Python and Odoo are
  supported by the junior vacancy; PostgreSQL, JavaScript and Docker by the
  senior developer requirements. Oracle NetSuite, SAP, Microsoft Dynamics 365,
  and Sinfosy IoT are advertised partner/service technologies, not verified
  internal production deployments. No reliable evidence established AWS,
  Azure or Google Cloud use; these claims were removed.
