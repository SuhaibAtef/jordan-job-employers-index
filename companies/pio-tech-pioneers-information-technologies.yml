notes: >-
  Official products and LinkedIn establish banking software, analytics, compliance and regional systems integration; founded 2003 per company LinkedIn. LinkedIn's 51-200 employee range is company-reported, not an independently audited Jordan headcount. Official privacy policy and LinkedIn both publish 348 Wasfi Al Tal Street, while the prior YAML listed 342; the 348 address is retained as company-provided, not independently confirmed occupancy. Prior coordinates 31.996855, 35.836975 were removed because they could not be tied reliably to the published building entrance. The careers page showed the Data Analytics & ETL Specialist role, but undated older individual job URLs may remain accessible after removal from the vacancy index. The 1-3-year Application Consultant role supports historical early-career hiring, not a currently open internship. hr@pio-tech.com is an employer-published recruitment mailbox; current acceptance of applications is not independently established. AI/ML and RPA are advertised product capabilities; Power BI, SQL/PLSQL, Oracle, SQL Server and ETL are recruitment requirements; C#/.NET and ASP.NET MVC come from an undated senior-developer posting, not a verified inventory of live infrastructure. No unsupported DevOps or cybersecurity-stack claim is retained. A 2026 award is mentioned on LinkedIn but does not independently establish company verification.
