notes: "Official site and matching LinkedIn profile establish 2009 founding, Amman headquarters, Microsoft Dynamics ERP consulting, and a company-reported 11-50 employee range (not an audited Jordan headcount). The company LinkedIn page now displays 'Raneem IT Services - Pioneers IT & Business consulting' and links raneemit.com; do not confuse it with the unrelated Jeddah-headquartered pioneersit.com company. The official website announced an office relocation on 2025-10-08, without publishing a new street address; the previous Muhammad Suleiman Street address and coordinates could not be substantiated as the current office and were removed. The official site lists founder/business contact fkarajeh@pioneersconsult.com and Amman phone +962 79 505 3602; neither establishes a dedicated HR mailbox. Dynamics 365 and Dynamics AX are documented company offerings; JavaScript, HTML and CSS are requirements in an employer-associated senior web-developer advertisement, not confirmed current production stack. The company's LinkedIn page reported participation in the Tariqi practical QA training initiative in October 2026, but no direct internship or graduate hiring intake was established. No verified dedicated careers portal or currently accepting applications were established."
