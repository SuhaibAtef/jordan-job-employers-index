notes: "The official website and privacy policy (updated 2026-06-30) identify a Jordan affiliate, Smart Stadium for Sports Reservations, LLC, at King Hussein Business Park, Building 23, Amman, with Jordan phone +962 79 773 3559. Current physical occupancy and the exact building entrance were not independently confirmed. The former coordinates (31.97183, 35.83394) were removed because no Playgeko-specific map pin substantiates them; the map now searches the published address. A Jordanian official-gazette filing dated 2024-12-30 independently identifies Smart Stadium for Sports Reservations as a Jordanian LLC but records an AlRamadi Street applicant address; this historical filing does not establish the current office. Playgeko LinkedIn reports Dubai headquarters, Dubai and Ramallah locations (no Amman location), 2024 founding and 2-10 employees; Clutch lists Amman and 2-9 employees. Size 2-10 is a platform-reported global range, not an audited Jordan headcount. Official contact hello@playgeko.com is a general/business mailbox, not a confirmed HR contact. Official privacy policy explicitly names Supabase (database/authentication), HyperPay (payments), Resend (email) and Cloudflare (infrastructure/hosting) as service providers. The product site advertises iOS/Android apps, API integrations and AI-powered analytics/automation, but does not identify internal programming languages or frameworks; the previous 'REST API' assertion was not independently substantiated. The historical 2025 Playsonic Community Manager advertisement is marked closed, and no currently accepting vacancy, dedicated careers portal, internship or graduate intake was verified."
