notes: "Official website and company LinkedIn corroborate the Sweileh headquarters at Ahmed Al Dalahmeh Street, Building 9; the official site gives postal code 11814 and telephone +962 6 551 0025. The Jordan ICT association int@j and third-party directories instead show Building 11, so the exact building number and current occupancy are not independently resolved. Previous coordinates (31.99915, 35.82995) were removed because a nearby directory pin cannot establish the company's present entrance; map search now uses the official address. LinkedIn reports 51-200 employees and founding in 2010; the official company profile claims more than 125 team members and a regional presence, but these are unaudited and not a Jordan-only headcount. HR@polaris-tek.com is supported by an employer-authored LinkedIn HR Manager hiring post; other recent technical vacancies direct applications to the general info@polaris-tek.com mailbox. No dedicated careers page or current internship intake was verified. The official service portfolio names AWS, Mendix, Oracle, Veeam and VMware as technologies/competencies, not proof of every internal deployment. Python, Apache Spark, Apache Airflow, Apache Kafka and PostgreSQL are supported by company-authored job requirements and should not be read as a fully confirmed production stack. The older note's Mendix Top Cloud Partner MEA FY21 and Oracle Field Delivery Partner claims appear on the official home page but are historical partner claims."
