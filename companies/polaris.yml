    - "Employer LinkedIn recruitment announcements visible in October 2026 sought an on-site Amman Senior Back-End Developer (5+ years, Python), a Senior Data Engineer (5+ years, Spark/Airflow/Kafka), and Senior Mendix Developers in Jordan; CVs requested at info@polaris-tek.com. Posting dates are relative on LinkedIn and application acceptance was not independently tested."
