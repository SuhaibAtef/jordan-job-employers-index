notes: "Foodics' official January 9, 2022 release confirms its full acquisition of POSRocket; an investor portfolio also records the exit. LinkedIn still labels POSRocket 'A Foodics company', reports an 11-50 employee range and lists 5th Floor, Office 502, Madina Munawara Street, Amman. This is not an audited 2026 headcount or proof of an operating independent office. Historical POSRocket directory records (reviewed in 2022) instead identify Building 158, Hijaz Towers, 2nd Floor, Office 205, Mecca Street; Foodics' current official Jordan contact page lists Alhijaz Tower, Mecca Street, 4th floor. Those addresses and floors must not be conflated. The old coordinate pin (31.9759337, 35.8610484) refers to a Foodics-linked map listing and cannot verify POSRocket's current occupancy; coordinates and exact address were cleared, with Amman retained only as a historical approximate location. The POSRocket website and contact page were inaccessible during the 2026-10-27 check, so website is a historical identifier rather than a verified active site. No POSRocket HR mailbox or dedicated current careers page was confirmed; the careers_url links to parent Foodics only. The prior DrJobs internship claim could not be dated or confirmed as a current POSRocket opportunity and is not counted as an active early-career signal. Technologies describe pre-acquisition work, not a confirmed 2026 production stack: an AWS cloud partner case study documents AWS and Amazon EKS/Kubernetes infrastructure around 2022; a former engineer's 2017-2018 CV documents Python, Django, PostgreSQL, MongoDB and React Native; former developer profiles support iOS and Android engineering activity. Independent POSRocket staffing and post-acquisition engineering operations remain unverified."
