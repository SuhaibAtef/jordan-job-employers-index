notes: "Cloud-based POS for restaurants/retailers; founded 2016 in Amman by Zeid Husban; acquired by Foodics (Jan 2022); a DrJobs listing showed a Software Engineer internship in Amman. No verified street-level office address; LinkedIn and HR email not verifiable. Tech stack cleared — listed items (Go/XML/Selenium/Moodle/Omniture) untraceable to any listed source. GPS remains approximation; no current office address (acquired by Foodics Jan 2022). posrocket.com fetch on 2026-10-03 returned an upstream error; treat website as unverified. | stack verified 2026-10-04: 4 employee profiles (iOS engineer, Android developer, frontend/React developer, back-end associate at POSRocket) + founder interview: cloud POS hosted on Amazon servers. GPS-2026-10-04 (attempt 1): live-browser deep check. posrocket.com is dead (Cloudflare origin DNS error, no redirect to Foodics). No POSRocket Google Maps listing exists — 'POSRocket Amman' resolves to acquirer Foodics Jordan, 'Mecca St. 158, Amman' (pin 31.9759337, 35.8610484), a claimed, well-maintained listing (48 reviews, owner photos, foodics.com) — that is Foodics' office, not POSRocket's. 'Hijaz Towers' is a separate, unclaimed Business-center listing ~100-130m away (pin 31.9768329, 35.8618503) with plus-code-only address label; directories (PitchBook/Mergr/CB Insights/TwoInstitute) conflated Foodics' street number with Hijaz Towers. POSRocket's own LinkedIn page lists primary location as 5th Floor, Office 502, Madina Munawara Street, Amman 11181 (different street), but no verifiable pin coordinates exist for it. Kept city-center fallback pin, approx_location=true; NOT verified. GPS-2026-10-04 (attempt 2): VERIFIED. POSRocket's own official contact page (posrocket.com/contact-us, Wayback snapshot 2022-01-26) lists 'Building No. 158, Hijaz Towers, 2nd Floor, Office no. 205, Mecca Street, Amman, Jordan' (+962 6 200 55 88) — corroborated by jordanyp.com verified listing, craft.co, CB Insights, Mergr, RocketReach, TwoInstitute (all same address). Building pin confirmed by claimed/owner-managed 'Foodics Jordan' Maps listing (48 reviews, foodics.com link) at Mecca St. 158 (31.9759337, 35.8610484) + Foodics' own site placing their Jordan office in Alhijaz Tower, Mecca Street. LinkedIn's 'Madina Munawara St., Office 502' appears only on LinkedIn and its scrapes; the company's own contact page wins."
