notes: "Review 2026-10-27: The official PostaPlus MYBOX contact page identifies a Jordan office at Mecca Street, Al Haraneh Complex, Building 150, fourth floor, office 407, Amman (+962 6 400 1881). An independent directory repeats this address and offers coordinates (31.9753666, 35.8621943), but no authoritative building-level map pin or confirmation of present occupancy was found; removed the previous city-centre fallback coordinates. A historical LinkedIn Posta Plus support/implementation engineer vacancy in Amman (approximately 2023, now closed) cited King Hussein Business Park, which may have been a separate or former workplace. Current LinkedIn profile lists 201-500 employees globally and headquarters in Kuwait City; its current overview emphasizes Kuwait, UAE and Bahrain operations, so the extent of present Jordan staffing is unclear. Official site offers a general career application page, but no current Jordan vacancy or dedicated HR email was verified. Historical employee profiles referenced C#, .NET Framework/.NET Core (2018-2020) and Flutter (2023-2025); these are historical stack signals, not independently confirmed present deployments. Posta Plus and MYBOX consumer apps are published; a historical engineering vacancy mentioned Oracle SQL/PLSQL, Windows Server and ERP support, but those requirements do not establish the currently deployed stack. Partial company verification; location address is company-provided, not independently geocoded."
