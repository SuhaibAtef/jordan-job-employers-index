notes: "Reviewed 2026-10-27. PSUT's official website confirms its Khalil Saket Street, Al-Jubeiha campus address and general email info@psut.edu.jo; Google Maps independently identifies the university at the same street, and third-party campus coordinates are approximately 32.02344, 35.87622. These are campus-level coordinates, not a surveyed building entrance. LinkedIn lists 201-500 employees for the institution (not a verified Jordan headcount). The Careers at PSUT LinkedIn page points to jobs.psut.edu.jo and advertises university staff and academic vacancies in 2026, including a .NET Core full-stack developer recruitment post mentioning ASP.NET Core, C#, HTML, CSS and JavaScript. Those technologies are hiring requirements, NOT proof of the university's deployed production stack. The careers portal timed out during this review, so individual vacancies and current application deadlines were not independently confirmed. The university's career guidance office offers student/alumni training, internships and employer networking, but that does not demonstrate entry-level employment at PSUT itself. info@psut.edu.jo is a general contact, not a verified HR mailbox; no dedicated recruitment email was confirmed. Earlier Firebase and Flutter entries originated from student/training material and were removed as unsupported internal-stack claims. Company verification remains partial despite verified campus location."
