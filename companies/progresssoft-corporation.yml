notes: >-
  Reviewed 2026-10-27. Official company contact page lists the Jordan headquarters at
  51 S. B. A. Waqqas Street, Amman 11941, and embeds a Google Maps place pin at
  31.96859668, 35.87727202; company LinkedIn independently repeats the address.
  Location status refers to this headquarters pin, not every office. LinkedIn lists
  501-1,000 employees globally, not Jordan-specific headcount. Official careers page
  and Workable recruitment board are active. A Workable Associate Support Engineers -
  Induction role in Amman, posted 2026-09-23, explicitly targets fresh graduates with
  up to one year of experience. The company's internship page describes 4-8 week
  summer placements, including software development, DevOps, security and AI;
  availability for a particular application cycle should be checked on Workable.
  Its 2026 Java Developer and support-engineer postings mention Java, Spring,
  Hibernate, SQL, Maven, Tomcat, Git, PostgreSQL, Docker and Kubernetes as job
  requirements, not a verified inventory of deployed infrastructure. Previous
  unsourced Apache Airflow, Nginx, Python, PyTorch, TensorFlow and Spring Boot
  entries were omitted pending direct evidence. No dedicated public HR email
  was confirmed; third-party info@progressoft.com is a general contact only.
  Company identity, address and hiring pathways are supported, but exact deployed
  stack and direct recruiting contact remain incomplete; company status is partial.
