notes: "Reviewed 2026-10-27. The official PROSYS website identifies the company as a Jordan-based ERP and media-applications vendor established in 2005 and gives its Jordan main office as 3rd floor, Sonnqrot Building, King Abdullah II Street, Amman (telephone +962 6 5601550). LinkedIn independently matches the company name, website, founding year and Amman headquarters, and reports 11-50 employees (company-wide, not an Amman headcount). However, LinkedIn lists Wasfi Al-Tall Street, Tabbah Complex, while the current Odoo partner directory lists Al-Madina Al-Tibbiyya Street. These conflicting street/building addresses prevent independent verification of a precise current office location; previous coordinates 31.966372,35.843045 were removed because they were not supported by a verified building pin. The official site describes ERP, CRM, media and mobile solutions; the Odoo partner directory identifies PROSYS as an Odoo implementation partner. Historical company-attributed job advertisements from March and July 2020 mention .NET/ASP.NET MVC, API technologies, SQL, JavaScript/jQuery, Android and React Native, and the March posting welcomed fresh graduates. Those technology signals are historical recruiting evidence, not proof of a current deployed stack or open vacancies. No current PROSYS Jordan vacancy, official careers portal or dedicated HR email was verified. The official site lists general/support contacts, but these are not labeled HR. Company verification remains partial because current hiring, production stack and exact office pin are unresolved."
