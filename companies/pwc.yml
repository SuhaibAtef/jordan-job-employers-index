notes: >-
  Reviewed 2026-10-28. PwC's official Jordan office page confirms the Third
  Circle, Jabal Amman address and general phone +962 (0)6 500 1300; this
  verifies the office address, not the exact position of the retained
  approximate geocoded map coordinates. The official PwC Middle East careers
  portal currently displays an Amman Junior AI Developer/Associate vacancy
  dated 2026-10-20, a Senior AI Engineer vacancy dated 2026-10-15 and an IT
  Project Manager vacancy dated 2026-10-07, each with an Apply now link.
  The six-month Digital & Cyber Internship Programme dated 2026-09-23
  explicitly says the position has been filled; it is historical early-career
  evidence, not an open internship. Current junior and senior AI role
  requirements mention Python, FastAPI, Azure, RAG, SQL, Docker and related
  engineering skills; these are advertised requirements, not an audit of the
  firm's deployed technology stack. Salesforce is retained from earlier
  Jordan job research but current usage was not independently reconfirmed.
  LinkedIn lists PwC Middle East at 10,001+ employees, consistent with PwC's
  statement of over 12,000 people across the region; this is not a Jordan-only
  headcount. A 2021-2022 AmCham directory reported over 600 Jordan staff,
  but no current Jordan-specific count was established. No dedicated HR
  recruitment email was verified; applications use the official portal.
  Company verification remains partial because Jordan staffing, exact
  coordinates and internal implementation details are not confirmed.
