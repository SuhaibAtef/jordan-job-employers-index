notes: "Reviewed 2026-10-28. Qawn is a digital-banking product/venture of Jordan Ahli Bank, not an independently verified separate licensed employer. Its official website and LinkedIn confirm chat payments, transfers, CliQ and Qawn AI; Jordan Ahli Bank's 2023 launch announcement confirms remote onboarding and CliQ. Thought Machine's 2023 vendor announcement confirms Vault Core, while Mastercard's 2025-09-22 Start Path announcement independently names Qawn among the cohort. The official Qawn contact page lists Qawn Bank, Al Shmeisani, Amman, and customer support +96262222462; it does not supply a street/building number, dedicated HR email or precise coordinates. Earlier 31.9539,35.9106 was an Amman-area placeholder, not evidence of Qawn's office, so coordinates and map link were cleared. LinkedIn reports 11-50 employees, which is self-reported and may include roles outside Jordan. The parent bank's careers site is provided only as an associated recruitment route, not a dedicated Qawn jobs portal. The March 2026 parent-bank DevOps advertisement explicitly mentions supporting QAWN and lists AWS, Terraform, Docker and Kubernetes as requirements, not a deployment audit. Existing Flutter, Git, Java, Kotlin and Swift claims came from a historical mobile engineer profile or general Jordan Ahli Bank vacancy, not direct Qawn production-stack evidence, and are retained only with qualifications. Both identified Qawn-related vacancies are closed. Parent-bank student programs do not establish a Qawn-specific internship. Partial status reflects unconfirmed distinct legal employer identity, precise office location, independent staffing, HR contact, active recruitment and complete technology stack."
