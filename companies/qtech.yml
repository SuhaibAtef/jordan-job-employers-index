notes: 'Reviewed 2026-10-29. QTech/QTech Networks is an Amman-founded digital agency (official company history says founded
  1999; an older directory said 1998) with Amman, Dubai and London offices. The currently functioning official Jordan
  website is qtechnetworks.com/jo/; the older qtech.com.jo URL timed out on review and is retained as historical evidence.
  The official Jordan contact page identifies Rabieh, Al-Laith Complex, Building 82, and its footer says Kabul Street,
  Amman; +962 79 7391324 and info@qtechnetworks.com are general commercial contacts, not HR. Its Map link resolves to
  the QTech Networks Google Maps place at 31.986402,35.8797143, and Clutch lists Kabul Street, Amman 11821. The previous
  city-centre maps_url search (31.9539,35.9106) was a mismatched placeholder and has been corrected without changing
  the supported pin coordinates. There is still a material address discrepancy: QTech LinkedIn lists Wasfi Altell Street
  and the official UAE regional contact page lists Wasfi AlTal Street, AlFaiha Complex, Building 82, and a different
  phone. Current Jordan page plus its map link support the Rabieh/Kabul address, but no on-site inspection or independent
  entrance geocode was completed; location confidence is qualified. LinkedIn self-reports 11-50 employees and London
  headquarters, while Clutch lists 10-49 employees and Amman as headquarters; these are platform-specific estimates,
  not an audited Jordan headcount. The company advertises Laravel, Flutter and React on its own website. .NET, Android
  and Strapi were retained from prior research and third-party service listings; Clutch also lists .NET and Android.
  None is a production-stack audit. The employer-attributed LinkedIn Graphic Designer advertisement is closed, marked
  entry-level, and provides a historical role-specific CV contact l.hmoud@qtechnetworks.com; do not assume this address
  is a general HR mailbox or that the vacancy remains open. No current QTech job, internship, dedicated careers page
  or general recruitment email was verified. Distinguish this QTech Networks profile from the unrelated QTech Smarter
  Life and QODRATech listings. Company verification remains partial despite the supported location pin.'
