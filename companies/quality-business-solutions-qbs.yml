notes: >-
  Reviewed 2026-10-29. QBS is a Jordanian IT consultancy and software provider
  (founded 2009 according to its official history, LinkedIn and intaj), active
  in enterprise integration, BI, custom software, portals, workflow and
  government-sector transformation. Its current official site advertises
  Nabadat, Adaa, Legal Management Suite, KBT and QCare, as well as 50+ employees;
  these are company-published claims. LinkedIn lists 11-50 employees and intaj
  lists 25-49; no independently audited headcount or Jordan-only count was found.
  The old area value Ajloun was inconsistent with all Amman evidence and has
  been corrected to Shmeisani, Amman. LinkedIn lists 70 Esam Ajlouni Street,
  Shmeisani, while the Jordan ICT association intaj lists 91 Queen Rania Street;
  whether these represent old/new premises is unknown. The old latitude
  31.97207 and longitude 35.90601 were a generic coordinate search rather
  than a corroborated office entrance, so coordinates and its placeholder map
  URL were cleared. Location is not fully verified. The 2026-08-01 Iron
  Software customer case study quotes a named QBS solutions architect and
  describes IronPDF in a C#/.NET government-reporting implementation, supporting
  these technologies as vendor-reported project evidence, not a full stack
  inventory. Microsoft 365 and REST API are retained from earlier research
  with no independent production verification; a QBS LinkedIn post mentions
  Power BI as a product capability without proving deployment. The 2026
  employer-attributed Technical Writer advertisement directed applicants to
  careers@qbs.jo; this is a historically evidenced recruitment address, not
  a guarantee that it remains monitored. The 2025 IT Support Engineer and
  2024 Quality Assurance advertisements sought 0-1 and 0-2 years of experience,
  respectively, supporting historical early-career hiring, not an internship.
  No currently accepting vacancy, dedicated careers portal or internship was
  confirmed. Partial company verification is appropriate because precise
  location, live recruitment, headcount and complete production stack remain
  unconfirmed. Do not confuse this Jordan QBS (qbs.jo) with unrelated QBS
  employers in Egypt or the United States.
