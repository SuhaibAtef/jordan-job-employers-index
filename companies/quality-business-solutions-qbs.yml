  Amman-based IT services and consulting company founded in 2009. QBS develops
  custom software, enterprise integrations, business-intelligence systems,
  web portals and workflow automation for government and commercial clients.
  Its company-published products include Nabadat customer-experience analytics,
  Adaa strategy management and QCare patient-engagement software.
