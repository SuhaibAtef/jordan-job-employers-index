notes: "First company-level review 2026-10-29. RABABA Games' LinkedIn profile describes a privately held Jordanian game studio founded in 2013, headquartered at Yajouz Road, Caracas Center, Office 302, Al Jubayha, Amman. The developer's Google Play listing independently repeats Caracas Center, Al Jubayha/Yajouz Road and publishes info@rababagames.com and +962 7 7757 9924 as game/app support contact information; info@rababagames.com is NOT a verified HR or recruitment mailbox, so hr_email is null. The official company domain was inaccessible to the research crawler (HTTP 403), and no active careers page or 2026 vacancy was verified. Sony's PlayStation Store and Google Play list HAJWALA under RABABA Games/RABABA Design Establishment, corroborating console and Android distribution; the 2024 CEO interview also mentions iOS. LinkedIn reports 11-50 employees, while CEO Hussam Alnatour estimated about 15 employees in Jordan in October 2024; neither is a current audited count. The same 2024 interview says RABABA collaborates with universities and offers internships, but does not confirm current availability. Employer-published LinkedIn posts from approximately 2021 describe 3D Artist, Unity/C# Game Developer and Rigger/Animator roles; one job listing explicitly says applications are closed. Unity and C# are evidenced as historical hiring requirements rather than an audited production stack. The original coordinate pair is preserved for continuity, but its accuracy and the exact office entrance were not independently confirmed, so the location remains provided_unverified. Company-level verification remains partial."
