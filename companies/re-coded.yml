notes: "First company-level verification on 2026-10-29. Re:Coded is a US 501(c)(3) nonprofit, founded in 2016 according to its current official About page; its LinkedIn profile is categorized as Education and headquartered in New York, not Amman. A 2023-07-17 official announcement confirms an EKTA Foundation partnership to train 370 people in Jordan, with full-stack web development, mentorship, job coaching and job readiness. A historical company LinkedIn advertisement specifies HTML, CSS, JavaScript, React, Node.js and SQL/NoSQL databases for the Jordan bootcamp, with an August 2023 application deadline. Existing Docker, MongoDB, JavaScript, Node.js and SQL technologies are preserved as historical training-curriculum references, NOT evidence of Re:Coded's internal production stack; React, HTML and CSS are likewise curriculum technologies. Re:Coded's 2026 official About page states the organization wound down coding bootcamps in 2024 and relaunched AI fluency/digital skills programs in 2025; its current impact page reports an 87% historical placement rate, superseding the older 92% claim in the 2023 announcement (different cohorts/time periods). A 2026-10-20 official post advertises a free Source Code Accelerator with a 2026-11-15 application deadline, but the official eligibility explicitly restricts this program to developers based in Iraq; do not list as a Jordan opportunity. The official contact page provides a general inquiry form and ali@re-coded.com for press/program questions, NOT a verified HR mailbox. The LinkedIn company profile lists New York headquarters and conflicting global size ranges (localized 2-10 vs English 11-50); neither confirms Jordan staffing. No current Amman office, physical address, precise coordinates, Jordan staff vacancy or dedicated recruitment email was established. The old generic Amman map pin has been removed and location marked unresolved. Company-level verification remains partial."
