notes: "First company-level review 2026-10-29. Official Jordan HQ page confirms 185 Wasfi Al Tal Street, Khalda, Wahet Ammon Building, Office 303, telephone +962-6-5377090 and general mailbox info@realsoft-me.com. The existing map listing locates the company at 31.992837,35.863598 and corroborates the street-level address; the previous maps_url instead searched 31.99725,35.84949 and was corrected. This verifies the recorded location, not the whole company. LinkedIn lists headquarters at Al Waha Circle, 51-200 employees and founding in 2002; official HQ page describes a team of about 100, with no audited Jordan-only count. Official site confirms statistical solutions, national censuses, e-government, data platforms, GIS and AI-related work. Existing GIS, Oracle, PostgreSQL, Power BI, Python, SQL, SQL Server and Tableau entries were retained from earlier documented technology research; the official banking case study specifically names Oracle ADF and Oracle Database. The official training curriculum includes Node.js, Angular, Mendix and PL/SQL, but these were not added as confirmed production-stack technologies. The careers page currently offers a general CV submission form with an Internships (Fresh Graduates) option; it does not list a dated vacancy or confirm an active internship intake. Historical 2016 university career-fair material identifies hr@realsoft-me.com, but the present official website publishes only a general contact address and the application form; no currently verified HR email. The company's October 2026 AI Expo participation supports ongoing activity. Company verification remains partial because current open roles, complete engineering stack, headcount and recruitment mailbox are not fully corroborated."
