notes: "First company-level verification 2026-10-29. Reflect's official support article says Arab Bank launched the mobile banking service in 2021. Its website confirms digital onboarding, debit/virtual/credit cards, multicurrency accounts, savings, instant loans and a four-interest-free-installment Pay Later feature; ReVA's official support page documents voice/text AI assistance and transaction initiation. The company LinkedIn profile identifies Amman headquarters and a self-reported 11-50 employee range; this is not the workforce of parent Arab Bank. Reflect's privacy policy explicitly says it is located at Arab Bank headquarters at 8 Shaker Bin Zaid Street, Shmeisani, Amman 11195, corroborated by its site footer. The location address is verified as published contact premises, not as a separate dedicated office; the previous 31.9539,35.9106 map pin was generic Amman-centre coordinates and was removed. support@reflectapp.com and +962792777027 are customer-support contacts, NOT verified HR contacts. Arab Bank's official careers portal lists Jordan vacancies and a 2026 Ambassadors Program, but no role was demonstrated to belong specifically to Reflect; its parent vacancies must not be counted as Reflect openings. No Reflect-specific careers page, recruitment email, live vacancy or internship was established. Android, iOS and Huawei are supported customer app platforms, not a verified internal engineering stack; ReVA is a product capability. The Reflect LinkedIn page reported a crypto trading waitlist in the Central Bank of Jordan regulatory sandbox in October 2026; do not infer unrestricted public availability. Company verification remains partial because recruitment channels, engineering stack, headcount and dedicated premises remain unconfirmed."
