notes: "First company-level review 2026-10-29. Official site and company LinkedIn establish an active Jordan-headquartered SaaS business serving field sales, FMCG, pharmaceuticals and service teams; the official Workstation site documents newer CRM, help-desk, omnichannel and AI features. LinkedIn lists founding in 2015 and 51-200 employees; the Jordan ICT association int@j has an older 1-24 range and 2017 founding year, so company size and founding date are source-dependent and neither is an audited current Jordan-only figure. Official contact page explicitly publishes 26 Utbah Bin Ghazwan Street, Khalda, Amman, general email info@repzo.com and phone +962 79987 7727. The official contact page links to a Google Maps business place at approximately 31.98983,35.8514709; these coordinates replace an inconsistent older generic pin, but the precise building entrance is not independently surveyed and remains provided_unverified. General sales/support contact is not a dedicated HR mailbox. LinkedIn has recent and historical employer-attributed Amman sales and engineering advertisements, but no verified currently accepting vacancy, dedicated careers portal or active internship intake was established. LinkedIn calls the historical Product Engineer role entry-level despite requiring experience; this supports a qualified early-career signal, not an open graduate program. Prior CSS, jQuery, Zoho and computer-vision entries lacked sufficient current primary-source support and were replaced by clearly labeled product features and historical QA requirements. The tools named in historical recruitment are examples, not proof of production use. Company-level verification remains partial because hiring availability, HR ownership, internal engineering stack, precise pin and employee count remain unconfirmed."
