notes: "First company-level review 2026-10-29. LinkedIn confirms a historical 2012-founded restaurant reservations and table-management business, 11-50 company-wide size range, and service markets including Amman, Dubai and Beirut. Founder Khalil Shadid told Entrepreneur Middle East in October 2015 that ReserveOut's largest office was in Jordan, housing software development, finance, call-center and content teams; this is historical, not evidence of a current Jordan office or workforce. The main reserveout.com site could not be accessed during the review. A company-branded Trakstar Hire portal remains reachable and shows two undated Amman engineering advertisements, but the postings' wording and older jQuery Mobile/PhoneGap stack suggest they may be stale; third-party 2026 job-board repost dates are not proof of a new vacancy. The developer descriptions are evidence of historical recruitment requirements, not confirmation of the current production stack. SevenRooms' official integration directory still names Reserveout as a Middle Eastern booking channel, but does not independently verify a staffed Jordan office. Dealroom labels the company 'closed' and lists 2-10 employees, conflicting with the LinkedIn listing and integration; neither operational status nor current headcount can be resolved from these sources. iMENA's 2025 restructuring announcement emphasizes OpenSooq, SellAnyCar and Jeeny but does not establish the disposition of ReserveOut. No current street address, exact map pin, dedicated HR mailbox, active internship or recently originated opening was verified. Previous generic Amman-centre coordinates were removed as misleading, and prior AWS/DevOps inference was not retained as verified stack. Company-level verification remains partial pending primary confirmation of operations, location and current hiring."
