notes: "First company-level verification 2026-10-29. Robotna's official website and company LinkedIn corroborate active Amman-based EdTech operations, robotics/coding/AI curricula, school programs and Innovation Nation / RIFA competitions. LinkedIn lists a 2017 company founding date, 11-50 employees and Omar Al-Mukhtar Street, Jabal Al-Taj, Amman (number 74); a 2021 interview describes an earlier 2013 initiative, which is not necessarily the company incorporation date. The official contact page lists general email Info@Robotna.org and telephone +962 78 820 3314; neither establishes a dedicated HR contact. The official contact page links to a Google Maps place for Robotna Center with coordinates around 31.9738673,35.8834749, while LinkedIn lists a Jabal Al-Taj address; the relationship between that center and the listed headquarters is unverified. Removed the former generic Amman-center pin 31.9539,35.9106 rather than presenting it as the employer entrance. A historical Project Assistant vacancy explicitly encouraged fresh graduates with no experience, and a Digital Marketing Specialist vacancy closed after 2025-04-15. A more recent founder outreach for an experienced competitions/operations manager appeared on company LinkedIn, but its current application status is not established. Robotna+ training and graduate placement is not an employer internship or a current staff vacancy. Training subjects and historical advertising-tool requirements do not establish the internal software stack. No current verified vacancy, internship, careers portal, dedicated HR mailbox, exact premises coordinates or audited headcount was established. Company verification remains partial, independent of location status."
