notes: "First company-level review on 2026-10-29. The official group site describes broadcasting, news, digital streaming, apps, podcasts, production and media training, and published news dated 2026-10-02. Group LinkedIn lists 201-500 employees, 2021 as a LinkedIn company-profile founding year and Al Muqabalain headquarters; the official site traces Roya TV operations to 2011, so these years describe different milestones and are not conflated. The earlier YAML 51-200 size was superseded by the current group LinkedIn range, which is self-reported and not audited. The official group site and its roya.tv-domain careers microsite publish the Jordan Media City / Um Al-Heran office; Jordan Media City independently publishes Building 41 on the same street, and a third-party map listing locates Roya TV Main Studios & Offices near 31.9064023,35.9314516. The coordinates represent an approximate studio-site map point, not an independently surveyed office entrance. Location status verified refers to the corroborated address only, not full company verification. The official careers microsite lists HR@royamediagroup.com, while employer-attributed 2026 LinkedIn posts also use careers@royamediagroup.com for CV submissions; no individual recruiter contact was verified. A recent employer-attributed three-week sales internship explicitly welcomes fresh graduates and offers possible junior employment, but intake availability as of review is unknown. A QA role seeking 1-2 years provides additional early-career evidence. Technology items are supported by employer job advertisements or official products and should not be read as a complete production-stack audit. Previous Cloudflare, Google Ads, Vue.js and Webpack entries lacked corroborating first-party technical evidence and were not retained as verified stack claims. No independently audited workforce count, exact entrance pin or live application acceptance was established. Company-level verification remains partial."
