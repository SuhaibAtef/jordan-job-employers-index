notes: "First company-level review 2026-10-29. Royal Jordanian's official 2025 annual report identifies Building No. 37, Mohammad Ali Janah Street, 5th Circle, Amman as the head office, corroborated by its LinkedIn company profile and the Arab Air Carriers Organization (AACO) member directory. The prior YAML address on Tripoli Street was inconsistent with these primary sources; it has been corrected. Previous coordinates 31.95706,35.87774 were not independently matched to Building 37 and were removed; the Maps URL is an address search, not an independently verified entrance pin. Location status verified refers to the published address, not the complete employer record. LinkedIn's self-reported 1,001-5,000 company size aligns with AACO's 4,071 total employees for 2024; neither establishes the exact 2026 Jordan workforce. AACO's member directory lists Rasha Al Zoubi as Head of Human Resources and a corporate HR office phone (+962-6-5202200); role-holder currency and direct recruiting availability were not independently verified. No dedicated HR email was confirmed; customer.services@rj.com and RJCC.SALES@RJ.COM are customer-service/sales contacts and are not HR mailboxes. The official careers portal had Apply Now links for Cabin Crew and a Passenger Services Agent talent pool on the review date, while August/September 2026 junior IT advertisements were explicitly closed. No current software-engineering opening or internship was confirmed. Technology items reflect role requirements or official products, not an audited production stack. Full company-level verification remains partial because exact premises coordinates, current HR email and comprehensive internal stack are unresolved."
