notes: "Reviewed 2026-10-29. Rubicon's March 13, 2013 employer-issued release verifies Amman headquarters, animation/virtual-training activities and 400 staff across Jordan, US, Philippines and UAE at that time. Bayt retains a historical employer profile (100-499 employees), and SignalHire identifies Building GH06 in King Hussein Business Park (200-500 range); neither establishes a current 2026 workforce or active occupancy. The prior GPS pin and 'verified' location status were removed because they reflected a last-known location, and the earlier map listing was reportedly marked permanently closed. The historical official domain rubiconholding.com and alternate rubicon.com.jo were inaccessible during this review; no current careers site, HR email or open Jordan vacancy was independently confirmed. Crunchbase marks the predecessor/related Jordan Training Technology Group (also known as Rubicon) closed, while SignalHire continues to list RGH as independent; the exact legal relationship and current operational status remain unresolved, so do not assert that RGH itself is definitively closed. A 2015 3D-modeling internship and former developers' Unity/C#/Python/MEL/Viz Vizard work support only historical skills and early-career experience. A third-party directory points to LinkedIn company ID 1408325, but the company page could not be opened to verify its identity or current details; linkedin remains null. Do not confuse this Jordanian media company with unrelated Rubicon groups in construction, renewable energy or ERP software."
