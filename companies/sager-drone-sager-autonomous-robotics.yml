description: "Sager is a robotics and geospatial-intelligence company founded in 2018, offering drone-based mapping, surveying, infrastructure inspection, progress monitoring and AI-assisted asset analytics. Its SagerSpace platform organizes aerial and sensor data into digital models and decision support for infrastructure operators. LinkedIn lists Abu Dhabi as headquarters and an Amman office; Jordan operations and a 2026 internship are documented, but current vacancies and its internal production software stack remain incompletely verified."
