notes: "Reviewed 2026-10-29. Official contact page verifies Building 23 at King Hussein Business Park on King Abdullah II Street and phone +962 7777 04242; LinkedIn independently lists a Building 23 Amman location but describes the street as Al Sha'b Street, a naming discrepancy left explicit. Official site links to a Google Maps business pin at 31.9722074,35.8327241; coordinates are approximate to the mapped business and not a surveyed office entrance. LinkedIn identifies Abu Dhabi, not Amman, as company headquarters, founded 2018, and self-reports 11-50 employees globally; no Jordan-specific headcount. The official contact page publishes general office/sales/support contact channels and the 2023 official PDF gives jo@sagerdrone.com as an Amman office contact, not HR; dedicated HR email remains unverified. Official site links to /careers, but that URL produced a redirect loop on 2026-10-29, so careers_url remains null rather than implying a functioning application page. Sager's company LinkedIn post advertises a March-July 2026 Jordan internship with March 7 application deadline, now expired. Product Designer and Computer Vision Engineer - AI LinkedIn listings are explicitly closed; example Python/C++ and Figma requirements do not establish the live production stack. SagerSpace's pilot network has training and paid missions but is distinct from salaried employment. A December 2022 HTU memorandum documents educational collaboration, not a current hiring program. Official services verify GIS/drone mapping, AI analytics and digital twins; no AWS, Azure, Kubernetes or other cloud vendor was independently confirmed. Company-level verification remains partial despite independently supported Jordan office address."
