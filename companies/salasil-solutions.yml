notes: >-
  First company-level review 2026-10-29. Jordan ICT's 2018 company profile
  documents the Jordanian company, 2015 establishment, Salasil Desktop, founder
  Mouneir Alnouri, CTO Eyad Bader and five employees at that time. The LinkedIn
  company profile currently states London headquarters, a listed Amman location,
  2021 founding and 11-50 employees; these differences may reflect a later
  entity or profile update and are not reconciled. LinkedIn's size is a
  self-reported company-wide range, not verified Jordan headcount. A company-
  attributed series of March-June 2023 posts describes bonboon and the Faheem
  AI assistant; present product availability could not be checked. The company-
  linked website timed out or was inaccessible at review. JordanYP's
  owner/directory-validated 2023 listing gives KHBP Building 7, second floor,
  and a company-attributed social page also identifies Building 7; LinkedIn
  identifies Al Sha'ab Street in Amman. Exact entrance, current occupancy and
  the old coordinates 31.9731,35.835 were not independently validated, so the
  coordinates were removed and the map link is an address search only. Jordan
  ICT provides general contact info@salasil.com and +962-7-90381908, but no
  dedicated HR email was established. No employer-attributed accepting vacancy,
  internship or early-career program was found in the reviewed sources. The
  former generic REST API technology claim lacked attributable evidence and
  was removed. Product capabilities do not establish a verified implementation
  stack, and a listed location does not establish full-company verification.
