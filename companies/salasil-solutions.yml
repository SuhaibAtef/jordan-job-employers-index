name: "Salasil Solutions"
description: >-
  Salasil Solutions is a Jordan-origin educational software developer documented
  since 2015, creating video-based e-learning and digital-content authoring
  tools for teachers, training providers and corporate users. Its documented
  products include the Salasil Desktop screen-recording/live-broadcasting tool
  and the historically promoted bonboon AI-assisted lesson-authoring tool.
  LinkedIn lists an Amman location and London headquarters, but current Jordan
  staffing, operating activity and recruitment remain incompletely confirmed.
