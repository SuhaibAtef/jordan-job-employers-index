    - "Historical B2B Sales Representative in Amman: employer-attributed LinkedIn listing required at least two years of sales experience; explicitly closed. CV recipient l.alkiswani@sama.jo was the sales manager, not verified HR."
    - "Historical Sales Account Manager in Amman: employer-attributed LinkedIn listing preferred one to three years of telecom/IoT/IT sales experience; explicitly closed."
    - "Customer Care Officer in Amman: third-party repost requested diploma/bachelor's degree, with previous service experience preferred; current application acceptance and original posting date unconfirmed."
notes: >-
  First company-level verification review on 2026-10-30. Official site confirms
  active JoTrack, JoSchool, OneOffice, SMS marketing, security and vehicle-video
  offerings. Company LinkedIn states founded 2005, Amman headquarters, Bahrain
  office and self-reported 11-50 company-wide employees; this is not a verified
  Jordan-only headcount. Recent 2026 company posts promote JoTrack AI-assisted
  fleet analysis, but do not disclose its implementation stack. Official contact
  page lists Building 159, Zahran Street, Fifth Circle, Amman, telephone
  +962 6 593 9050; LinkedIn specifies the ground floor. Independent Cybo and
  Yellow Pages listings corroborate the address and telephone. The geographic
  listing supplies coordinates 31.958753,35.884223, retained only as an
  approximate map point rather than a surveyed entrance. Official SMS brochure
  publishes info@sama.jo, a general mailbox, not a dedicated HR address.
  Historical employer-attributed LinkedIn sales roles accepted CVs at
  l.alkiswani@sama.jo, a sales manager's address, not a verified HR mailbox;
  both LinkedIn roles are closed. A Customer Care Officer listing appears on
  third-party aggregators but its live status is not verified. No currently
  accepting official vacancy, internship or dedicated careers page was
  established. Early-career signal is qualified historical sales/customer-care
  recruitment, not a confirmed graduate program. Unsupported prior C#, PHP
  and GIS claims were removed; product capabilities are not an audited
  production stack. A corroborated street address does not constitute
  full-company verification.
