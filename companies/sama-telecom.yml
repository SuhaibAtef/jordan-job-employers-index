name: "Sama Telecom"
description: >-
  Amman-headquartered Jordanian ICT and telematics provider, founded in 2005
  according to its company LinkedIn profile. It develops and markets JoTrack
  web/mobile fleet tracking, JoSchool GPS/GSM school-bus monitoring, OneOffice
  collaboration tools, SMS marketing and vehicle security/MDVR solutions.
  Its official website and recent company LinkedIn updates support continuing
  product activity, but current recruitment and internal software architecture
  remain incompletely verified.
