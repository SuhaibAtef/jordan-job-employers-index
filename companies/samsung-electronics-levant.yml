notes: >-
  Reviewed 2026-10-30. Official Samsung Levant pages and 2026 university partnership
  confirm the regional operation; Samsung's global R&D pages do not establish a
  Jordan software-development team. LinkedIn's 201-500 company-size range applies
  to the Samsung Levant profile and is not a verified Amman headcount. Samsung's
  own 2026 Workday job advertisement locates an Amman role at King Hussein
  Business Park, while independent directory listings identify Building 5;
  current suite/entrance and exact coordinates were not verified. The previous
  coordinate pair was removed because it did not establish the Building 5 entrance.
  A Bayt posting for Specialist, AP Accountant / Marketing AP lists 0-3 years and
  an application deadline of 2026-11-07; a recent B2B HVAC pre/post-sales
  LinkedIn vacancy explicitly says applications are closed, despite some
  aggregated job feeds displaying it as active. The 2025 AAU agreement offers
  internships conditional on business needs; the 2026 Innovation Campus AI
  course is educational training, not Samsung employment. No dedicated public
  HR mailbox, confirmed current internship intake, Jordan software-engineering
  vacancy or verified Levant production software stack was established. The
  directory-listed drhee@sea.samsung.com is not substantiated as an HR contact.
