notes: >-
  Reviewed 2026-10-30. The official domain savvytek.com was inaccessible to the
  research browser, and no accessible official careers page, company-matched
  LinkedIn company profile, currently accepting Jordan vacancy, dedicated HR
  mailbox or 2026 internship was independently established. An October 2008
  company-attributed announcement documented Red Hat Premier Partner status;
  this does not establish a current accreditation. Historical company profiles
  describe Oracle EBS, Siebel, Hyperion, BI/data warehousing, portal services,
  consulting and training. A former intern reports a June-August 2012 Oracle
  DBA internship in Amman, which is historical early-career evidence only.
  SignalHire lists 318 King Abdullah II St, Amman; a current Google business
  listing identifies Savvytek Co at 320 King Abdullah II St, while other
  directories retain a different Queen Rania/University Street address.
  Current office occupancy, precise entrance and coordinates are unresolved;
  the previous generic coordinate pair was removed. ContactOut's company
  description lists info@savvytek.com and +962 6 56655266 as general contacts,
  neither verified as current or HR-specific. The retained 11-50 size is an
  unverified directory estimate; SignalHire reports 100-200 and ContactOut
  contains inconsistent company size/headquarters metadata. No reliable
  current employee count can be established. No current deployed software
  stack was independently audited.
