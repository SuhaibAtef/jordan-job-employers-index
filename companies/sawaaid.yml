notes: >-
  Reviewed 2026-10-30. The official website describes services and lists
  info@sawaaidhct.com and +962 7 9644 4366 as general contacts, not a dedicated
  recruitment mailbox. The official contact page gives Al Basem 2 Complex,
  second floor, Office 201; company LinkedIn supplies Building 257 and the
  2-10 employee range. A matching local business listing corroborates the
  street and phone, but an independent entrance coordinate or current
  physical occupancy was not established. Removed previous uncorroborated
  coordinates (31.9539, 35.9106) and retained an address-based map search.
  No official careers portal, internship announcement or programming-language
  stack was verified. Earlier generic 'Internship' signal was unsupported
  and replaced with documented graduate-friendly recruitment. The 2026
  company-attributed LinkedIn vacancies and nurse-network post demonstrate
  hiring/provider recruitment activity, but none establishes a currently
  accepting application. A third-party MimusJobs posting claims a 2026-11-03
  deadline, yet directs applications to the company's general homepage and
  inconsistently states 1-2 versus 2-3 years' experience. Official site
  contains apparent template placeholder sections, so rely on its specific
  service/contact claims rather than generic template material. Founded 2021;
  Flat6Labs backing is documented by CB Insights and Dharab.
