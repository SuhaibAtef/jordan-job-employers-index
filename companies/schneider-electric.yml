  address, but independent current occupancy and precise entrance coordinates
  were not confirmed. Removed prior coordinates 31.962777, 35.844106 because
  they could not be tied reliably to the published building; retained an
  address-search map link. Other directory listings show different Amman
  streets and may be historical or different branches. The company LinkedIn
  size of 10,001+ is global, not a Jordan staff estimate. No dedicated Jordan
  HR email or currently accepting Jordan vacancy was independently verified.
  Historical Jordan vacancies are closed. The Global Student Experience 2026
  is open to students internationally but is education, not an internship or
  a guarantee of employment. The official Jordan website's customer-care
  telephone and historical customercare.jo@schneider-electric.com address
  are not recruitment contacts. Listed technologies describe the company's
  products or historical vacancy requirements, not an audited Jordan stack.
