notes: "Reviewed 2026-10-30. Official SedraPay website and product pages describe a payments/RegTech software vendor; the company LinkedIn profile lists 51-200 employees (company-wide, not a verified Jordan headcount) and 2018 founding. The company LinkedIn page shows a 2026 Karbon partnership announcement, supporting recent activity. Recruitment posts attributed to Eman J. Al-wahsh and reposted by a listed SedraPay employee establish hr@sedrapay.com as a recruitment mailbox and fresh-graduate/junior hiring history, but no currently accepting vacancy or internship was confirmed. Historic employee-directory mention of an intern is insufficient to establish an active internship program. Location confidence is limited: the current company LinkedIn profile says King Hussein Business Park Building 19; official SedraCheck/SedraCollect pages (copyright 2022) say Building 23, second floor; more recent recruiter posts say Amman, Mecca Street. Previous 2026-10-06 GPS review accepted a King Hussein Business Park area-level map pin and rejected an unclaimed Mecca Street map listing; that pin is not a surveyed office entrance and is now omitted pending current-office confirmation. The park-level address is retained as company-published historical location, not asserted as present occupancy. Technologies are official product capabilities or historical job requirements, not a validated deployed stack."
