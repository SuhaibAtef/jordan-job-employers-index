notes: "E-payment software company (founded 2018) plus RegTech products SEDRACHECK (eKYC/AML identity verification) and SEDRACOMPLY; won Mastercard's Outliers challenge 2021; SignalHire lists a Business & Product Analysis Intern among staff — internship evidence. GPS verified 2026-10-06: office is on Mecca St., Amman (pin 31.9742192,35.8454547) per three agreeing sources — company-domain business info, a maintained Maps listing with correct category + hours, and an employee job post (\"Amman - Mecca Street\"). The previous \"King Hussein Business Park, Bldg. 23\" address was contradicted by all three; SignalHire's scraped \"King Abdullah II Street, Sweileh\" HQ claim (aggregator) is also unsupported. GPS attempt 1 (2026-10-06): CORRECTION — an earlier same-run pass had wrongly marked Mecca St. verified based on the company-domain Google knowledge card plus an employee job post, before the live-browser handoff arrived; the handoff showed the Maps listing is UNCLAIMED/sparse and pinned to a cafe, and the official product sites both state KHBP Bldg. 23, 2nd floor, so the Mecca pin was reverted. Official sites confirm KHBP Bldg. 23 but are ~2022-dated and carry no map; company LinkedIn page says KHBP Building 19 (conflict on building number); unclaimed Mecca-Street Maps listing and third-party job ads naming Mecca St. are judged weak/recruiter shorthand; Google Play dev profile lists \"Al Shaab Street\" (circa 2022). Precise pin coordinates for the KHBP building not established — pin stays approximate at the KHBP-area fallback. GPS attempt 2 (2026-10-06): VERIFIED via live-browser investigation — office is at King Hussein Business Park, Amman (Sweileh). Two+ independent sources agree: official product sites (Bldg. 23, 2nd floor, ©2022), company LinkedIn (owner-managed: Building 19), intaj.net member listing (KHBP, Amman), ZoomInfo workplace data (KHBP). The unclaimed Mecca St. Maps pin (inside a cafe, ~1.35 km from KHBP) is judged wrong/stale. Pin set to Google Maps KHBP coords 31.9710998,35.8355168. Building number genuinely uncertain (19 per current LinkedIn vs 23 on 2022 pages — possible in-park move), so address kept at park level."
