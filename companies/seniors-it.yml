technologies:
- SIEM and security orchestration/response (SOAR; advertised security solution capabilities)
- Endpoint detection and response (EDR/XDR; company services and vendor partnerships, not an audited internal stack)
- Next-generation firewalls and IDS/IPS (official solutions and historical pre-sales vacancy)
- Data loss prevention (DLP), encryption and data classification (official solutions)
- Identity and privileged access management (IAM/PAM; official solutions)
- Web application firewalls (WAF), application security and penetration testing (official services)
- Network access control (NAC), VPN and network security (official solutions and recruitment requirements)
- Microsoft Azure and Microsoft 365 cloud protection (company service offerings; deployments unverified)
- Backup, recovery and disaster recovery (company service offerings)
- Palo Alto Networks, Kaspersky, Tenable and other security vendors (advertised partnerships; not proof of deployed
  tools)
job_seeker:
  early_career_signal: true
  signals:
  - 2026 company LinkedIn post recruited a Cybersecurity Team Lead in Jordan via careers@seniorsit.me; post has
    no confirmed open application window as of 2026-10-30.
  - 2026 Senior Cybersecurity Pre-Sales Engineer vacancy in Amman specified SIEM, firewalls, IDS/IPS, endpoint protection,
    routing/VPN and security certifications; LinkedIn explicitly says applications closed.
  - Historical company recruiting for a Senior Cybersecurity Engineer in Jordan via careers@seniorsit.me, reposted
    by an employee; current acceptance unconfirmed.
  - Former trainee self-reports a Cyber Security Engineer Trainee placement in Amman, March-July 2023; historical
    individual evidence only, not an active internship program.
  - Legacy company Join Us page includes a CV submission form and invites applications; current intake and successful
    form submission not independently confirmed.
notes: Reviewed 2026-10-30. The current LinkedIn company page points to seniorsit.me; seniorsit.co and seniorsit.net
  are older company-branded sites that continue to publish the same Amman contact address. The official site and
  LinkedIn corroborate Building 273 on Al Madina Al Monawarah Street; SignalHire repeats the address, but an independent
  BizMidEast listing reports an alternate Tala Al Ali/Al Andalos complex address. Precise entrance coordinates and
  current occupancy were not independently confirmed, so prior 31.9986,35.8785 map coordinates were removed and
  an address-search link retained. Company-wide 51-200 LinkedIn employee band is not a Jordan headcount. The recruitment
  mailbox is supported by a company-authored 2026 hiring post; no currently accepting role or current graduate internship
  was verified. The newer seniorsit.me/join-our-team/ link was visible in official site navigation but returned
  an access error during review; careers_url points to an accessible legacy company CV form, not a verified open
  vacancy. A 2023 trainee experience is self-reported, not proof of a standing internship. Listed technologies describe
  marketed client solutions, vendor partnerships or historical job requirements, not an audited production stack.
