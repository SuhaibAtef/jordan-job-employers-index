name: Seniors IT
description: Amman-headquartered regional cybersecurity and enterprise IT infrastructure integrator founded in 2008.
  Designs and implements network, endpoint, application, data and cloud security, identity/access controls, penetration
  testing, compliance consulting, backup/disaster recovery and enterprise infrastructure for organizations in Jordan,
  Qatar and Saudi Arabia.
industry: Cybersecurity / Network security / Enterprise IT infrastructure and systems integration
