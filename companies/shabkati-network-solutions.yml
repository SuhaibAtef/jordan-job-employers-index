- Microsoft Excel (required in 2026 Junior PMO advertisement; job skill, not production stack)
job_seeker:
  early_career_signal: true
  signals:
  - 2026 company-authored Junior Project Management Officer advertisement in Amman seeks engineering graduates with
    6-12 months of project coordination/PMO experience and Excel; CVs directed to t.qassas@shabkati.com. Acceptance
    as of 2026-10-30 unconfirmed.
  - 2026 company LinkedIn advertisement for a full-time Account Manager in Amman asks for networking/cybersecurity
    knowledge and sales/account management experience; CVs directed to b.jweihan@shabkati.com. Current acceptance
    unconfirmed.
  - Company website offers a general contact form but no dedicated public careers page or standing internship program
    was verified.
notes: Reviewed 2026-10-30. Company official website, contact page, intaj directory and LinkedIn corroborate an
  Amman network/cybersecurity integrator founded in 2012; the company says it is part of DOT Group and maintains
  a Riyadh branch. LinkedIn reports 11-50 employees, while intaj lists 1-24, with no independently confirmed Jordan-specific
  headcount. Official address is Mecca Street plus P.O. Box 18024; neither a building number nor entrance coordinates
  are published. A local business listing corroborates Mecca Street and the company phone +962 6 552 4777, but previous
  31.975415,35.862216 coordinates cannot be tied reliably to the entrance and were removed. info@shabkati.com is
  a general contact, not HR. Company-authored LinkedIn hiring posts provide role-specific CV recipients t.qassas@shabkati.com
  (Junior PMO) and b.jweihan@shabkati.com (Account Manager), but neither is established as a dedicated HR mailbox
  and the current acceptance window was not independently tested. No standing internship or graduate program was
  verified. Vendor names are official partnerships and services, not proof of installed client equipment or
  an internal production software stack.
