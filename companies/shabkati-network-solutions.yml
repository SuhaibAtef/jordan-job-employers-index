name: Shabkati Network Solutions
description: Amman-headquartered network infrastructure and cybersecurity integrator founded in 2012 and part of
  Distribution Oriented Technologies (DOT) Group. Provides enterprise routing, switching, wireless networks, structured
  copper/fiber cabling, network security, physical security, collaboration, IoT and consulting services in Jordan,
  with a stated Saudi Arabia branch.
