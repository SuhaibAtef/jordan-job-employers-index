- Cisco Meraki (official vendor partnership; deployment unverified)
- Fortinet (official security vendor partnership; deployment unverified)
- Cisco SD-WAN and SASE (company specialization and 2026 Cisco SD-WAN workshop)
- Hikvision CCTV and access control (official vendor partnership and physical security services)
- Teltonika IoT/network devices (official vendor partnership; deployment unverified)
- Cloudflare (official partner list; no verified internal use)
- CrowdStrike, Trend Micro and Nozomi Networks (official partner list; not an audited technology stack)
