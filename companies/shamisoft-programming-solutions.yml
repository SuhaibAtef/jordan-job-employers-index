notes: "Reviewed 2026-10-30. The official website and active company LinkedIn profile corroborate Amman operations since 1991 and a broad ERP, accounting, jewelry, inventory, HR, CRM and mobile application portfolio. LinkedIn reports 2-10 employees; JordanYP lists 6-10 and the 2018 Jordan ICT directory recorded 10 staff, so no current independently audited count is available. The official contact page, LinkedIn and JordanYP corroborate Building 53, Abdallah Ghosheh Street, Office 502 and telephone +962 6 553 8099. Current office occupancy and entrance coordinates were not independently surveyed; previous 31.96774,35.85519 coordinates were a street-level fallback and have been removed. info@shamisoft.com is a general contact, not verified HR. Company job advertisements refer applicants to https://www.shamisoft.com/Work_With_US, but the portal could not be fetched during review, so submission availability is unconfirmed. The 2026 C#/.NET vacancy is closed on LinkedIn and describes a planned Web API/MySQL modernization of an Access-based legacy system, not proof of completed deployment. The older Flutter vacancy is also closed. No confirmed current internship or fresh-graduate opening. Product/hardware technologies and job-ad skills are qualified rather than represented as an audited production stack. A previous note attributed the Kinz Amman app to ShamiSoft, but the accessible Kinz listings identify other developers; that attribution was not retained."
