notes: >-
  Reviewed 2026-10-30. Official site lists Grand, Desert King and Drift Online for
  Android/iOS, contact@shanabgames.com and +962 6 552 7261. Its recruitment call
  names jobs@shanabgames.com; support@shanabgames.com is for game support/privacy,
  not HR. LinkedIn self-reports founding in 2016 and 11-50 employees (not an audited
  Jordan headcount). Unity3D, C# and Blender are evidenced by job requirements and
  LinkedIn specialties, not an independently audited deployed stack. A University
  of Petra announcement dated 2022-05-19 supports a historical unpaid internship,
  but no active internship is verified. Both discovered LinkedIn jobs are closed;
  the standing CV invitation does not prove active hiring. Official website and
  LinkedIn corroborate Wasfi Al Tal Street, with LinkedIn specifying the third floor;
  an independent business listing matches the street and published phone. The
  previously researched Google Maps business pin was retained, but exact entrance
  and current occupancy were not independently surveyed during this review.
