name: "Shop4Me"
description: >-
  Shop4Me is a B2B procurement marketplace connecting restaurants, clinics,
  offices and other businesses with suppliers. Its web and mobile platforms
  have supported supplier discovery, product comparison and ordering; a 2022
  accelerator brief documents operations in Jordan and Saudi Arabia, but
  current trading activity has not been independently established.
