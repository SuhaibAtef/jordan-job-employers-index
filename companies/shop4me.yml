notes: >-
  Reviewed 2026-10-30. LinkedIn describes a technology/logistics marketplace,
  reports founding in 2020, a Delaware headquarters, 11-50 employees and an
  Amman 11953 location (also Jeddah). Wellfound instead reports 1-10 employees;
  the size field follows the company LinkedIn range and is not a Jordan-specific
  headcount. The Flat6Labs 2022 Amman investor brief documents HORECA, office,
  health/beauty procurement and then-current operations in Jordan and Saudi
  Arabia. Flat6Labs and StartupsJo publish founder/CEO Eihab Elzinary's
  eihab@shop4me.com as a business contact, not a verified HR mailbox.
  Wellfound has no listed jobs, and no active internship or recruitment
  announcement was confirmed. Apple's App Store lists the iOS customer app,
  last updated in November 2023; AppBrain and Chrome-Stats report that the
  Android customer app was removed from Google Play in early 2025. Android
  and iOS therefore describe published customer applications, not an audited
  current engineering stack. The official shop4me.com site was inaccessible
  during this review, leaving current operations uncertain. No company
  street address, office entrance or reliable coordinates in Amman were
  corroborated; the previous 31.9539,35.9106 point was an unsubstantiated
  generic city-center coordinate and was removed. The old village.do source
  was inaccessible and was not relied upon.
