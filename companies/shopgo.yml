notes: "Reviewed 2026-10-31. ShopGo's original Jordan e-commerce enablement business dates to 2012; CB Insights and other industry profiles identify MakanE as its successor/formerly ShopGo. The active MakanE official website describes online-store and mobile-app builders, payments/shipping integrations and merchant support; ShopGo's legacy shopgo.me URL was not independently accessible on this review. MakanE's own office page gives Yaser Sabaaneh Street, Building 3 B, P.O. Box 802, Amman; the existing Google Maps business listing pin at 31.948644,35.8600017 is retained from prior evidence, but entrance precision is not surveyed. Location verification does not mean the entire company is verified. Legacy ShopGo LinkedIn lists Riyadh and 501-1,000 employees, while MakanE LinkedIn lists Amman and 201-500; Crunchbase's historical ShopGo band is 11-50. These are conflicting, differently scoped estimates, not an established present-day Jordan headcount. support@shopgo.me is an older general support contact and support@makane.com is a current official general support contact, neither a dedicated HR email. ShopGo-branded public GitHub Magento extensions (2015-2016, PHP) support historical Magento/PHP experience only; they do not prove the current MakanE production stack. A 2021 MakanE hiring post used careers@mawdoo3.com; it is historical, not proof of current hiring or a valid present-day application address. No active job or graduate program verified. Company record remains partial because legacy/successor entity boundaries, current ShopGo staffing, HR channel, vacancies and internal stack are unresolved."
