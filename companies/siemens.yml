    - "The official Siemens Graduate Program is a two-year entry-level program for master's graduates with three assignments; Jordan eligibility or placements were not confirmed."
    - "Siemens' official career site describes global internships and working-student opportunities, but no active Jordan internship was verified."
notes: >-
  Reviewed 2026-10-30. Siemens' official corporate materials document
  industry, infrastructure and mobility activities; Siemens' LinkedIn
  company page reports 10,001+ employees and approximately 318,000
  worldwide employees at fiscal-year-end 2025, not a Jordan-specific count.
  The Siemens AG Jordan listing at JordanYP provides Zaina Commercial
  Complex, Queen Noor Street 44, Shmeisani and telephone +962 6 562 1303;
  the listing's own last update was 2021-05-10. Buildeey repeats the
  address and telephone. An independent listing for another business in
  Zina Commercial Center at number 44 corroborates the building and gives
  building-area coordinates 31.9622624,35.8991466, but does not prove
  Siemens' current tenancy or entrance. Earlier coordinates
  31.962399,35.899117 were removed rather than presented as an exact
  Siemens location. No current Siemens-authored Jordan office address,
  Jordan employee headcount, local HR mailbox, currently accepting
  Jordan vacancy or local internship was verified. Siemens' global
  graduate and internship programs are not evidence of Jordan openings.
  SIMATIC S7, WinCC and TIA Portal are official Siemens product
  technologies, not a verified Jordan office production or hiring stack.
  Historical Siemens press material documents a Jordan power-plant
  equipment project, not present office operations. Search results for
  Siemens Energy and Siemens Healthineers must not be treated as
  Siemens AG Jordan vacancies; they have distinct careers operations.
