name: "Siemens"
description: >-
  Siemens AG is a German industrial technology group supplying automation,
  industrial software, electrification, smart infrastructure and mobility
  solutions. Its Digital Industries business provides SIMATIC programmable
  controllers, TIA Portal engineering software and WinCC industrial HMI/SCADA
  systems. A Jordan business listing identifies an Amman presence, but the
  current local office and operating scope have not been confirmed by Siemens.
