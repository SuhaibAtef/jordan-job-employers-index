name: Sky Software
description: >-
  Amman-headquartered software company founded in 1997, developing and supporting
  hospitality and business-management applications. Its products include Bayan
  HRMS (enterprise and SME editions), Jana procurement and materials management,
  Horizon guest-services/quality management, hotel property management, Spark
  membership management and Osoul fixed-asset management. The company also
  provides customization, integration, implementation, training and support.
industry: Hospitality technology / enterprise software / HR and property-management SaaS
