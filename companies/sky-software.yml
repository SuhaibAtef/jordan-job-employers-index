job_seeker:
  early_career_signal: true
  signals:
  - Official Jordan Software Engineer vacancy lists a degree or equivalent and HTML5, CSS3, Bootstrap, JavaScript and object-oriented/web fundamentals; no minimum experience is stated. An application form is displayed, but its current acceptance is not independently confirmed.
  - Official Jordan Quality Engineer vacancy asks for a computer-related university degree and understanding of software development lifecycle and business rules; no experience minimum is stated. Application form visible, current intake unconfirmed.
  - Official Jordan Customer Success Engineer vacancy asks for an IT/computer-science degree, basic troubleshooting and preferred ticketing-system familiarity; no experience minimum is stated. Application form visible, current intake unconfirmed.
  - Company LinkedIn updates describe a former intern joining as a full-time employee; evidence of a past internship pathway, not an advertised open internship.
notes: >-
  Reviewed 2026-10-30. Sky Software Co. LLC operates its official skyits.com
  website and lists Jordan, Saudi Arabia and UAE contact numbers. Official
  contact page confirms the Jordan number +962 6 533 9616 and separate product
  support mailboxes; info@skyits.com is used for general business inquiries
  and is NOT a verified recruitment address, so hr_email is null. The official
  careers page currently displays three Jordan roles with on-page CV forms,
  but no reliable posting/closing dates or successful application submission
  were established. They are listed as hiring signals, not guaranteed live
  openings. The software engineer requirements specifically name HTML5,
  CSS3, Bootstrap and JavaScript; these are job requirements, not an audited
  production technology stack. The official product site markets cloud-based
  and mobile-friendly solutions without disclosing hosting provider, database,
  backend language or mobile framework. LinkedIn reports 51-200 employees
  worldwide/company-wide and Amman headquarters, founded 1997; the count is
  not a Jordan-only headcount. JordanYP's Ahmad Al-Tarawneh Street address
  was last updated 2021-04-28; Waze and local map listings also identify
  Sky Software on that street, while LinkedIn gives only PO Box 2164,
  Amman 11941. A map listing mentions Al Khadra Commercial Complex, but
  the current building entrance and occupancy were not independently
  verified. Previously stored coordinates (32.020692, 35.869768) were
  removed because they are an approximate map point rather than a confirmed
  current office entrance. Location verification remains separate from
  company-level verification. A LinkedIn company update recounts a former
  intern joining the team, but no currently accepting internship was found.
  Company status is partial pending independently confirmed office occupancy,
  current job application acceptance, direct HR contact and engineering stack.
