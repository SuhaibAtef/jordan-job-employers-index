name: SkyMatrix
description: SkyMatrix is a regional cloud infrastructure product and service operated by Amman-based
  Virtual Data IT, offering cloud VPS hosting, dedicated servers, business email, load balancing,
  web application firewalls, disaster recovery, and a unified DevOps control panel for production
  SaaS, API and enterprise workloads. Its official site describes infrastructure in Amman, Jordan
  and Riyadh, Saudi Arabia. SkyMatrix is not independently established as a separate employing
  legal entity.
industry: Cloud infrastructure / infrastructure-as-a-service (IaaS) / managed hosting
