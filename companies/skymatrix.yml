- Load balancing (advertised SkyMatrix infrastructure service; implementation not disclosed)
- Disaster recovery, backup and replication (advertised service; backup software not disclosed)
- Infrastructure monitoring and provisioning (advertised unified DevOps panel; tooling not disclosed)
job_seeker:
  early_career_signal: false
  signals:
  - Parent operator Virtual Data IT's official Amman careers page displayed no open positions
    on 2026-10-30, but invites speculative CV/profile submissions. This is a parent-company
    pathway, not a confirmed SkyMatrix vacancy.
  - Virtual Data IT previously advertised an on-site Flutter Mobile App Developer role in Amman
    requiring Flutter, Dart, REST APIs and Git; LinkedIn marks applications closed. It is not
    a SkyMatrix-specific or confirmed early-career opening.
notes: Reviewed 2026-10-30. SkyMatrix's official website expressly identifies Virtual Data IT
  as the developer and operator; the parent also lists SkyMatrix in its product portfolio. Do
  not count SkyMatrix as a separately confirmed legal employer or apply parent workforce figures
  to the product. Virtual Data IT's LinkedIn profile lists 11-50 employees, founded 2018, headquarters
  in Amman and an office on As-Sakhrah Al-Musharrafah Street; these are PARENT-company details,
  not independently verified SkyMatrix headcount or SkyMatrix office address. SkyMatrix says
  it operates cloud infrastructure in Amman and Riyadh but publishes no data-center street address
  or independently verifiable entrance coordinates. Previous latitude/longitude (31.9518, 35.94042)
  and their map URL were removed as unsupported for SkyMatrix premises. SkyMatrix's official
  contact email info@skymatrix.cloud and telephone +962 7 9052 1114 are general sales/support
  contacts, not confirmed HR channels; hr_email remains null. The parent careers portal currently
  displays no open positions but permits unsolicited profile submission. A parent Flutter Developer
  posting is closed; no active SkyMatrix-specific vacancy or internship was verified. Veeam
  was removed because no reliable source establishes SkyMatrix's use of it. Named technologies
  are advertised infrastructure capabilities, not an audited production implementation or vendor
  stack. The company's claims about Tier III facilities, ISO 27001 and uptime were not independently
  certified in this review. Status is partial pending independent employer identity, hiring,
  location, headcount and technology verification; location verification is distinct.
