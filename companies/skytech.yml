technologies:
- SAP Business One (officially offered ERP implementation and hosting; not an audited internal stack)
- Microsoft Dynamics 365 (officially offered ERP/CRM implementation)
- Odoo ERP (official partner and implementation offering; 2026 development and consulting vacancies)
- Zoho (officially offered ERP/CRM and business applications)
- SAP Analytics Cloud (officially advertised business-intelligence service)
- Microsoft Power BI (officially advertised business-intelligence service)
- Crystal Reports (historical SAP reporting service in third-party company directory; current usage unconfirmed)
job_seeker:
  early_career_signal: true
  signals:
  - >-
    SkyTech's official recruitment portal displayed an Odoo ERP Developer
    position in Amman requiring 1-3 years of experience, under Current Openings
    on 2026-10-30. Its listed date is 10/07/2026 (format ambiguous); actual
    application acceptance was not independently tested.
  - >-
    The official portal also displayed an Amman Odoo Functional Consultant
    position requiring 4-5 years of experience under Current Openings on
    2026-10-30; this is not an entry-level role.
  - >-
    A SkyTech Associate Functional Consultant vacancy dated 2026-08-15 on
    Bayt described 0-3 years of experience and welcomed relevant coursework
    or internship exposure. It was not present among the two current official
    portal openings, so ongoing availability is unconfirmed.
  - >-
    A third-party September 2026 Sales Software Consultant listing in Amman
    stated 1-3 years and an application deadline of 2026-12-10; its employer
    authorization and present application status were not independently verified.
notes: >-
  Reviewed 2026-10-30. The official company website and LinkedIn support
  an active Amman-based ERP and IT consulting business. LinkedIn identifies
  the founding year as 2013 and company size as 11-50 employees, not a verified
  Jordan-only workforce count. The official contact page currently gives
  13 Mohamed Al-Amin Al Momani Street, Um Al Summaq, Amman and telephone
  +962 6 222 9600; LinkedIn also identifies Amin Al-Momani Street, second
  floor. Older JordanYP and TipnTag listings instead place SkyTech at
  152 Mecca Street, Al Husseini Complex, with older telephone +962 6 553 1200;
  these are treated as historical or stale and not the current address.
  Prior coordinates 31.97681, 35.8548 and the coordinate-based maps link
  were removed because they do not substantiate the new office entrance.
  Precise occupancy/entrance has not been independently surveyed, hence
  location.status is provided_unverified, distinct from company status.
  The public contact email info@e-skytech.com is a general company mailbox,
  not verified HR; no dedicated HR email was found. The official careers
  portal displayed two 2026 Odoo openings; it was not possible to complete
  an application, confirm closing dates, or establish an active internship.
  The prior record claimed participation in SAP's 2019 Young Professionals
  Program, but the historical source could not be rechecked; it is not
  evidence of a current SkyTech graduate program. SAP's own 2026 graduate
  training is not attributed to SkyTech. The company announced ISO 27001
  certification on 2026-08-19, but the certificate was not independently
  audited here. Technologies describe sold products and role requirements,
  not independently inspected production infrastructure. Status remains
  partial pending independent office occupancy, HR contact, hiring
  acceptance and other company details.
