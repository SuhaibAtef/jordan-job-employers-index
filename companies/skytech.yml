name: SkyTech
description: >-
  SkyTech (also identified as Marcelia for Information Technology) is an
  Amman-headquartered enterprise software implementation and IT consulting
  provider. It implements SAP Business One, Microsoft Dynamics 365, Odoo and
  Zoho systems, and offers ERP hosting, business intelligence, warehouse
  management, procurement and field-sales solutions. Its official website
  lists offices in Jordan, Qatar and the UAE.
industry: Enterprise software / ERP implementation / IT consulting
