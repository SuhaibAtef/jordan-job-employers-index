name: "Smart Eye (Jordan)"
description: >-
  SmartEye (also branded SmartEye-NeuroTech) is a Jordan-based technology
  company founded in 2018 that develops AI- and IoT-enabled energy and water
  monitoring, efficiency, renewable-energy and low-current systems for
  organizations and facilities. Its services include consumption analytics,
  smart controls, leak detection and digital transformation.
