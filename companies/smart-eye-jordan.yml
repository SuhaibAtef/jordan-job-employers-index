notes: >-
  Reviewed 2026-10-31. The official SmartEye website describes Jordan-based
  AI/IoT solutions for energy management, water monitoring, renewable energy,
  digital transformation and low-current systems. Its contact page lists
  Office No. 111, Building No. 7, King Hussein Complex for Business, Amman,
  phone +962 79 672 1321 and general email info@smarteyeglobal.com. The
  related Neurotech site independently repeats the address and phone, but
  neither confirms the exact office entrance; the previous 31.95672,35.92519
  city-centre pin and generic Maps search were unsupported and removed.
  SmartEye-NeuroTech's company LinkedIn links to smarteyeglobal.com, identifies
  Amman headquarters, founding in 2018 and a self-reported 11-50 employees;
  the older official About page describes six founding team members, not a
  verified current workforce count. StartupsJo corroborates founder Omar
  Asa'd and the Jordan energy-management focus. The LinkedIn company feed
  includes 2026 product activity and recognition by the British Design Fund
  / Royal Academy of Engineering programme, supporting continuing operations.
  LinkedIn recruitment posts include an Amman full-stack role requesting
  React/TypeScript, ASP.NET Core/C#, MQTT and REST APIs, plus AI and business
  roles. These listings were closed at review; their skill requirements do
  not establish the deployed internal engineering stack. The published
  jobs@smarteyeglobal.com recruitment mailbox is historical and its current
  responsiveness is unverified. No active vacancies or graduate programme
  were established. SmartWTI is a related group venture but has a separate
  employer record and is not treated as identical to SmartEye. Verification
  remains partial: published office details do not establish a precise
  geolocation or full-company verification.
