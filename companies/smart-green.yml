name: "Smart Green"
description: >-
  Smart Green for AgriTech Solutions is a Canadian-headquartered agricultural
  technology company founded in 2020 with an Amman presence and Jordanian farm
  projects. It develops Fertigo irrigation/fertigation controls, Rootrika
  root-zone monitoring and SgView/SG-Connect software, combining IoT sensors,
  field data and AI-supported irrigation decisions.
