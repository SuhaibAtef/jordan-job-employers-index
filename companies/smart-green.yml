notes: >-
  Reviewed 2026-10-31. The official website confirms Fertigo, Rootrika and
  SgView/SG-Connect systems and says Smart Green operates in Jordan, Canada,
  Saudi Arabia and Spain. The 2026-07-03 Jordan News Agency (Petra) report
  independently documents Jordanian engineers Mohammad Zeinati and Salma
  Amayri, fourth-generation smart irrigation technology and farm projects in
  the Jordan Valley, Mafraq and Jerash. Company LinkedIn reports founding in
  2020, a self-reported global size of 2-10, Montreal headquarters and an
  Amman location; Jordan-specific staffing is not established. The official
  contact page lists +962 7 8764 0761 and info@sg-agritech.com as general
  contacts, not HR. It labels a map 'Housing Bank Complex, Queen Nour Street',
  but that map resolves to a bank branch, not a confirmed Smart Green office
  entrance. A directory last updated in 2023 instead lists Teiba Commercial
  Complex, Al Jadah Street; no precise office or coordinates were verified.
  Removed the unsupported Amman city-centre coordinates and generic map pin.
  The company's October 2026 C3 Launchpad accelerator selection and recent
  LinkedIn activity support continued operations, not recruitment. No
  dedicated careers page, current vacancy, HR email, graduate intake or
  internal programming-language/framework stack was verified. AI/ML and IoT
  describe documented product technology, not an audited internal stack;
  the previous devops category had no supporting evidence. Verification
  remains partial; location evidence alone does not verify the full company.
