notes: >-
  Reviewed 2026-10-31. The current official site describes water and energy
  monitoring, leak detection, AI analytics, LoRaWAN/NB-IoT/4G connectivity,
  smart buildings, agriculture and ESG reporting. GSMA independently documents
  a November 2024 grant for Blue Future for Schools, targeting installation
  at up to 40 schools in Jordan's refugee-hosting communities; the company's
  own website claims 35+ schools served, but that deployment count was not
  independently confirmed here. The company LinkedIn profile lists Amman
  headquarters and 2-10 employees, consistent with GSMA's 2024-25 portfolio.
  Its 2026 posts include a Green Jobs Project event and recognition of CEO
  Heba Asa'd in the WE Empower UN SDG Challenge, supporting current activity.
  The main official contact page confirms Amman and info@smartwti.com as a
  general business email, not a dedicated HR mailbox. The older store contact
  page previously provided Office 111, Building 7, King Hussein Complex for
  Business; it could not be reloaded during this review and the current main
  contact page provides no street address. That specific address is therefore
  retained as provided but not independently verified as current. The
  previous 31.97183,35.83394 pin was a generic area fallback, not a verified
  office entrance, and was removed along with its generic Maps evidence.
  The official careers page exists but displays a placeholder instructing
  an administrator to add job listings; no live job advertisement was found
  there. No graduate intake, active vacancy or dedicated HR contact was
  confirmed. Product AI/IoT/connectivity terms do not establish the internal
  programming languages or deployed software stack. Verification remains
  partial, independent of the location status. SmartEye-NeuroTech is a
  related but separately indexed employer, not an interchangeable record.
