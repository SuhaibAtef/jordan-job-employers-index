name: "SmartWTI"
description: >-
  SmartWTI is an Amman-based climate-technology company providing IoT sensor
  monitoring, AI-assisted analytics and automation for water and energy
  management. Its solutions include leak detection, smart metering, irrigation
  monitoring, building and industrial resource management, and sustainability
  reporting. GSMA selected SmartWTI in November 2024 for its Blue Future for
  Schools water-monitoring initiative in Jordan.
