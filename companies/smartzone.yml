notes: >-
  Reviewed 2026-10-31. Official SmartZone company and service pages confirm
  web/mobile development, ERP, e-commerce, cloud/hosting, digital marketing,
  SEO, design and support services. LinkedIn's company page points to the
  same official domain and lists Amman headquarters, founding in 2018 and
  an 11-50 employee band; its displayed name varies between Smart Zone and
  Smart Move by locale/crawl, so identity is grounded in the linked domain.
  The official contact page and company PDF agree on Mai Ziadeh Street in
  Al Khalidi; the website specifies Building 5. This is a company-provided
  address, not an independently verified office entrance. The previous
  31.95075,35.906 coordinates were a generic street-level fallback and are
  removed; the Maps URL is an address search, not an exact verified pin.
  The former hr_email info@smartzonejo.com did not match the current official
  domain and was not corroborated. Official contact and recent recruiting
  materials instead use info@smartzone-jo.com, a general-purpose address
  that also accepts CVs; no dedicated HR mailbox was confirmed. The company
  LinkedIn page and an October 2026-era Technology Sales Specialist posting
  support recent hiring activity; the listing is marked entry level but
  asks for B2B software-sales experience and is not proof of a graduate
  program. An older Junior Full Stack Developer listing is explicitly closed;
  its PHP/Laravel/MySQL/JavaScript requirements are historical stack evidence.
  Flutter is offered on the current mobile service page; ERPNext, Odoo and
  SQL Server appear in service-page titles, not as verified deployments.
  No current internal production stack, exact workforce, live software
  engineering vacancy or independently geocoded office was established.
  Company verification is partial and separate from location verification.
