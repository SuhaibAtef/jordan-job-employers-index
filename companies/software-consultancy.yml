  size band; the band is not a verified present-day headcount. Recent company
  posts describe a new brand identity, Oracle Fusion implementations, managed
  support and 2026 Oracle consultancy recruitment. The official domain
  responded at https://www.sc.com.jo/ but its current content could not be
  fully extracted for a contact or careers-page audit; no dedicated careers
  portal was confirmed. The recruiting email careers@sc.com.jo is supported
  by the company's own LinkedIn hiring posts. A 2026 internship posting
  demonstrates a real early-career program but is explicitly closed; the
  separate fresh/mid-level technical consultant post has no confirmed active
  application status. The 351 Queen Rania Street, fifth-floor Marar Commercial
  Complex address and near-identical coordinates are reported by two business
  directories, while LinkedIn lists both Queen Rania Street and Zahran Street
  without an office number. Retained coordinates are an approximate
  directory-derived map point, NOT an independently verified entrance or
  confirmed current office; location confidence is low. A 2017 JordanYP
  listing separately mentioned a Sweifieh address, so historical location
  differences remain unresolved. Oracle Cloud technologies are supported as
  delivered services and job requirements, not as a verified internal
  production stack. Historical Oracle Cloud expertise certifications were
  reported by int@j; their present validity was not independently checked.
  Company verification remains partial and separate from location status.
