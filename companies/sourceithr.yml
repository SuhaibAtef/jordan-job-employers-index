notes: "Reviewed 2026-10-30. Official SOURCEitHR website and About page establish ongoing payroll outsourcing, EOR/staffing, HR consulting and people-analytics services and its relationship with MenaITech; the company has an active 2026 website and recent LinkedIn posts. Company LinkedIn lists Amman headquarters, founded 2016, and a 51-200 employee range, which is platform-reported and not an audited local headcount (previous 11-50 estimate superseded). The official contact page publishes only Dhi Al-Qaada Street, Amman, without a building number. Earlier record's '21 Thi Al Q'idah Street, Teeba Commercial Center, 1st Floor' was not independently corroborated by current first-party materials, and the old generic city-center coordinates 31.9518,35.94042 were not a verified office pin; these have been removed. info@sourceithr.com is a general sales/support address, not a confirmed HR mailbox. The company's own late-October LinkedIn recruitment posts for Junior Payroll Officer (0-2 years) and Senior Payroll Officer (4-6 years) explicitly give hr@menaitech.com as an application email, which is a shared MenaITech-domain recruiting contact, not an independently verified dedicated SOURCEitHR HR mailbox. Its official careers page says 'No Current Vacancies Available' while retaining historical 2024 postings, some for external clients; therefore the status of the LinkedIn roles and any live careers-page vacancy remains uncertain. The official site lists MenaITech HRMS, MenaMe and Mena App as client-facing offerings; no specific programming languages, frameworks or SOURCEitHR-owned software development stack were established. Company-level verification remains partial because precise office location, current hiring acceptance and internal technology stack are not fully confirmed."
