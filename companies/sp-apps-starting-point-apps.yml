  while the former 10-49 size figure was not corroborated. Official contact
  page publishes the Al-Dalahma Complex address in Khalda-Dabouq and general
  email info@sp-apps.com (+962796015420); no dedicated HR mailbox was found,
  so hr_email is null. LinkedIn still lists Al-Rabiah as its primary location;
  the discrepancy and exact office entrance remain unresolved. The coordinates
  are an approximate center from the Google map embedded on the official
  contact page, not verified building or entrance coordinates. Android and iOS
  are company-advertised delivery platforms; Flutter and PHP/Laravel are
  evidenced by historical internship requirements, not a verified current
  production stack. LinkedIn's closed Flutter and Laravel internships show
  historical early-career recruitment, but the official careers page displayed
  zero jobs at review; no open position was established.
