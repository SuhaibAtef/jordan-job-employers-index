notes: >-
  Reviewed 2026-10-31. STS's LinkedIn company profile confirms the official
  stsarabia.com domain, Amman headquarters, 201-500 company-wide employee band,
  and work in systems integration, cloud and digital transformation; it describes
  more than 350 professionals but that figure is not a separately audited current
  Jordan headcount. ZainTECH announced an agreement to acquire STS in October
  2023 and explicitly called STS its Jordan subsidiary in October 2025.
  ZainTECH's current official contact page lists Building No. 1 on Abdallah
  Ghosheh Street, PO Box 950745, Amman; independent directories name Shaban
  Building near 7th Circle. The official ZainTECH Google Maps directions point
  to this vicinity, but the stored 31.96001,35.8571 coordinates remain an
  approximate building-area pin, not a verified STS entrance. The company's
  own stsarabia.com site timed out during this review; its domain remains
  listed by LinkedIn and ZainTECH-era industry sources. The STS-branded Workable
  portal and an indexed L2 Network and Security Engineer listing were found;
  that Amman role requests 2-3 years' experience, not a fresh-graduate hire.
  Cisco, Fortinet, Palo Alto and Ansible are evidenced as vacancy requirements,
  not as a verified internal production stack. An individual's public CV
  previously cited a cybersecurity internship, but it is historical and does
  not establish an active company recruitment program. A ZainTECH group-wide
  careers page also links to a separate parent-company Workable portal; it
  should not be conflated with STS-specific openings. The former 251-500
  employee estimate was replaced by LinkedIn's published 201-500 band. No
  dedicated HR email, independently confirmed office entrance or current
  entry-level vacancy was established. Another STS record exists at
  companies/sts-specialized-technical-services.yml; it was not edited in this
  single-company review. Company-level verification remains partial regardless
  of the address evidence.
