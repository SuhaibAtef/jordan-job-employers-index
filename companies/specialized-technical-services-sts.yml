name: "Specialized Technical Services (STS)"
description: >-
  Specialized Technical Services (STS) is an Amman-headquartered ICT systems
  integrator and digital-transformation provider founded in 1989. Operating as
  a ZainTECH subsidiary, it supplies enterprise infrastructure, cloud and
  managed services, cybersecurity/SOC, network integration, and technology
  solutions to public- and private-sector clients in Jordan and the region.
  ZainTECH identified STS as its Jordan subsidiary in October 2025.
