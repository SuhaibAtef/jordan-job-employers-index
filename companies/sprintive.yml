name: "Sprintive"
description: >-
  Sprintive is an Amman-based digital transformation and open-source software
  agency founded in 2016. It builds Drupal-based websites and digital platforms,
  offers web and mobile application development, UI/UX design, accessibility,
  website auditing, Drupal consulting and support, and search optimization.
  Its official site and Drupal.org profile identify it as a Drupal Gold
  Certified Partner and a subsidiary of Saudi technology company Naseej.
