notes: >-
  Reviewed 2026-10-31. Official website and Drupal.org identify Sprintive
  as an Amman-headquartered Drupal-focused digital agency, founded in 2016,
  offering digital platforms, web/mobile development, UI/UX, Drupal support,
  accessibility, audits and SEO. The Drupal.org Gold Certified Partner
  profile and official Naseej investment announcement support its partner
  and ownership descriptions; the investment dates to 2020. LinkedIn
  lists 11-50 company-wide employees; Jordan ICT's 2024 company profile
  reported 31 staff, not a verified 2026 headcount. Sprintive's official
  contact page gives Al Jalal Complex, Suhayb Ben Sinan Street, Amman,
  P.O. Box 2894, postal code 11181 and phone +962 6 4642339; Clutch
  independently repeats the address. Office occupancy and entrance
  coordinates were not independently geocoded. The existing coordinates
  31.967507,35.905283 remain approximate, with low coordinate confidence;
  a coordinate-search Maps link is not proof of a business pin. The
  company's official careers page displayed several positions on the
  review date, including a Flutter Developer requiring 2-5 years and
  a Senior Drupal Developer. The Flutter job description specifically
  mentions Drupal integrations, REST/GraphQL, Firebase, Dart and Git,
  but these requirements are not an independently audited production
  stack. The application form was accessible as a page but submission
  was not tested; posting dates and role-specific Jordan work locations
  were not stated. The earlier record's Internship and Junior signals
  were unsupported by a confirmed opportunity and have been replaced
  with qualified hiring observations. A LinkedIn post about student
  project collaboration does not establish a formal internship.
  The contact page obfuscates its general email, and no dedicated
  recruitment mailbox was confirmed, so hr_email remains null.
  Company verification is partial and distinct from location verification.
