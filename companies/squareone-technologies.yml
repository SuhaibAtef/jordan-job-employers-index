name: "SquareOne Technologies"
description: >-
  SquareOne Technologies is a Dubai-headquartered IT services and digital
  transformation company founded in 2008, with a documented office in Amman,
  Jordan. Its services include robotic process automation, enterprise content
  and document management, data integration and analytics, artificial
  intelligence, business process management, low-code applications, and
  enterprise technology consulting. Its official website lists regional
  partnerships with Microsoft, Automation Anywhere, Hyland, Qlik and Kore.ai.
