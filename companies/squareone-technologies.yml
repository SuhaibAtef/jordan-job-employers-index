notes: >-
  Reviewed 2026-10-31. SquareOne's official website, contact page and LinkedIn
  corroborate the company, its Dubai headquarters and its Amman branch. The
  official Amman address is Khalda, Wasfi Al Tal Street, Al Hayat Complex,
  Building 257, fourth floor, Office 402; the phone is +962 6 5542091.
  LinkedIn and Craft independently reproduce the address. The original
  31.9518,35.94042 city-centre coordinates were inconsistent with Khalda
  and replaced with 31.9927321,35.8631268 from the Google Maps business
  place link supplied by SquareOne's own contact page. This is a linked
  business pin, not a surveyed office entrance or proof of occupancy;
  location status remains provided_unverified. LinkedIn gives 201-500
  company-wide employees and 2008 founding, superseding the unsupported
  51-200 estimate; Jordan-specific headcount is unknown. The official
  careers page links to a Zoho Recruit portal with two Jordan positions,
  Senior Java Developer (opened 2023-10-20) and Team Lead Automation
  (opened 2022-06-01). Third-party Dr.Job copies claim September 2026
  posting and December 2026 deadlines, but their freshness conflicts with
  the older official opening dates. A junior Power Platform vacancy asking
  for 0-1 years was found on LinkedIn but is closed. The official careers
  contact careers@squareonemea.com is supported. Technology descriptions
  reflect public partner offerings and historical role requirements,
  not a verified internal production stack. September 2026 official news
  supports regional activity, not a current Amman hiring commitment.
  Earlier generic job-directory and LeadIQ sources are retained only as
  historical research context. Company verification remains partial,
  independent of location confidence.
