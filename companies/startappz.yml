description: >-
  Startappz is an Amman-headquartered digital product and software development
  agency serving telecom operators, banks, government organizations and other
  enterprises. Its public services include mobile and web application
  development, UX/UI design, software architecture, digital transformation and
  digital marketing. Its official website lists offices in Amman, Dubai and Riyadh.
