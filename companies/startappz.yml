notes: >-
  Reviewed 2026-10-31. Official website, About Us, contact page and LinkedIn
  confirm Startappz as a regional digital product agency with Amman operations.
  LinkedIn reports founding in 2011 and a company-wide 51-200 employee band;
  the Jordan ICT directory also records 2011, but no audited current Jordan
  workforce figure is available. The official contact page lists third floor,
  Building 41, Abd Al Rahim Al Haj Street, Sweifieh, Amman, phone
  +962 797733772 and general email info@startappz.com. LinkedIn and older
  third-party listings still give Al Izz Bin Abdelsalam Street, Building 10;
  this conflict may reflect an older office and was not independently resolved.
  Previous coordinates 31.958704,35.8642463 were retained only as a low
  confidence approximate Sweifieh pin, not a surveyed entrance or proof of
  present occupancy; the prior verified location label was downgraded to
  provided_unverified. The official About Us page identifies Intisar
  Abuhalaweh as Admin and HR Manager, but publishes no direct HR address.
  The official 2025 recruitment posts use hiring@startappz.com; that address
  is a historical recruiting contact, not confirmation that applications are
  currently accepted. The official careers page says there are no available
  positions on review date. The 2025 Senior Android job demonstrates historical
  demand for Android, Kotlin, Jetpack and Firebase; Flutter was only an
  optional skill. Other technology tags (HTML, JavaScript, PostgreSQL, Python,
  React, Redis and TypeScript) were preserved from earlier employee-profile
  research in this record, but their underlying CVs were not independently
  rechecked and they are not established as the current production stack.
  A prior internship claim likewise lacks a current attributable opening.
  Company verification is partial; a published address does not establish
  complete company verification.
