notes: >-
  Reviewed 2026-10-31. STME's official site and LinkedIn establish a regional
  enterprise infrastructure integrator headquartered in Riyadh and founded in
  1982; the official homepage reports a 2026 merger of Creative Telecom Company
  and Integrated System Solutions into STME. Its official contact page lists
  an Amman office on Zahran Street in Abdoun, with telephone +962 6 5850368
  and mobile +962 799747807. The About page lists a different Jordan number,
  +962 6 559 0006, so telephone details should be checked before use.
  Neither page supplies a building or unit number. The contact page's map
  link resolves to Al Fadl Ben Al Hasan Street around 31.957658,35.867807,
  which does not independently establish the stated Zahran Street office;
  the old coordinate pin 31.95185,35.89474 was therefore removed. This is
  a company-published location, not a physically verified office entrance.
  LinkedIn's 51-200 employee band is company-wide and not a Jordan headcount;
  the careers page separately claims 120+ engineers and specialists across
  eight markets. The official careers page redirects job discovery to LinkedIn,
  but a currently open Jordan role, graduate intake or internship could not
  be substantiated; the original internship flag was unsupported. No dedicated
  HR or recruitment email was found. supportline@stme.com and sales@stme.com
  are published support/sales contacts, not HR contacts. Veeam, Commvault,
  Cohesity, Fortinet, Palo Alto Networks and NetApp ONTAP are publicly
  advertised partner/customer-solution technologies, not proof of the
  company's internal production stack or Jordan team skills. Current
  company-level verification remains partial despite confirmed official
  business information and the published Amman location.
