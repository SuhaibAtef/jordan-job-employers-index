notes: >-
  Reviewed 2026-10-31. STRIDE's official website and Odoo's independent partner
  directory establish an active Amman-based Odoo implementation, migration,
  customization and support business. The company advertises its EPMS,
  STRIDELAB, ROOTS and Bio-Pest Odoo solutions; its published Odoo Apps Store
  modules independently support active Odoo module development. LinkedIn
  reports a 2023 founding, King Hussein Business Park headquarters and a 2-10
  company-wide employee band; this is not an audited Jordan headcount. The
  official contact page and Odoo partner listing agree on King Abdullah II
  Street 242 within King Hussein Business Park. LinkedIn specifies Building 23,
  while the company's website footer says 23B; neither an exact office unit
  nor a geocoded entrance was corroborated. Removed the old precise-looking
  business-park coordinates because they did not verify the office entrance.
  The published info@stridebs.com and Odoo directory's admin@stridebs.com are
  general/business contacts, not confirmed recruiting mailboxes, so hr_email
  is null. The homepage describes the company as an Odoo partner; Odoo's own
  partner directory identifies its partner listing, but no Gold tier is
  independently asserted here. Historical LinkedIn Odoo Developer postings
  establish early-career (1-2 years) recruitment and relevant requirements,
  but explicitly state that applications are closed. No internship program or
  current graduate vacancy was verified, correcting the earlier unsupported
  Internship signal. Odoo versions describe delivered solutions, and listed
  programming/infrastructure tools come from historical hiring requirements,
  not an audited internal production stack. Company verification remains
  partial because precise office occupancy, HR recruitment contact and
  current hiring status remain unconfirmed.
