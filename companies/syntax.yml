notes: "Reviewed 2026-10-31. The live official site documents brand strategy, product/service, digital and spatial design work and current portfolio examples. Its people page lists Mid Level Designer, UI/UX Designer, Project Coordinator and Business Developer as 'Open Position' with applications to careers@syntaxdesign.com; postings have no publication dates and application acceptance was not tested. The same page identifies Ghadeer Jarrar as HR/Office Manager, Ahmad Humeid as founder/CEO and Qusai Naim as a front-end developer. The official contact page and LinkedIn agree on 133 Arar Street, 4th Floor, Office 27 (Al Hassan Center/Suite 27), Wadi Saqra, Amman, telephone +962 6 4612834; a mapped directory point close to the existing coordinates corroborates the street-level area, but not the exact office entrance or present occupancy. Coordinates are approximate, location confidence medium for published street/office address and low for the pin. LinkedIn estimates 11-50 employees, consistent with Clutch's 10-49 and a historical Jordan ICT profile reporting 20 staff; none is an audited 2026 headcount. A 2010 company recruitment post described HTML-oriented interactive architecture and allowed applicants without experience, but is historical and does not establish a current graduate program or modern engineering stack. HTML is historical recruitment evidence only; previously listed CSS and JavaScript lacked specific support and were not retained. No independently verified internal production stack, active internship or dated entry-level vacancy was established. Company verification is partial notwithstanding the corroborated address and current recruitment links."
