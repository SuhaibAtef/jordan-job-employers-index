notes: "Reviewed 2026-10-31. The official site describes cloud POS and agentic AI for restaurants and cafes; the official about page says founded in 2024. The official contact page lists the Jordan office at Airport Road, Building B3, 3 Yasser Saba'neh Street, Amman, telephone +962 6 222 9423 and WhatsApp +962 79 330 4433. This establishes a published office address but not physical occupancy or an independently confirmed entrance. Previously stored coordinates 31.9539, 35.9106 were removed because they could not be tied reliably to the stated Airport Road office; map pin confidence is unresolved, published address confidence medium. Company LinkedIn estimates 51-200 employees globally, not a Jordan headcount. Safaa AlGhizayel is identified as Human Resources Manager on historical company LinkedIn job posts, but no dedicated recruitment email was verified; support@tabsense.ai is a customer-support contact, not an HR mailbox. Historical Amman postings include Junior Quality Engineer (1-2 years), AI/LLM Integration Engineer (minimum 2 years), Data Engineer/Analyst (3+ years) and Customer Technical Support (entry-level classification); inspected LinkedIn pages say applications are closed. Listed technologies are advertised product capabilities or historical job requirements, not a confirmed current internal production stack; AI job listings include alternatives and examples, not proof of deployment. Wamda reported a $5 million round led by Jasoor Ventures on 2025-10-21 and planned growth of AI and engineering teams; this is not evidence of an open vacancy today. No official careers portal, current Jordan internship, active graduate vacancy, current HR mailbox or exact mapped entrance was confirmed. Company verification is partial, separate from location status."
