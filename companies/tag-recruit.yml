description: "Talal Abu-Ghazaleh Recruitment and Human Resources Development (TAG-Recruit) is a recruitment and HR development firm within Talal Abu-Ghazaleh Global. It provides candidate sourcing and assessment, executive search, job-matching support, job-description and employment-contract assistance, and an online vacancy and candidate-registration portal for employers and job seekers in Jordan and other markets. Its job board advertises technical and nontechnical roles, but those postings do not establish TAG-Recruit's own engineering headcount or internal technology stack."
