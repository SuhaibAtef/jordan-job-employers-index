notes: "Reviewed 2026-10-31. TAG.Global's official company directory and TAG-Recruit's own Who We Are page confirm the distinct recruitment/HR development firm and its group affiliation. Its live tagirecruit.com site offers candidate sign-up and displays Jordan vacancies, including junior auditing and senior software engineering roles. A Full Stack Developer listing (job ID 21317) was originally posted 2021-06-15, specifies 3-5 years and C#, ASP.NET Core/MVC, Web API, LINQ, Entity Framework, SQL and optional Angular, and shows a 2026-10-31 deadline. A Junior Auditor listing (job ID 11312) was posted 2021-05-19, specifies 1-3 years and the same 2026-10-31 deadline. The board's 2026-09-12 news page also displays multiple Jordan vacancies; listing presence and future/expiring deadlines do not prove current acceptance or that TAG-Recruit itself is the employing organization. Previously recorded .NET, Angular, Ansible, AWS, C#, Git, Laravel, MySQL, PHP, Redis, SQL Server and Terraform are recruitment-ad requirements for TAG.Global or client positions, not evidence of TAG-Recruit's internal stack; removed from technologies while retaining job-category tags as historical advertised role types. The older tagirecruitment.com domain was not accessible; tagirecruit.com is the functioning official recruitment portal. TAG.Global LinkedIn gives the parent group 1,001-5,000 employees and the parent headquarters at TAG-Org Building, No. 26 Prince Shaker bin Zaid Street, Shmeisani, Amman, but neither figure nor address was verified specifically for TAG-Recruit. Therefore TAG-Recruit's own size, precise address, coordinates and map pin remain unknown; prior generic 31.9518, 35.94042 coordinates were removed. No standalone company LinkedIn page, dedicated HR email, TAG-Recruit-specific open vacancy, internship or confirmed candidate submission was established. The online contact form is available. Company verification remains partial and independent of location status."
