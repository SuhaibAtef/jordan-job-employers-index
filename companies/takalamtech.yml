notes: "Reviewed 2026-10-31. The official website describes a stuttering-support wearable using an audio-feedback/choral-effect approach, the Takalam Platform for therapist assessment forms, and Takalam Clinic as a shared-cloud clinical records concept. AI, IoT and mobile-app references are company-described product capabilities, not independently established internal production frameworks, languages or infrastructure. No technical hiring advertisement, currently accepting Jordan vacancy, official careers page or graduate/internship recruitment was corroborated; the prior Internship signal was unsupported and removed. LinkedIn identifies the company as privately held, headquartered in Amman, founded in 2018 and in the 2-10 employee band; the official About page instead displays 'Est. 2020', so the founding year is not treated as conclusively resolved. LinkedIn publishes Irshaid Al Sheebi Street, independently repeated by CB Insights and a medical-devices directory; the official site only says Amman, with no building or suite. The old coordinates represented a generic Amman point and were removed. Official contact phone is +962 79 83 72 000. The official contact page literally prints info@www.takalamtech.com, while Jordan's StartupsJo directory lists info@takalamtech.com; neither is documented as an HR/recruitment mailbox, so hr_email remains null. StartupsJo names Ghassan Ibrahim as a general contact, not an HR officer. A 2021 Jordan News interview identifies Abdallah Al-Faris as a founder; the LinkedIn profile remains active with product updates in 2026. The company's product effectiveness and Jordanian regulatory-certification statements are self-reported and have not been independently verified against clinical studies or the regulator. Company-level verification remains partial despite a corroborated street-level location."
