notes: "Reviewed 2026-11-01. Talabat's corporate website confirms Kuwait founding in 2004, acquisition by Delivery Hero in 2015, Jordan expansion in 2017, and food/grocery/retail delivery across eight MENA countries. The 2025 annual report states 7,821 group employees at 2025-12-31 excluding InstaShop; this is not a Jordan headcount, and LinkedIn's 1,001-5,000 size band differs. Talabat's official careers locations page lists its Jordan office as 'Qatari Jordanian Investment & Real Estate Development Co., Amman' without a street or unit. The company LinkedIn page instead lists Karadsheh Plaza Complex, Wasfi Al Tal Street, Khalda, while Waze and BizMidEast identify Talabat HQ at King Hussein Business Complex on King Abdullah II Street. Amman presence is high confidence, but the exact current office, entrance and coordinates are low confidence due to conflicting sources. Prior coordinates 31.9708716,35.8317251 were a third-party business pin and are intentionally cleared; the new maps URL is only a search, not location verification. Corporate contact lists inquiries@talabat.com for general enquiries, not HR; no dedicated public HR mailbox confirmed. On 2026-11-01 the official careers pages showed an Amman Category Manager (5+ years) and Account Manager (2+ years) with Apply links; neither is a confirmed internship or fresh-graduate role. .NET, C#, Go, AWS, CI/CD, Flutter, Dart and iOS are historical regional engineering job requirements from official postings in Cairo/Dubai, not evidence of a Jordan-office production stack. Full-company verification remains partial because the precise Jordan office, local headcount and HR contact remain unconfirmed."
