notes: >-
  Reviewed 2026-11-01. The official TAG.Global contact page lists Building
  No. 46, Abdel Rahim Al-Waked Street, Shmeisani, Amman, phone +962 6 5100 900
  and general mailbox info@tag.global. The company LinkedIn profile instead
  lists TAG-Org Building No. 26, Prince Shaker bin Zaid Street, Shmeisani;
  Waze has a TAG.Global listing at 104 Mecca Street. These may refer to
  different group offices; a single precise headquarters entrance or map pin
  cannot be established from the conflicting public records. Former
  coordinates 31.96644,35.89467 were not corroborated against the official
  contact address and have been removed. LinkedIn reports 1,001-5,000
  employees for the international group, while the official group directory
  describes over 1,500 professionals; neither provides a Jordan headcount.
  TAG-ITI's official 2024 service guide explicitly describes PHP, Drupal,
  WordPress, Java and MS.NET as web-development capabilities of that member
  firm. C#, ASP.NET, SQL and Angular are documented in an older 2021
  TAG-Recruit Full Stack Developer listing; they are historical advertised
  job requirements, not a verified current internal stack for TAG.Global.
  TAG-Recruit is a group member operating a recruitment portal for employers
  and job seekers, not necessarily a list of direct TAG.Global vacancies.
  The portal lists an Amman Auditor role posted 2026-09-24 (1-3 years of
  experience), with a 2026-10-31 deadline; as of this review the deadline has
  passed and application acceptance and employing entity are unconfirmed.
  No verified currently accepting direct group vacancy, graduate internship,
  dedicated HR mailbox or Jordan-specific staff count was established.
