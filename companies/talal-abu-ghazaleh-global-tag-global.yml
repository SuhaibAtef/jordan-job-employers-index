name: "Talal Abu-Ghazaleh Global (TAG.Global)"
description: >-
  Talal Abu-Ghazaleh Global (TAG.Global, also presented as TAG.Global Digital)
  is an Amman-headquartered international professional-services group founded
  in 1972. Its member firms provide audit and accounting, intellectual property,
  legal and management consulting, education and professional training,
  recruitment, and IT services including software development, cloud,
  cybersecurity and e-archiving. The group operates through multiple member
  firms and locations, so recruitment listings and technologies must not be
  attributed to every group company.
