name: "Talentspace.ai"
description: >-
  Talentspace.ai is an AI-enabled recruitment and workforce-technology platform
  founded in 2020, offering candidate sourcing, screening, job matching,
  recruitment automation, labor-market analytics and managed hiring services.
  Its brand operates through legal entities in Jordan, Saudi Arabia and Qatar;
  the official website identifies Al-Adwat Al-Tiqanih Lilbarmajah as its
  Jordanian operating company. The company's LinkedIn profile currently
  identifies Riyadh as its primary headquarters and lists an Amman office.
