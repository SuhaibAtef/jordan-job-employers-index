notes: >-
  Reviewed 2026-11-01. The official Talentspace.ai site describes AI recruitment,
  automated matching, candidate vetting, workforce services and labor-market
  analytics. Its official legal-information page names the Jordanian operating
  entity Al-Adwat Al-Tiqanih Lilbarmajah (national establishment number
  200148172) and gives Building 8, Al Adeeb Center, Al-Yanabii Street 102,
  Amman, telephone +962 79 588 5661. The official privacy policy separately
  states 6th Circle, Amman. LinkedIn lists an Amman office at Building 14,
  Hawa Complex, Office 15, Al-Yanabii Street and now describes Al Raed,
  Riyadh as the primary headquarters. CB Insights also repeats the Building
  14 address, while Lucidity Insights still describes Amman as headquarters.
  These are conflicting location and headquarters records, not evidence of
  one confirmed office entrance. Previous coordinates 31.956374,35.863308
  were not independently tied to the current official legal address and
  were removed; street-level Amman presence has medium confidence, precise
  unit and map pin low confidence. LinkedIn's 11-50 size band is company-wide,
  not a verified Jordan headcount. StartupsJo lists hello@talentspace.ai as a
  general contact and Mohannad Alsouqi as contact person, not as an HR contact;
  no dedicated HR email was corroborated. The retained recruitment-portal
  link is to an expired 2024 internship (HTML, CSS, JavaScript, React, Angular,
  Node.js), and a 2025 Software QA Engineer LinkedIn listing is closed.
  Historical senior engineering recruitment referenced the MERN stack.
  These technologies are historical advertised requirements, not a verified
  current production stack. Other portal internship entries are dated 2023-25;
  no currently accepting internship or direct vacancy was established.
