notes: "2026-11-01 company review: Official about page confirms nonprofit status, founding in 1999 and Noor Al Hussein Foundation ownership; branch directory lists 39 branches. Official team page says over 500 employees and identifies Nisreen AlSourani as Human Resources & Organizational Development Director; LinkedIn estimates 201-500, a conflicting platform estimate rather than audited headcount. Official contact lists info@tamweelcom.org and head-office telephone +962 6 4001344; info@ is a general inquiry address, not a dedicated HR mailbox. The official careers form explicitly welcomes fresh graduates and accepts CVs, but does not identify currently open dated positions or internships. Vendor documentation from 2024 describes an Oracle Database and Oracle WebLogic loan-management implementation; these are historical vendor-supported system technologies, not evidence of a complete current internal engineering stack. Official website, Central Bank of Jordan registry and geographic listings agree on Jureisat Center 2, Building 29, Sweileh, Amman; the retained 32.011949,35.832396 coordinate is a previously sourced approximate office pin, not a surveyed entrance. Corrected former area Ma'an to Amman/Sweileh (Ma'an is also a separate branch area). Verified location does not establish full-company verification; recruitment currency, precise pin and internal stack remain incomplete."
