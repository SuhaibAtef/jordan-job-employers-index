notes: "Reviewed 2026-11-01. Jordan Ministry of Labour's directory of private employment offices lists شركة الهدف للتوظيف / Target Recruitment Company, manager Mohammad Alawneh (محمد علاونة), 105 Wasfi Al Tal/Gardens Street, Al Barakah Building, fourth floor, Amman, phones +962 6 5532359, +962 6 5512555 and +962 6 5532330, and general mailboxes targetjo@targetjo.com and visa@targetjo.com. The directory identifies a manager, not a confirmed dedicated HR contact. The company-controlled contact page also confirms +962 6 5532359 and targetjo@targetjo.com. The company LinkedIn page corroborates Amman headquarters and Gardens Street, estimates 11-50 employees company-wide, and advertises recruitment and skill-matching services. Historic official targetjo.com job advertisements direct CVs to cv@targetjo.com, supporting the retained candidate-submission mailbox but not proving that it is currently monitored or a dedicated HR address. The older candidate-registration URL was retained but timed out during this review; the domain homepage was intermittently inaccessible. Third-party 2026-10-06 postings for client companies demonstrate agency placement activity, not direct staff openings; no currently accepting in-house vacancy, fresh-graduate internship or company engineering role was established. Official job adverts may reference IT, AutoCAD or other skills for client placements; these are not evidence of Target Recruitment's internal software stack, so technologies remains empty. Waze and Bizmideast corroborate building 105 and the street but not independently verified occupancy; older directories disagree on third versus fourth floor, so the ministry's fourth-floor entry is preferred while the conflict remains noted. Removed prior unverified coordinates. Company verification remains partial despite the official registry and published location."
