name: "Tawqi3i"
description: "Tawqi3i (توقيعي) is an Amman-headquartered Jordanian software company founded in 2021 that develops electronic/digital-signature and digital-trust services for government, financial institutions and businesses. Its products include document-signing workflows, identity and authentication integrations, eSignature APIs, and government and banking signing solutions. Jordan Ahli Bank independently confirmed deploying Tawqi3i's remote digital-signature technology in August 2026."
