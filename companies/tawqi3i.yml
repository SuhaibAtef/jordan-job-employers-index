notes: "Reviewed 2026-11-01. Tawqi3i's official site documents e-signatures, digital signing for the SANAD government gateway, banking remote-signing solutions, API integrations and mobile/web products; the site describes eIDAS compliance, but its broad legal-compliance claims were not independently audited. Jordan Ahli Bank's August 2026 announcement independently corroborates Tawqi3i's remote signing engine and Central Bank of Jordan PKI integration. LinkedIn identifies a privately held Amman-headquartered software-development company founded in 2021, with an 11-50 employee estimate; Jordan ICT independently lists establishment in 2021, CEO Sami Rasekh, CTO Raed Abu Sanad and P.O. Box 140317, Amman 11814. A postal box is not a street address. No physical office entrance, business-specific coordinates or reliable map pin was established; previous city-centre coordinates were removed. The official support page gives info@tawqi3i.com as a general sales/corporate address, not a dedicated HR mailbox; official sales phones are +962 77 883 8091 and +962 77 909 2588. The official careers page has a general application form, without an independently verified currently accepting role. Historical LinkedIn job ads confirm direct Amman hiring in React/Redux/JavaScript, React Native/TypeScript, .NET/C#/Docker and UX design; those postings are closed. The technologies field combines supported public product interfaces/platforms and historical recruitment requirements, not a verified current internal production stack. The Apple App Store listing corroborates the iOS application. No current internship, dedicated HR contact, or exact office address was established. Company verification remains partial regardless of headquarters corroboration."
