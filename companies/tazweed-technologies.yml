notes: "Reviewed 2026-11-01. Tazweed Technologies' official tazweed.tech website and Jordan ICT directory describe a Jordanian ICT/ITO company established in 2025, with managed ICT, software and hardware resale, systems integration, MSSP/MDR cybersecurity, data networks, datacenters and physical security solutions. Jordan ICT names Mohammad Eid as general manager and reports 12 staff; the company LinkedIn page estimates 11-50 employees. The official site gives +962 6 535 2222 and Dabouq, Amman 11822, but no independently corroborated street/building/entrance. Its embedded Google Maps plus code 2R7M+MC is site-provided only; the previous 31.95672, 35.92519 coordinates were removed as unsupported for this office. The official contact-center page invites job seekers to submit CVs, while the company's LinkedIn recruitment advertisements and historical job posts explicitly provide careers@tazweed.tech. Recent LinkedIn posts advertise 1-3-year PreSales and Sales Executive positions without a confirmed closing date; other LinkedIn jobs are closed. The technologies field lists vendor solutions publicly marketed or supported by Tazweed (Acronis, Microsoft 365, Azure, GCP, AWS), not a verified internal software-development stack. The previously recorded claim that Tazweed Technologies is a Mezzan Holding company appears to conflate this 2025 ICT firm (tazweed.tech) with a separate venture-capital business (tazweed.jo, founded 2011); no ownership relationship was substantiated. Exact office location, current acceptance of vacancies, and internal engineering stack remain unverified, so company verification is partial."
