notes: >-
  Reviewed 2026-11-01. Official TebCan About Us page confirms appointment booking,
  telemedicine, medical tourism and a cloud-based healthcare platform serving Jordan
  and Saudi Arabia. Official Jordan website publishes +962 6 400 1111. The LinkedIn
  company profile identifies Riyadh as primary headquarters, founded 2015 and 51-200
  employees globally; third-party CB Insights identifies 221 Zahran Street, Amman,
  as a headquarters address. This Amman street address is not confirmed by the
  official site as a currently occupied office, and no independent exact map pin
  was established; previous coordinates and coordinate-based maps link were removed.
  LinkedIn historical Amman vacancies for Registration Officer and Call Center
  Agent explicitly accepted fresh graduates and directed applications to
  hr@tebcan.com; both are closed, and the mailbox's present use is unverified.
  support@tebcan.com is a public general-support address, not an HR contact.
  Official Google Play publisher Tebcan LLC confirms an Android application;
  Angular was recorded from an earlier 2026-10-04 site-source inspection, not
  independently revalidated here and not proof of the current internal stack.
  No official careers page, active vacancy, internship or Jordan headcount was
  independently confirmed. Company verification remains partial, regardless
  of its presence in Jordan.
