notes: "Reviewed 2026-11-01. Official company website describes software engineering, AI/LLM automation, SaaS, mobile development, system integration and sector-specific platforms; these are service/product capabilities, not proof of a particular deployed engineering stack. Official About page says founded in Amman in 2016, whereas LinkedIn and Clutch report 2017; founding-year discrepancy unresolved. LinkedIn reports 11-50 employees globally (not Jordan headcount), while Clutch uses 10-49. Official contact page and Clutch independently list the Amman branch at King Hussein Business Park, Building 15, telephone +962 79 519 2265. LinkedIn lists Al-Sha'b Street, 15, Amman, which may be another description of the same location. Previously recorded 31.9727151,35.8336835 coordinates lie within/near the business park and are retained only as an approximate park-level pin, not independently confirmed Building 15 entrance or occupancy; location.status verified reflects address corroboration, not exact-pin precision or company-wide verification. Official careers page publicly invites fresh graduates and students and lists broad role families with general CV submissions to careers@technzone.com; it does not identify dated individual openings or an internship programme. contact@technzone.com is a general business contact. A historical Amman Senior UI/UX Designer advertisement is closed; it references Figma and other design tools. A historical company hiring post reproduced on an employee's LinkedIn profile references .NET, Angular, Node.js, SQL Server and REST integrations. Prior record also associated iOS with an employee profile, but current employment or production deployment was not established. Odoo appears in an official client case study; technologies are historical job requirements or documented client solutions, not a validated current internal stack. Verification remains partial due to unresolved founding date, limited direct stack confirmation, undated role-family listings and no independently confirmed exact office entrance."
