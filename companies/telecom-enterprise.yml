notes: "Reviewed 2026-11-01. Official tele-ent.com site is live and describes managed mobile VAS/content, USSD advertising, TE-Cards POS, Sambateek/Takhsees diet services and Into Gamers top-ups. Jordan ICT's 2022 directory lists 2010 establishment, 25 staff, MENA services, Amman P.O. Box 360064, telephone +962 79 6968481, Aiman Ziq as CEO and aiman@tele-ent.com as a business contact; these figures and personnel are historical, not independently reconfirmed in 2026. A third-party aggregator estimates 11-20 employees, conflicting with the historical 25; no reliable current headcount established. The official dev.tele-ent.com TE VAS login lists support@tele-ent.com for product support, not HR. No verified company LinkedIn page or current careers page, job posting, internship or graduate-hiring evidence found; the similarly named telecomenterprise.net LinkedIn company is an unrelated Cairo-based entity and must not be used. The prior Queen Rania Street/Abu El Hajj Commercial Complex floor/office address and coordinates were not corroborated by the company or reliable independent geographic sources and have been removed; only city-level Amman is supported. USSD and SMS are documented service platforms; Android is supported by the third-party app listing for the Telecom Enterprise-published SlimCity Diet app, not proof of a full internal stack. Removed unsupported PHP, HTML and JavaScript internal-stack claims and unsupported internship signal. Company verification is partial because precise office location, current workforce, HR recruitment channel and current technical stack remain unverified."
