notes: >-
  Reviewed 2026-11-01. The company's LinkedIn profile identifies 2017 founding, custom software, mobile and web development, UI/UX, QA, cloud and DevOps, and 51-200 employees; Clutch lists 50-249, while an older Wuzzuf profile lists 11-50 and founded 2016. TechBehemoths lists founded 2018, so 2017 is the better-corroborated but not legally verified founding year. The official domain terkwaz.com could not be accessed during this review, so no current official careers page or official HR mailbox could be verified. The previously stored info@terkwaz.com is a general contact, not demonstrated to be HR; current monitoring is unknown. Wuzzuf shows no open positions. A historical LinkedIn Senior QA Specialist vacancy for Egypt is closed and documents Java, Selenium WebDriver and REST Assured requirements; a 2020 client review on Clutch describes a React developer on a project. .NET, Android and PHP appear in third-party service listings; all technology entries are historical project, job or advertised service evidence, not a verified current internal production stack. No evidence supports the previously stored internship claim, so the early-career signal is false. LinkedIn identifies Wasfi Al Tal Street, Al Mehanyyeh Tower, Khalda, Amman; Clutch, Lisnic and BizMidEast corroborate number 176, but JordanYP and SEM Firms list 195. The previously verified tower-area geocode is retained as approximate, not as an entrance fix. Verified location is limited to street/tower-level corroboration and does not mean full-company verification. Jordan ICT lists telephone +962 79 925 3290 as a business contact, not a recruitment line.
