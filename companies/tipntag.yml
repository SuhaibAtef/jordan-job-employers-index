notes: >-
  Reviewed 2026-11-01. The official Tip n' Tag website remains accessible and describes local Q&A, community discovery, advertising and development work. Its About page says Khalid Kassim created the platform in 2011; LinkedIn lists founding in 2012, so legal founding year is unresolved. LinkedIn classifies the company as telecommunications but its actual services are more accurately local discovery, advertising and restaurant-ordering technology. The company LinkedIn profile lists 11-50 employees; Bayt's older employer profile lists 1-9, so no current headcount is confirmed. Tip n' Tag's own HQ listing and LinkedIn identify Rainbow Street, First Circle; Tatbeeqi's website states 59 Rainbow Street and solutions@tipntag.com, while Google Play lists Tip n' Tag, LLC as the Tatbeeqi Merchant publisher and a separate developer address at 33 Mecca Street. The Rainbow Street office address is plausible but current occupancy is not independently confirmed; earlier city-centre coordinates were removed as not a precise business location. The official Tip n' Tag contact page provides a Career Opportunities email link and a form accepting CVs, but the email address is obfuscated in the available page and was not transcribed or guessed. This is a general career-contact route, not evidence of a currently open role. No currently accepting vacancy, graduate internship or early-career programme was verified. Apple lists the company's Tip n' Tag iOS app (last version dated January 2021) and multiple branded restaurant apps; Google Play confirms Android merchant and restaurant products. Android and iOS are documented delivery platforms, not proof of a current internal programming stack. The previous Flutter attribution from an unrelated or unverified personal GitHub project could not be independently tied to this company and was removed.
