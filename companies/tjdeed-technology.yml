notes: >-
  Reviewed 2026-11-01. Official company website, company LinkedIn and Jordan ICT establish a 2010 founding, Amman headquarters and enterprise ITSM/ITAM, cybersecurity, endpoint management, cloud, automation and systems-integration services. LinkedIn's 51-200 range is company-wide; Jordan ICT's 120+ experts is a reported figure, not an audited headcount. Official contact page and company LinkedIn agree on Al Hussaini Complex 147, Mecca Street, third floor, Office 309; BizMidEast corroborates Mecca Street 147 and telephone +962 6 551 8040. This is corroborated address-level location evidence, not verified entrance GPS or proof of full-company verification. Unsupported previous coordinates were removed. The company publicly names Raghda (Raghdah) Al Durrah as HR manager in its April 2026 HTU career-day and February 2026 employee-wellbeing announcements, but no dedicated recruitment email was confirmed; info@tjdeed.com is expressly for general inquiries and is not HR. The official careers portal lists Jordan roles, including a May 2026 UEM Systems Engineer position requiring 1-3 years of experience, and displays application forms; no application submission was tested, so current intake cannot be guaranteed. Darb is a documented training/incubation programme for final-year students and graduates, with a June 2026 network-training cohort and a public registration form; a future cohort is not guaranteed. ManageEngine ServiceDesk Plus and Ivanti EPM are documented customer-delivery platforms. SQL Server, Windows Server, Active Directory and PowerShell are requirements in the May 2026 Jordan UEM posting; Microsoft 365 is in company LinkedIn specialties. Azure, AWS, EDR/XDR and SIEM appear as preferred familiarity in an April 2026 Iraq System Engineer posting, not verified Jordan deployment or the company's internal production stack. Previous unsupported ERP and DevOps category assignments were removed. Partial verification reflects missing confirmed HR mailbox, unverified precise GPS and limited production-stack visibility despite corroborated company operations and address.
