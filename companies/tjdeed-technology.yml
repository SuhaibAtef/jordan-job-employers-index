description: >-
  TJDEED Technology is an Amman-headquartered regional IT solutions provider and systems integrator established in 2010. It provides enterprise IT service and asset management, endpoint and infrastructure management, cybersecurity, cloud and collaboration solutions, AI-enabled automation and digital transformation consulting for organizations across the Middle East. Its Darb programme trains final-year students and recent graduates in practical IT disciplines.
