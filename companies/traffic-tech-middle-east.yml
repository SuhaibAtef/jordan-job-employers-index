name: "Traffic Tech Middle East"
description: >-
  Traffic Tech Middle East (TTME) is an Amman-founded intelligent transportation and
  traffic-engineering systems integrator established in 1985. It supplies, integrates,
  installs and maintains traffic monitoring and enforcement systems, urban traffic
  control, smart parking and access control, CCTV, automatic number-plate recognition,
  industrial weighing and weigh-in-motion systems in Jordan and other regional markets.
  Traffic Tech (Jordan) Co. (TTJ), established in 1994, is described by the company as
  its principal Jordanian contracting subsidiary.
