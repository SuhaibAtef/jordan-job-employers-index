notes: >-
  Reviewed 2026-11-01. The official site and company LinkedIn identify Traffic Tech
  Middle East as founded in Amman in 1985; Traffic Tech (Jordan) Co. is described as a
  related contracting company founded in 1994. Official product pages document ITS,
  ANPR, IP CCTV, RFID, WIM and parking systems, while the company's project gallery
  describes SCADA-enabled parking guidance at Abdali Boulevard and Abdali Mall.
  Jenoptik's 2025-10-28 release independently confirms a Greater Amman Municipality
  contract with TTME as local integrator/maintenance partner for 41 TraffiStar SR591
  cameras, nine VECTOR SR P2P devices and the FlowTris back-office platform; the
  announcement is not evidence that deployment was completed. These are delivered
  products/partner platforms, not a verified internal programming or production stack.
  Company LinkedIn gives 11-50 employees; the 500+ figure belongs to the separately
  profiled Doha-based Traffic Tech (Gulf) W.L.L. and must not be used as TTME staff size.
  The official site, LinkedIn and Parking Network corroborate No. 4 Suleiman Nabulsi
  Street, Amman and phone +962 6 464 6941. The prior precise coordinates were not
  independently corroborated and were removed. The previously listed
  ttme@traffic-tech.com is a general business contact in Parking Network, not a
  verified HR mailbox. No TTME-specific active careers page, current vacancy,
  recruitment mailbox, internship or fresh-graduate programme was established.
  Do not confuse this Jordanian traffic-systems company with traffictech.com, a
  similarly named global freight/logistics business. Full-company verification
  remains partial because recruitment information, current staff count and internal
  software stack are not independently established.
