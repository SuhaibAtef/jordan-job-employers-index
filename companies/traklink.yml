name: "TrakLink"
description: >-
  TrakLink is an Amman-based Jordanian telematics and Internet of Things (IoT)
  solutions provider established in 2005. It provides GPS-based vehicle and asset
  tracking, fleet management, route and driver monitoring, video telematics,
  smart metering and LoRaWAN connectivity, together with customized software
  and IoT integrations. Its company LinkedIn profile now uses the name
  AlMutawirah for Telecom and Software Services, Traklink; the exact current
  registered legal entity name has not been independently confirmed.
