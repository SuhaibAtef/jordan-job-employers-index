notes: >-
  Reviewed 2026-11-01. The official About page and company LinkedIn both report
  a 2005 founding. The LinkedIn company profile identifies the organization as
  AlMutawirah for Telecom and Software Services, Traklink and states that its
  company name changed; this should not be treated as independently verified
  corporate-registration evidence. The official website documents GPS fleet
  and asset tracking, CAN-bus diagnostics, LoRaWAN services, ADAS/DMS video
  telematics and bespoke software; the official contact FAQ confirms mobile
  and browser-based customer access and geofencing. Gurtam's 2023 partner
  interview confirms historical Wialon platform adoption, a Gold partnership
  since 2015 and an in-house development team, but does not verify present
  deployment versions or programming languages. An app listing identifies
  TrakLink Co as publisher of Android TrakLink TAM, while unrelated apps
  with similar names must not be attributed to this company. The original
  generic GIS and SMS Gateway stack entries were not independently verified
  as internal engineering tools and were replaced by evidenced product and
  connectivity capabilities; the current internal software stack is unknown.
  The official contact page gives phone +962 6 541 2281 and general mailbox
  info@trak-link.net. Company-authored LinkedIn recruitment posts and a
  recent Outdoor Sales listing explicitly give hr@trak-link.net; a fresh-
  graduate-friendly outdoor-sales role and several other recent roles were
  visible at review, but no dedicated careers portal, confirmed internship
  programme, or tested application acceptance was established. Official,
  LinkedIn and independent listings agree on Building 26, Al Al-Bayt Street,
  Dabouq; no trustworthy entrance-level coordinates were established, so the
  previous numeric pin was removed. Company-level verification remains
  partial despite the corroborated published street/building address.
