name: "Trixel Studios"
description: >-
  Trixel Studios is an Amman-based computer-generated imagery (CGI), animation
  and virtual-production studio founded in 2010 by Rami Al-Fuqaha'a. It
  produces 3D character animation, visual effects, architectural and interior
  visualization, interactive AR/VR/MR experiences, and game-design projects.
  The company says it joined forces with UBitc Group in 2022 and offers
  creative-technology training alongside client production services.
