notes: >-
  Reviewed 2026-11-01. The official About and Services pages corroborate the
  2010 founding, Rami Al-Fuqaha'a, CGI/VFX, animation, architectural
  visualization, XR and game design, as well as the reported 2022 collaboration
  with UBitc Group. Company LinkedIn activity in 2026 describes in-house
  avatar/character and virtual-production work; LinkedIn's 11-50 size band
  is not a current audited headcount. Official service pages mention Maya,
  Autodesk and V-Ray training expertise, and Unreal Engine virtual production;
  Clutch lists BIM as an architectural-design service, not a named software
  stack. Previously listed Unity was not corroborated and was removed.
  Official website contact details are +962 6 534 1800 and info@trixelcg.com,
  which is a general inquiries address, not a confirmed HR mailbox. The
  company advertises training courses and a training portal; course attendance
  is not evidence of a graduate job or internship. No current careers portal,
  recruiting email, active vacancy or formal internship was established.
  The official footer gives 162 King Abdullah II Street, Amman 11822, while
  company LinkedIn and BizMidEast identify no. 169 on the same street. Older
  TipnTag and Allspots listings give Al-Madinah Street, Al Basem Center,
  with inconsistent floor and office numbers. Exact current occupancy is
  unresolved; prior numeric coordinates were removed instead of asserting
  a verified entrance. Company verification remains partial.
