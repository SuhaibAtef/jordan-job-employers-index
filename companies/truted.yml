notes: >-
  Reviewed 2026-11-01. Official About page identifies Mohammad Al-Sallal as
  founder and a 2016 Amman origin, and documents websites, apps, cloud systems,
  e-commerce/POS integrations, digital branding and creative production.
  Portfolio case studies explicitly identify Angular, Node.js and MongoDB;
  mobile-services graphics show Flutter, Kotlin and Swift, without proving
  deployment in a specific client project. The official careers page currently
  lists one Angular Front-End Developer opening in Amman (full-time,
  mid-senior), asks for JavaScript, HTML and CSS, and accepts general
  applications at careers@truted.com. No graduate-specific vacancy or formal
  internship was confirmed, so early_career_signal remains false. The
  company contact page independently publishes the same recruitment mailbox,
  general contact hello@truted.com and phone +962 79 155 5633. LinkedIn
  lists 51-200 employees; the official About page says 50+ professionals
  across five international offices but elsewhere says 15+ team members,
  while third-party agency directories report different ranges. None is
  an audited current Jordan headcount. Official contact, Clutch and DesignRush
  corroborate Queen Rania Street, Amman, without a building or suite.
  The map pin is taken from the Google Maps business listing linked on the
  official contact page, not a verified entrance. The previous 31.99797,
  35.88235 coordinates were not supported for the listed headquarters.
  The full current production stack, precise office occupancy, current
  application acceptance and early-career hiring remain unconfirmed;
  company verification is therefore partial. Previously listed WordPress
  was not established as a production technology, and a DevOps specialization
  was not independently confirmed.
