name: "TruTed"
description: >-
  TruTed is an Amman-headquartered software development and digital-product
  agency founded in 2016 by Mohammad Al-Sallal. It designs and builds websites,
  e-commerce and retail platforms, mobile applications, cloud-based systems,
  and custom business software. Its official portfolio describes inventory,
  point-of-sale and order-management integrations, while its services also
  cover UI/UX, branding and creative production for clients internationally.
