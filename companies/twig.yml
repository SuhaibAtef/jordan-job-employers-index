notes: >-
  Reviewed 2026-11-01. The Jordanian TWIG gardening business is distinguished
  from unrelated international companies named Twig. January 2021 coverage by
  intaj, MAGNiTT, LAFFAZ and Wamda confirms seed funding from Miqdadi AMC,
  founder/CEO Mohammad Al Homsi and HASSAD accelerator participation; LAFFAZ
  names Ali Al Rawashdeh, Ayat Shahin and Mohammed Al Houmsi as 2019 founders.
  The company LinkedIn profile identifies an Amman headquarters, a gardening
  products/services marketplace, an app, smart irrigation and an 11-50 employee
  band, but lists a conflicting 2021 founding year. The Refugee Investment
  Network also describes the 2019 founding and links twigjo.com. The
  www.twigjo.com site was accessible during this review and displayed plant
  product listings, but its homepage also contained unrelated placeholder
  travel-destination text; its current commercial reliability and recent
  transaction activity are therefore unconfirmed. LinkedIn links to
  ar.twigjor.com, which could not be accessed during the review. Buildeey and
  JordanYP list Mecca Street, plus code XVG6+5HG and phone +962 7 7719 3008;
  these directory listings do not independently establish current occupancy.
  The previous central-Amman coordinates were removed rather than misrepresenting
  an exact office. No current careers page, recruitment email, dated job post,
  employee hiring campaign or internship was found. The company mentions
  gardener onboarding and potential training, not verified employee recruitment.
  The mobile/web product is documented, but no programming languages, app
  frameworks or IoT implementation are verified; the former generic IoT
  category was removed. Partial company verification reflects historical
  identity and services with unresolved current operations, location and hiring.
