name: "TWIG"
description: >-
  TWIG is a Jordanian agritech and gardening marketplace founded in 2019,
  connecting garden owners with landscaping, garden-maintenance, farm-management
  and agricultural-supply services. Its published product concept includes
  a web marketplace and mobile application for ordering products and services,
  tracking maintenance, and arranging smart irrigation systems. A January 2021
  funding announcement documents investment from Miqdadi Agricultural Materials
  Company and participation in the HASSAD agritech accelerator. Current operating
  activity and recruitment could not be independently confirmed in November 2026.
