name: "UBA - United Business Applications"
description: >-
  United Business Applications (UBA) is an Amman-headquartered business software
  and digital-transformation consultancy founded in 2002. It implements and
  supports ERP, CRM, business-intelligence and HR management solutions, including
  Microsoft Dynamics 365, Power Platform, Sage and Salesforce products. UBA also
  develops its DXTR automotive dealership-management system, Kayan HR platform
  and Jordanian electronic-invoicing integrations, and serves customers across
  the Middle East.
