notes: >-
  Reviewed 2026-11-01. The official site and company LinkedIn establish a 2002
  founding, Amman headquarters, ERP/CRM/BI implementation and consulting, and
  the DXTR automotive and Kayan HR products. Microsoft Dynamics 365, Power
  Platform, Azure, Power BI, Salesforce, Sage and Bitdefender are documented
  customer-facing platforms, not proof of UBA's internal production stack.
  Historical Amman developer vacancies mention Node.js, Django/Python, React
  and Vue; these are not current engineering-stack confirmations. SAP and Odoo
  were removed because current official offerings did not substantiate them;
  the prior DevOps category was also unsupported. LinkedIn reports 51-200
  employees while its description says approximately 50 full-time team members;
  int@j reports 50-99. These are unaudited and not a Jordan-only headcount.
  The official contact page lists 28 Sate El Hosari Street, Anshassi Square
  Building, fourth floor, Shmeisani, telephone +962 6 565 2002 / 3003.
  LinkedIn, CB Insights and BizMidEast independently corroborate the street
  and number; older int@j and JordanYP listings show 12 Nasser Bin Jameel
  Street, apparently historical. The previous precise coordinates were not
  validated against the current office and were removed. The official site
  provides a map search but not verified entrance GPS. Its contact email is
  obfuscated; info@uba.com.jo appears in third-party directories as a general
  business contact, not a confirmed recruitment mailbox, so hr_email is null.
  The official careers page says there are no current openings. A recent
  entry-level Operations listing and older entry-level CRM Implementer listing
  are closed; the previously claimed internship was unsupported and removed.
  Company-level verification remains partial because current hiring, HR
  contact, precise office occupancy and full engineering stack are unconfirmed.
