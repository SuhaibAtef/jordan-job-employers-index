notes: >-
  Reviewed 2026-11-02. Uber's official Amman city page confirms 24/7 ride
  requests, local taxi booking and advance reservations. Uber's official
  Jordan newsroom dates its local launch to 2015 and Uber Taxi launch to
  April 2019; the earlier record's suggestion that Jordan service began in
  2019 confused Uber Taxi with the overall launch. The Royal Hashemite Court
  reported a 2026-09-21 meeting with Uber's CEO discussing potential Jordan
  service expansion and tourism cooperation, not a confirmed expansion or
  technology investment. Jordan's Petra news agency reported on 2026-10-03
  that Uber was among licensed smart-transport app operators in regulatory
  discussions. Uber's Jordan driver page references a Greenlight support hub
  in Amman, but no reliable current street/building address or office GPS
  was found; a third-party fleet partner listing must not be treated as an
  Uber corporate office. The previous coordinates were a generic city-center
  fallback and were removed rather than represented as a workplace location.
  Uber's global LinkedIn lists 10,001+ employees, not a Jordan headcount.
  Uber's global careers portal is available, but the 2026 Amman Country
  Manager/Country Operations Manager listing (minimum eight years' experience)
  is closed. No currently accepting Jordan vacancy, dedicated Jordan HR email,
  internship or graduate scheme was confirmed. Driver-partner enrollment is
  not employee hiring. No Jordan-specific software engineering roles or
  internal production technologies were verified; the unsupported AI category
  was removed. Company verification remains partial because local staffing,
  office address, recruitment contact and engineering footprint are unknown.
