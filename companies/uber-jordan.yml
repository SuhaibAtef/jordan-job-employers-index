name: "Uber Jordan"
description: >-
  Uber operates an app-based ride-hailing and taxi-booking platform in Jordan.
  It launched locally in 2015 and introduced Uber Taxi in 2019. Its current
  Amman city page advertises on-demand and advance-booked rides and local taxi
  requests. Jordanian authorities identified Uber among licensed smart-app
  transport operators in October 2026. Uber is a global technology company;
  the Jordan operation's local staffing and engineering footprint are not
  independently established.
