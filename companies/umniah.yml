notes: >-
  Reviewed 2026-11-02. Official Umniah contact information lists the HQ on
  Queen Nour Street in Shmeisani (telephone +962 6 200 2000); LinkedIn lists
  No. 73 Queen Noor Street. The earlier Abdul Rahim Al-Waked Street address
  was not supported as Umniah's current headquarters and may reflect a
  related business. The previous coordinates align closely with the Umniah
  HQ Google Maps business pin linked from Umniah's official Directions link;
  the recorded pin is approximate, not a surveyed building entrance.
  LinkedIn reports 501-1,000 employees, differing from the prior 1001-5000
  band; Jordan ICT's 2025 profile gives 900 staff. Umniah's official website
  links to an Oracle-hosted candidate portal, but its dynamic job inventory
  could not be independently inspected. A recent LinkedIn Software
  Development Engineer advertisement explicitly seeks fresh graduates with
  0-1 years of experience, and shows an Apply action as checked; application
  completion was not tested. Its listed C#/.NET, ASP.NET Core, REST APIs,
  JavaScript/TypeScript, SQL Server and Git are role requirements, not a
  verified full production stack. An October 2026 Talent Acquisition Trainee
  advertisement also displays an Apply action; a Network Engineer Internship
  - JEA listing explicitly says applications are closed. An earlier
  Call For Talents campaign accepted 0-3 years of experience but is closed.
  Ericsson radio technology and 5G expansion are documented in official
  September 2026 announcements; Python appears in network optimization job
  requirements, not as independently confirmed production usage. The former
  PHP attribution lacked sufficient direct evidence and was removed. The
  Shababi youth-marketing initiative is not itself an employment internship.
  No verified dedicated HR email, audited live headcount or complete current
  engineering stack was found. Company-level verification therefore remains
  partial despite corroborated HQ street-level location.
