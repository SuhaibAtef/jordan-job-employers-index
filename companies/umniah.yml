name: "Umniah"
description: >-
  Umniah by Beyon is a Jordanian telecommunications and digital-services
  provider operating since 2005. It supplies mobile connectivity, fixed and
  fiber broadband, 5G services, and enterprise ICT, cloud and cybersecurity
  solutions. Its network expansion includes an Ericsson partnership for 3G,
  4G and 5G radio access; its business portfolio also includes digital
  financial services through the UWallet consortium. The company's complete
  internal software stack and recruitment contacts are not independently known.
