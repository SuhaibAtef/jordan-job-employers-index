name: "Unifonic"
description: >-
  Unifonic is a Saudi-founded (2006), Riyadh-headquartered enterprise
  communications and AI-native customer-experience software provider with
  an Amman office. Its CPaaS/SaaS offering combines SMS, voice, WhatsApp
  Business messaging, omnichannel engagement, customer-journey automation,
  and conversational/agentic AI. Its official careers portal advertises
  Jordan-based roles across engineering, customer support, data, sales and
  operations. The precise current Jordan headcount and full internal
  production stack are not independently established.
