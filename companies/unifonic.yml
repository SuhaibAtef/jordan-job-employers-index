notes: >-
  Reviewed 2026-11-02. The company's official careers page reports 400+
  employees globally and more than 10 offices, whereas LinkedIn lists
  201-500 employees; several individual job descriptions refer to 500.
  These figures are global and not a verified Jordan headcount. LinkedIn
  publishes the Amman address as Mecca Street, second floor, Alhamdani
  Complex No. 141; Jordan Jobs Network independently repeats it. The
  prior coordinate pair (31.9751, 35.8611) and coordinate-based Google Maps
  URL lacked a confirmed match to the office and were removed. The retained
  Bing directions URL comes from the company's LinkedIn location link and
  is an address search, not an independently surveyed pin. Official careers
  listings display Apply forms for Amman-based roles, including Senior
  Infrastructure Engineer (5+ years), Senior Java Software Engineer (5+
  years), Senior Software Development Engineer in Test (7+ years) and
  Associate Customer Support Engineer (2+ years). No Jordan-specific
  fresh-graduate or internship intake was confirmed; Cairo and Saudi
  internships must not be treated as Jordan vacancies. The published
  engineering tools reflect requirements and duties in company-authored
  job advertisements, not a complete verified internal production stack.
  A dedicated public HR email was not established; the portal supports
  applications and a general CV-submission route. Application completion
  was not tested. Company-level verification remains partial despite
  corroboration of the published Amman office address.
