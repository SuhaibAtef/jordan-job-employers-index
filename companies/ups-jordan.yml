name: "UPS Jordan"
description: >-
  UPS provides international parcel shipping, tracking and express delivery
  services in Jordan through Consolidated Marketing & Logistics Corp. (CML),
  its locally authorized service contractor. UPS's Jordan locations page
  identifies CML at Abbasi Plaza, 425 King Abdullah II Street, Amman. CML
  also offers air, ocean and overland freight, customs brokerage, warehousing
  and healthcare logistics under its own business. CML is a separate local
  company, not evidence of a UPS-owned Jordan subsidiary or UPS payroll.
  Jordan-specific staffing, hiring and internal engineering technologies
  have not been independently established.
