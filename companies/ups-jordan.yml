notes: >-
  Reviewed 2026-11-02. Official UPS Jordan locations and support pages
  identify Consolidated Marketing & Logistics Corp. as the authorized UPS
  service contractor at Abbasi Plaza, 425 King Abdullah II Street, Amman.
  CML's official contact page independently publishes the same address,
  names its head office and operations centre there, and gives +962 6
  585 6956; UPS's support page also lists +962 6 537 7772 for customer
  support. CML's company history dates its UPS Supply Chain Solutions
  authorization to 2007 and exclusive UPS Small Package authorization to
  2016. CML's company LinkedIn profile reports 51-200 staff, but these
  are contractor employees and cannot be counted as direct UPS Jordan
  employees. UPS's own LinkedIn band of 10,001+ is global, not local.
  A third-party courier directory and BizMidEast list XRWJ+RG2 and
  31.997016,35.831258; this conflicts with the primary-source address.
  Those unsupported precise coordinates and the old coordinate-based
  map link were removed. The new Google Maps link searches for the
  published address and is not a surveyed entrance pin. The official
  global UPS careers portal does not confirm Jordan vacancies; no
  Jordan-specific development stack, HR email, internship or fresh-graduate
  intake was substantiated. info@cml.jo is a general contractor contact,
  not a confirmed recruiting address. Company-level verification remains
  partial even though the published service-contractor location is verified.
