notes: >-
  Reviewed 2026-11-02. The official UWallet about page states that Umniah
  launched the service in 2014 in cooperation with a consortium, including six
  Jordanian banks, and describes the AlHulool for Mobile Payments operating
  entity and Central Bank of Jordan licensing. The official contact page
  publishes 25 Abdul Rahim Al-Waked Street, Shmeisani, Amman, and the
  official about page repeats the address and lists P.O. Box 3124, Amman
  11953. BizMidEast corroborates the street, but the previous exact latitude
  31.967843 and longitude 35.9021763 were not independently confirmed as
  the current office entrance and were removed; the replacement map link
  searches for the published address. LinkedIn identifies UWallet's own
  company page and 201-500 employee band; the number of people linked to
  the profile is not a verified total workforce count. The official site
  provides info@uwallet.jo for general enquiries and complaints@uwallet.jo
  for complaints, neither confirmed as an HR recruitment mailbox.
  Umniah's Oracle-hosted candidate portal is used for UWallet-branded jobs;
  a current October 2026 IT Internal Auditor & DPO posting is attributable
  to UWallet through Umniah but application completion was not tested.
  UWallet's May 2026 student ambassador programme provides early-career
  field-marketing exposure, not a confirmed engineering internship. Android,
  Mastercard, eFAWATEERcom, Google Pay, QR payments and payment gateway
  describe supported products, integrations or customer platforms, not a
  verified internal programming stack. No UWallet-specific software
  engineering recruitment or dedicated HR email was established. The
  published headquarters address is verified independently of the partial
  company-level verification status.
