name: "UWallet"
description: >-
  UWallet is a Jordanian mobile-wallet and digital-payments provider operating
  under AlHulool for Mobile Payments, launched in 2014 by an Umniah-led
  consortium of Jordanian banks and other financial partners. Licensed by the
  Central Bank of Jordan, it offers person-to-person transfers, bill payments,
  cash-in/cash-out, merchant QR and online payments, Mastercard debit/virtual
  cards, international transfers, and business payroll and disbursement
  services. Its Amman headquarters and financial-services business are
  documented by official sources. The current internal software stack and
  complete Jordan workforce are not independently established.
