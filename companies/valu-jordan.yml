notes: >-
  Reviewed 2026-11-02. The Central Bank of Jordan directory identifies the
  licensed entity as Valu Specialized Financing, lists Chairman Mothanna
  Gharaibeh and General Manager Mohammad Sameh Al-Yousef, and publishes
  King Abdullah II Bin Al Hussein Street, King Hussein Business Park,
  P.O. Box 360 (postal code 11831), phone 0791133456 and general contact
  info-jo@valugroup.com. The postal code belongs to the published P.O. Box
  and is not treated as a verified physical-building postal code. The Valu
  Jordan LinkedIn profile provides Building 9 and the 201-500 employee band,
  but does not independently prove the exact number of staff working in
  Jordan. The prior 31.9539, 35.9106 coordinates pointed to an unsupported
  generic Amman location and have been removed; the map link is an address
  search, not a surveyed entrance pin. The corporate website's /jo landing
  path redirected to the general Valu website when checked; the regulator
  independently links that /jo path. The company has a Jordan-specific
  complaints page, but no verified public Jordan careers portal.
  Careers-jo@valugroup.com is supported by a Jordan hiring post circulated
  by Valu Jordan leadership; a separate older company LinkedIn recruitment
  post uses careers-jo@valu.com.eg. Neither mailbox was tested for delivery.
  A previously recorded Flutter, C#/.NET, AWS and CI/CD technology attribution
  was not independently re-established for Jordan in this review and is not
  represented as a confirmed production stack. The listed technologies are
  directly sourced from a Valu Jordan Senior Application Support Engineer
  advertisement and describe job requirements rather than proof of every
  technology in current production. A 1-3-year collection role is evidence
  of early-career hiring history, not an active vacancy or software internship.
  The headquarters campus is independently corroborated, but company-level
  verification remains partial.
