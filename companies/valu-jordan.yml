name: "Valu Jordan"
description: >-
  Valu Jordan is the Jordanian consumer-finance operation of Egypt-founded Valu.
  The Central Bank of Jordan lists the licensed local entity as Valu Specialized
  Financing and gives its head office at King Hussein Business Park in Amman.
  Valu received final specialized-finance regulatory approval in January 2026
  and began offering buy-now-pay-later and flexible consumer financing in
  Jordan during 2026, through a mobile app, merchants and physical service
  locations. The current Jordan-specific workforce and full internal software
  engineering stack are not independently established.
