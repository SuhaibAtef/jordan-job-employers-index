    - "Vardot's paid 12-week Amman QA Engineering Internship Program (2026) explicitly targeted students and fresh graduates and taught Jira, Postman, BrowserStack, Playwright and Cypress; the KayanHunt record shows a July 9, 2026 closing date, so this is historical evidence, not an open intake."
    - "An Amman Admin Assistant advertisement was marked entry-level, requiring 1-3 years of experience; its stated application deadline was October 20, 2026, despite the role still appearing on the company careers page on November 2."
    - "The company careers page displays Admin Assistant and Sr. Software Engineer apply links, but the linked KayanHunt postings have expired closing dates; their current acceptance was not verified."
