name: "Vardot"
description: >-
  Vardot is a privately held digital-experience and enterprise web development
  agency founded in 2011, specializing in Drupal-based websites, content
  management, migrations, headless and composable architecture, managed
  hosting, and AI-enabled content workflows. Its Varbase product is an
  open-source enterprise Drupal distribution. The company serves universities,
  governments, nonprofits, media and enterprise customers and maintains an
  Amman operation alongside international offices. Its LinkedIn profile lists
  Santa Clara, California as its primary headquarters. Jordan-specific
  employee headcount, current exact Amman office premises and the complete
  internal production stack remain unconfirmed.
