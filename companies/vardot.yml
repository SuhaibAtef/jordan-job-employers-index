notes: >-
  Reviewed 2026-11-02. The official company website describes enterprise
  Drupal 10/11 development, migrations, headless sites, managed services,
  AI integrations and the Varbase CMS. The company LinkedIn page gives
  51-200 employees globally, founding year 2011, primary HQ in Santa Clara,
  and an Amman office at 20 Paris Street, Sweifieh (P.O. Box 852277).
  BizMidEast repeats that street address and specifies third floor, suite
  305, but that suite and present-day occupancy were not independently
  confirmed. The official current contact page lists US, UAE and Saudi
  locations but does not list Jordan. A company-authored September 2026
  Admin Assistant advertisement instead names Deir Ghbar as the on-site
  Amman work location, making the current office address ambiguous.
  Previous coordinates 31.957373, 35.85965 were not backed by a verifiable
  office-specific geospatial source and have been removed; the map URL is
  only an address search. The official careers page displays two roles,
  but their linked job-board records have past closing dates. The QA
  internship is confirmed as a historical paid early-career programme;
  its application deadline has passed. The Business Operations Lead
  KayanHunt listing gives a future closing date while LinkedIn marks
  applications closed, so its acceptance is uncertain. No public dedicated
  HR email was confirmed; info@vardot.com appears in an independent
  business directory as a general contact, not a recruitment mailbox.
  Drupal/PHP/Twig/JavaScript are directly supported by the company job
  specifications. React and GraphQL are advertised delivery capabilities;
  AWS and Azure are listed company cloud partners. HubSpot and
  JavaScript/TypeScript are cited in the business operations job description.
  These are not proof of a complete current production stack. The devops
  category reflects published Drupal hosting and managed operations;
  ERP categorization was removed for lack of evidence. Company-level
  verification remains partial.
