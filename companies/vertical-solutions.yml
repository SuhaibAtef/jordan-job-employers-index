notes: >-
  Reviewed 2026-11-02. Official site identifies founder Faris Fleifel and 2010 founding,
  with ERP consulting, implementation, training and support for NetSuite, Epicor and Odoo.
  Company LinkedIn reports 11-50 employees, not an audited headcount, and an Amman
  headquarters. Its primary location is 11 Siqilliyah Street, Al Rabieh, while the
  current official contact page gives Al Sahel and 7th Circle, Amman; these are
  materially different descriptions, so no precise office location or coordinates
  are asserted. The old 7th Circle coordinate pin was removed. Official contact
  publishes info@ver-solutions.com and sales@ver-solutions.com; company-authored
  LinkedIn recruitment posts direct applicants to the general info@ address, not
  a dedicated HR mailbox. A junior/mid-level Functional ERP Implementer recruitment
  post requests MIS/CIS/AIS education and ERP/accounting/business-process knowledge;
  its current application acceptance cannot be confirmed. Separate LinkedIn job
  listings for Functional ERP Implementer and ERP Sales Supervisor explicitly say
  applications are closed. No internship or graduate programme was confirmed;
  prior Internship signal was unsupported. Technology names represent customer ERP
  products implemented or advertised, not a verified internal development stack.
  SAP is not listed as a delivered solution: it appears only as comparative sales
  experience in an advertisement. Older third-party profile and PDF references
  were not used to establish current office occupancy.
