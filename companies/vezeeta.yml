notes: >-
  Reviewed 2026-11-02. The official Jordan booking website is operational and
  lists Amman, Zarqa and Irbid, confirming Jordan market coverage but not
  necessarily a staffed Jordan engineering office. Vezeeta's official About Us
  describes physician booking and practice-management software and Jordan
  operations. Company LinkedIn lists Dubai headquarters, founding year 2012
  and a global 201-500 employee band; it lists Dubai, Riyadh and Cairo offices,
  but not a current Amman office. The 14 Zahran Street, Amman 11183 address
  and +962 6 500 1616 phone appear in third-party business-directory and
  Vezeeta Jordan profile listings, but the current official Jordan contact
  page displays a Dubai address. Current office occupancy and precise GPS
  are unconfirmed. The previous 31.9539, 35.9106 coordinates represented
  an approximate Amman city-centre pin, not verified office GPS, and were
  removed. Street-address confidence is low to medium; Jordan market-service
  confidence is high. BizMidEast lists customercare.jo@vezeeta.com as a
  customer-care address, not HR. A historical company-authored LinkedIn
  recruitment post supplied Jobs@Vezeeta.com for a call-centre role, but
  this mailbox is not verified for current Jordan recruitment; hr_email
  remains null. The official Jordan site links to careers.vezeeta.com,
  which returned HTTP 502 when checked. No currently accepting Jordan
  vacancy, internship or graduate programme was verified. A 2026 Cairo
  Staff Engineer advertisement documents C#/.NET, Python, SQL Server,
  PostgreSQL, MySQL, Docker, Kubernetes and AWS requirements; an older
  Cairo frontend advertisement lists React and TypeScript. Android and
  iOS are public consumer app platforms. These are company-wide product
  and recruitment technologies, not evidence of a Jordan-specific internal
  engineering stack. Previously listed Jenkins, Redis, Elasticsearch
  and Swift were not retained as current claims without direct evidence.
  Company verification remains partial despite the live Jordan service.
