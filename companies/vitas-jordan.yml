name: "Vitas Jordan"
description: >-
  Vitas Jordan is the trading name of Partners for Micro Credit, a Jordanian
  microfinance lender supervised by the Central Bank of Jordan. It provides
  loans for individuals, small enterprises and agricultural activities through
  branches across Jordan. Its roots are in the 1998 Southern Jordan Access to
  Credit Project; the current for-profit Vitas Jordan entity was formed in
  2013 under Vitas Group. It also offers customer mobile applications and
  electronic loan-repayment services.
