notes: >-
  Reviewed 2026-11-02. The Central Bank of Jordan's microfinance directory
  identifies the licensed local company as Partners for Micro Credit and
  independently confirms Farah Building, third floor, Al-Wakalat Street,
  Sweifieh; the Arabic directory specifies Building 13. Vitas Jordan's own
  contact and branches pages corroborate the headquarters address and
  general customer-service email customerservice@vitasjordan.com. The
  official careers page and 2026-11-01 Sales and Marketing Officer advert
  confirm a current fresh-graduate-eligible vacancy with a 2026-11-15
  deadline, and the associated application form explicitly publishes
  jobs@vitasjordan.com for recruitment. Application completion was not
  tested. LinkedIn lists 201-500 employees, but this is a profile size band,
  not a verified current headcount. The current official branches page
  confirms multiple Jordan service locations; historical 17+ branch and
  27,000+ borrower figures in the vendor case study are not asserted as
  current counts. The headquarters map coordinates are a previously
  recorded business pin in the correct street vicinity; a separate map
  directory locates Farah Complex around 31.957278, 35.86048. Treat the
  retained coordinates as approximate, not a surveyed office entrance.
  The TMX vendor case study documents deployment of its digital-lending
  platform at Vitas Jordan, but does not establish a present-day internal
  programming stack. The official online-service page and Apple App Store
  confirm Android/iOS consumer apps and eFAWATEERcom loan payments; none
  proves in-house mobile development. An older employee-profile assertion
  about a Web-Abacus core system could not be independently verified and
  is not included as a current technology claim. The official website
  credits an external agency for site development. No active Jordan
  software-engineering role or formal internship was confirmed. Company
  verification remains partial despite independently corroborated
  headquarters address and fresh-graduate hiring evidence.
verification_status: "partial"
