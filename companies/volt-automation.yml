notes: >-
  Reviewed 2026-11-02. Volt Automation's official website confirms the
  Khalda, Amman street/building address and general contact info@va.jo;
  LinkedIn and Decypha add third floor, office 303 and postal code 11821.
  This independently corroborates the published headquarters address, not
  present-day physical occupancy or a surveyed entrance coordinate. The
  earlier 31.98635, 35.84831 map pin was removed because its precision
  could not be substantiated against the published street address; the map
  link now searches the address rather than asserting GPS. LinkedIn also
  lists a Tadmur Street, North Marka site, which is not independently
  verified as a current staffed office. LinkedIn's 51-200 band covers the
  whole company, not an audited Jordan headcount. The official careers
  page has a general CV application form but no dated vacancy list;
  completion of the form was not tested. Company-authored LinkedIn posts
  advertised an Amman Automation Engineer position accepting 0+ years
  of experience and a Junior Instrumentation Sales Engineer position
  accepting 0-3 years. The Automation Engineer post was subsequently
  edited/re-shared, but the application link could not be opened, so
  active acceptance is unconfirmed. A much older design-engineer post
  published careers@va.jo, while the current official site lists only
  info@va.jo as a general contact; neither is verified as a current HR
  mailbox, so hr_email remains null. ABB's 2025-12-02 announcement names
  Volt Automation as its Jordan partner for planned deployment of ABB
  Genix with GIZ and the Water Authority of Jordan; completion and
  production deployment were not confirmed. PLC/SCADA, ABB 800xA and
  Siemens PCS 7 are company-advertised industrial automation capabilities;
  protocol names come from recruitment requirements. These do not
  establish a conventional internal software engineering stack.
  Company-level verification remains partial despite corroborated
  location, operations and early-career recruitment evidence.
