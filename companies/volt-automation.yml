name: "Volt Automation"
description: >-
  Volt Automation is an Amman-headquartered industrial automation,
  instrumentation and electrical engineering systems integrator founded in
  2016. It designs, supplies, programs, assembles, installs and commissions
  PLC/SCADA, distributed-control, electrical distribution and measurement
  systems for water and wastewater, grain processing, cement and minerals,
  and oil and gas operations. The company also publishes regional contacts
  in Qatar and Sudan. ABB identified Volt Automation as its local delivery
  partner for a planned industrial IoT and AI water-efficiency project in
  Jordan announced in December 2025.
