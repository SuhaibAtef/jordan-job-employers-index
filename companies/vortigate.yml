notes: >-
  Reviewed 2026-11-02. The official website and company LinkedIn profile
  independently establish Vortigate's Amman origin in 2023 and its immersive
  VR/AR/MR, training, real-estate visualization and web-development services.
  LinkedIn reports 11-50 employees, whereas Clutch estimates 10-49; neither
  figure is an independently audited current headcount. LinkedIn publishes
  Queen Rania Al-Abdullah Street in Amman, while Clutch publishes Al Jama'a
  Street, Amman 11942. These are street-level directory descriptions without
  a verifiable building or office number. The former 31.9539, 35.9106
  coordinates were a generic Amman-centre fallback, not a confirmed Vortigate
  entrance, and have been removed. The map URL is a street-address search,
  not evidence of a surveyed pin. The official contact page publishes
  sales@vortigate.com and +962781313782, but sales@ is a general sales
  address, not a verified HR mailbox; hr_email remains null. The homepage
  includes a generic Join Our Team call to action without a dedicated
  vacancy list. The only identifiable company-authored LinkedIn opening was
  a closed Riyadh Co-Founder / Investor listing, which supplied
  mr@vortigate.com for that strategic partnership, not for Jordan HR.
  Clutch lists Unity, Vuforia, C#, C++, HTML5 and other technologies as
  service/programming focus; these are directory-reported capabilities,
  not verified production-stack inventories. A 2024 client review
  specifically documents Unreal Engine delivery, and a 2025 client review
  documents a VR training app delivered for Meta Quest 2/3. The company's
  regional service coverage does not prove physical offices in Saudi Arabia
  or the UAE. Company verification remains partial because office occupancy,
  current Jordan recruiting, HR contact and full internal stack are unconfirmed.
