name: "Vortigate"
description: >-
  Vortigate is an immersive-technology and digital-experience studio founded in
  Amman, Jordan in 2023. It develops virtual-reality, augmented-reality and
  mixed-reality experiences, VR training and simulations, architectural and
  real-estate walkthroughs, 3D animation, and web solutions for clients in
  Jordan and regional markets including Saudi Arabia and the UAE. Client
  reviews document completed Unreal Engine visualization and Meta Quest VR
  training work, but do not establish the full internal engineering stack.
