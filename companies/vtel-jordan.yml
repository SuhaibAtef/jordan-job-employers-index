notes: |
  VTEL Holdings Limited/Jordan Co. is an Amman-based telecom and internet infrastructure operator established in 2008. Official business pages describe enterprise fiber internet, dedicated connectivity, IP transit, domestic/international data links, data-center hosting, VPS, SD-WAN, VSAT, IoT, smart facilities and tracking. RIPE NCC identifies the Jordan operator and confirms its network registration; AS50670 is attributable to VTEL.
  The official business contact page, RIPE NCC and company LinkedIn independently corroborate Al Reem Center, Building 244, Arar Street, Wadi Saqra. Location.status verified means the published business address is corroborated, not that present-day occupancy or entrance-level GPS has been surveyed. Earlier coordinates (31.962192, 35.890565) were removed because their entrance-level precision could not be independently validated.
  LinkedIn's company-wide 51-200 employee band differs from an older intaj listing of 1-24; no audited headcount was found. A 2024/2025 Jordan ICT profile lists general contact info@vtel.jo and technical management; neither is a dedicated HR contact. A company-authored Network Support Engineer posting directs CVs to jobs@vtel.jo, recorded as the recruitment contact without inbox-delivery testing. A newer Outdoor Sales posting instead gives jobs@vtel.com; the two recruitment domains were not reconciled.
  The Network Support Engineer role is early-career (1-3 years), not explicitly open to fresh graduates; no confirmed internship or graduate scheme. Both identified LinkedIn listings showed applications closed, while the official general careers form was visible on 2026-11-02. The technology list combines services and role requirements, not an independently audited internal production software stack. An earlier October 2026 note cited network-operations employee evidence; current company-authored requirements provide stronger direct corroboration.
