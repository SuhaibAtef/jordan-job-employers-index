notes: >-
  Reviewed 2026-11-02. Wafii's current official homepage redirects to its
  business-facing consumer-panel site, which describes receipt-based cashback
  data, FMCG shopper insights, targeted advertising and promotional measurement.
  The Google Play listing (updated 2026-08-03) and Apple App Store identify
  Stark Software Technologies LLC / StarkTech LLC as the mobile app publisher;
  this is a publisher attribution, not proof of current ownership or a legal
  parent-company relationship. LinkedIn identifies Wafii as founded in 2019,
  lists 2-10 employees company-wide, names Dubai as primary headquarters and
  Arar Street, Amman as another location. Older sources give a 2018 origin,
  so the exact founding year is not independently reconciled. The old dataset's
  3rd Circle address and precise 31.9539, 35.9106 coordinates could not be
  corroborated and were replaced with an address-based map search. CB Insights
  lists 268 Arar Street, but the exact building and current office occupancy
  are not independently confirmed. The official business site publishes
  info@wafii.co and +962 79 81 222 81 as general contacts, not a dedicated
  HR mailbox; hr_email is therefore null. The earlier generic 'Internship'
  signal lacked company-authored recruitment evidence; a third-party personal
  profile mentions short historical internships, but no open role or structured
  programme was confirmed. Android/iOS and consumer-analytics capabilities
  are public product evidence, not proof of specific programming languages,
  frameworks, infrastructure or a Jordan-based engineering team. Historical
  Wafii Card / contactless-payment claims on older official pages should not
  be treated as current product availability. Company verification remains
  partial due to unconfirmed HR, hiring, office occupancy and internal stack.
