name: "Wafii"
description: >-
  Wafii is a Jordan-origin consumer rewards and retail-insights platform launched
  around 2019. Its mobile app lets shoppers scan grocery receipts for cashback,
  while its business offering provides FMCG brands and retailers with consumer
  panel data, purchase-behavior insights, targeted promotions and advertising.
  The company lists an Amman location and a Dubai headquarters; a current
  Jordan office headcount and internal engineering stack have not been confirmed.
