name: "Wajeez"
description: >-
  Wajeez is a Jordan-founded Arabic digital audio and learning platform offering
  short book summaries, full audiobooks, podcasts, novels and professional-skills
  learning for individuals and organizations. The Wajeez app launched in 2020
  after the founders' earlier Faylasoof book venture. The company identifies
  Amman as its headquarters and also publishes a Riyadh contact address;
  current Amman office occupancy, Jordan-specific headcount and the complete
  production engineering stack have not been independently established.
