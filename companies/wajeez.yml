notes: >-
  Reviewed 2026-11-02. The official website and About page describe Arabic
  book-summary audio/text, full audiobooks, novels, podcasts, and Wajeez Skills
  corporate learning. The official site claims six million users; this is a
  company-reported marketing figure, not independently audited. Company LinkedIn
  reports founding in 2019, Amman headquarters and 51-200 employees company-wide;
  the Royal Hashemite Court's 2021 account confirms founders Mohammad Zatara and
  Rami Abu Jbara, the preceding Faylasoof venture, and Wajeez's 2020 launch.
  The official site now lists a Riyadh, Al-Yasmin/Anas bin Malik Street contact
  and support@wajeez.co, but no current Jordan street address. EMIS lists 67
  Abd Ar-Rahim Al-Hajj Muhammad Street in Amman, while CB Insights gives a
  different Jabal Al-Weibdeh address; the company-reposted telesales notice
  locates on-site work in Sweifieh. Neither building occupancy nor an entrance
  GPS pin was verified. Removed the previously recorded 31.958439, 35.858974
  coordinates, which mapped to the street vicinity rather than a confirmed
  Wajeez office. The founder's recent Chief Accountant hiring notice uses
  HR@wajeez.co, while the older .NET engineer advertisement uses
  HR@wajeez.com; the two domains are not interchangeable and neither inbox
  was delivery-tested. The site's support@wajeez.co is customer support, not HR.
  Wajeez published several Amman content/marketing internships for students
  and recent graduates in 2026, but the inspected LinkedIn listings were closed;
  no current open internship or software graduate scheme is confirmed. The
  .NET/C#, PostgreSQL, TypeScript, FFmpeg and cloud technologies come from a
  company-authored backend job description and should not be treated as an
  audited deployed stack. Android/iOS are publicly distributed apps. Earlier
  Next.js attribution based on old site assets was not revalidated against the
  current site. Company-level verification remains partial because of
  unconfirmed current office address, exact staffing, active vacancies and
  full production stack.
