name: "Waseela"
description: >-
  Waseela is a Jordan-founded regional ICT and telecommunications master systems
  integrator established in 2007. It delivers connectivity and in-building
  wireless coverage, network engineering, smart and safe city systems, IoT,
  cybersecurity, and enterprise ICT infrastructure for government, telecom
  operators and businesses across the Middle East. Waseela operates in Amman
  and other regional markets and describes itself as a subsidiary of Revonence
  Technologies International; its company LinkedIn now lists Dubai as the
  primary headquarters rather than Amman.
industry: "ICT systems integration / telecommunications engineering / cybersecurity"
