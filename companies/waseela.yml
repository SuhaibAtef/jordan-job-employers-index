notes: >-
  Reviewed 2026-11-02. The current official About page identifies Waseela as
  established in Jordan in 2007, operating in Jordan, UAE, Saudi Arabia and
  Qatar, with more than 270 professionals in a company-reported figure and a
  Revonence Technologies International affiliation. Company LinkedIn reports
  201-500 employees worldwide, Dubai as primary HQ and a separate Amman
  location; neither figure is a verified Jordan headcount. The current official
  Contact page still lists Al Husseini Complex, Office 406, Al-Madinah
  Al-Munawara Street, +962 6 5543105 and info@waseela.com, whereas company
  LinkedIn lists Jad Center, Office 401 on the same street. Current occupancy
  of either specific office and entrance GPS were not independently confirmed;
  removed the old 31.974056, 35.864925 coordinates to avoid a false exact pin.
  Waseela's recruiter Rawan Owiss publicly used hr-jordan@waseela.com for an
  Amman vacancy; delivery was not tested. The official Join Us page is live
  but did not expose a vacancy list in the accessible HTML. A KayanHunt portal
  lists Waseela Jordan roles including Sales Support Specialist; the portal
  also includes jobs for other companies, so those are not attributed to
  Waseela. A 2026-10-26 third-party junior applications support posting
  requests SAP Business One, Crystal Reports, SQL and Power BI experience;
  these are advertised skills, not an audited internal stack. The company
  explicitly described a telecom-graduate internship pathway in 2022, but
  no currently open internship was verified. Jordan's Petra news agency
  independently reported Waseela's August 2026 Zscaler/NCSC workshop, and
  Waseela's LinkedIn documents 2026 Jordan smart-campus exploration. These
  support ongoing operations but not full verification of office, staff,
  internal software infrastructure or all current hiring. Status remains
  partial; verified location alone would not imply full company verification.
