notes: >-
  Reviewed 2026-11-02. WATEEN's live official website describes an Amman-based
  enterprise IT integrator operating since 2008, with cybersecurity, networking,
  cloud, managed services, data protection and education technology offerings.
  Company LinkedIn reports a privately held business with 11-50 employees and
  Jbeiha headquarters; this is a platform-reported size band, not a verified
  headcount. The official contact page and company LinkedIn both publish
  Office 809, Abulhaj Commercial Building, 148 Queen Rania Street, Amman;
  Open-E independently repeats the same address and lists WATEEN as a partner.
  The previous latitude 31.99884 and longitude 35.88088 were not substantiated
  as office-entrance coordinates, so both have been removed; the map link is
  an address search, not a verified pin. The official contact page gives
  info@wit-jo.com and support@wit-jo.com as general/support contacts, not HR.
  The recruitment address jobs@wit-jo.com appears in a 2026-10-24 job listing
  and an older WATEEN recruitment repost, but was not published as an HR
  mailbox on the inspected official contact page and was not delivery-tested.
  The official careers page lists four Amman positions and an application
  form. A company LinkedIn update offered a fresh-graduate Technical Support
  Engineer position with a 2026-10-26 deadline; that particular opportunity
  should be treated as expired unless the employer confirms otherwise.
  The official careers page separately states 2+ years for Technical Support
  Engineer, so the criteria may describe different recruitment rounds.
  Vendor products in technologies represent WATEEN's advertised integration
  and customer-service portfolio, not a verified internal software stack;
  Windows Server/Active Directory are job-advertised skills. The older Veeam
  entry remains flagged as uncorroborated. The company published a 2025
  Yarmouk University e-learning recognition, supporting recent activity.
  ERP and DevOps categories were inherited from the existing record and
  were not independently substantiated as dedicated current service lines.
  Status is partial because current staffing, internal engineering stack,
  HR mailbox deliverability, precise entrance coordinates and each vacancy's
  acceptance status have not all been independently confirmed.
