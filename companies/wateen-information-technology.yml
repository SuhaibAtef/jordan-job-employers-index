name: "WATEEN Information Technology"
description: >-
  WATEEN Information Technology (WIT) is a privately held Jordanian enterprise
  IT systems integrator founded in 2008 and headquartered in Jbeiha, Amman.
  It designs, deploys and supports networking and data-center infrastructure,
  cybersecurity and Zero Trust solutions, cloud migration, Microsoft 365 and
  business applications, backup and disaster recovery, managed IT services,
  and education/LMS hosting for organizations in Jordan and the region.
