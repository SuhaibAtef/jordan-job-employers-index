notes: >-
  Reviewed 2026-11-02. The official homepage is indexed and displays vacancies
  for Jordan and Saudi Arabia, categories for fresh graduates, remote work,
  part-time roles and a company job-posting facility. Its About page identifies
  the project as a website and Facebook page associated with the office of
  Mutaz Abu Rumman and an anti-unemployment initiative serving Jordanian
  youth. Independent historical reporting in 2016 describes the initiative
  as voluntary/nonprofit; a May 2024 news report says the associated Labour
  Party announced a Wathefty mobile application, but this does not confirm
  its current app availability, technical implementation or corporate status.
  A separate wathefty.com/jobs/ section carries older 2022-2024 postings;
  these are advertisements for third parties, not proof of Wathefty's own
  hiring. The original generic "Graduate" hiring signal was therefore
  replaced with an explicit distinction between graduate job-board content
  and employer recruitment. No verified LinkedIn company profile, employee
  count, dedicated HR email, current internal vacancy, legal employer entity
  or precise Amman office address was found. The previous 31.9518, 35.94042
  coordinates and associated map pin were unsupported as a Wathefty office
  and have been removed. The old claim that the site's internal stack is
  WordPress was not substantiated; the separate /jobs/ pages do not establish
  the main site's production stack. Company-level verification remains
  partial because the operator's present legal/employment structure, staffing,
  office location and internal engineering stack remain unconfirmed.
