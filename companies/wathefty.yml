name: "Wathefty"
description: >-
  Wathefty (وظيفتي) is an Arabic-language Jordanian job-listing and
  employment-access initiative serving job seekers across Jordan. Its official
  About page describes a website and Facebook page issued by the office of
  Mutaz Abu Rumman under the "Together to Fight Unemployment" initiative,
  rather than establishing a separately incorporated recruitment employer.
  The website aggregates vacancies across industries, locations and
  experience levels, including fresh-graduate and remote-work categories.
