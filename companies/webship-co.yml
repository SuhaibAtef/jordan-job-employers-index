notes: >-
  Reviewed 2026-11-02. Official site and company LinkedIn corroborate an operating
  Amman-based QA automation consultancy; the official product page documents
  Webship-js 2.0.x, including 2.0.6, and LinkedIn describes recent releases.
  LinkedIn's 2-10 employee band is a self-reported company-wide estimate, not
  independently verified headcount. The official contact page publishes
  info@webship.co and +962 7 9000 2280 as general business contacts, not a
  verified HR mailbox. No company-authored active job posting, recruiting email,
  internship or dedicated careers page was confirmed during this review.
  The official 7 Paris Street third-floor address is supported by the contact
  page and Paris Street by LinkedIn, but no independently verified entrance
  coordinates were found; previously asserted latitude/longitude were removed.
  Technology names refer to documented testing products, integrations, open-source
  code and legacy documentation; they do not establish the internal production stack.
  Company-level verification remains partial because recruitment and precise
  location details are incomplete.
