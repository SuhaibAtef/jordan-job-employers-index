notes: >-
  Reviewed 2026-11-02. The current official website describes website and
  e-commerce design, mobile applications, digital marketing, branding, hosting
  and maintenance; its June 2026 blog content and recent company LinkedIn posts
  support continuing activity. LinkedIn identifies an Amman headquarters, a
  2011 founding year and 11-50 employees; the employee band is self-reported,
  not an independently audited Jordan headcount. The official careers page
  publishes career@websitejo.com and accepts CVs, but a linked position is
  explicitly marked 'not currently available'; the page also displays a
  generic training label without a dated, confirmed internship. Therefore no
  currently open vacancy or early-career hiring signal is asserted. The
  official contact page publishes contactus@websitejo.com and
  websitejoTeam@gmail.com as general enquiries, not HR-specific contacts.
  The official address is University Street, Amman, corroborated by GoodFirms,
  but no building number or entrance coordinates could be confirmed. Earlier
  latitude/longitude were not substantiated and have been removed; the map URL
  is a street search, not a verified office pin. The website's technology FAQ
  lists illustrative HTML, CSS, JavaScript, PHP, Java, Node.js, ASP.NET and SQL,
  and its service page names additional example platforms, but these do not
  establish an actual deployed engineering stack. Earlier unsubstantiated
  framework entries were removed. Company verification remains partial.
