notes: >-
  Reviewed 2026-11-02. WebTeb's official Arabic-language medical-information
  website and About page were accessible and the homepage referenced 2026
  content. The official About page describes licensed evidence-based medical
  information and a multidisciplinary editorial/technology team. Company
  LinkedIn reports founding in 2011, Amman headquarters, a Riyadh office and
  51-200 employees, which is a company-reported global band rather than an
  audited Jordan headcount. LinkedIn publicly lists marketing@webteb.net,
  but that is a marketing contact, NOT a verified HR/recruitment mailbox;
  hr_email remains null. No official careers board or current WebTeb-authored
  vacancy was established. The prior generic 'Internship' signal was not
  supported by a WebTeb internship advertisement and was corrected. The
  historical iOS and Android applications are documented by the company's
  own announcements and independent 2014 reporting. AppBrain records the
  Android application as removed from Google Play on 2024-03-16, so past
  mobile products must not be represented as currently distributed apps or
  as proof of the internal production stack. CB Insights and BizMidEast
  both list 15 Arar Street, but the current office address and entrance
  coordinates could not be corroborated from an official contact page;
  previous 31.954,35.91944 coordinates were therefore removed. WebTeb's
  website remains active, but full employer verification is incomplete due
  to unconfirmed current premises, HR channel, vacancies, Jordan staffing,
  and production engineering stack.
