name: "WebTeb"
description: >-
  WebTeb (ويب طب) is an Arabic-language digital health and wellness information
  publisher founded in 2011. Its live website provides medical articles,
  medicine and disease references, symptom-checking and health tools, and
  content intended to connect Arabic-speaking readers with health providers.
  The company says its editorial and product team includes doctors, editors,
  programmers, designers and advertising specialists; this does not imply
  that WebTeb directly provides medical treatment.
