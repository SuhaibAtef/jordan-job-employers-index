name: "WeTheMakers"
description: >-
  WeTheMakers is a Jordanian software engineering and AI-enabled product studio
  founded in 2019 and based in Dabouq, Amman. It builds web, mobile and
  enterprise applications, provides fractional technical leadership and
  DevOps/product-engineering support, and runs WeTheMakers School, a developer
  training program for students, junior engineers and career changers.
