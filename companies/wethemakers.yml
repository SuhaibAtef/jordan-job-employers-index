notes: >-
  Reviewed 2026-11-02. The official website and company LinkedIn support
  WeTheMakers' continuing operation as a Dabouq, Amman software and AI product
  studio founded in 2019. It describes Build, Solutions and School business
  tracks; claims of 100+ delivered products, 120+ School graduates and 85%
  graduate employment are company-reported and not independently audited.
  LinkedIn gives a company-wide size band of 11-50, while Clutch estimates
  10-49; neither establishes a verified Jordan headcount. The official careers
  page displayed five Jordan/hybrid software engineering roles on the review
  date, generally requesting two or more years of experience; the site's
  application links and open-role status were not independently transaction-
  tested. Its School page offers a free four-month program and a next-cohort
  application form; this is an early-career training pathway, not proof of a
  paid internship or a guaranteed job. The original hello@wethemakers.dev
  address is corroborated by third-party directories as a general business
  contact, not a confirmed HR-specific mailbox; the careers page provides an
  obfuscated application email that could not be independently decoded, so
  hr_email is null. The official contact page and company LinkedIn agree on
  1 Khair Al Din Al Maani Street, Dabouq, Amman; the former area 'Ma'an' was
  erroneous. The official site's linked Google Maps place resolves to a
  business pin near 32.0118086, 35.8330369; coordinates describe that pin,
  not a surveyed office entrance. GoodFirms lists a different Yathreb Street
  address, so physical occupancy remains unverified and location status is
  provided_unverified. Listed technologies are a combination of the studio's
  publicly advertised service stack and requirements in its current careers
  listings, not an independently audited inventory of all internal systems.
  'Generative AI' from the prior technology list is treated as a capability
  rather than a specific product/framework. Company verification remains
  partial pending independent confirmation of HR contact, headcount and
  precise current office occupancy.
