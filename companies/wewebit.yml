notes: >-
  Reviewed 2026-11-02. Official homepage/about/contact pages and company
  LinkedIn corroborate active operations since 2012, web/mobile development,
  UX/UI, e-commerce, integration and CRM services. The official product pages
  document GoverGate data governance, a configurable CRM platform and a
  Success Partner sales/order-management product. Company LinkedIn reports
  11-50 employees (a self-reported company-wide band, not an audited Jordan
  headcount), headquarters in Amman and 342 Wasfi Al Tal Street, 4th Floor.
  The official contact page gives the same street/building number and the
  Arabic contact page identifies Khalda. BizMidEast corroborates the street
  address and telephone +962 6 550 6530, but does not independently establish
  current office occupancy or precise entrance coordinates. The original
  coordinates 31.99683,35.83797 came from an unverified generic Google Maps
  search, so they and the associated maps URL were removed rather than
  presented as a surveyed office point. The official contact page lists a
  careers email, and a company-authored LinkedIn PHP vacancy explicitly
  prints careers@wewebit.com; mailbox delivery was not tested. The LinkedIn
  Flutter Developer posting was tagged entry-level and had no minimum years
  of experience, supporting a historical early-career hiring signal; both
  inspected Flutter and PHP vacancies were closed as of this review, and
  no currently open role or internship was verified. The technology list
  represents named skills in historical company-authored job advertisements,
  not an audit of the deployed production stack; Laravel was listed as an
  example alongside Yii rather than a confirmed deployed framework. The
  prior 'VPS Hosting' technology entry describes a service, not a verified
  implementation technology. The original ERP and DevOps categories lacked
  sufficient evidence of standalone business offerings and were removed.
  Company verification remains partial pending confirmation of current
  recruitment, audited size, production technologies and precise office pin.
