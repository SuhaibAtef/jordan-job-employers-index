notes: >-
  Jordan-based Arabic conversational AI company founded in 2020; develops
  dialect-aware voice assistants and bilingual customer-support chatbots.
  Jordan ICT's 2023 profile reported 25 staff, whereas third-party company
  directories report 11-50 (and Crunchbase reports 1-10); current audited
  headcount is unknown. StartupsJo publishes careers@xina.tech as a contact,
  but current inbox operation and an open vacancy were not confirmed.
  Wuzzuf reported no open Xina AI vacancies at the November 2026 review.
  Former CEO Sari Hweitat publicly announced his resignation around 2023/24;
  historical leadership information must not be presented as current.
  Amman operations are supported by industry directories, but the previous
  King Hussein Street 264 address and exact map coordinates were not
  independently corroborated and were removed. Listed AI technologies
  describe documented product capabilities, not a verified internal
  deployment stack. Official website could not be independently inspected
  during this review. Partial verification only.
