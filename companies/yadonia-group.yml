notes: "Reviewed 2026-11-03. Official website and company LinkedIn document a digital agency founded in 2000, with services including web design, mobile development, graphic design, SEO, social media marketing and managed hosting. LinkedIn reports 11-50 employees (company-wide estimate), headquarters at Building 27, Ghazi Arabiyat Street, Tela Al Ali, Amman, and a Jeddah office. Official opening-jobs page lists Web Developer, Graphic/Web Designer, Sales Executive, Project Coordinator and Secretary; listings are undated and application acceptance was not tested, so current hiring is unconfirmed. Official Web Developer listing mentions PHP, MySQL, HTML, XML, JSP, ASP, Java and .NET as qualifications; these do not establish a current production stack. Official about page gives information@yadonia.com as general contact, not a dedicated HR mailbox. Existing map pin and coordinates corroborate the street address but exact current office entrance was not independently inspected. No confirmed internship or graduate-specific opening. Partial company verification is distinct from the existing location verification."
